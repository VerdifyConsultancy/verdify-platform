APP_ENV: "production"
PLANNER_INSTANCE: "planner_graph"
PLANNER_STORE_BACKEND: "postgres"
PLANNER_MEMORY_BACKEND: "disabled"
PLANNER_MEMORY_INGEST_ENABLED: "false"
PLANNER_MEMORY_INGEST_MAX_ITEMS: "100"
PLANNER_MEMORY_INGEST_MAX_BODY_CHARS: "4000"
PLANNER_MEMORY_INGEST_ALLOW_VERDIFY_PRIOR_PLANS: "true"
PLANNER_MEMORY_INGEST_ALLOW_SUPPORT_DOCS: "true"
OPENAI_MODEL: "gpt-5.5"
OPENAI_REASONING_EFFORT: "medium"
PLANNER_WORKER_POLL_SECONDS: "0.5"
PLANNER_WORKER_LEASE_SECONDS: "30"
