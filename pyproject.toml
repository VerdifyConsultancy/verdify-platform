[project]
name = "verdify"
version = "1.0.0"
description = "Greenhouse management platform — ESP32 control, AI planning, climate monitoring"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "asyncpg>=0.29",
    "aioesphomeapi==44.24.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    # astral (solar position) is imported by core ingestor code
    # (ingestor/tasks/_common.py, forecast.py) and shipped in
    # ingestor/requirements-image.txt, but was missing from this list (L1 audit
    # — pyproject is meant to be the single dep source of truth).
    "astral>=3.2,<4",
]

[project.optional-dependencies]
planner = [
    "anthropic>=0.90",
    "google-genai>=0.5",
    # Phase 3 (Iris loop overhaul): OpenAI text-embedding-3-large for the
    # unified verdify_embeddings corpus, and the GPT-5.5 client that the
    # Hermes adapter calls in Phase 5. Pinned to >=1.50 for the responses
    # API and reasoning_effort parameter support.
    "openai>=1.50",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
# planner_graph/ runtime deps (folded from VerdifyConsultancy/verdify-planner, #102).
# These mirror planner_graph/pyproject.toml. The k3s planner image
# (planner_graph/Dockerfile) installs from the standalone pyproject+uv.lock — this
# extra exists so the monorepo venv can `pip install -e .[planner-graph]` and run
# the planner_graph/tests suite locally.
planner-graph = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.60",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn>=0.32.0",
]
dev = [
    # Protocol-v2's pre-draw joint-power and frozen analyzer tests are part of
    # the release gate, not an optional notebook-only environment.
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

# planner_graph/ was folded in from the standalone VerdifyConsultancy/verdify-planner
# repo (#102). It carries its OWN tooling contract (pyright via
# planner_graph/pyproject.toml, not this repo's ruff ruleset) and its
# own test+CI lineage. We deliberately do NOT reformat the imported tree (would
# diverge from upstream history and risk a tested, production planner package);
# it is excluded from this repo's ruff so `make lint`/broad scans stay green. Its
# k3s image builds from planner_graph/Dockerfile + planner_graph/pyproject.toml.
extend-exclude = ["planner_graph"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print (catch stray prints)
]
ignore = [
    "E501",  # line too long — we use 120, but don't hard-fail on long lines
    "E701",  # multiple statements on one line — used in dense config/query sections
    "E702",  # semicolons — used in dense config sections
    "S101",  # assert in tests is fine
    "S310",  # URL construction — internal trusted URLs only
    "S603",  # subprocess calls are intentional (ESP32, docker exec)
    "S607",  # partial path subprocess — we trust our own scripts
    "S608",  # SQL injection — all queries use trusted internal inputs, not user data
    "T201",  # print() is used intentionally in CLI scripts
    "B904",  # raise from — too strict for our error handling style
    "B023",  # function variable binding in loops — intentional in lambdas
    "E402",  # import not at top — sys.path manipulation requires it
    "E722",  # bare except — used for resilient error handling in long-running services
    "S105",  # hardcoded passwords — these are local dev defaults, production uses env vars
    "S110",  # try-except-pass — intentional resilience in ingestor/scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"scripts/*" = ["T201", "S603", "S607", "S602", "S104", "F841", "W291"]
"ingestor/*" = ["S110", "S701", "F811"]  # try/except/pass for resilience; jinja2 not user-facing; WATTAGES re-export

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "verdify_schemas/tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -q"
