escalation_conditions:
  - A new tunable or entity outside the approved contract is required.
  - Replay divergence extends beyond the documented topology or unavailable-DLI delta.
  - A defensible heap floor cannot be reached or measured.
  - Fertilizer route or exact sequence is ambiguous.
  - Physical commissioning or production device access is requested.
  - A prohibited path, public/schema/security boundary, destructive operation, or second device writer becomes necessary.
  - Any hard dependency changes a consumed interface after branch cut.
agent_profile: firmware-esphome-cpp
critic_profile: firmware safety/replay/heap adversarial critic
integration_requirements:
  - Independent critic reviews the immutable source head, binary manifest, replay deltas, topology matrix, and heap evidence.
  - Controller reconciles any shared registry/entity-map/twin change with merged lane contracts before integration.
  - Repository-wide CI reruns at the integrated head; release-control alone performs preflight, OTA, and runtime acceptance.
definition_of_done:
  - Every lane acceptance criterion passes with linked, revision-specific evidence.
  - All five assigned issues are accurately updated and no unassigned firmware behavior is added.
  - One exact combined image and rollback artifact are tied to the immutable lane head.
  - Required firmware, lighting, irrigation, lint, test, replay, band-replay, and compile gates pass.
  - Branch is pushed, PR is open, required CI is green, and the lane worktree is clean.
  - Adversarial self-audit is recorded and the lane is READY_FOR_CRITIC; the worker does not self-merge or OTA.
