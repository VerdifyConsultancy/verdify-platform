      coordination: consumes corrected irrigation intent after deploy
expected_inputs:
  - Merged canonical cfg readback contract and quiet writer behavior.
  - Refreshed replay corpus plus raw-cycle and realized-night evidence contracts.
  - Merged unavailable-DLI firmware signal and actuation-neutral baseline.
  - Final planner tunable registry and bound definitions.
outputs:
  - One exact combined firmware binary and retained rollback artifact.
  - Unit, invariant, stock replay, band replay, compile, lighting, and irrigation evidence packet.
  - Heap allocation/profile report and actionable WDT diagnostics.
  - OTA acceptance manifest for release-control; no OTA is executed by this lane.
coordination_rules:
  - Do not dispatch until all four hard dependencies are independently accepted and merged.
  - Cut the feature branch from the then-current main; retain baseline_sha as the sprint audit reference.
  - Coordinate before touching Makefile, the replay exporter, schema dump, any twin mirror, or any interface shared with a merged lane.
  - This lane is the exclusive firmware YAML/header/test owner for the combined image; no parallel firmware edit may run.
  - Although scripts/firmware-*.sh overlaps release-control's named release scripts, those named scripts are reserved for release-control unless the controller records and serializes an explicit handoff.
  - Release-control alone executes the exact reviewed OTA after critic, CI, alert, weekly, bake, heap, cycling, and rollback gates pass.
constraints:
  - Climate/VPD wet intent resolves only to center mist; center drip and dormant south/west irrigation remain disabled by default.
  - Fertilizer can reach only a commissioned wall-drip path, and incomplete commissioning must fail closed.
  - Wall feed is exact-once prewet, feed, fertilizer-off, and immediate wall-local clean flush; no legacy 90-minute hold.
  - Preserve the existing 45-second center re-fire fence and lighting minimum-on boundary without extending water pulses.
  - Preserve solar-night zero-daytime admission, temperature bounds, heat2-off behavior, and existing deterministic safety.
  - Add no new tunable/entity outside the approved contract; every approved new tunable still requires a cfg readback.
  - Replay divergence is limited to documented topology and unavailable-DLI effects and must be explained row-by-row or by invariant.
  - Controlled restart is a last resort; first remove avoidable allocation/publish churn and provide heap/WDT evidence.
  - No production OTA, device-VLAN action, or secret access is authorized for the lane worker.
acceptance_criteria:
  - id: LANE-AC-01
    statement: All climate wet intent resolves to center; center drip and dormant south/west paths remain disabled; only commissioned wall drip can receive fertilizer.
    evidence_required:
      - Resolver unit tests for every command source and zone-enable state.
      - Invariant and replay evidence showing zero south/west climate demand and zero non-wall fertilizer demand.
  - id: LANE-AC-02
    statement: Missing commissioning prevents feed and the exact-once wall sequence is prewet, feed, fertilizer-off, and immediate clean flush.
    evidence_required:
      - Fail-closed commissioning fixtures.
      - Restart, cancellation, duplicate-trigger, and sequence-order tests.
  - id: LANE-AC-03
    statement: Existing 45-second center re-fire and lighting minimum-on behavior are regression-tested without a speculative new control tunable.
    evidence_required:
      - Re-fire test proving no pulse extension.
      - In-window to outside-window lighting boundary test and static lighting audit.
  - id: LANE-AC-04
    statement: Solar-night safety remains zero-daytime, temperature-bounded, and heat2-off with no unproven post-wet flag or hold.
    evidence_required:
      - Night admission and stop/block regression fixtures.
      - Invariant and replay proof against the refreshed corpus.
  - id: LANE-AC-05
    statement: Heap profile, floor, and WDT diagnostics meet the pre-OTA contract, with controlled restart used only if all safer corrections are insufficient.
    evidence_required:
      - Before/after free-heap, largest-block, allocation/publish pressure, loop-duration, and reset profile.
      - Compile/map output and an explicit defended heap threshold.
  - id: LANE-AC-06
    statement: One exact firmware artifact passes every required unit, invariant, replay, band-replay, lighting, irrigation, lint, test, and compile gate.
    evidence_required:
      - Immutable artifact manifest with source SHA and checksums.
      - Full validation output and retained rollback artifact reference.
validation_commands:
  - id: firmware-unit
    command: make test-firmware
    purpose: Run native firmware unit tests and corpus replay.
    required: true
  - id: firmware-invariants
    command: make firmware-invariants
    purpose: Enforce greenhouse safety invariants on the refreshed corpus.
    required: true
  - id: firmware-replay
    command: make firmware-replay OLD=origin/main NEW=HEAD
    purpose: Quantify and explain every firmware behavior delta from current main.
    required: true
  - id: firmware-band-replay
    command: make firmware-replay-band OLD=origin/main
    purpose: Detect any diurnal-band shape delta hidden by corpus-fed setpoints.
    required: true
  - id: firmware-compile
    command: make firmware-check
    purpose: Compile the exact ESP32 firmware image without deployment.
    required: true
  - id: lighting-audit
    command: make lighting-audit-static
    purpose: Verify DLI-independent lighting and boundary behavior statically.
    required: true
  - id: irrigation-audit
    command: make irrigation-stack-software-check
    purpose: Verify the software irrigation topology and fail-closed behavior without physical commissioning.
    required: true
  - id: repository-lint
    command: make lint
    purpose: Run repository Python lint and policy checks.
    required: true
  - id: repository-tests
    command: make test
    purpose: Run the full Python/runtime regression suite.
    required: true
  - id: diff-check
    command: git diff --check
    purpose: Reject whitespace and patch-integrity defects.
    required: true
required_evidence:
  - Full required-command output or immutable CI links at lane HEAD.
  - Resolver matrix for every wet-intent source, zone enable, and fertilizer interlock.
  - Exact-once wall prewet/feed/fertilizer-off/immediate-flush fault-injection results.
  - Mister re-fire, lighting boundary, and solar-night preservation fixtures.
  - Before/after heap, largest-block, allocation pressure, loop-duration, WDT, and reset profile.
  - Stock replay and band-replay delta explanation against current main.
  - Exact binary source SHA/checksum, map output, rollback artifact, and OTA acceptance manifest.
  - Diff self-audit proving no prohibited path or speculative tunable/entity change.
