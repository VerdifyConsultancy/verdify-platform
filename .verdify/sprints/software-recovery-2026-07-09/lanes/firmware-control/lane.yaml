sprint_id: software-recovery-2026-07-09
lane_id: firmware-control
title: Combined firmware topology and reliability package
objective: >-
  Produce one reviewable firmware package that enforces the approved irrigation
  topology and fail-closed wall-feed sequence, preserves proven DLI-independent
  and night/dwell behavior, and establishes a defensible ESP32 heap/WDT floor.
desired_outcome: >-
  The exact reviewed image enforces center-only climate and fail-closed wall
  feed, remains DLI-honest, preserves proven dwell/night behavior, and runs
  above the heap/WDT floor.
non_goals:
  - Add speculative anti-chatter, shoulder, freshness, post-wet, or closed-heat tunables.
  - Enable physical fertilizer before commissioning is complete.
  - Remove dormant south/west infrastructure or add physical hardware and sensors.
  - Change planner, MCP, database migrations, device-writer dispatch, or Kubernetes manifests.
  - Perform the production OTA or declare runtime acceptance from this lane.
