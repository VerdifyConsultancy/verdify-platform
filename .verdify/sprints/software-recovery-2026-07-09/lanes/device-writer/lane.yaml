    - deploy/k8s/components/hermes-iris/**
  coordination_required_paths:
    - db/schema.sql
    - deploy/k8s/base/ingestor-deployment.yaml
    - Makefile
  owned_interfaces:
    - canonical cfg wire-ID map
    - monotonic connection generation
    - requested-to-confirmed command lifecycle
    - bounded writer queue
  runtime_resources:
    - verdify-prod verdify-ingestor logs and metrics, read-only in the worker phase
    - The single ESPHome API device-writer interface, exercised only by approved non-production tests or controller-authorized probes
dependencies:
  hard: []
  soft:
    - lane_id: planner-delivery
      coordination: Planner delivery consumes the fair task cadence produced by this lane.
    - lane_id: firmware-control
      coordination: Firmware control consumes canonical cfg readbacks produced by this lane.
expected_inputs:
  - Current tunable registry
  - Actual aioesphomeapi wire slugs
  - Live storm trace
expected_outputs:
  - Generated ID fixture
  - Fair queue
  - Post-delivery state machine
  - Reason-classified logs
  - Runtime probe script or evidence
constraints:
  - Preserve exactly one live device writer and never create a parallel command path.
  - Generic cfg drift must not advance the transport reconnect generation; only a real transport generation may trigger reconnect reconciliation.
  - Never mark requested, sent, or confirmed state before the corresponding physical delivery milestone.
  - Queue and retry behavior must be bounded, cancellation-safe, restart-safe, and fair enough that no scheduled task is delayed beyond twice its cadence.
  - Canonical cfg IDs must be derived from the actual wire contract; changing firmware IDs is outside scope and requires escalation.
  - Do not add a migration; escalate if truthful terminal lifecycle cannot be implemented without one.
  - Any touched verdify_schemas or entity-map wire contract must include the required ingestor/MCP restart documentation in the PR.
  - Production access in the worker phase is read-only; release-control owns deployment and runtime mutation.
  - Update only this lane's .verdify records; the security lane's sprint-wide artifact glob does not transfer ownership of this directory.
acceptance_criteria:
  - id: LANE-AC-01
    statement: A generated fixture reports zero mismatch between every firmware-v2 cfg readback identity and the actual ESPHome wire slug.
    evidence_required:
      - Generated canonical ID fixture
      - Drift test output covering every registered cfg entity
  - id: LANE-AC-02
    statement: Generic cfg drift never advances a transport reconnect generation or causes an unchanged broad anchor push.
    evidence_required:
      - Unit and integration tests separating drift from real reconnect
      - Reason-classified stable-transport log evidence
  - id: LANE-AC-03
    statement: Cancellation, restart, timeout, and partial delivery cannot record an unsent value as sent or confirmed.
    evidence_required:
      - Dispatcher and confirmation fault-injection results
      - State-transition trace for requested, sent, confirmed, cancelled, and failed outcomes
  - id: LANE-AC-04
    statement: Long write batches do not delay any scheduled task beyond twice its configured cadence.
    evidence_required:
      - Deterministic fairness test with a long batch and concurrent scheduled tasks
      - Measured maximum task delay and queue bound
  - id: LANE-AC-05
    statement: Two steady-state production hours contain zero unchanged broad anchor pushes after deployment.
    evidence_required:
      - Post-deployment two-hour read-only log window tied to exact image digest and commit
      - Classified counts distinguishing real reconnect, actual drift, and unchanged state
validation_commands:
  - id: WRI-VAL-01
    command: make lint
    purpose: Enforce repository Python lint requirements.
    required: true
  - id: WRI-VAL-02
    command: make test
    purpose: Run the repository test suite and drift guards.
    required: true
  - id: WRI-VAL-03
    command: .venv/bin/pytest -q tests/test_03_ingestor.py tests/test_05_dispatcher.py tests/test_16_*.py
    purpose: Run targeted writer, dispatcher, confirmation, and fault-injection coverage.
    required: true
  - id: WRI-VAL-04
    command: kubectl -n verdify-prod logs deployment/verdify-ingestor --since=2h
    purpose: Capture the controller-owned post-deployment read-only push and task-cadence acceptance window.
    required: true
required_evidence:
  - Generated cfg wire-ID fixture with zero mismatches
  - Desired-versus-observed comparison and reconnect-generation test results
  - Cancellation, restart, partial-delivery, retry, and timeout fault-injection traces
  - Long-batch fairness timing and queue-bound evidence
  - Reason-classified logs with no premature sent or confirmed state
  - Controller-supplied two-hour production window with zero unchanged broad anchor pushes
  - Git diff, clean-scope review, commit SHA, PR URL, and CI results
  - Independent async/state-machine critic verdict tied to the immutable lane head
