spec_or_change_ids:
  - software-recovery-change-proposal
  - device-writer-reconcile
decision_ids:
  - DEC-005
  - DEC-006
  - DEC-007
ownership:
  domains:
    - ingestor connection generation
    - readback identity
    - desired-versus-observed comparison
    - dispatcher fairness
    - confirmation lifecycle
  owned_paths:
    - ingestor/ingestor.py
    - ingestor/shared.py
    - ingestor/esp32_push.py
    - ingestor/entity_map.py
    - ingestor/tasks/_common.py
    - ingestor/tasks/dispatcher.py
    - ingestor/tasks/confirmation.py
    - verdify_schemas/tunable_registry.py
    - verdify_schemas/tests/test_firmware_drift.py
    - tests/test_03_ingestor.py
    - tests/test_05_dispatcher.py
    - tests/test_16_*.py
