sprint_id: software-recovery-2026-07-09
lane_id: device-writer
title: Truthful non-starving ESPHome delivery
objective: >-
  Repair the sole ESPHome writer so transport generations, cfg wire identities,
  desired-versus-observed comparison, queue fairness, and post-delivery command
  states are deterministic, truthful, and non-starving.
desired_outcome: >-
  Stable transport causes no broad unchanged reconcile and every command reaches
  a truthful terminal state without starving the task loop.
non_goals:
  - Change firmware wire IDs, firmware behavior, irrigation topology, or planner policy.
  - Add or apply database migrations or create a second device writer.
  - Retire the stale 0.25 intent or perform production deployment/state mutation in this worker lane.
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
branch: lane/recovery-writer-433
worktree: /Users/jason/repos/verdify-worktrees/software-recovery-writer-433
