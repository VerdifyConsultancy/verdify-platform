  github_ci_required: true
pull_request:
  target_branch: main
  title: "Writer: truthful stable-connection reconcile and delivery lifecycle (#433)"
  linked_issues:
    - "#433"
  rules:
    - Document service restart requirements for every touched schema or entity-map contract.
    - Include terminal-state, fairness, reconnect, and runtime-probe evidence; do not claim production acceptance before deployment.
critic_requirements:
  - A fresh adversarial async/state-machine critic tests cancellation, restart, timeout, ordering, backpressure, and state-truth claims at the immutable head.
  - The critic must reject any second writer, premature persistence, unbounded queue, or drift/reconnect conflation.
integration_requirements:
  - Merge before planner-delivery and firmware-control consume the registry/readback contract.
  - Release control supplies the post-deployment two-hour acceptance window and exact runtime digest.
escalation_conditions:
  - Need to change firmware wire IDs
  - Second device writer discovered
  - Terminal lifecycle requires destructive schema change
  - No safe reconnect probe
agent_profile: python-ingestor-writer
critic_profile: adversarial async/state-machine critic
definition_of_done:
  - Every lane acceptance criterion has linked evidence in evidence.yaml, including controller-supplied runtime evidence when available.
  - All required validation commands pass at the immutable lane head.
  - Issue #433 and the PR describe exact behavior, service restarts, risks, tests, and remaining deployment-only acceptance.
  - All intended commits are pushed, required GitHub CI is green, and the worktree is clean.
  - A fresh critic accepts the state machine, fairness, ownership, and evidence.
  - Integration confirms no ownership conflict and preserves the single-writer invariant.
  - The lane is COMPLETE only after the exact deployed revision passes the two-hour zero-unchanged-broad-push runtime criterion.
