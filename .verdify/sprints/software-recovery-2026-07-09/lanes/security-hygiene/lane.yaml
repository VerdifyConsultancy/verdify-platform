sprint_id: software-recovery-2026-07-09
lane_id: security-hygiene
title: Credential source hygiene and protected rotation readiness
objective: >-
  Remove database-password fallback material from the approved standalone clients,
  prove fail-closed injected authentication, inventory every production caller,
  and prepare the protected application-credential rotation without exposing any
  credential material or bypassing the human gate.
desired_outcome: >-
  Source contains no DB-password fallback, every caller has an injected-auth path,
  and the protected rotation can be executed without stranding a consumer.
non_goals:
  - Rotate the production application DB credential without Jason's separate explicit authorization.
  - Rewrite Git history, disclose secret material, or change unrelated credentials.
  - Change database schemas, runtime services, firmware, Kubernetes manifests, or product behavior.
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
branch: codex/software-recovery-2026-07-09
worktree: /Users/jason/repos/verdify-worktrees/software-recovery-20260709
issue_ids:
  - "#438"
issue_urls:
  - https://github.com/VerdifyConsultancy/verdify-platform/issues/438
spec_or_change_ids:
  - software-recovery-change-proposal
  - g-prod-db-credential-rotation-20260709
decision_ids:
  - DEC-007
  - DEC-009
ownership:
  domains:
    - repository security
    - standalone DB clients
    - caller inventory
    - redacted rotation evidence
  owned_paths:
    - scripts/daily-summary-snapshot.py
    - scripts/render-crop-profiles.py
    - scripts/render-equipment-page.py
    - scripts/render-zone-pages.py
    - scripts/vault-operations-writer.py
    - tests/test_no_committed_db_password.py
    - .agent-workflow/hygiene/**
    - .verdify/sprints/software-recovery-2026-07-09/**
  prohibited_paths:
    - db/migrations/**
    - ingestor/**
    - mcp/**
    - firmware/**
    - deploy/k8s/**
  coordination_required_paths:
    - Makefile
    - .github/workflows/**
    - production secret authority
  owned_interfaces:
    - VERDIFY_DSN or POSTGRES_PASSWORD fail-closed injection contract
    - redacted credential gate
  runtime_resources:
    - Redacted repository and full-history secret-scan results
    - Production application DB caller inventory and credential authority, read-only until Q-001 is explicitly resolved
dependencies:
  hard: []
  soft:
    - lane_id: release-control
      coordination: Release control consumes the closed, redacted credential-rotation gate.
expected_inputs:
  - Redacted secret scan
  - Live caller inventory
  - Explicit rotation authorization
expected_outputs:
  - Source cleanup
  - Regression test
  - Caller matrix
  - Rotation runbook
  - Redacted new-valid and old-invalid proof
constraints:
  - Never print, log, commit, summarize, or store raw credential material in an artifact.
  - Stop before production rotation until Jason explicitly resolves Q-001; sprint approval and OTA approval do not authorize rotation.
  - Preserve existing secret references and use only VERDIFY_DSN or POSTGRES_PASSWORD injection; missing injection must fail closed.
  - Do not rewrite Git history or broaden the change beyond the exact owned client and hygiene paths.
  - The sprint-wide .verdify owned-path glob is limited to this lane's own records and shared security-gate records; every other lane exclusively updates its own lane directory.
  - The assigned controller worktree contains unrelated recovery changes; do not stage, modify, or commit them, and escalate if isolation cannot be proven.
  - No production mutation is permitted in the worker phase; caller discovery and auth-path checks must remain read-only and redacted.
acceptance_criteria:
  - id: LANE-AC-01
    statement: Five affected clients contain no literal or default password and fail closed without approved authentication injection.
    evidence_required:
      - Source diff limited to the five approved clients and the regression test
      - Positive injected-auth construction tests and negative missing-injection tests
  - id: LANE-AC-02
    statement: AST/source regression and redacted current-tree secret scans pass without exposing matched material.
    evidence_required:
      - Passing tests/test_no_committed_db_password.py output
      - Redacted scanner summary with counts and file classifications only
  - id: LANE-AC-03
    statement: Every production caller and its injection, restart, validation, and rollback path is inventoried before rotation.
    evidence_required:
      - Caller matrix covering repository jobs, pods, CronJobs, and operator scripts
      - Redacted preflight result proving each caller has an approved injection path
  - id: LANE-AC-04
    statement: Rotation occurs only after explicit authorization and yields redacted new-valid and old-invalid verification for every consumer.
    evidence_required:
      - Explicit Q-001 authorization reference
      - Redacted successful-new and failed-old boolean results
      - Consumer restart and rollback disposition
validation_commands:
  - id: SEC-VAL-01
    command: python3 -m py_compile scripts/daily-summary-snapshot.py scripts/render-crop-profiles.py scripts/render-equipment-page.py scripts/render-zone-pages.py scripts/vault-operations-writer.py
    purpose: Compile all affected standalone clients without importing or exposing credentials.
    required: true
  - id: SEC-VAL-02
    command: .venv/bin/pytest -q tests/test_no_committed_db_password.py
    purpose: Prove source regression and fail-closed authentication behavior.
    required: true
  - id: SEC-VAL-03
    command: git diff --check
    purpose: Reject malformed or whitespace-damaged changes.
    required: true
required_evidence:
  - Redacted current-tree and history scan summaries with no raw matches
  - Source and AST regression results for all five clients
  - Complete caller and injected-auth matrix
  - Explicit rotation authorization, if granted
  - Redacted new-valid and old-invalid verification for every caller, if rotation is authorized
  - Git diff, clean-scope review, commit SHA, PR URL, and CI results
  - Independent security and release critic verdict tied to the immutable lane head
record_updates:
  issues: true
  pull_request: true
  specifications: true
  documentation: true
  decisions: true
git_policy:
  commit_style: Small coherent commits referencing #438; never include credential material in commit text.
  push_required: true
  self_merge_allowed: false
  clean_worktree_required: true
  pull_request_required: true
  github_ci_required: true
pull_request:
  target_branch: main
  title: "Security: remove DB credential fallbacks and prepare scoped rotation (#438)"
  linked_issues:
    - "#438"
  rules:
    - Describe redacted findings, validation, caller coverage, and the unresolved Q-001 gate.
    - Do not claim rotation complete until explicit authorization and negative-old verification exist.
critic_requirements:
  - A fresh independent security/release critic reviews the immutable head, redaction, caller completeness, and fail-closed behavior.
  - Any secret-like output or unidentified caller is an automatic rejection.
integration_requirements:
  - Integrate source cleanup without production mutation.
  - Release control must consume a separately closed rotation gate before any production release.
escalation_conditions:
  - Any unidentified caller
  - Any output containing credential material
  - Missing explicit rotation authorization
  - Failed old-credential rejection
agent_profile: controller-integrator with security hygiene discipline
critic_profile: independent security/release critic
definition_of_done:
  - Every lane acceptance criterion has linked evidence in evidence.yaml.
  - All required validation commands pass at the recorded immutable head.
  - Issue #438 and the pull request accurately distinguish source remediation from the protected rotation state.
  - The caller matrix, runbook, and redacted verification artifacts are durable and contain no secret material.
  - A fresh critic accepts the lane and required GitHub CI is green.
  - All intended commits are pushed, unrelated controller changes remain untouched, and the final worktree is clean.
  - The lane is not COMPLETE until Q-001 is explicitly authorized and the redacted new-valid and old-invalid checks pass; otherwise it stops at the protected gate.
