      granted_by: software-recovery controller
      reason: Preserve the merged fail-closed credential contract while exposing resource provenance.
  owned_interfaces:
    - canonical active equipment alias contract
    - revisioned resource coefficient
    - water ledger freshness/conservation
    - energy measurement coverage
  runtime_resources:
    - verdify-prod PostgreSQL equipment/resource tables and views (read-only validation only)
    - verdify-ingestor daily and Home Assistant materializer tasks (code ownership only)
    - verdify-api and verdify-mcp resource consumers (code ownership only)
    - provisioned Grafana resource dashboards (source ownership; controller deploys)
dependencies:
  hard:
    - lane_id: evidence-core
      required_output: complete-day transition source and finalized migration sequence through its highest number
  soft:
    - lane_id: security-hygiene
      coordination: Rebase on the merged fail-closed credential helper before editing render-equipment-page; do not wait for production rotation.
    - lane_id: firmware-control
      coordination: Corrected irrigation intent events arrive later; preserve an explicit intent-versus-observed distinction until then.
constraints:
  - Do not begin implementation until evidence-core is merged and the controller confirms its highest migration number and shared DB/MCP head.
  - Reserve only migrations 193 and 194; stop on any number collision or if evidence-core ends above migration 192.
  - Land schema and migrations before consumers; keep every migration idempotent and compatible with the rollback-safety classifier.
  - SQL fixtures must run against a disposable database; this worker may not apply migrations or mutate verdify-prod.
  - Preserve active telemetry compatibility until every active relay slug resolves through the canonical alias contract.
  - Never convert command-only intent into gallons, and never discard ambiguous or unattributed water to make conservation appear exact.
  - Keep measured energy, runtime-modeled energy, uncertainty range, coefficient revision, source, coverage, and quality independently queryable.
  - A missing or stale ledger must produce unavailable/degraded evidence, never a silent raw max-minus-min fallback.
  - Generated Grafana ConfigMaps may be regenerated and committed only after the controller grants exclusive ownership of the coordination-required generated path.
  - Coordinate before changing scripts/daily-summary-snapshot.py; do not edit migration 195, which belongs to dli-availability after this lane merges.
  - Rebase on security-hygiene source cleanup before changing scripts/render-equipment-page.py and preserve its fail-closed credential contract.
  - No new external dependency, physical device, public API break, or production mutation is authorized.
acceptance_criteria:
  - id: LANE-AC-01
    statement: Every active telemetry slug resolves canonically before legacy reads are removed.
    evidence_required:
      - Active-slug inventory and alias fixture with zero unresolved or multiply resolved active slugs
      - Compatibility tests proving legacy reads remain valid during convergence
  - id: LANE-AC-02
    statement: The water ledger catches up idempotently, alerts on staleness, and never silently falls back to raw max/min.
    evidence_required:
      - Catch-up, rerun, counter-reset, gap, and staleness SQL fixtures
      - Consumer tests for fresh, stale, unavailable, and discontinuous ledger states
  - id: LANE-AC-03
    statement: Complete-day water conserves across attributed, ambiguous, and manual/unattributed buckets; command-only never becomes gallons.
    evidence_required:
      - Hand-calculated conservation fixtures covering overlap, no command, multiple candidate runs, and incomplete days
      - API, MCP, dashboard, and generated-page evidence showing scope and quality labels
  - id: LANE-AC-04
    statement: Runtime-modeled and partial measured energy remain separate with coefficient revision/range, coverage, and quality.
    evidence_required:
      - Coefficient provenance and revision fixtures
      - Reconciliation fixtures for fully measured, partially measured, modeled-only, stale, and unavailable energy
validation_commands:
  - id: migration-classification
    command: make migration-rollback-safety
    purpose: Classify migrations 193 and 194 and prevent unsafe rollback wrapping.
    required: true
  - id: resource-sql-fixtures
    command: for f in db/migrations/tests/test-193-*.sql db/migrations/tests/test-194-*.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
    purpose: Run water and energy migration fixtures against a disposable PostgreSQL/Timescale database.
    required: true
  - id: python-lint
    command: make lint
    purpose: Run repository Python lint for the cross-stack consumers and materializers.
    required: true
  - id: repository-tests
    command: make test
    purpose: Run the full repository test suite, including database and site consumer coverage.
    required: true
  - id: grafana-generation
    command: python3 scripts/gen-grafana-dashboard-cms.py
    purpose: Regenerate provisioned dashboard ConfigMaps after controller grants exclusive ownership of the generated path.
    required: true
  - id: grafana-render-contract
    command: make grafana-brand-check && .venv/bin/pytest -q tests/test_15_lab_site_followup.py
    purpose: Validate dashboard JSON/render contracts and the generated-site resource surfaces.
    required: true
  - id: diff-integrity
    command: git diff --check
    purpose: Reject whitespace errors and malformed patches.
    required: true
required_evidence:
  - Lane-head commit SHA and complete diff against the assigned baseline/current-main branch point
  - Migration classifications plus disposable-database rollback and idempotence fixture output
  - Active-slug alias inventory with provenance and zero unresolved active relays
  - Water-ledger freshness, catch-up, discontinuity, and conservation artifacts
  - Energy measurement-coverage and modeled-coefficient reconciliation artifacts
  - API, MCP, Grafana, and generated equipment-page examples with scope, quality, and unavailable states
  - Full validation output or immutable CI links at lane HEAD
  - Adversarial self-audit covering false precision, double counting, stale fallback, and cross-lane path ownership
record_updates:
  issues: true
  pull_request: true
  specifications: true
  documentation: true
  decisions: false
git_policy:
  commit_style: "Focused conventional commits that keep schema before consumers and cite #437"
  push_required: true
  self_merge_allowed: false
  clean_worktree_required: true
  pull_request_required: true
  github_ci_required: true
escalation_conditions:
  - No canonical alias exists for an active relay or multiple active slugs resolve to the same physical output ambiguously.
  - A water-counter reset, discontinuity, or overlap cannot be conservatively classified without inventing delivered volume.
  - Migration 193 or 194 collides, evidence-core consumes a later number, or a self-committing migration becomes necessary.
  - A product surface cannot represent unavailable, partial, modeled, ambiguous, or unattributed evidence without a false scalar.
  - A prohibited or ungranted coordination-required path must change.
  - A destructive/production operation, new external dependency, public API break, or physical measurement is required.
agent_profile: cross-stack-data-product
critic_profile: data-integrity/accounting critic
definition_of_done:
  - Every acceptance criterion passes with evidence tied to the immutable lane HEAD.
  - Migrations 193 and 194, schema dump, materializers, API/MCP consumers, dashboard sources, generated artifacts, and equipment page agree on one provenance-bearing contract.
  - "Issue #437 contains an implementation summary, validation evidence, limitations, and remaining physical-data gaps."
  - "The feature branch is pushed and a PR linked to #437 is open with required restart/migration notes and green required CI."
  - The worker has completed an adversarial self-audit and recorded discoveries as separate follow-up issues rather than widening scope.
  - The worktree is clean and contains no edits outside owned paths or explicitly granted coordination-required paths.
  - An independent data-integrity/accounting critic is requested; the worker leaves the lane READY_FOR_CRITIC and does not self-merge.
