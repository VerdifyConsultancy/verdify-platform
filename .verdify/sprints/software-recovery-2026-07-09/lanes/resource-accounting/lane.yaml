sprint_id: software-recovery-2026-07-09
lane_id: resource-accounting
title: Canonical equipment and scope-aware water/energy evidence
objective: >-
  Converge active equipment identity and resource coefficients, then expose
  idempotent water and energy evidence whose scope, provenance, freshness, and
  uncertainty are explicit to every consumer.
desired_outcome: >-
  One active-slug equipment catalog and a fresh idempotent water ledger expose
  measured, modeled, uncertain, command-only, ambiguous, and unattributed
  resource scopes separately.
non_goals:
  - Add physical sensors, meters, plumbing, or equipment.
  - Infer delivered water from commands or collapse measured and modeled energy into one scalar.
  - Change firmware control, device-writer delivery, or planner_graph behavior.
  - Deploy migrations, restart production services, or mutate production state from this lane.
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
branch: lane/recovery-resource-437
worktree: /Users/jason/repos/verdify-worktrees/software-recovery-resource-437
