  soft:
    - lane_id: evidence-core
      coordination: supplies corrected forecast/outcome evidence
expected_inputs:
  - Quiet and fair writer cadence from device-writer.
  - The merged unavailable-DLI contract from dli-availability.
  - Existing firmware-supported tunable registry bounds.
  - July 9 planner_graph crash trace plus read-only proof that planner_graph_runs contains zero rows and is not the Hermes/MCP writer path.
outputs:
  - Self-healing MCP path with tool-level readiness.
  - Terminal planner ledger and action-contract verifier.
  - Normalized materializer with strict bounds, singularity, and expiry.
  - Forecast comparator fixtures and explicit neutral fallback behavior.
  - Worker-aware health and transient DB/DNS recovery for the retained non-authoritative planner_graph workload, or a reviewed desired-state decommissioning change.
coordination_rules:
  - Do not dispatch until both hard dependencies are independently accepted and merged.
  - Cut the feature branch from the then-current main; retain baseline_sha as the sprint audit reference.
  - Coordinate any change to the shared tunable registry or schema dump with the controller before editing.
  - Schema and migration changes land before consumer changes, and the PR must name required verdify-mcp and verdify-ingestor restarts.
constraints:
  - Deterministic firmware remains authoritative and every failure path is neutral.
  - Required set_plan triggers may be satisfied only by a valid full plan; other actions remain separately classified.
  - Bounds are intersected and normalized once, exactly one plan is effective at an instant, and every plan expires.
  - Tool readiness must fail on MCP tool loss and recover indefinitely with bounded backoff and no keepalive race.
  - "planner_graph remains non-authoritative: it may not receive production trigger routing, materialize device plans, or write device commands."
  - If planner_graph remains deployed, repository/DB exceptions may not silently kill its worker while health stays green; readiness must observe worker state and recovery must be bounded and indefinite or deliberately exit for Kubernetes restart.
  - If planner_graph is decommissioned instead, the reviewed desired state must remove its workload and probes without deleting run history or changing the Hermes/MCP path.
  - Never clear planner_required_plan_missed except through a valid accepted terminal action.
  - No production mutation, Argo sync, or service restart is authorized for the lane worker.
  - No raw secrets or credential material may enter source, logs, issues, PRs, or evidence.
acceptance_criteria:
  - id: LANE-AC-01
    statement: Tool loss fails readiness and recovers indefinitely with bounded backoff and no keepalive race.
    evidence_required:
      - Deterministic MCP disconnect, reconnect, and prolonged-outage fault-injection tests.
      - Readiness and retry-state assertions at lane HEAD.
  - id: LANE-AC-02
    statement: Required set_plan triggers are satisfied only by a valid full plan and every other action is terminally classified separately.
    evidence_required:
      - Action-contract unit and integration fixtures.
      - Terminal ledger examples for success, neutral fallback, timeout, and wrong action.
  - id: LANE-AC-03
    statement: Bounds are intersected and normalized once, one plan is effective at an instant, and every plan expires.
    evidence_required:
      - Strict-bound conflict and normalization tests.
      - Migration rollback proof and plan singularity/TTL fixtures.
  - id: LANE-AC-04
    statement: SUNRISE and SUNSET fault injection yields a valid plan or explicit neutral fallback and a valid action can resolve the critical planner alert.
    evidence_required:
      - Forecast comparator and trigger fault-injection results.
      - Read-only end-to-end acceptance probe plan and output; production mutation remains release-controlled.
  - id: LANE-AC-05
    statement: The deployed non-authoritative planner_graph runtime cannot remain false green; it either reports worker-aware health and recovers from transient DB/DNS loss, or is explicitly removed from desired state without becoming a writer.
    evidence_required:
      - Worker exception, retry/backoff or deliberate-exit, readiness, and recovery tests plus a synthetic non-authoritative queued-run terminal trace if retained.
      - Manifest diff proving truthful probes or explicit workload removal, and read-only evidence that planner_graph does not satisfy Hermes/MCP required-plan acceptance.
validation_commands:
  - id: planner-lint
    command: make lint
    purpose: Run repository Python lint and static policy checks.
    required: true
  - id: planner-tests
    command: make test
    purpose: Run the full Python/runtime test suite.
    required: true
  - id: planner-targeted-tests
    command: .venv/bin/pytest -q tests/test_04_planner.py tests/test_10_planner_routing.py tests/test_17_planner_health_surface.py
    purpose: Exercise planner delivery, routing, health, fault, bounds, and terminal-action contracts.
    required: true
  - id: planner-graph-health-tests
    command: .venv/bin/pytest -q planner_graph/tests/test_app.py planner_graph/tests/test_server.py planner_graph/tests/test_store_postgres.py planner_graph/tests/test_worker.py
    purpose: Prove the non-authoritative deployed planner worker cannot die behind a green health surface and can recover or exit deliberately.
    required: true
  - id: migration-safety
    command: make migration-rollback-safety
    purpose: Classify the lane migration before any database application.
    required: true
  - id: prod-manifest-build
    command: kustomize build deploy/k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas
    purpose: Validate Hermes and MCP manifest integration without changing production.
    required: true
  - id: diff-check
    command: git diff --check
    purpose: Reject whitespace and patch-integrity defects.
    required: true
required_evidence:
  - Full required-command output or immutable CI links at lane HEAD.
  - MCP disconnect/reconnect/prolonged-outage fault-injection artifact.
  - Terminal action ledger and wrong-action rejection artifact.
  - Bounds, singularity, TTL, and migration rollback evidence.
  - SUNRISE/SUNSET full-plan or neutral-fallback evidence.
  - Worker-aware planner_graph recovery/decommission evidence that cannot be mistaken for Hermes/MCP plan acceptance.
  - Diff self-audit proving no planner_graph production routing, materialization authority, or device-writer change.
  - Service-restart note for verdify-mcp and verdify-ingestor when required by touched contracts.
