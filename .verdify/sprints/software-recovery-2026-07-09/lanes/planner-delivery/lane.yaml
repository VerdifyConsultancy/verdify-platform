  pull_request: true
  specifications: true
  documentation: true
  decisions: false
git_policy:
  commit_style: Focused conventional commits tied to issue #427
  push_required: true
  self_merge_allowed: false
  clean_worktree_required: true
  pull_request_required: true
  github_ci_required: true
pull_request:
  title: "Planner: self-healing MCP delivery, terminal plans, bounds, and expiry (#427)"
  base: main
  issue_update_rule: Keep #427 updated at orientation, PR open, blocker, critic handoff, and acceptance; never claim production resolution before release evidence.
  merge_rule: Controller merges only after independent critic acceptance and required GitHub checks at the immutable reviewed head.
escalation_conditions:
  - Hermes upstream image must change.
  - planner_graph would become a writer.
  - Registry bounds conflict cannot be safely intersected.
  - Neutral fallback would bypass deterministic firmware.
  - A prohibited path, public API expansion, destructive migration, security-boundary change, or production mutation becomes necessary.
  - Either hard dependency is incomplete, rejected, or changes a consumed interface after branch cut.
agent_profile: planner-mcp-reliability
critic_profile: distributed-state/planner contract critic
integration_requirements:
  - Independent critic reviews the immutable lane head and all acceptance evidence.
  - Integration preserves schema-first ordering and reconciles shared registry, MCP, and schema changes against merged dependency heads.
  - Repository-wide tests and GitHub CI rerun after merge; production proof belongs to release-control.
definition_of_done:
  - Every lane acceptance criterion passes with linked, revision-specific evidence.
  - Only issue #427 scope and owned paths changed, or an approved coordination record exists.
  - Migration and manifest validation pass and restart requirements are documented.
  - Issue #427 and the pull request accurately state implementation and remaining production work.
  - Branch is pushed, PR is open, required CI is green, and the lane worktree is clean.
  - Adversarial self-audit is recorded and the lane is READY_FOR_CRITIC; the worker does not self-merge or deploy.
