sprint_id: software-recovery-2026-07-09
lane_id: planner-delivery
title: Self-healing bounded planner delivery
objective: >-
  Repair the Hermes/MCP/planner delivery chain so required planner triggers
  recover tool health, produce truthful terminal actions, enforce the strictest
  bounds once, expire cleanly, evaluate forecasts against the correct
  semantics, and leave no false-green deployed planner runtime.
desired_outcome: >-
  Required planner triggers regain tool health, truthful terminal action
  semantics, strict bounds, singular expiry, and correct forecast evaluation.
non_goals:
  - Make planner_graph an operational writer.
  - Route production triggers or device writes through planner_graph, or use a planner_graph synthetic run as Hermes/MCP acceptance.
  - Move deterministic five-second control or safety rails into AI.
  - Change firmware behavior, device-writer delivery code, or Grafana surfaces.
  - Perform production deployment, stale-intent retirement, or alert mutation from this lane.
