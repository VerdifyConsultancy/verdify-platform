sprint_id: software-recovery-2026-07-09
lane_id: release-control
title: Cycling gate, stale-intent retirement, and production acceptance
objective: >-
  Integrate and release the independently accepted recovery in its safe order,
  add a topology-aware immutable cycling gate, retire the stale 0.25 intent
  without repin, deploy one exact reviewed firmware image, and prove immediate
  plus settled production health.
desired_outcome: >-
  The exact integrated revisions deploy in safe order, stale 0.25 intent is
  retired without repin, one OTA passes topology-aware cycling/heap gates, and
  the settled runtime state is durable.
non_goals:
  - Implement product behavior owned by any upstream lane.
  - Edit firmware policy, ingestor/planner/MCP implementation, or database migrations.
  - Rotate credentials without Jason's separate explicit authorization.
  - Override a failed critical-alert, weekly, bake, heap, cycling, migration, CI, or runtime gate.
  - Sync unrelated Argo drift, prune production resources, or add physical hardware.
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
branch: lane/recovery-release-377-390
worktree: /Users/jason/repos/verdify-worktrees/software-recovery-release-control
