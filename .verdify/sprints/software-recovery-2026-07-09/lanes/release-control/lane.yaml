    - immediate/settled acceptance
  runtime_resources:
    - argocd Application/verdify-prod-dark
    - verdify-prod schema migration job and promoted application Deployments
    - verdify-prod active-plan and setpoint readback surfaces
    - ESP32 greenhouse controller OTA and rollback path
    - verdify-prod alert, writer, planner, relay, DLI, heap, reset, cycle, and resource evidence surfaces
dependencies:
  hard:
    - lane_id: security-hygiene
      required_output: credential rotation authorized, executed, and verified redacted
    - lane_id: evidence-core
      required_output: trustworthy cycle/night/replay evidence live
    - lane_id: resource-accounting
      required_output: scope-bearing resource consumers live
    - lane_id: device-writer
      required_output: two-hour quiet writer acceptance live
    - lane_id: dli-availability
      required_output: DLI unavailable consumers live
    - lane_id: planner-delivery
      required_output: valid required plan and critical alert resolution live
    - lane_id: firmware-control
      required_output: exact reviewed firmware and rollback artifacts
  soft: []
expected_inputs:
  - Independently accepted and merged heads from every implementation lane.
  - Live issue-389 cycle view and realized night/replay evidence.
  - Exact reviewed combined firmware binary, source SHA, checksum, and rollback artifact.
  - Closed issue-438 credential rotation gate with redacted new-valid and old-invalid proof.
outputs:
  - Immutable pre/post cycling JSON and human-readable reports.
  - Release manifest tying Git, image digests, migrations, Argo revision, firmware, policy, and evidence.
  - Audited stale-intent retirement and zero-repin proof.
  - Promotion, sync, OTA, immediate verification, 48-hour bake, and final review packet.
coordination_rules:
  - No release worktree dispatch until every hard dependency is independently accepted and merged.
  - No production mutation until the protected credential gate is explicitly authorized, executed, and verified without exposing material.
  - Cut the release branch from current main after dependencies merge; retain baseline_sha as the sprint audit reference.
  - Coordinate any prod-promote workflow or overlay edit; only a digests-only reviewed promotion may enter the sync surface.
  - Release-owned named firmware scripts are edited only after firmware-control is accepted; if that lane touched one through its wildcard, the controller must reconcile the handoff and rerun both contracts' checks serially.
  - An autonomous lane worker may implement and validate release tooling but may not execute production state changes; only the controller-integrator may do so after every gate.
constraints:
  - Delivery order is serialized schema, services, valid planner action/alert clearance, stale-intent retirement, then one exact firmware OTA.
  - The cycling gate rejects overlapping, current/future, incomplete, or incomparable windows and records immutable source/SHA/firmware/policy metadata.
  - Cycling policy requires zero south/west climate cycles, compares center against the prior combined climate envelope, and uses explicit canaries/tolerances for other relays.
  - Repaired consumers must be live before the stale 0.25 row is atomically retired; effective and device band_track_fraction must stay zero with no repin.
  - Argo sync is limited to the reviewed surface, uses prune false, and stops on unrelated drift.
  - OTA uses the exact reviewed artifact and retained rollback binary; critical alerts, weekly, 48-hour bake, heap, cycling, telemetry, and action-log gates remain mandatory.
  - Post-OTA verification must use diagnostics.firmware_version, not last-good.version, and must keep VERDIFY_DB_BACKEND=kube throughout version and sensor checks.
  - No raw secret, old/new credential, private key, or decrypted secret content may appear in commands, logs, issues, PRs, or evidence.
acceptance_criteria:
  - id: LANE-AC-01
    statement: The cycling gate rejects invalid windows and emits immutable source, SHA, firmware, policy, and completeness metadata.
    evidence_required:
      - Gate unit/fixture results including overlapping, future, partial, insufficient-data, and historical-regression cases.
      - Immutable pre-release baseline artifact from the trustworthy cycle source.
  - id: LANE-AC-02
    statement: Cycling policy requires zero south/west climate cycles, compares center to the prior combined climate envelope, and applies explicit canaries and tolerances to other relays.
    evidence_required:
      - Policy fixture and human-readable explanation.
      - Pre/post raw-transition cycle, runtime, short-cycle, and peak-rate comparison.
  - id: LANE-AC-03
    statement: Repaired consumers are live before stale intent is atomically retired and effective/device band_track_fraction remains zero with no repin.
    evidence_required:
      - Redacted before/after transaction and effective-view/readback proof.
      - Zero-repin log and plan-row watch across immediate and settled windows.
  - id: LANE-AC-04
    statement: Exact reviewed digests, revisions, migrations, and one firmware image deploy in safe order with immediate and settled runtime proof.
    evidence_required:
      - Release manifest, Argo diff/sync/health, live image digests, schema versions, firmware version, and rollback references.
      - Immediate and 48-hour settled DB/log/readback/endpoint probes.
  - id: LANE-AC-05
    statement: No deploy-blocking alert, Task WDT, heap-guard reboot, forbidden route, false DLI, writer storm, stale repin, or declared cycling regression remains.
    evidence_required:
      - Alert, reset, heap, route attribution, DLI availability, writer cadence, planner action, and cycling evidence.
      - Independent release/runtime critic verdict on the immutable final packet.
validation_commands:
  - id: release-lint
    command: make lint
    purpose: Run repository Python lint and policy checks for release tooling.
    required: true
  - id: release-tests
    command: make test
    purpose: Run the full Python/runtime regression suite.
    required: true
  - id: migration-safety
    command: make migration-rollback-safety
    purpose: Verify every integrated migration is correctly classified before production delivery.
    required: true
  - id: cycling-gate
    command: make firmware-cycling-gate
    purpose: Generate and enforce the immutable topology-aware pre/post cycling policy.
    required: true
  - id: firmware-preflight
    command: VERDIFY_DB_BACKEND=kube bash scripts/firmware-deploy-preflight.sh
    purpose: Enforce alert, weekly, bake, telemetry, action-log, and release prerequisites before OTA.
    required: true
  - id: argo-diff
    command: kustomize build deploy/k8s/overlays/prod | kubectl diff -f -
    purpose: Prove the production sync surface contains only reviewed changes before sync.
    required: true
  - id: argo-health
    command: kubectl get application verdify-prod-dark -n argocd -o yaml
    purpose: Capture desired revision, sync, operation, and health state without mutating production.
    required: true
  - id: climate-authority
    command: VERDIFY_DB_BACKEND=kube bash scripts/validate-climate-authority-post-deploy.sh
    purpose: Verify post-deploy authority, readback, and control-path invariants from production evidence.
    required: true
  - id: diff-check
    command: git diff --check
    purpose: Reject whitespace and patch-integrity defects.
    required: true
required_evidence:
  - Full required-command output or immutable CI links at the exact release head.
  - Independent critic verdicts for every upstream immutable lane head.
  - Redacted issue-438 caller, new-valid, and old-invalid gate proof; never credential material.
  - Migration rollback classifications and applied schema-version evidence.
  - Digest-pinned promotion, scoped Argo diff/sync, pod image, health, and endpoint evidence.
  - Atomic stale-intent retirement plus immediate and settled zero-repin evidence.
  - Exact firmware SHA/checksum/version, preflight, OTA, rollback, heap/reset, and sensor-health evidence.
  - Immutable topology-aware cycling baseline and 48-hour post-OTA comparison.
  - Final DB/log/readback/alert/relay/DLI/planner/writer/resource review packet.
record_updates:
  issues: true
  pull_request: true
  specifications: true
  documentation: true
  decisions: true
git_policy:
  commit_style: Focused conventional commits for release tooling and durable acceptance records
  push_required: true
  self_merge_allowed: false
  clean_worktree_required: true
  pull_request_required: true
  github_ci_required: true
pull_request:
  title: "Release: topology-aware cycling gate and recovery acceptance (#377 #390)"
  base: main
  issue_update_rule: Keep #377 and #390 updated at tooling PR, critic, preflight, state retirement, OTA, immediate proof, and settled proof; do not close before runtime evidence.
  merge_rule: Controller merges tooling only after independent critic acceptance and required GitHub checks; production steps begin only after every hard dependency and protected gate are closed.
escalation_conditions:
  - Credential rotation is not separately and explicitly authorized or its caller verification is incomplete.
  - Unrelated Argo drift enters the sync surface.
  - Any critical alert, weekly, bake, heap, cycling, migration, CI, telemetry, or action-log gate fails.
  - The stale row repins, effective/device value is nonzero, or transaction semantics are uncertain.
  - Immediate or settled runtime acceptance fails.
  - A prohibited product path, destructive database action, force/prune operation, raw secret exposure, or unreviewed artifact becomes necessary.
agent_profile: controller-integrator; no autonomous worker may execute production state changes
critic_profile: independent release/runtime critic
integration_requirements:
  - Verify every upstream PR was accepted at its immutable head and integrated in dependency order before cutting this branch.
  - Independent critic reviews cycling tooling and the pre-release manifest before production mutation.
  - Controller-integrator alone performs schema/service delivery, stale-state retirement, Argo sync, and OTA after all gates.
  - A fresh independent release/runtime critic reviews immediate and settled evidence before final completion.
definition_of_done:
  - Every upstream lane is independently accepted, merged, live where required, and represented in the exact release manifest.
  - The protected credential rotation gate is explicitly authorized, executed, and verified with redacted evidence.
  - Every lane acceptance criterion passes with revision- and environment-specific evidence.
  - Issues #377 and #390, PRs, decisions, router/strategy state, and final review packet match production reality.
  - Exact reviewed services and one firmware image are live; rollback artifacts and procedures are exercised or deterministically proven.
  - Immediate and 48-hour settled probes show no declared blocker or regression.
  - Git and worktrees are clean, required CI is green, and the independent final critic accepts the immutable release packet.
