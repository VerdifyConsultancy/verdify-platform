sprint_id: software-recovery-2026-07-09
lane_id: evidence-core
title: Solar, cycle, dry-out, and replay evidence foundations
objective: >-
  Establish one serialized evidence contract for DB/device solar and VPD parity,
  transition-derived equipment cycling, realized solar-night dry-out episodes,
  and provenance-bearing outdoor freshness in the stock replay corpus.
desired_outcome: >-
  Production and offline gates use device-parity solar/VPD semantics,
  raw-transition cycling, realized night episodes, and source-backed outdoor
  freshness.
non_goals:
  - Change firmware control behavior, irrigation routing, writer delivery, planner policy, dashboards, or Kubernetes deployment.
  - Rewrite historical equipment state or use a force-fresh override to manufacture replay coverage.
  - Apply production migrations from the autonomous worker phase; release sequencing remains controller-owned.
