deferred_work:
  - id: DEF-001
    reason: Physical interior-light sensor replacement and calibration are Jason-owned; software remains unavailable until then.
  - id: DEF-002
    reason: Wall fertigation chemistry, product, injector, flow, distribution, and flush commissioning require physical measurements; actuation remains disabled.
  - id: DEF-003
    reason: Vision issue 436 is real but unrelated to the live greenhouse control recovery and the mixed PR was closed.
  - id: DEF-004
    reason: New HAF, shade, intake, meters, dehumidifier, sensors, and plumbing are outside the approved software-only wave.
  - id: DEF-005
    reason: Broad controller deletion/mode collapse and planner_graph productization remain deferred; the already-deployed zero-run workload still receives narrow truthful-health or explicit decommissioning treatment without gaining planner authority.
risk:
  overall: CRITICAL
  items:
    - id: RISK-001
      description: A wrong writer or irrigation sequence can affect the only live greenhouse.
      mitigation: One resolver/writer, schema-service-first order, offline proof, explicit relay attribution, and rollback.
      human_gate: false
    - id: RISK-002
      description: The combined firmware surface can worsen heap, cycling, or control behavior.
      mitigation: One exclusive firmware lane, refreshed replay, heap/cycling gates, independent critic, one OTA, and settled runtime watch.
      human_gate: false
    - id: RISK-003
      description: Production-only migrations can drift or self-commit unexpectedly.
      mitigation: Reserve 189, serialize every migration, classify rollback shape, and prove source/live version before consumers.
      human_gate: false
    - id: RISK-004
      description: Credential rotation can strand an undiscovered consumer.
      mitigation: Complete caller inventory and staged injection proof before the explicitly authorized scoped rotation; retain a rollback secret path without exposing values.
      human_gate: true
    - id: RISK-005
      description: Weather and broken sensors can create false outcome PASS claims.
      mitigation: Availability/provenance, matched/representative windows, realized response, insufficient-data state, and no DLI claims.
      human_gate: false
    - id: RISK-006
      description: Existing Argo drift can turn a broad sync into unrelated production mutation.
      mitigation: Reconcile exact diff, promote digest-pinned artifacts, and sync only the reviewed release surface.
      human_gate: false
deployment_policy:
  approval_required: true
  rollback_required: true
  runtime_checks:
    - Protected DB credential rotation is required before any production release and awaits explicit authorization.
    - Apply serialized schema migrations and verify service consumers before stale-state cleanup or OTA.
    - Deploy writer/planner/services and clear the critical required-plan alert before firmware preflight.
    - Atomically retire stale 0.25 intent only after repaired consumers are live.
    - OTA the exact reviewed combined image once; then run immediate and settled writer, planner, relay, DLI, dry-out, heap, cycling, and alert probes.
