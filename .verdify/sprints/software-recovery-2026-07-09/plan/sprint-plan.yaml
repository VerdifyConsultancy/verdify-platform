sprint_id: software-recovery-2026-07-09
title: Live greenhouse software truth and control recovery
objective: >-
  Deliver every approved July 9 software correction through reviewed source,
  serialized schema changes, production services, one combined firmware OTA,
  and durable runtime verification without adding hardware or guessing physical
  crop measurements.
desired_outcome: >-
  The live greenhouse has one truthful non-starving device writer, a tool-healthy
  bounded planner, center-only climate mist, fail-closed wall-only fertigation,
  unavailable interior DLI, solar-night realized dry-out evidence, trustworthy
  cycling/resource accounting, a safe heap floor, and no stale June intent or
  exposed production database credential.
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
target_environment: verdify-prod
target_cadence: Outcome-driven recovery wave; no artificial daily cutoff.
backlog_source:
  system: GITHUB_ISSUES
  repository: VerdifyConsultancy/verdify-platform
  milestone: Cross-milestone recovery label sprint:software-recovery-2026-07-09
  query: is:issue is:open label:sprint:software-recovery-2026-07-09
assumptions:
  - Current deterministic firmware safety remains authoritative over planner output.
  - Physical wall-feed commissioning is incomplete, so automatic fertilizer software ships disabled and fail-closed.
  - Jason's objective authorizes implementation, production delivery, and one OTA without another OTA request; deterministic gates are not waived.
  - Production credential rotation remains separately protected until Jason explicitly authorizes it.
constraints:
  - Track A live greenhouse continuity outranks delivery speed.
  - Schema changes land before consumers and migrations are serialized with rollback classification.
  - One live device writer, one production environment, one reviewed combined firmware package, and no second control path.
  - Firmware delivery requires unit, invariant, replay, band-replay where applicable, compile, heap, cycling, alert, weekly, bake, and rollback evidence.
  - No raw credential, secret, or decrypted material may appear in source, logs, issues, review packets, or chat.
non_goals:
  - Replace the broken interior light sensor or add any other sensor, meter, HAF fan, shade, intake, dehumidifier, or plumbing.
  - Enable physical fertilizer before wall chemistry, product, injector, flow, distribution, volume, and flush commissioning are recorded.
  - Invent a mixed lime/cannabis nutrient recipe or reinterpret climate mist as deliberate Vanda irrigation.
  - Make planner_graph an operational writer or move five-second deterministic control into AI.
  - Extract the deferred vision work in issue 436, rewrite Git history, or perform unrelated public DNS/edge work.
acceptance_criteria:
  - id: SPR-AC-01
    statement: Stable ESPHome operation produces no periodic broad anchor reconcile and every requested device write has truthful terminal state without starving scheduled tasks.
    evidence_required:
      - Generated cfg-wire identity fixture with zero mismatches.
      - Two steady-state production hours with zero unchanged bulk repushes.
      - Controlled drift and reconnect probes with exact requested/sent/confirmed/cancelled outcomes.
  - id: SPR-AC-02
    statement: Required Hermes/MCP planner cycles are tool-healthy, terminally classified, strictly bounded, expiring, and immediately active after acceptance; the deployed non-authoritative planner_graph runtime is truthfully healthy or explicitly absent.
    evidence_required:
      - MCP fault-injection and self-heal tests.
      - SUNRISE and SUNSET terminal full-plan or neutral-fallback records.
      - Strict bound-intersection, action-contract, TTL, and forecast-semantics tests.
      - Resolution of critical planner_required_plan_missed from a valid terminal action.
      - Worker-aware planner_graph DB/DNS fault/recovery or desired-state removal proof, never used as Hermes/MCP plan acceptance.
  - id: SPR-AC-03
    statement: Climate/VPD wetting actuates center mist only and center mist accepts no non-climate origin; dormant center drip and south/west irrigation remain disabled; both legacy 10:30 jobs are ineligible; fertilizer can reach only a calibrated commissioned wall-drip path on restart-safe weekly solar cadence.
    evidence_required:
      - Resolver unit/invariant/replay evidence for every command source.
      - Live intent and relay attribution showing zero south/west climate cycles and zero non-wall fertilizer cycles.
      - Reverse-exclusivity, no-10:30, weekly solar/missed-window/restart, calibrated liters-to-duration, fail-closed commissioning, and exact-once prewet/feed/immediate-flush tests.
  - id: SPR-AC-04
    statement: Interior crop DLI is unavailable with provenance everywhere the broken sensor is invalid, while DLI-independent lighting remains operational.
    evidence_required:
      - Schema and historical-validity migration tests.
      - Consumer matrix across firmware, DB, planner, MCP, API, dashboards, and generated sites.
      - Lighting qualified-minute, photoperiod, and render verification.
  - id: SPR-AC-05
    statement: DB solar/VPD semantics match device control and solar-night dry-out is judged from realized sunset-to-sunrise response rather than fixed clock or projected intent, ending in an explicit effectiveness disposition before firmware freeze.
    evidence_required:
      - Live migration 186 parity proof and migration 189 divergence fixtures.
      - Episode ledger with admission, stop/block reason, AH advantage, temperature, duty, and 10-20 minute response.
      - Representative valid-night report with zero daytime admission and heat2 forbidden.
      - Effective, ineffective, blocked, or insufficient_evidence disposition; any firmware delta requires a separately accepted scope handoff.
  - id: SPR-AC-06
    statement: Stock replay exercises outdoor-aware control paths with real freshness data and cannot silently regress to zero branch coverage.
    evidence_required:
      - Refreshed archived corpus containing regime-diverse fresh-outdoor rows.
      - Corpus coverage invariant and stock replay branch proof without a force-fresh override.
  - id: SPR-AC-07
    statement: The combined firmware has a conservative heap floor, no avoidable high-frequency allocation churn, actionable WDT evidence, and no Task WDT during the acceptance soak.
    evidence_required:
      - Before/after heap and publish-pressure profile.
      - Minimum-free/largest-block/loop-duration/reset evidence.
      - Runtime soak and last-good/rollback artifact proof.
  - id: SPR-AC-08
    statement: The topology/DLI recovery preserves proven mister and lighting dwell behavior, adds missing regression coverage, and makes no speculative anti-chatter change without raw-edge and response evidence.
    evidence_required:
      - Transition-derived completed-day starts, short cycles, runtime, and peak transitions per hour.
      - Historical fixture that fails on the post-295 lighting regression.
      - Existing center-mister re-fire and lighting min-on boundary regression tests.
      - Topology-aware pre/post OTA policy with explicit insufficient-evidence state.
  - id: SPR-AC-09
    statement: Equipment, water, and energy outputs use one provenance-bearing catalog, a fresh idempotent water ledger, and distinct measured, modeled, low-confidence, command-only, and unattributed quantities.
    evidence_required:
      - Active-slug catalog convergence and coefficient provenance tests.
      - Water-event catch-up/freshness proof plus run-level conservation fixtures.
      - Energy coverage/scope reconciliation fixtures.
      - Availability/confidence-bearing planner, outcome, dashboard, API, and site labels.
  - id: SPR-AC-10
    statement: Source contains no database-password fallback and the exposed production application credential is rotated and verified across every consumer before release.
    evidence_required:
      - AST/source regression tests and redacted current-tree scan.
      - Caller inventory and injected-auth proof.
      - Redacted successful-new and failed-old credential verification after explicit authorization.
  - id: SPR-AC-11
    statement: All source is independently reviewed, integrated on current main, green in required CI, and released in schema-service-state-OTA order with an exercised rollback path.
    evidence_required:
      - Lane critic verdicts tied to immutable heads.
      - Required CI checks, migration rollback proof, image digests, Argo diff/sync proof, and OTA artifact bundle.
      - Reconciled GitHub issues, lifecycle state, and final review packet.
  - id: SPR-AC-12
    statement: Production remains durably healthy after settling, with no reconnect storm, stale 0.25 intent, false numeric DLI, forbidden irrigation route, deploy-blocking alert, Task WDT, or declared cycling regression.
    evidence_required:
      - Immediate and settled runtime probes from DB, logs, Argo, pods, endpoints, device readbacks, and alert ledger.
      - Zero-repin watch and effective band_track_fraction equal to zero.
      - Final greenhouse operator-impact summary and rollback disposition.
