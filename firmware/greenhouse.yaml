###############################################################################
# greenhouse.yaml — ESPHome main config
#
# Top-level configuration for the greenhouse ESP32.  This file includes
# hardware, sensors, tunables and control logic from separate files.
# Major changes:
#  - unified naming (fog vs humid, manual burst naming)
#  - implemented safety rails; vent control uses min_on/off timing rather than debounce
#  - added cycle counters and fixed manual scripts
###############################################################################

substitutions:
  # Fallback for manual `esphome compile greenhouse.yaml` invocations.
  # `make firmware-deploy` overrides this at build time with
  # `-s fw_version YYYY.M.D.HHMM.{short-sha}` so diagnostics.firmware_version
  # uniquely identifies each dirty OTA build, not just each commit.
  fw_version: "2026.4.15.1"

esphome:
  name: greenhouse
  friendly_name: Greenhouse
  name_add_mac_suffix: false
  min_version: 2026.1.4
  includes:
    - lib/heap_diagnostics.h
    - lib/greenhouse_types.h
    - lib/greenhouse_solar.h
    - lib/greenhouse_logic.h
  # Lutron LEAP TLS disabled (causes ESP32 crash — TLS heap exhaustion)
  # Grow lights use HA native service calls; no on-device HTTP client.
  # Cold-start safety: turn every relay OFF before the first control pass
  on_boot:
    priority: 600
    then:
      - logger.log: "Cold-start: forcing all relays off"
      # Climate relays
      - switch.turn_off: fan1_rly
      - switch.turn_off: fan2_rly
      - switch.turn_off: vent_rly
      - switch.turn_off: fog_rly
      - switch.turn_off: heat1_rly
      - switch.turn_off: heat2_rly
      # Irrigation & fertilizer relays
      - switch.turn_off: wall_drips
      - switch.turn_off: center_drips
      - switch.turn_off: wall_drips_fertilized
      - switch.turn_off: center_drips_fertilized
      - switch.turn_off: west_wall_mister
      - switch.turn_off: west_wall_mister_fertilized
      - switch.turn_off: south_wall_mister
      - switch.turn_off: south_wall_mister_fertilized
      - switch.turn_off: center_mister
      - switch.turn_off: fertilizer_master_valve
      # Boot-time validation: catch corrupted restore_value globals
      - lambda: |-
          ESP_LOGI("boot","Validating restored globals...");
          int fixes = 0;
          // Safety rails — CRITICAL
          if(id(safety_min_f) < 30 || id(safety_min_f) > 70 || isnan(id(safety_min_f))){ id(safety_min_f) = 45; fixes++; ESP_LOGE("boot","safety_min invalid → 45°F"); }
          if(id(safety_max_f) < 70 || id(safety_max_f) > 120 || isnan(id(safety_max_f))){ id(safety_max_f) = 95; fixes++; ESP_LOGE("boot","safety_max invalid → 95°F"); }
          if(id(safety_vpd_min_kpa) < 0 || isnan(id(safety_vpd_min_kpa))){ id(safety_vpd_min_kpa) = 0.3; fixes++; }
          if(id(safety_vpd_max_kpa) < 1 || isnan(id(safety_vpd_max_kpa))){ id(safety_vpd_max_kpa) = 3.0; fixes++; }
          // Timing — prevent 0 values
          if(id(lead_rotate_timeout_s) < 60 || id(lead_rotate_timeout_s) > 7200){ id(lead_rotate_timeout_s) = 600; fixes++; ESP_LOGE("boot","lead_rotate invalid → 600s"); }
          if(id(min_heat_on_s) < 10){ id(min_heat_on_s) = 120; fixes++; }
          if(id(min_heat_off_s) < 30){ id(min_heat_off_s) = 300; fixes++; }
          if(id(min_fan_on_s) < 10){ id(min_fan_on_s) = 120; fixes++; }
          if(id(min_fan_off_s) < 10){ id(min_fan_off_s) = 90; fixes++; }
          if(id(min_vent_on_s) < 5){ id(min_vent_on_s) = 30; fixes++; }
          if(id(min_vent_off_s) < 5){ id(min_vent_off_s) = 30; fixes++; }
          // Burst durations — prevent 0 (which defaults to 60 min)
          if(id(fan_burst_minutes) < 1){ id(fan_burst_minutes) = 10; fixes++; }
          if(id(vent_bypass_minutes) < 1){ id(vent_bypass_minutes) = 10; fixes++; }
          if(id(fog_burst_minutes) < 1){ id(fog_burst_minutes) = 8; fixes++; }
          // Setpoint sanity
          if(id(target_temp_low_f) < 40 || id(target_temp_low_f) > 80){ id(target_temp_low_f) = 58; fixes++; }
          if(id(target_temp_high_f) < 60 || id(target_temp_high_f) > 100){ id(target_temp_high_f) = 82; fixes++; }
          if(id(target_vpd_high_kpa) < 0.5 || id(target_vpd_high_kpa) > 4){ id(target_vpd_high_kpa) = 2.0; fixes++; }
          if(id(target_vpd_low_kpa) < 0.1 || id(target_vpd_low_kpa) > 2){ id(target_vpd_low_kpa) = 0.5; fixes++; }
          // Irrigation schedule sanity — persisted operator schedule must not
          // become an impossible or disabled program after NVS corruption.
          if(id(irrig_wall_start_hour) < 0 || id(irrig_wall_start_hour) > 23){ id(irrig_wall_start_hour) = 10; fixes++; }
          if(id(irrig_wall_start_minute) < 0 || id(irrig_wall_start_minute) > 59){ id(irrig_wall_start_minute) = 30; fixes++; }
          if(id(irrig_wall_duration_min) < 1 || id(irrig_wall_duration_min) > 120){ id(irrig_wall_duration_min) = 10; fixes++; }
          if(id(irrig_wall_fert_duration_min) < 0 || id(irrig_wall_fert_duration_min) > 60){ id(irrig_wall_fert_duration_min) = 6; fixes++; }
          if(id(irrig_wall_fert_every_n) < 0 || id(irrig_wall_fert_every_n) > 30){ id(irrig_wall_fert_every_n) = 0; fixes++; }
          if(id(irrig_wall_days_mask) < 0 || id(irrig_wall_days_mask) > 127){ id(irrig_wall_days_mask) = 127; fixes++; }
          if(id(irrig_wall_fert_days_mask) < 0 || id(irrig_wall_fert_days_mask) > 127){ id(irrig_wall_fert_days_mask) = 127; fixes++; }
          if(id(irrig_wall_flush_min) < 0 || id(irrig_wall_flush_min) > 30){ id(irrig_wall_flush_min) = 2; fixes++; }
          if(id(irrig_wall_interval_days) < 1 || id(irrig_wall_interval_days) > 14){ id(irrig_wall_interval_days) = 1; fixes++; }
          if(id(irrig_center_start_hour) < 0 || id(irrig_center_start_hour) > 23){ id(irrig_center_start_hour) = 10; fixes++; }
          if(id(irrig_center_start_minute) < 0 || id(irrig_center_start_minute) > 59){ id(irrig_center_start_minute) = 30; fixes++; }
          if(id(irrig_center_duration_min) < 1 || id(irrig_center_duration_min) > 120){ id(irrig_center_duration_min) = 10; fixes++; }
          if(id(irrig_center_fert_duration_min) < 0 || id(irrig_center_fert_duration_min) > 60){ id(irrig_center_fert_duration_min) = 6; fixes++; }
          if(id(irrig_center_fert_every_n) < 0 || id(irrig_center_fert_every_n) > 30){ id(irrig_center_fert_every_n) = 0; fixes++; }
          if(id(irrig_center_days_mask) < 0 || id(irrig_center_days_mask) > 127){ id(irrig_center_days_mask) = 127; fixes++; }
          if(id(irrig_center_fert_days_mask) < 0 || id(irrig_center_fert_days_mask) > 127){ id(irrig_center_fert_days_mask) = 127; fixes++; }
          if(id(irrig_center_flush_min) < 0 || id(irrig_center_flush_min) > 30){ id(irrig_center_flush_min) = 2; fixes++; }
          if(id(irrig_center_interval_days) < 1 || id(irrig_center_interval_days) > 14){ id(irrig_center_interval_days) = 1; fixes++; }
          // VPD-primary state machine globals
          if(id(vpd_watch_dwell_s) < 15 || id(vpd_watch_dwell_s) > 120){ id(vpd_watch_dwell_s) = 60; fixes++; }
          if(id(mist_max_closed_vent_s) < 60){ id(mist_max_closed_vent_s) = 600; fixes++; }
          if(id(mist_thermal_relief_s) < 15){ id(mist_thermal_relief_s) = 90; fixes++; }
          if(id(fog_escalation_kpa) < 0.1 || id(fog_escalation_kpa) > 0.5){ id(fog_escalation_kpa) = 0.4; fixes++; }
          if(id(mister_pulse_on_s) < 15){ id(mister_pulse_on_s) = 60; fixes++; }
          if(id(mister_pulse_gap_s) < 5){ id(mister_pulse_gap_s) = 45; fixes++; }
          if(id(mister_engage_kpa) < 0.5 || id(mister_engage_kpa) > 2.5){ id(mister_engage_kpa) = 1.6; fixes++; }
          if(id(min_fog_on_s) < 10){ id(min_fog_on_s) = 60; fixes++; }
          if(id(min_fog_off_s) < 10){ id(min_fog_off_s) = 60; fixes++; }
          if(id(fog_rh_ceiling_pct) < 50 || id(fog_rh_ceiling_pct) > 100){ id(fog_rh_ceiling_pct) = 90; fixes++; }
          if(id(fog_min_temp_f) < 30 || id(fog_min_temp_f) > 70){ id(fog_min_temp_f) = 55; fixes++; }
          // Additional VPD-primary globals
          if(id(hyst_vpd_kpa) < 0.1 || id(hyst_vpd_kpa) > 0.5){ id(hyst_vpd_kpa) = 0.3; fixes++; }
          if(id(mister_all_kpa) < 1.0 || id(mister_all_kpa) > 2.5){ id(mister_all_kpa) = 1.9; fixes++; }
          if(id(mister_vpd_weight) < 0.5 || id(mister_vpd_weight) > 3){ id(mister_vpd_weight) = 1.5; fixes++; }
          if(id(mist_vent_close_lead_s) < 0 || id(mist_vent_close_lead_s) > 60){ id(mist_vent_close_lead_s) = 15; fixes++; }
          if(id(mist_vent_reopen_delay_s) < 0 || id(mist_vent_reopen_delay_s) > 120){ id(mist_vent_reopen_delay_s) = 45; fixes++; }
          if(id(enthalpy_open_kjkg) < -5 || id(enthalpy_open_kjkg) > 0){ id(enthalpy_open_kjkg) = -2; fixes++; }
          if(id(enthalpy_close_kjkg) < -5 || id(enthalpy_close_kjkg) > 20){ id(enthalpy_close_kjkg) = 1; fixes++; }
          if(id(stage2_heat_delta_f) < 2 || id(stage2_heat_delta_f) > 15){ id(stage2_heat_delta_f) = 5; fixes++; }
          if(id(stage2_cool_delta_f) < 2 || id(stage2_cool_delta_f) > 15){ id(stage2_cool_delta_f) = 3; fixes++; }
          if(id(mister_water_budget_gal) < 100 || id(mister_water_budget_gal) > 300){ id(mister_water_budget_gal) = 300; fixes++; }
          if(id(bias_heat_f) < -10 || id(bias_heat_f) > 10){ id(bias_heat_f) = 0; fixes++; }
          if(id(bias_cool_f) < -10 || id(bias_cool_f) > 10){ id(bias_cool_f) = 0; fixes++; }
          // State machine corruption protection
          if(id(mister_state) < 0 || id(mister_state) > 2){ id(mister_state) = 0; fixes++; ESP_LOGE("boot","mister_state corrupted → 0"); }
          if(id(irrig_state) < 0 || id(irrig_state) > 6){ id(irrig_state) = 0; fixes++; ESP_LOGE("boot","irrig_state corrupted → 0"); }
          // Zone VPD targets — prevent division issues in mister stress scoring
          if(id(vpd_target_south) < 0.1 || id(vpd_target_south) > 3){ id(vpd_target_south) = 1.3; fixes++; }
          if(id(vpd_target_west) < 0.1 || id(vpd_target_west) > 3){ id(vpd_target_west) = 1.3; fixes++; }
          if(id(vpd_target_east) < 0.1 || id(vpd_target_east) > 3){ id(vpd_target_east) = 1.3; fixes++; }
          if(id(vpd_target_center) < 0.1 || id(vpd_target_center) > 3){ id(vpd_target_center) = 1.3; fixes++; }
          if(id(mister_center_penalty) < 0 || id(mister_center_penalty) > 1){ id(mister_center_penalty) = 0.5; fixes++; }
          if(id(east_adjacency_factor) < 0 || id(east_adjacency_factor) > 1){ id(east_adjacency_factor) = 0.3; fixes++; }
          if(fixes > 0){ ESP_LOGE("boot","Fixed %d corrupted globals", fixes); }
          else { ESP_LOGI("boot","All globals valid"); }
          ESP_LOGI("boot", "Firmware version: %s", "${fw_version}");
          // Band anchors: ONE source of truth = the DB table `crop_band_anchors`.
          // The dispatcher reconciles it into NVS on every reconnect and corrects
          // any readback drift (ingestor/tasks/band_anchors.py + dispatcher.py),
          // so the device always converges to the DB while online. The band_*
          // globals' restore_value NVS is the offline cache; their initial_value
          // (globals.yaml) is the conservative DRY cold-start fallback for a
          // factory-fresh boot only. The former `band_curve_rev` one-shot that
          // force-wrote a hardcoded anchor snapshot here was a THIRD, competing
          // source — retired 2026-06-15 (item 2: unify the band). To change the
          // band, edit `crop_band_anchors`, NOT these globals.

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended


packages:
  globals:   !include greenhouse/globals.yaml
  hardware:  !include greenhouse/hardware.yaml
  sensors:   !include greenhouse/sensors.yaml
  tunables:  !include greenhouse/tunables.yaml
  control:   !include greenhouse/controls.yaml
  external:  !include greenhouse/external_sensors.yaml

# ────────────────────────────── Networking ─────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.10.111
    gateway:   192.168.10.1
    subnet:    255.255.255.0
    dns1:      192.168.10.1
  reboot_timeout: 300s  # Reboot if WiFi down for 5 minutes

# Disabled 2026-04-27: ESPHome web_server keeps several TCP sockets and
# response buffers alive on a controller that is already seeing heap-pressure
# reboots. HA API, OTA, and the ingestor provide the operational surfaces we
# actually use; browser access is not worth the RAM cost.
# web_server:

logger:
  baud_rate: 0
  # Keep runtime logging at WARN to protect ESP32 heap. Routine state,
  # lighting, Tempest, and irrigation status is published through sensors/text
  # sensors; warning/error logs remain available for alerting.
  level: WARN
  logs:
    # Keep noisy components quiet while preserving warning/error evidence.
    wifi: WARN
    api: WARN
    ota: WARN
    mdns: WARN
    web_server: WARN
    lambda: WARN
    modbus_controller: WARN
    sensor: WARN

# ────────────────────────────── API / OTA ─────────────────────────────────
api:
  id: ha_api
  reboot_timeout: 0s      # never auto‑reboot if HA disconnects
  # Keep the historical connection ceiling. HA, ingestor, and operational
  # tooling all reconnect after OTA; lowering this risks starving the
  # encrypted API path exactly when we need telemetry most.
  max_connections: 20
  encryption:
    key: !secret api_encryption_key

  # firmware-v2 anchors-mode: DB→on-chip band sync (docs/design/firmware-v2-settable-anchors-2026-06-15.md).
  # ONE service (heap-safe vs 56 number entities) writes any NVS-persisted band/zone anchor
  # global by name; the dispatcher calls it on crop_band_anchors change; cfg_<key> sensors confirm.
  services:
    - service: set_band_anchor
      variables:
        anchor_key: string
        value: float
      then:
        - lambda: |-
            bool ok = true;
            if (anchor_key == "band_temp_low_sr") { id(band_temp_low_sr) = value; }
            else if (anchor_key == "band_temp_low_sm") { id(band_temp_low_sm) = value; }
            else if (anchor_key == "band_temp_low_ss") { id(band_temp_low_ss) = value; }
            else if (anchor_key == "band_temp_low_mid") { id(band_temp_low_mid) = value; }
            else if (anchor_key == "band_temp_target_sr") { id(band_temp_target_sr) = value; }
            else if (anchor_key == "band_temp_target_sm") { id(band_temp_target_sm) = value; }
            else if (anchor_key == "band_temp_target_ss") { id(band_temp_target_ss) = value; }
            else if (anchor_key == "band_temp_target_mid") { id(band_temp_target_mid) = value; }
            else if (anchor_key == "band_temp_high_sr") { id(band_temp_high_sr) = value; }
            else if (anchor_key == "band_temp_high_sm") { id(band_temp_high_sm) = value; }
            else if (anchor_key == "band_temp_high_ss") { id(band_temp_high_ss) = value; }
            else if (anchor_key == "band_temp_high_mid") { id(band_temp_high_mid) = value; }
            else if (anchor_key == "band_vpd_low_sr") { id(band_vpd_low_sr) = value; }
            else if (anchor_key == "band_vpd_low_sm") { id(band_vpd_low_sm) = value; }
            else if (anchor_key == "band_vpd_low_ss") { id(band_vpd_low_ss) = value; }
            else if (anchor_key == "band_vpd_low_mid") { id(band_vpd_low_mid) = value; }
            else if (anchor_key == "band_vpd_target_sr") { id(band_vpd_target_sr) = value; }
            else if (anchor_key == "band_vpd_target_sm") { id(band_vpd_target_sm) = value; }
            else if (anchor_key == "band_vpd_target_ss") { id(band_vpd_target_ss) = value; }
            else if (anchor_key == "band_vpd_target_mid") { id(band_vpd_target_mid) = value; }
            else if (anchor_key == "band_vpd_high_sr") { id(band_vpd_high_sr) = value; }
            else if (anchor_key == "band_vpd_high_sm") { id(band_vpd_high_sm) = value; }
            else if (anchor_key == "band_vpd_high_ss") { id(band_vpd_high_ss) = value; }
            else if (anchor_key == "band_vpd_high_mid") { id(band_vpd_high_mid) = value; }
            else if (anchor_key == "zone_vpd_target_center_sr") { id(zone_vpd_target_center_sr) = value; }
            else if (anchor_key == "zone_vpd_target_center_sm") { id(zone_vpd_target_center_sm) = value; }
            else if (anchor_key == "zone_vpd_target_center_ss") { id(zone_vpd_target_center_ss) = value; }
            else if (anchor_key == "zone_vpd_target_center_mid") { id(zone_vpd_target_center_mid) = value; }
            else if (anchor_key == "zone_vpd_target_south_sr") { id(zone_vpd_target_south_sr) = value; }
            else if (anchor_key == "zone_vpd_target_south_sm") { id(zone_vpd_target_south_sm) = value; }
            else if (anchor_key == "zone_vpd_target_south_ss") { id(zone_vpd_target_south_ss) = value; }
            else if (anchor_key == "zone_vpd_target_south_mid") { id(zone_vpd_target_south_mid) = value; }
            else if (anchor_key == "zone_vpd_target_west_sr") { id(zone_vpd_target_west_sr) = value; }
            else if (anchor_key == "zone_vpd_target_west_sm") { id(zone_vpd_target_west_sm) = value; }
            else if (anchor_key == "zone_vpd_target_west_ss") { id(zone_vpd_target_west_ss) = value; }
            else if (anchor_key == "zone_vpd_target_west_mid") { id(zone_vpd_target_west_mid) = value; }
            else if (anchor_key == "zone_vpd_target_east_sr") { id(zone_vpd_target_east_sr) = value; }
            else if (anchor_key == "zone_vpd_target_east_sm") { id(zone_vpd_target_east_sm) = value; }
            else if (anchor_key == "zone_vpd_target_east_ss") { id(zone_vpd_target_east_ss) = value; }
            else if (anchor_key == "zone_vpd_target_east_mid") { id(zone_vpd_target_east_mid) = value; }
            else if (anchor_key == "zone_vpd_width_below_center") { id(zone_vpd_width_below_center) = value; }
            else if (anchor_key == "zone_vpd_width_below_south") { id(zone_vpd_width_below_south) = value; }
            else if (anchor_key == "zone_vpd_width_below_west") { id(zone_vpd_width_below_west) = value; }
            else if (anchor_key == "zone_vpd_width_below_east") { id(zone_vpd_width_below_east) = value; }
            else if (anchor_key == "zone_vpd_width_above_center") { id(zone_vpd_width_above_center) = value; }
            else if (anchor_key == "zone_vpd_width_above_south") { id(zone_vpd_width_above_south) = value; }
            else if (anchor_key == "zone_vpd_width_above_west") { id(zone_vpd_width_above_west) = value; }
            else if (anchor_key == "zone_vpd_width_above_east") { id(zone_vpd_width_above_east) = value; }
            else if (anchor_key == "zone_priority_center") { id(zone_priority_center) = value; }
            else if (anchor_key == "zone_priority_south") { id(zone_priority_south) = value; }
            else if (anchor_key == "zone_priority_west") { id(zone_priority_west) = value; }
            else if (anchor_key == "zone_priority_east") { id(zone_priority_east) = value; }
            else if (anchor_key == "wet_taper_before_sunset_min") { id(wet_taper_before_sunset_min) = value; }
            else if (anchor_key == "dawn_boost_offset_min") { id(dawn_boost_offset_min) = value; }
            else if (anchor_key == "midday_boost_offset_min") { id(midday_boost_offset_min) = value; }
            else if (anchor_key == "manual_override_timeout_min") { id(manual_override_timeout_min) = value; }
            else { ok = false; ESP_LOGW("band", "set_band_anchor: unknown key '%s'", anchor_key.c_str()); }
            if (ok) { ESP_LOGI("band", "set_band_anchor %s = %.3f", anchor_key.c_str(), value); }

# MQTT is intentionally omitted on the ESP32. The global MQTT component creates
# a publish wrapper for every public entity, which costs tens of KB of runtime
# heap on this controller. Sentinel occupancy now enters through the ingestor's
# API push path (`greenhouse_occupied`) instead of an on-device MQTT client.

ota:
  - platform: esphome
    password: !secret ota_password

# ───────────────────────── TIME / CONTROLLER CLOCK ─────────────────────────
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 192.168.10.1
      - pool.ntp.org
    timezone: America/Denver
    on_time_sync:
      then:
        - lambda: |-
            id(sntp_last_sync_ms) = millis();
            id(sntp_heartbeat_misses) = 0;
            id(sntp_failed) = false;
    on_time:
      # 30-minute heartbeat — A3: track consecutive misses for controller time.
      - seconds: 0
        minutes: /30
        then:
          - lambda: |-
              if(id(sntp_time).now().is_valid()){
                if(id(sntp_failed)){
                  ESP_LOGI("sntp","controller time recovered");
                }
                id(sntp_heartbeat_misses) = 0;
                id(sntp_failed) = false;
              }else{
                id(sntp_heartbeat_misses) = id(sntp_heartbeat_misses) + 1;
                ESP_LOGW("sntp","controller time invalid — miss count: %d", id(sntp_heartbeat_misses));
                if(id(sntp_heartbeat_misses) >= 2){
                  id(sntp_failed) = true;
                  ESP_LOGE("sntp","controller time FAILED — 2 consecutive misses (1 hour)");
                }
              }
      # reset counters once per day at local midnight
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              /* reset all daily cycle counters */
              id(cnt_fan1_today)  = 0;
              id(cnt_fan2_today)  = 0;
              id(cnt_heat1_today) = 0;
              id(cnt_heat2_today) = 0;
              id(cnt_fog_today)   = 0;
              id(cnt_vent_today)  = 0;
              id(mister_water_today) = 0.0f;
              id(runtime_mister_south_ms) = 0;
              id(runtime_mister_west_ms) = 0;
              id(runtime_mister_center_ms) = 0;
              id(cnt_mister_fairness_overrides_today) = 0;
              /* sprint-7 per-zone cycle counters */
              id(cnt_mister_south_today)  = 0;
              id(cnt_mister_west_today)   = 0;
              id(cnt_mister_center_today) = 0;
              id(cnt_drip_wall_today)     = 0;
              id(cnt_drip_center_today)   = 0;
          - logger.log: "Daily cycle counters reset (midnight)"

# ───────────────────── BINARY SENSORS ─────────────────────
binary_sensor:
  # API connectivity — A4: log disconnects/reconnects
  - platform: status
    id: api_link
    name: "API Status"
    entity_category: diagnostic
    on_state:
      then:
        - lambda: |-
            if(id(api_link).state){
              ESP_LOGI("api","HA API reconnected");
            }else{
              ESP_LOGW("api","HA API disconnected — local control continues");
            }

  # A3: controller time failure detection (2 consecutive 30-min heartbeat misses)
  - platform: template
    id: bs_sntp_failed
    name: "Controller Time Status"
    entity_category: diagnostic
    device_class: problem
    lambda: "return id(sntp_failed);"

  # Relay monitors
  - platform: template
    id: bs_fan1_running
    name: "Fan 1 Running"
    lambda: "return id(fan1_rly).state;"
    device_class: running

  - platform: template
    id: bs_fan2_running
    name: "Fan 2 Running"
    lambda: "return id(fan2_rly).state;"
    device_class: running

  - platform: template
    id: bs_heat1_running
    name: "Heat 1 Running"
    lambda: "return id(heat1_rly).state;"
    device_class: running

  - platform: template
    id: bs_heat2_running
    name: "Heat 2 Running"
    lambda: "return id(heat2_rly).state;"
    device_class: running

  - platform: template
    id: bs_fog_running
    name: "Fog Running"
    lambda: "return id(fog_rly).state;"
    device_class: running

  # Physical push buttons
  - platform: gpio
    id: fans_switch
    name: "PB • Fan Burst"
    pin:
      pcf8574: pcf_in_2
      number: 6
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 30ms   # debounce the momentary PB (both edges); imperceptible
    on_press:
      then:
        - button.press: fan_burst_btn

  - platform: gpio
    id: vent_bypass_switch
    name: "PB • Vent Bypass"
    pin:
      pcf8574: pcf_in_2
      number: 7
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 30ms   # debounce the momentary PB (both edges); imperceptible
    on_press:
      then:
        - button.press: vent_bypass_btn

  - platform: gpio
    id: fog_switch
    name: "PB • Fog Burst"
    pin:
      pcf8574: pcf_in_2
      number: 5
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 30ms   # debounce the momentary PB (both edges); imperceptible
    on_press:
      then:
        - button.press: fog_burst_btn

  # Manual-override state indicators
  - platform: template
    id: bs_manual_fan
    name: "Fan Burst Active"
    lambda: "return id(manual_fan_active);"
    device_class: running

  - platform: template
    id: bs_vent_lock
    name: "Vent Bypass Active"
    lambda: "return id(vent_lock_active);"
    device_class: running

  - platform: template
    id: bs_manual_fog
    name: "Fog Burst Active"
    lambda: "return id(manual_fog_active);"
    device_class: running

  - platform: template
    id: bs_occupancy_quiet_override
    name: "Occupancy Quiet Override Active"
    lambda: |-
      return id(occupancy_override_until_ms) != 0
        && (int32_t)(id(occupancy_override_until_ms) - millis()) > 0;

  - platform: template
    id: bs_vent_state
    name: "Vent Open"
    lambda: "return id(vent_rly).state;"
    device_class: opening

  # Economiser gate status (true = economiser blocked / venting inhibited)
  - platform: template
    id: bs_econ_blocked
    name: "Economiser Blocked"
    lambda: "return id(econ_block_state);"
    device_class: safety


  # Mister state machine indicators
  - platform: template
    id: bs_mister_running
    name: "Mister Running"
    lambda: "return id(mister_state) > 0 && id(mister_duty_phase) == 1;"
    device_class: running

  - platform: template
    id: bs_mister_budget_exceeded
    name: "Mister Budget Exceeded"
    lambda: "return id(mister_water_today) >= id(mister_water_budget_gal);"
    device_class: problem

  # Water status — replaces HA template binary_sensors
  - platform: template
    id: bs_water_flowing
    name: "Water Flowing"
    device_class: running
    lambda: |-
      float flow = id(water_flow_rate).state;
      return !isnan(flow) && flow > 0.05;

  - platform: template
    id: bs_leak_detected
    name: "Leak Detected"
    device_class: problem
    lambda: |-
      // Sprint-4: debounce against pipe bleed-down between mister pulses.
      // Historical false-positive rate: 5-41 events/hour during mister-active
      // windows. Residual flow after valve-close can linger above 0.1 gpm
      // for 5-15s through the 25-45s pulse gap; the pre-sprint-4 lambda
      // fired leak_detected during that window. A real leak persists
      // indefinitely, so a 30s bleed-down grace period is safe.
      //
      // Also includes fog_rly in the valve list — the fog generator uses
      // water and was previously missing, causing a separate false-positive
      // class whenever fog fired without a mister in parallel.
      //
      // 2026-04-26 update: 30s grace was insufficient. Production data shows
      // pipe-network bleed-down lasting 1m 40s – 2m on this hardware (fog
      // line + drip + mister manifold all flow through the same meter).
      // 7 false leak alerts in 24h — every mister pulse triggered one.
      // Two changes:
      //   1. Grace bumped 30s → 120s (covers observed bleed-down + margin)
      //   2. Added 60s persistence debounce: flow must stay above 0.1 gpm
      //      for 60 consecutive seconds AFTER grace expires before firing.
      //      Real leaks persist indefinitely; bleed-down trails to zero.
      // Combined: false leak requires >120s grace + >60s sustained flow,
      // total 3-min minimum cycle. A real leak hits this in 3 min and
      // alerts; a bleed-down resolves before either threshold trips.
      static uint32_t last_valve_on_ms = 0;
      static uint32_t flow_above_thresh_since_ms = 0;
      uint32_t now_ms = millis();
      bool any_valve = id(wall_drips).state || id(center_drips).state
                    || id(south_wall_mister).state || id(west_wall_mister).state
                    || id(center_mister).state || id(wall_drips_fertilized).state
                    || id(south_wall_mister_fertilized).state || id(west_wall_mister_fertilized).state
                    || id(fog_rly).state;
      if(any_valve) last_valve_on_ms = now_ms;
      float flow = id(water_flow_rate).state;
      if(isnan(flow) || flow < 0.1) {
          flow_above_thresh_since_ms = 0;       // reset persist clock — flow gone
          return false;
      }
      if(any_valve) {
          flow_above_thresh_since_ms = 0;       // valve open, expected flow
          return false;
      }
      if(now_ms - last_valve_on_ms < 120000) {  // 120 s bleed-down grace
          flow_above_thresh_since_ms = 0;       // still inside grace window
          return false;
      }
      // Past grace, no valve, flow > 0.1 gpm — start the persist clock.
      if(flow_above_thresh_since_ms == 0) {
          flow_above_thresh_since_ms = now_ms;
      }
      // Require 60s of sustained flow before declaring leak.
      if(now_ms - flow_above_thresh_since_ms < 60000) return false;
      return true;

  # ─── Heap pressure watchdogs (added 2026-04-26) ──────────────
  # Background: 4 reboots in 4 hours after the 09313b2 OTA — Task WDT
  # ×3 plus 1 Guru/Panic. Heap floor dropped to 20.6 KB right before
  # the panic (healthy floor ~38-44 KB free). Memory pressure was
  # the immediate trigger. We need an alarm that fires BEFORE the
  # device crashes so we can disconnect the cause (or schedule a
  # restart) instead of getting surprised by a coredump.
  #
  # Two thresholds:
  #   - warning (<25 KB sustained 2 min) → planner backs off pushes;
  #     ingestor escalates to alert_log.warning.
  #   - critical (<15 KB instantaneous)  → fire immediately;
  #     within ~10 s of typical pre-panic readings.
  - platform: template
    id: bs_heap_pressure_warning
    name: "Heap Pressure Warning"
    device_class: problem
    on_press:
      then:
        - lambda: |-
            ESP_LOGW("heap", "Heap pressure WARNING: free=%.1f kB min=%.1f kB largest=%.1f kB",
                     gh_free_heap_kb(),
                     gh_min_free_heap_kb(),
                     gh_largest_free_heap_block_kb());
    lambda: |-
      static uint32_t below_thresh_since_ms = 0;
      uint32_t now_ms = millis();
      float heap_kb = gh_free_heap_kb();
      if (heap_kb < 25.0f) {
          if (below_thresh_since_ms == 0) below_thresh_since_ms = now_ms;
          if (now_ms - below_thresh_since_ms > 120000) return true;
      } else {
          below_thresh_since_ms = 0;
      }
      return false;

  - platform: template
    id: bs_heap_pressure_critical
    name: "Heap Pressure Critical"
    device_class: problem
    on_press:
      then:
        - lambda: |-
            ESP_LOGE("heap", "Heap pressure CRITICAL: free=%.1f kB min=%.1f kB largest=%.1f kB",
                     gh_free_heap_kb(),
                     gh_min_free_heap_kb(),
                     gh_largest_free_heap_block_kb());
    lambda: |-
      // Instantaneous — no debounce. <15 KB is panic-adjacent territory
      // (observed pre-panic floor 20.6 KB; safety margin at 15 KB).
      float heap_kb = gh_free_heap_kb();
      return heap_kb < 15.0f;

# ───────────────────── HEAP-GUARD SAFETY NET (#428) ─────────────────────
# Chronic heap exhaustion on this ~612-entity config has held free-heap at a
# 3-8 KB worst-case floor for weeks (995c9b3 hit 7 KB over 11 days; ab18fe8
# 3.8 KB) vs a healthy 38-44 KB. On 2026-07-05 15:44Z it finally met a transient
# and the ESP32 Task WDT rebooted the device UNCONTROLLED (~8 min of degraded
# operation, then a coredump reset). This guard converts that failure mode into
# a CONTROLLED restart *before* the panic:
#   • fires only when CURRENT free heap is genuinely low (< 20 KB) and SUSTAINED
#     3 min — normal steady-state free is 48-68 KB, so this is near-panic only;
#   • 15-min startup grace so the post-boot allocation transient (min-free dips
#     to ~3.8 KB within ~4 min of every boot) can NEVER boot-loop this guard;
#   • never reboots while a heater relay is actively driving (the one gap the
#     parallel hardware thermostat can't fully cover on a cold night);
#   • App.safe_reboot() is a clean "Software reset" (distinct from Task WDT in
#     diagnostics.reset_reason); the dehum-vent-hold flag PERSISTS across it
#     (switch sw_dehum_vent_hold RESTORE_DEFAULT_OFF re-asserts the global), the
#     deterministic FSM re-enters within ~15 s, and on_boot forces all relays off.
# CONTROL-NEUTRAL: touches no setpoint/mode/relay decision — determine_mode and
# resolve_equipment are byte-unchanged, so make firmware-replay shows 0 divergence.
interval:
  - interval: 60s
    then:
      - lambda: |-
          const float free_kb = gh_free_heap_kb();
          const uint32_t up_ms = millis();
          static uint32_t low_since_ms = 0;
          if (up_ms < 900000UL) { low_since_ms = 0; return; }          // 15-min startup grace
          if (free_kb >= 20.0f) { low_since_ms = 0; return; }          // healthy — clear latch
          if (id(heat1_rly).state || id(heat2_rly).state) { low_since_ms = 0; return; }  // never reboot mid-heat
          if (low_since_ms == 0) { low_since_ms = up_ms; return; }
          if (up_ms - low_since_ms < 180000UL) return;                 // require 3 min sustained
          ESP_LOGE("heap", "Heap-guard: free=%.1f kB sustained <20 KB for %.0fs (uptime %.0fs) "
                           "— CONTROLLED restart ahead of Task WDT (chronic heap #428)",
                   free_kb, (up_ms - low_since_ms) / 1000.0f, up_ms / 1000.0f);
          App.safe_reboot();

# ───────────────────── DASHBOARD BUTTONS ─────────────────────
button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: template
    id: fan_burst_btn
    name: "Fan Cycle"
    on_press:
      - script.execute: occupancy_quiet_override
      - if:
          condition:
            lambda: "return id(manual_fan_active);"
          then:
            - script.stop: manual_fan_burst
            - lambda: "id(manual_fan_active) = false;"
          else:
            - script.execute: manual_fan_burst

  - platform: template
    id: vent_bypass_btn
    name: "Vent Bypass Toggle"
    on_press:
      - script.execute: occupancy_quiet_override
      - if:
          condition:
            lambda: "return id(vent_lock_active);"
          then:
            - script.stop: vent_bypass_timer
            - lambda: "id(vent_lock_active) = false;"
          else:
            - script.execute: vent_bypass_timer

  - platform: template
    id: fog_burst_btn
    name: "Fog Cycle"
    on_press:
      - script.execute: occupancy_quiet_override
      - if:
          condition:
            lambda: "return id(manual_fog_active);"
          then:
            - script.stop: manual_fog_burst
            - lambda: "id(manual_fog_active) = false;"
          else:
            - script.execute: manual_fog_burst

# ───────────────────── SCRIPTS (0 min = 24 h) ────────────────────
script:
  - id: occupancy_quiet_override
    mode: restart
    then:
      - lambda: |
          id(occupancy_override_until_ms) = millis() + 3600000UL;
          id(greenhouse_occupied) = false;
          id(occupancy_last_true_ms) = 0;
          id(sw_greenhouse_occupied).publish_state(false);
          ESP_LOGW("occupancy","Local button override: occupancy ignored for 60 minutes");

  # Manual fan burst script. Requests both fans for a user-defined number of
  # minutes; the control loop remains the only relay actuator path.
  - id: manual_fan_burst
    mode: restart
    then:
      - lambda: |
          id(manual_fan_active) = true;
      - delay: !lambda |-
          int minutes = id(fan_burst_minutes);
          if(minutes <= 0 || minutes > 60) minutes = 60;
          return (uint32_t)minutes * 60000UL;
      - lambda: |
          id(manual_fan_active) = false;

  # Vent bypass timer. Requests a vent lockout for user-defined minutes; safety
  # rails in the control loop decide whether the vent may actually close.
  - id: vent_bypass_timer
    mode: restart
    then:
      - lambda: |
          id(vent_lock_active) = true;
      - delay: !lambda |-
          int minutes = id(vent_bypass_minutes);
          if(minutes <= 0 || minutes > 30) minutes = 30;
          return (uint32_t)minutes * 60000UL;
      - lambda: |
          id(vent_lock_active) = false;

  # Manual fog burst script. Requests fog for a user-defined number of minutes;
  # the control loop remains the only relay actuator path.
  - id: manual_fog_burst
    mode: restart
    then:
      - lambda: |
          id(manual_fog_active) = true;
      - delay: !lambda |-
          int minutes = id(fog_burst_minutes);
          if(minutes <= 0 || minutes > 60) minutes = 60;
          return (uint32_t)minutes * 60000UL;
      - lambda: |
          id(manual_fog_active) = false;

