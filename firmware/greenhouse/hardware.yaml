###############################################################################
# Firmware-v2 MANUAL OVERRIDE BUTTONS (momentary toggle + deadline latch)
# ---------------------------------------------------------------------------
# Each press TOGGLES a latch that runs for manual_override_timeout_min minutes
# (default 10) and SUPERSEDES all climate automation (only a re-press, the
# timeout, or a true safety rail interrupts it). The deadline globals
# (manual_*_until_ms) are consumed in controls.yaml's override layer. These
# are template buttons (HA-pressable now; a physical GPIO binary_sensor can
# call them via on_press). Fixes the inverted vent_lock that killed the fans.
###############################################################################
button:
  - platform: template
    id: btn_manual_fans
    name: "Manual FANS (both + vent, 10min)"
    on_press:
      - lambda: |-
          const uint32_t now_ms = millis();
          const bool latched = id(manual_fans_until_ms) != 0
              && (int32_t)(id(manual_fans_until_ms) - now_ms) > 0;
          if (latched) {
            id(manual_fans_until_ms) = 0;
            ESP_LOGI("manual","FANS latch CLEARED by re-press");
          } else {
            uint32_t hold = (uint32_t)id(manual_override_timeout_min) * 60000UL;
            id(manual_fans_until_ms) = now_ms + hold;
            if (id(manual_fans_until_ms) == 0) id(manual_fans_until_ms) = 1;
            ESP_LOGW("manual","FANS latched ON for %d min (both fans + vent)", id(manual_override_timeout_min));
          }

