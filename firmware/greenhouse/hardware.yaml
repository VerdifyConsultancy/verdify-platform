###############################################################################
# greenhouse/hardware.yaml -- Hardware implementation for greenhouse
#
# Defines text sensors, I²C/UART/Modbus configuration and all GPIO relays.
###############################################################################

# ───────────────────── Boot-info sensors ─────────────────────
text_sensor:
  - platform: template
    id: ts_last_boot
    name: "Last Boot"
    icon: mdi:clock-start
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(sntp_time).now().is_valid())   // controller time not yet synced
        return {};
      uint32_t up = (uint32_t) id(uptime_seconds).state;
      time_t boot_ts = id(sntp_time).now().timestamp - up;
      char buf[25];
      strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M:%S", localtime(&boot_ts));
      return {buf};

  - platform: template
    id: ts_boot_reason
    name: "Reset Reason"
    icon: mdi:restart
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:   return {"Power-on"};
        case ESP_RST_EXT:       return {"External reset"};
        case ESP_RST_SW:        return {"Software reset"};
        case ESP_RST_PANIC:     return {"Guru/Panic"};
        case ESP_RST_INT_WDT:   return {"Interrupt WDT"};
        case ESP_RST_TASK_WDT:  return {"Task WDT"};
        case ESP_RST_WDT:       return {"Other WDT"};
        case ESP_RST_DEEPSLEEP: return {"Deep-sleep wake"};
        case ESP_RST_BROWNOUT:  return {"Brown-out"};
        case ESP_RST_SDIO:      return {"SDIO reset"};
        default:                return { std::to_string(esp_reset_reason()) };
      }

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  - platform: template
    id: ts_fw_version
    name: "Firmware Version"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${fw_version}"};

  - platform: template
    id: gh_state
    name: "Greenhouse State"
    entity_category: diagnostic
    update_interval: 5s

  # OBS-1e (Sprint 16): Firmware silent-override audit. Published by
  # controls.yaml after every determine_mode() cycle. Value is a
  # comma-separated list of currently-active override flags from
  # evaluate_overrides() (e.g. "occupancy,fog_rh" or "none"). Ingestor
  # diffs transitions and writes one row per start to override_events.
  - platform: template
    id: gh_overrides
    name: "Active Overrides"
    entity_category: diagnostic
    update_interval: 5s

  # Sprint-15.1 fix 8: which branch of determine_mode() chose the current
  # mode. Diagnostic-only — used to RCA gate/seal/idle decisions post-hoc.
  # Updated by controls.yaml after each determine_mode() call.
  - platform: template
    id: gh_mode_reason
    name: "Mode Reason"
    entity_category: diagnostic
    update_interval: 5s

  # AI-control diagnostics: these explain whether a requested moisture assist
  # path had an actuator route available. Published by controls.yaml only on
  # value changes; behavior-neutral telemetry.
  - platform: template
    id: gh_moisture_block_reason
    name: "Moisture Block Reason"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_vent_mist_assist_status
    name: "Vent Mist Assist Status"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_direct_wet_zone_mask
    name: "Direct Wet Zone Mask"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_fog_block_reason
    name: "Fog Block Reason"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_action
    name: "Climate Action"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_priority_axis
    name: "Climate Priority Axis"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_candidate_summary
    name: "Climate Candidate Summary"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_moisture_assist_state
    name: "Climate Moisture Assist State"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_moisture_zone
    name: "Climate Moisture Zone"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_temp_error_f
    name: "Climate Temp Error F"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_vpd_error_kpa
    name: "Climate VPD Error kPa"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_fog_margin_kpa
    name: "Climate Fog Margin kPa"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_fog_block_reason
    name: "Climate Fog Block Reason"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_resource_cost_estimate
    name: "Climate Resource Cost Estimate"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_next_mist_eligible_s
    name: "Climate Next Mist Eligible s"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gh_climate_moisture_exchange
    name: "Climate Moisture Exchange"
    entity_category: diagnostic
    update_interval: 5s

  - platform: template
    id: gl_main_state_text
    name: "GL Main State"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: gl_main_reason
    name: "GL Main Reason"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: gl_grow_state_text
    name: "GL Grow State"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: gl_grow_reason
    name: "GL Grow Reason"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: ts_lead_fan
    name: "Lead Fan"
    entity_category: diagnostic
    update_interval: 30s

  # Firmware-v2 evidence surface (text): which zone the priority arbiter
  # granted wetting to, and whether the band is the on-chip solar curve.
  - platform: template
    id: gh_zone_wet_granted
    name: "Zone Wet Granted"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: gh_band_source
    name: "Band Source"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return { id(fan_lead_is_fan1) ? "Fan 1" : "Fan 2" };

# ───────────────────── I²C / UART / Modbus ─────────────────────
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true

pcf8574:
  - id: pcf_out_1
    address: 0x21
  - id: pcf_out_2
    address: 0x25
  - id: pcf_in_2
    address: 0x24

uart:
  id: rs485_uart
  tx_pin: GPIO32
  rx_pin: GPIO13
  baud_rate: 9600

modbus:
  id: modbus_main
  uart_id: rs485_uart

modbus_controller:
  - id: case_probe
    address: 1
    modbus_id: modbus_main
    update_interval: 5s
  - id: north_wall_probe
    address: 2
    modbus_id: modbus_main
    update_interval: 10s
  - id: west_wall_probe
    address: 3
    modbus_id: modbus_main
    update_interval: 10s
  - id: south_wall_probe
    address: 4
    modbus_id: modbus_main
    update_interval: 10s
  - id: east_wall_probe
    address: 5
    modbus_id: modbus_main
    update_interval: 10s
  - id: exterior_intake_probe
    address: 6
    modbus_id: modbus_main
    update_interval: 10s
  # ── Soil sensors (DFRobot SEN0600/SEN0601, Modbus RTU 9600 8N1) ──
  # Addr 7: SEN0601 south-1 (moisture+temp+EC), Addr 8: SEN0600 south-2, Addr 9: SEN0600 west
  - id: south_1_soil_probe
    address: 7
    modbus_id: modbus_main
    update_interval: 60s
    command_throttle: 200ms
  - id: south_2_soil_probe
    address: 8
    modbus_id: modbus_main
    update_interval: 60s
    command_throttle: 200ms
  - id: west_soil_probe
    address: 9
    modbus_id: modbus_main
    update_interval: 60s
    command_throttle: 200ms

# ───────────────────── SWITCHES (relays & templates) ─────────────────────
switch:
  # Ingestor-owned presence input. This replaces the ESP32 MQTT subscription:
  # Frigate/Sentinel occupancy is written to DB by ingestor, then pushed here
  # over the native ESPHome API so controller decisions remain traceable.
  - platform: template
    id: sw_greenhouse_occupied
    name: "Greenhouse Occupied"
    icon: "mdi:account"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(greenhouse_occupied);"
    turn_on_action:
      - lambda: |
          const uint32_t now_ms = millis();
          const bool override_active = id(occupancy_override_until_ms) != 0
            && (int32_t)(id(occupancy_override_until_ms) - now_ms) > 0;
          if (override_active) {
            id(greenhouse_occupied) = false;
            id(occupancy_last_true_ms) = 0;
            id(sw_greenhouse_occupied).publish_state(false);
            ESP_LOGW("occupancy","Ignoring OCCUPIED API push: local quiet override active");
          } else {
            id(greenhouse_occupied) = true;
            id(occupancy_last_true_ms) = now_ms;
            id(sw_greenhouse_occupied).publish_state(true);
            ESP_LOGI("occupancy","Greenhouse OCCUPIED (API)");
          }
    turn_off_action:
      - lambda: |
          id(greenhouse_occupied) = false;
          id(occupancy_last_true_ms) = 0;
          id(sw_greenhouse_occupied).publish_state(false);
          ESP_LOGI("occupancy","Greenhouse EMPTY (API)");

  # --- Internal climate relays (hidden from HA) ---
  - platform: gpio
    id: fan1_rly
    pin:
      pcf8574: pcf_out_2
      number: 3
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: fan2_rly
    pin:
      pcf8574: pcf_out_2
      number: 4
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: vent_rly
    pin:
      pcf8574: pcf_out_2
      number: 5
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: fog_rly
    pin:
      pcf8574: pcf_out_2
      number: 6
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: heat1_rly
    pin:
      pcf8574: pcf_out_2
      number: 7
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: heat2_rly
    pin:
      pcf8574: pcf_out_2
      number: 2
      mode: OUTPUT
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  # --- Irrigation / mister relays (visible) -----
  - platform: gpio
    id: west_wall_mister
    name: "Mister • West Wall"
    pin:
      pcf8574: pcf_out_1
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(water_controller_actuating)) {
            id(west_wall_mister).turn_off();
            ESP_LOGE("irrig","Blocked non-controller west clean-mister relay ON");
            return;
          }

  - platform: gpio
    id: west_wall_mister_fertilized
    name: "Mister • West Wall (Fert.)"
    pin:
      pcf8574: pcf_out_1
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(fert_controller_actuating)) {
            id(west_wall_mister_fertilized).turn_off();
            ESP_LOGE("irrig","Blocked non-controller west fert-mister relay ON");
            return;
          }
          if(!id(fertilizer_master_valve).state) {
            id(fertilizer_master_valve).turn_on();
            ESP_LOGW("irrig","FERT MASTER opened by west fert-mister relay");
          }
    on_turn_off:
      - lambda: |-
          if(!id(south_wall_mister_fertilized).state &&
             !id(west_wall_mister_fertilized).state &&
             !id(wall_drips_fertilized).state &&
             !id(center_drips_fertilized).state) {
            id(fertilizer_master_valve).turn_off();
          }

  - platform: gpio
    id: south_wall_mister_fertilized
    name: "Mister • South Wall (Fert.)"
    pin:
      pcf8574: pcf_out_1
      number: 2
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(fert_controller_actuating)) {
            id(south_wall_mister_fertilized).turn_off();
            ESP_LOGE("irrig","Blocked non-controller south fert-mister relay ON");
            return;
          }
          if(!id(fertilizer_master_valve).state) {
            id(fertilizer_master_valve).turn_on();
            ESP_LOGW("irrig","FERT MASTER opened by south fert-mister relay");
          }
    on_turn_off:
      - lambda: |-
          if(!id(south_wall_mister_fertilized).state &&
             !id(west_wall_mister_fertilized).state &&
             !id(wall_drips_fertilized).state &&
             !id(center_drips_fertilized).state) {
            id(fertilizer_master_valve).turn_off();
          }

  - platform: gpio
    id: south_wall_mister
    name: "Mister • South Wall"
    pin:
      pcf8574: pcf_out_1
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(water_controller_actuating)) {
            id(south_wall_mister).turn_off();
            ESP_LOGE("irrig","Blocked non-controller south clean-mister relay ON");
            return;
          }

  - platform: gpio
    id: wall_drips
    name: "Drip • Wall"
    pin:
      pcf8574: pcf_out_1
      number: 4
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(water_controller_actuating)) {
            id(wall_drips).turn_off();
            ESP_LOGE("irrig","Blocked non-controller wall clean-drip relay ON");
            return;
          }

  - platform: gpio
    id: center_mister
    name: "Mister • Center"
    pin:
      pcf8574: pcf_out_1
      number: 5
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(water_controller_actuating)) {
            id(center_mister).turn_off();
            ESP_LOGE("irrig","Blocked non-controller center clean-mister relay ON");
            return;
          }

  - platform: gpio
    id: center_drips_fertilized
    name: "Drip • Center (Fert.)"
    pin:
      pcf8574: pcf_out_1
      number: 6
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(fert_controller_actuating)) {
            id(center_drips_fertilized).turn_off();
            ESP_LOGE("irrig","Blocked non-controller center fert-drip relay ON");
            return;
          }
          if(!id(fertilizer_master_valve).state) {
            id(fertilizer_master_valve).turn_on();
            ESP_LOGW("irrig","FERT MASTER opened by center fert-drip relay");
          }
    on_turn_off:
      - lambda: |-
          if(!id(south_wall_mister_fertilized).state &&
             !id(west_wall_mister_fertilized).state &&
             !id(wall_drips_fertilized).state &&
             !id(center_drips_fertilized).state) {
            id(fertilizer_master_valve).turn_off();
          }

  - platform: gpio
    id: center_drips
    name: "Drip • Center"
    pin:
      pcf8574: pcf_out_1
      number: 7
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(water_controller_actuating)) {
            id(center_drips).turn_off();
            ESP_LOGE("irrig","Blocked non-controller center clean-drip relay ON");
            return;
          }

  - platform: gpio
    id: wall_drips_fertilized
    name: "Drip • Wall (Fert.)"
    pin:
      pcf8574: pcf_out_2
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(fert_controller_actuating)) {
            id(wall_drips_fertilized).turn_off();
            ESP_LOGE("irrig","Blocked non-controller wall fert-drip relay ON");
            return;
          }
          if(!id(fertilizer_master_valve).state) {
            id(fertilizer_master_valve).turn_on();
            ESP_LOGW("irrig","FERT MASTER opened by wall fert-drip relay");
          }
    on_turn_off:
      - lambda: |-
          if(!id(south_wall_mister_fertilized).state &&
             !id(west_wall_mister_fertilized).state &&
             !id(wall_drips_fertilized).state &&
             !id(center_drips_fertilized).state) {
            id(fertilizer_master_valve).turn_off();
          }

  - platform: gpio
    id: fertilizer_master_valve
    name: "Valve • Fert. Master"
    pin:
      pcf8574: pcf_out_2
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if(!id(fert_controller_actuating)) {
            id(fertilizer_master_valve).turn_off();
            ESP_LOGE("irrig","Blocked non-controller fert master ON");
          }
    on_turn_off:
      - lambda: |-
          if(id(south_wall_mister_fertilized).state ||
             id(west_wall_mister_fertilized).state ||
             id(wall_drips_fertilized).state ||
             id(center_drips_fertilized).state) {
            id(fert_controller_actuating) = true;
            id(fertilizer_master_valve).turn_on();
            id(fert_controller_actuating) = false;
            ESP_LOGW("irrig","FERT MASTER manual-off corrected while fert relay active");
          }

  # --- Grow lights (HA native service calls, no on-device HTTP client) ---
  # HA owns the Lutron bridge; firmware requests Lutron switch changes over the
  # existing ESPHome API connection instead of carrying REST/TLS buffers.
  - platform: template
    id: grow_light_main
    name: "Grow Light Main"
    icon: mdi:lightbulb
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.greenhouse_main
      - lambda: 'ESP_LOGI("lights", "Main lights ON via HA service");'
    turn_off_action:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.greenhouse_main
      - lambda: 'ESP_LOGI("lights", "Main lights OFF via HA service");'

  - platform: template
    id: grow_light_grow
    name: "Grow Light Grow"
    icon: mdi:lightbulb
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.greenhouse_grow
      - lambda: 'ESP_LOGI("lights", "Grow lights ON via HA service");'
    turn_off_action:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.greenhouse_grow
      - lambda: 'ESP_LOGI("lights", "Grow lights OFF via HA service");'

