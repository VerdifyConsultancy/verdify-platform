# policy_engine.yaml — Lane E (#586, audit §8.9): native-API transport +
# readback for the atomic policy engine in lib/policy_vector.h.
#
# Heap budget (deliberate, #428):
#   * SEVEN api services with tight argument surfaces instead of per-field
#     entities — the same "ONE service" idiom as set_band_anchor. Chunk
#     payloads are hex strings capped at 192 raw bytes (384 hex chars) and are
#     decoded straight into the engine's single static staging arena; no
#     std::String churn beyond the api frame ESPHome already allocates.
#   * ONE aggregated identity text sensor (60 s, diagnostic) instead of many
#     entities, plus one binary sensor for the armed state.
#   * The engine itself is a fixed ~6 KB .bss singleton; the journal writes
#     two ≤1280 B NVS blobs only on state transitions.
#
# Transport encoding (documented for Lane C): hex was chosen over base64 —
# 2× size on an ≤384-char string is cheaper than a base64 decoder + padding
# edge cases, and the chunk cap already bounds every allocation.
#
# The engine is INERT until an experiment manifest is staged and committed
# through these services: policy_snapshot().experiment_active stays false, so
# every gated consumer in controls.yaml keeps reading the legacy globals and
# behavior is bit-identical to today (feature-off equivalence gate).
#
# Service names are the Lane C transport constants (#584 not yet merged; the
# §8.9 defaults below are the agreed fallback):
#   policy_begin(header_hex)
#   policy_chunk(offset, data_hex)          (shared by vector + manifest)
#   policy_validate()
#   policy_commit(slot, effective_at)       slot: 1=boundary, 2=tactical
#   policy_abort(slot)
#   policy_manifest_begin(expected_len)
#   policy_manifest_commit()

api:
  services:
    - service: policy_begin
      variables:
        header_hex: string
      then:
        - lambda: |-
            using namespace verdify_policy;
            static uint8_t header_buf[kPolicyBeginHeaderMax];
            size_t header_len = 0;
            if (!policy_hex_decode(header_hex.c_str(), header_hex.size(), header_buf,
                                   sizeof(header_buf), &header_len)) {
              ESP_LOGW("policy", "policy_begin: bad hex header (%u chars)", (unsigned) header_hex.size());
              return;
            }
            const bool ok = policy_engine().begin_policy(header_buf, header_len);
            ESP_LOGI("policy", "policy_begin: %s", policy_error_name(policy_engine().last_error()));
            (void) ok;

    - service: policy_chunk
      variables:
        offset: int
        data_hex: string
      then:
        - lambda: |-
            using namespace verdify_policy;
            static uint8_t chunk_buf[kMaxStageChunk];
            size_t chunk_len = 0;
            if (offset < 0 ||
                !policy_hex_decode(data_hex.c_str(), data_hex.size(), chunk_buf,
                                   sizeof(chunk_buf), &chunk_len)) {
              ESP_LOGW("policy", "policy_chunk: bad hex chunk (%u chars)", (unsigned) data_hex.size());
              return;
            }
            const bool ok = policy_engine().stage_chunk((size_t) offset, chunk_buf, chunk_len);
            if (!ok) {
              ESP_LOGW("policy", "policy_chunk@%d: %s", offset,
                       policy_error_name(policy_engine().last_error()));
            }

    - service: policy_validate
      then:
        - lambda: |-
            using namespace verdify_policy;
            policy_engine().validate_policy();
            ESP_LOGI("policy", "policy_validate: %s", policy_error_name(policy_engine().last_error()));

    - service: policy_commit
      variables:
        slot: int
        effective_at: int
      then:
        - lambda: |-
            using namespace verdify_policy;
            if (slot != 1 && slot != 2) {
              ESP_LOGW("policy", "policy_commit: bad slot %d", slot);
              return;
            }
            policy_engine().commit_policy((PolicySlot) slot, (uint32_t) effective_at);
            ESP_LOGI("policy", "policy_commit slot=%d at=%d: %s", slot, effective_at,
                     policy_error_name(policy_engine().last_error()));

    - service: policy_abort
      variables:
        slot: int
      then:
        - lambda: |-
            using namespace verdify_policy;
            if (slot != 1 && slot != 2) {
              ESP_LOGW("policy", "policy_abort: bad slot %d", slot);
              return;
            }
            // Idempotent: clears the addressed pending slot AND any in-flight
            // staging transfer (vector or manifest).
            policy_engine().manifest_abort();
            policy_engine().abort_policy((PolicySlot) slot);
            ESP_LOGI("policy", "policy_abort slot=%d", slot);

    - service: policy_manifest_begin
      variables:
        expected_len: int
      then:
        - lambda: |-
            using namespace verdify_policy;
            if (expected_len < 0) return;
            policy_engine().manifest_begin((size_t) expected_len);
            ESP_LOGI("policy", "policy_manifest_begin len=%d: %s", expected_len,
                     policy_error_name(policy_engine().last_error()));

    - service: policy_manifest_commit
      then:
        - lambda: |-
            using namespace verdify_policy;
            policy_engine().manifest_commit();
            ESP_LOGI("policy", "policy_manifest_commit: %s",
                     policy_error_name(policy_engine().last_error()));

text_sensor:
  # ONE aggregated identity readback (heap: no per-field entities), transport
  # contract v2 (#586 decision):
  # "<schema>|<generation>|<assignment uuid|->|<activation sha256 FULL 64 hex|->|<apply_state>"
  # The truncated content/activation prefixes of v1 are gone — content
  # identity is bound inside the activation hash (audit §8.9).
  - platform: template
    id: policy_identity
    name: "Policy Identity"
    entity_category: diagnostic
    icon: "mdi:file-key-outline"
    update_interval: 60s
    lambda: |-
      static char identity_buf[verdify_policy::kPolicyIdentityMax];
      verdify_policy::policy_engine().identity_readback(identity_buf, sizeof(identity_buf));
      return std::string(identity_buf);

binary_sensor:
  - platform: template
    id: policy_engine_active
    name: "Policy Engine Active"
    entity_category: diagnostic
    icon: "mdi:shield-check-outline"
    lambda: |-
      return verdify_policy::policy_engine().manifest_armed();
