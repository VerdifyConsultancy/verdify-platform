###############################################################################
# greenhouse/sensors.yaml — refactored edition (2025-07-20)
#
# Defines uptime, analog sensors, Modbus sensors, derived metrics and daily
# counters.  All lambdas end with a semicolon to satisfy the ESPHome compiler.
###############################################################################

substitutions:
  upd_int: 10s
  modbus_temp_lambda: |
    /* raw register = 0.1 °C; convert → °F.
       0x7FFF (32767) = Modbus sensor error sentinel → NAN */
    if(x >= 32000.0f) return NAN;
    return (x * 0.1f) * 9.0f / 5.0f + 32.0f;
  vpd_lambda: |-
    /* VPD [kPa] from T (°F) & RH (%) */
    float tc = (T - 32) * 5.0 / 9.0;
    float es = 0.6108 * expf((17.27 * tc) / (tc + 237.3));
    return es * (1.0 - RH / 100.0);

sensor:
  # --------------------------------------------------------------------------
  # 1‑A Uptime
  # --------------------------------------------------------------------------
  - platform: uptime
    id: uptime_seconds
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    id: heap_free
    name: "Free Heap"
    unit_of_measurement: "kB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return gh_free_heap_kb();'

  - platform: template
    id: heap_min_free
    name: "Minimum Free Heap"
    unit_of_measurement: "kB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return gh_min_free_heap_kb();'

  - platform: template
    id: heap_largest_free_block
    name: "Largest Free Heap Block"
    unit_of_measurement: "kB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return gh_largest_free_heap_block_kb();'

  # --------------------------------------------------------------------------
  # 1‑B Analog – CO₂ & Light
  # --------------------------------------------------------------------------
  - platform: adc
    id: co2_raw_v
    pin: GPIO36
    attenuation: 12db
    internal: true
    update_interval: 5s
  - platform: template
    id: greenhouse_co2_ppm
    name: "CO₂ (ppm)"
    device_class: carbon_dioxide
    unit_of_measurement: "ppm"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      // B13 / M2: corrected CO2 transform.
      // The analog module's output voltage DECREASES as CO2 rises (MG811-style),
      // so the prior linear `raw_v * K` produced an INVERTED diurnal (low at
      // night when respiration raised CO2, high midday when photosynthesis drew
      // it down). Use a two-point INVERTED-linear map: ppm falls as voltage
      // rises, anchored on (v_lo_ppm @ co2_cal_lo_ppm) and (v_hi_ppm @
      // co2_cal_hi_ppm). True absolute accuracy still needs a reference-NDIR
      // two-point field calibration (see globals.yaml co2_cal_*).
      float v = id(co2_raw_v).state;
      float v_lo = id(co2_cal_v_lo_ppm);   // voltage at LOW ppm (higher v)
      float v_hi = id(co2_cal_v_hi_ppm);   // voltage at HIGH ppm (lower v)
      float ppm_lo = id(co2_cal_lo_ppm);
      float ppm_hi = id(co2_cal_hi_ppm);
      // Guard a degenerate calibration (equal voltages) → avoid div-by-zero.
      float dv = v_hi - v_lo;
      if (fabsf(dv) < 1e-4f) {
        id(co2_plausible) = false;
        return NAN;
      }
      float ppm = ppm_lo + (v - v_lo) * (ppm_hi - ppm_lo) / dv;
      // Plausibility gate: a disconnected/railed analog line, or a ppm outside
      // the planted-greenhouse band, is flagged AND suppressed (NAN) rather than
      // fed downstream as a real reading.
      bool raw_ok = v >= id(co2_raw_v_min) && v <= id(co2_raw_v_max);
      bool ppm_ok = ppm >= id(co2_plausible_min_ppm) && ppm <= id(co2_plausible_max_ppm);
      bool ok = raw_ok && ppm_ok;
      id(co2_plausible) = ok;
      if (!ok) return NAN;   // flagged implausible → don't publish a bogus value
      return ppm;
    filters:
      - clamp:
          min_value: 0
          max_value: 10000

  # B13 / M2: plausibility flag for the CO2 reading (1 = inside band, 0 = the
  # last sample was flagged implausible — disconnected/railed line or ppm out of
  # the 300–5000 planted-greenhouse band). Lets the planner/operator distinguish
  # "no data" from "real low CO2".
  - platform: template
    id: co2_plausible_flag
    name: "CO₂ Plausible"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return id(co2_plausible) ? 1.0f : 0.0f;

  - platform: adc
    id: lux_raw_v
    pin: GPIO35
    attenuation: 12db
    internal: true
    update_interval: 5s
  - platform: template
    id: greenhouse_light_lux
    name: "Light (lx)"
    device_class: illuminance
    unit_of_measurement: "lx"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      // ADC baseline offset: 0.142V at 12dB attenuation = 2820 lux phantom reading.
      // Subtract offset voltage before scaling.  Confirmed by 72h of nighttime data
      // reading a constant 2820 lux while Tempest reads 0.
      float v = id(lux_raw_v).state - 0.142f;
      if (v < 0.0f) v = 0.0f;
      return v * (5.0f/3.3f) * (65535.0f/5.0f);
    filters:
      - clamp:
          min_value: 0
          max_value: 65535

  # --------------------------------------------------------------------------
  # 1‑C Water meter (diagnostic flow + total usage)
  # DAE AS200U-75P, 3/4" NPT, pulse output, measures in gallons.
  # Measures ALL water downstream including: misting, hydro, sink,
  # workstation, pressure washer hose. NOT greenhouse-only.
  # Calibrate: fill a known container (e.g., 5 gallon bucket), read
  # pulse count, adjust multiply factor. Current multiply: 1.0 (uncalibrated).
  # --------------------------------------------------------------------------
  - platform: pulse_counter
    id: water_flow_rate
    name: "Water Flow (gpm)"
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    internal_filter: 10us
    update_interval: 60s
    unit_of_measurement: gal/min
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 1.0   # adjust after calibration (see above)
    total:
      id: water_total_used
      name: "Water Used (gal)"
      unit_of_measurement: gal
      device_class: water
      state_class: total_increasing
      accuracy_decimals: 1
      filters:
        - multiply: 1.0

  # --------------------------------------------------------------------------
  # 2. MODBUS PROBES
  # --------------------------------------------------------------------------
  # Controller case
  - platform: modbus_controller
    id: case_temperature
    name: "Case Temp (°F)"
    modbus_controller_id: case_probe
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: ${modbus_temp_lambda}
    on_value:
      then:
        - lambda: |-
            id(last_external_update) = millis() / 1000;
            id(last_case_ms) = millis();

  - platform: modbus_controller
    id: case_humidity
    name: "Case RH (%)"
    modbus_controller_id: case_probe
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    device_class: humidity
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: "return x > 110.0f ? NAN : x;"  # 0x7FFF sentinel → NAN

