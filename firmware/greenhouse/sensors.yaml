  - platform: modbus_controller
    id: west_soil_temp
    name: "West Soil Temp (°F)"
    modbus_controller_id: west_soil_probe
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: ${modbus_temp_lambda}
      - timeout: 300s

  # --------------------------------------------------------------------------
  # 2b. OUTDOOR CLIMATE — Tempest direct primary, legacy pulled globals fallback
  # --------------------------------------------------------------------------
  # Tempest UDP provides data every 60s. The pulled globals are retained only as
  # a no-HTTP compatibility fallback if an external path ever sets them.
  # The enthalpy calculation and economiser reference these IDs.
  - platform: template
    id: ha_outdoor_temp
    internal: true
    update_interval: 30s
    lambda: |-
      float t = id(tempest_temp_f);
      if (!isnan(t)) return t;
      return id(pulled_outdoor_temp_f);

  - platform: template
    id: ha_outdoor_rh
    internal: true
    update_interval: 30s
    lambda: |-
      float r = id(tempest_rh_pct);
      if (!isnan(r)) return r;
      return id(pulled_outdoor_rh_pct);

  # Outdoor weather — now sourced from Tempest UDP (see external_sensors.yaml)
  # Legacy HA imports removed. Tempest sensors: tempest_outdoor_temp, tempest_outdoor_rh, tempest_illuminance

  # Expose Tempest illuminance as outdoor reference for grow light automation
  - platform: template
    id: outdoor_illuminance
    name: "Outdoor Illuminance"
    icon: mdi:weather-sunny
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    device_class: illuminance
    update_interval: 60s
    lambda: |-
      float v = id(tempest_lux);
      if(isnan(v)) return NAN;
      return v;

  # --------------------------------------------------------------------------
  # 3. DERIVED METRICS
  # --------------------------------------------------------------------------
  # Absolute humidity outside (g/m³, internal)
  - platform: template
    id: absolute_humidity_out
    internal: true
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      // Prefer local Modbus probe; fall back to HA 3-tier sensor
      float T  = id(exterior_intake_temperature).state;
      float RH = id(exterior_intake_humidity).state;
      if(isnan(T) || isnan(RH)){
        T  = id(ha_outdoor_temp).state;
        RH = id(ha_outdoor_rh).state;
      }
      if(isnan(T) || isnan(RH)){
        T  = id(pulled_outdoor_temp_f);
        RH = id(pulled_outdoor_rh_pct);
      }
      if(isnan(T) || isnan(RH)) return NAN;
      float tc = (T - 32) * 5.0f / 9.0f;
      float es = 0.6108f * expf((17.27f * tc) / (tc + 237.3f)) * 10.0f;  // kPa→hPa
      float avp= es * RH / 100.0f;
      return 216.7f * (avp / (tc + 273.15f));

  # Interior averages — FW-10 (Sprint 17): skip stale probes.
  #
  # When a Modbus probe times out, its sensor state retains the last
  # successful reading rather than going NaN, so !isnan() alone is not
  # sufficient to exclude a dead probe from the aggregate. We also check
  # the per-probe last_update timestamp against PROBE_STALE_MS. A probe
  # older than 5 min is considered dead for averaging purposes; its
  # reading is dropped until it comes back. Matches the watchdog's 300s
  # wall-probe threshold in controls.yaml.
  - platform: template
    id: average_temperature
    name: "Avg Temp (°F)"
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |
      const uint32_t now = millis();
      const uint32_t STALE = 300000; // 5 min, matches watchdog
      auto ok = [&](uint32_t ts){ return ts > 0 && (now - ts) < STALE; };
      float s = 0; int n = 0;
      if(ok(id(last_north_ms)) && !isnan(id(north_wall_temperature).state)){ s += id(north_wall_temperature).state; n++; }
      if(ok(id(last_west_ms))  && !isnan(id(west_wall_temperature).state)) { s += id(west_wall_temperature).state;  n++; }
      if(ok(id(last_south_ms)) && !isnan(id(south_wall_temperature).state)){ s += id(south_wall_temperature).state; n++; }
      if(ok(id(last_east_ms))  && !isnan(id(east_wall_temperature).state)) { s += id(east_wall_temperature).state;  n++; }
      return n ? s/n : NAN;

  - platform: template
    id: average_humidity
    name: "Avg RH (%)"
    device_class: humidity
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |
      const uint32_t now = millis();
      const uint32_t STALE = 300000;
      auto ok = [&](uint32_t ts){ return ts > 0 && (now - ts) < STALE; };
      float s = 0; int n = 0;
      if(ok(id(last_north_ms)) && !isnan(id(north_wall_humidity).state)){ s += id(north_wall_humidity).state; n++; }
      if(ok(id(last_west_ms))  && !isnan(id(west_wall_humidity).state)) { s += id(west_wall_humidity).state;  n++; }
      if(ok(id(last_south_ms)) && !isnan(id(south_wall_humidity).state)){ s += id(south_wall_humidity).state; n++; }
      if(ok(id(last_east_ms))  && !isnan(id(east_wall_humidity).state)) { s += id(east_wall_humidity).state;  n++; }
      return n ? s/n : NAN;

  - platform: template
    id: average_vpd_kpa
    name: "Avg VPD (kPa)"
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |
      const uint32_t now = millis();
      const uint32_t STALE = 300000;
      auto ok = [&](uint32_t ts){ return ts > 0 && (now - ts) < STALE; };
      float s = 0; int n = 0;
      if(ok(id(last_north_ms)) && !isnan(id(vpd_north).state)){ s += id(vpd_north).state; n++; }
      if(ok(id(last_west_ms))  && !isnan(id(vpd_west).state)) { s += id(vpd_west).state;  n++; }
      if(ok(id(last_south_ms)) && !isnan(id(vpd_south).state)){ s += id(vpd_south).state; n++; }
      if(ok(id(last_east_ms))  && !isnan(id(vpd_east).state)) { s += id(vpd_east).state;  n++; }
      return n ? s/n : NAN;

  # FW-10 (Sprint 17): active probe count — how many zone probes currently
  # contribute to the aggregates. Emits 0-4 as an int. Planner reads this
  # to know when to distrust averages (e.g., if only 1 probe is live, the
  # "greenhouse average" is really just that one zone).
  - platform: template
    id: active_probe_count
    name: "Active Probe Count"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const uint32_t now = millis();
      const uint32_t STALE = 300000;
      auto ok = [&](uint32_t ts){ return ts > 0 && (now - ts) < STALE; };
      int n = 0;
      if(ok(id(last_north_ms))) n++;
      if(ok(id(last_west_ms)))  n++;
      if(ok(id(last_south_ms))) n++;
      if(ok(id(last_east_ms)))  n++;
      return (float)n;

  # OBS-3 (Sprint 18): firmware control-state exposure for planner feedback.
  # ControlState.relief_cycle_count and vent_latch_timer_ms are firmware-
