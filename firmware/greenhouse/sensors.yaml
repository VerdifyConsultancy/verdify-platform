# ─────────────────── TEXT SENSORS ──────────────────────────────────────────

text_sensor:
  - platform: template
    id: dli_availability
    name: "DLI Availability"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).available
        ? "available" : "unavailable"};

  - platform: template
    id: dli_unavailable_reason
    name: "DLI Unavailable Reason"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).unavailable_reason};

  - platform: template
    id: dli_provenance
    name: "DLI Provenance"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).provenance};

  - platform: template
    id: dli_validity_revision
    name: "DLI Validity Revision"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).validity_revision};

  - platform: template
    id: dli_valid_from
    name: "DLI Valid From"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).valid_from};

  - platform: template
    id: dli_valid_to
    name: "DLI Valid To"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).valid_to};

  # Full Unix epochs exceed ESPHome sensor float precision. Publish them as
  # strings and let the ingestor parse exact bigint values.
  - platform: template
    id: controller_time_epoch
    name: "Controller Time Epoch"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto now = id(sntp_time).now();
      if(!now.is_valid()) return {};
      char buf[24];
      snprintf(buf, sizeof(buf), "%lld", (long long)now.timestamp);
      return {buf};

  - platform: template
    id: gl_main_decision_epoch
    name: "GL Main Decision Epoch"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: gl_grow_decision_epoch
    name: "GL Grow Decision Epoch"
    entity_category: diagnostic
    update_interval: never

  # A1: State machine transition logging
  - platform: template
    id: ts_last_transition
    name: "Last State Transition"
    entity_category: diagnostic

  # A2: Per-probe health monitoring
  - platform: template
    id: probe_health
    name: "Probe Health"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint32_t now = millis();
      const uint32_t STALE_MS = 120000;
      char result[96];
      size_t n = 0;
      result[0] = '\0';
      struct { const char* name; uint32_t last; } probes[] = {
        {"Case", id(last_case_ms)},
        {"North", id(last_north_ms)},
        {"West", id(last_west_ms)},
        {"South", id(last_south_ms)},
        {"East", id(last_east_ms)}
      };
      bool all_ok = true;
      auto append = [&](const char* s) {
        while (*s != '\0' && n + 1 < sizeof(result)) {
          result[n++] = *s++;
        }
        result[n] = '\0';
      };
      for(auto &p : probes){
        if(p.last == 0 || (now - p.last) > STALE_MS){
          if(!all_ok) append(", ");
          append(p.name);
          append(" STALE");
          all_ok = false;
        }
      }
      return all_ok ? std::string("OK") : std::string(result);

