  # Exterior intake
  - platform: modbus_controller
    id: exterior_intake_temperature
    name: "Exterior Intake Temp (°F)"
    modbus_controller_id: exterior_intake_probe
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: ${modbus_temp_lambda}
    on_value:
      then:
        - lambda: |-
            id(last_external_update) = millis() / 1000;
  - platform: modbus_controller
    id: exterior_intake_humidity
    name: "Exterior Intake RH (%)"
    modbus_controller_id: exterior_intake_probe
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    device_class: humidity
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
