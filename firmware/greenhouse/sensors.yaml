  # Live outdoor readings (firmware exposes the values it's actually
  # comparing). Useful for Iris to see whether the gate is data-poor
  # or data-rich. Gated on cfg_first_pull_ok like the rest.
  - platform: template
    id: cfg_outdoor_temp_f
    name: "Cfg • Outdoor Temp (°F)"
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(cfg_first_pull_ok)) return NAN;
      return id(ha_outdoor_temp).state;

  - platform: template
    id: cfg_outdoor_dewpoint_f
    name: "Cfg • Outdoor Dewpoint (°F)"
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(cfg_first_pull_ok)) return NAN;
      // Recompute outdoor DP here from the Tempest-primary outdoor inputs so
      // the readback reflects the same value SensorInputs uses.
      float Tf = id(ha_outdoor_temp).state;
      float RH = id(ha_outdoor_rh).state;
      if (isnan(Tf) || isnan(RH) || RH <= 0.0f) return NAN;
      float Tc = (Tf - 32.0f) * (5.0f / 9.0f);
      float gamma = (17.27f * Tc) / (237.7f + Tc) + log(RH / 100.0f);
      float dp_c = (237.7f * gamma) / (17.27f - gamma);
      return dp_c * (9.0f / 5.0f) + 32.0f;

