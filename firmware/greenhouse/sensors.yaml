    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: ${modbus_temp_lambda}
      - timeout: 300s

  # West zone — SEN0600 (moisture + temp)
  - platform: modbus_controller
    id: west_soil_moisture
    name: "West Soil Moisture (%)"
    modbus_controller_id: west_soil_probe
    register_type: holding
    address: 0x0000
