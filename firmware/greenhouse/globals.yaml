  # ─── B13 / M2: CO2 inverted-diurnal fix + plausibility calibration ───
  # The analog CO2 module on GPIO36 outputs a voltage that DECREASES as CO2
  # rises (MG811-style). The old linear `raw_v * K` map therefore produced an
  # INVERTED diurnal: it read LOW at night (when respiration raises CO2 →
  # voltage falls) and HIGH midday (photosynthesis draws CO2 down → voltage
  # rises) — backwards from real plant physiology. The corrected transform is a
  # two-point INVERTED-linear map anchored on (v_lo_ppm @ v at LOW ppm) and
  # (v_hi_ppm @ v at HIGH ppm): ppm falls as voltage rises.
  #
  # IMPORTANT: these anchors are PLACEHOLDERS that only fix the inversion +
  # bound the range. A trustworthy absolute ppm needs a TWO-POINT field
  # calibration against a reference NDIR meter (e.g. fresh-air ~420 ppm and a
  # known elevated point): set co2_cal_v_lo_ppm / co2_cal_v_hi_ppm to the
  # measured ADC voltages at co2_cal_lo_ppm / co2_cal_hi_ppm. Until then the
  # value is directionally correct (de-inverted) but not absolutely accurate —
  # surfaced via the co2_plausible flag.
  - id: co2_cal_lo_ppm
    type: float
    restore_value: no
    initial_value: '400.0'    # reference LOW concentration (fresh-air ~420 ppm)
  - id: co2_cal_hi_ppm
    type: float
    restore_value: no
    initial_value: '2000.0'   # reference HIGH concentration
  - id: co2_cal_v_lo_ppm
    type: float
    restore_value: no
    initial_value: '2.7'      # measured ADC volts AT co2_cal_lo_ppm (HIGH v at LOW ppm; placeholder)
  - id: co2_cal_v_hi_ppm
    type: float
    restore_value: no
    initial_value: '1.2'      # measured ADC volts AT co2_cal_hi_ppm (LOW v at HIGH ppm; placeholder)
  # Plausibility band: a valid CO2 reading for a vented planted greenhouse sits
  # roughly 300–5000 ppm; the raw ADC voltage must also be inside a sane window
  # (a disconnected/short sensor pegs near 0 or rail). Out-of-band → flagged.
  - id: co2_plausible_min_ppm
    type: float
    restore_value: no
    initial_value: '300.0'
  - id: co2_plausible_max_ppm
    type: float
    restore_value: no
    initial_value: '5000.0'
  - id: co2_raw_v_min
    type: float
    restore_value: no
    initial_value: '0.05'     # below this the analog line is likely disconnected/shorted low
  - id: co2_raw_v_max
    type: float
    restore_value: no
    initial_value: '3.2'      # above this the line is likely railed (ADC ~3.3V ceiling at 12db)
  - id: co2_plausible
    type: bool
    restore_value: no
    initial_value: 'true'     # published flag: last CO2 reading inside the plausibility band

