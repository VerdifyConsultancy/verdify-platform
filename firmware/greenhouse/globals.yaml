  # ══════════════════════════════════════════════════════════════════════════
  # FIRMWARE-V2: deterministic solar band engine (contract §B2)
  # ══════════════════════════════════════════════════════════════════════════
  # The dispatcher STOPS pushing temp_low/high & vpd_low/high as control inputs;
  # instead it pushes these NVS-persisted anchors (restore_value: yes →
  # offline-first: one push survives reboot indefinitely). Each cycle
  # controls.yaml reconstructs the served band via band_value_at_phase() from
  # the 4 anchors (SR / solar-noon / SS / solar-midnight) and writes them into
  # the existing Setpoints.temp_low/high/vpd_low/high fields. Seed values from
  # the researched envelopes + owner Vanda table + §3.1 house reconciliation.

  # ─── B2: house TEMPERATURE band anchor curves (°F) ───
  # low / target / high; SR SM SS MID order.
  - id: band_temp_low_sr
    type: float
    restore_value: yes
    initial_value: '60'
  - id: band_temp_low_sm
    type: float
    restore_value: yes
    initial_value: '76'
  - id: band_temp_low_ss
    type: float
    restore_value: yes
    initial_value: '66'
  - id: band_temp_low_mid
    type: float
    restore_value: yes
    initial_value: '60'

  - id: band_temp_target_sr
    type: float
    restore_value: yes
    initial_value: '66'
  - id: band_temp_target_sm
    type: float
    restore_value: yes
    initial_value: '84'
  - id: band_temp_target_ss
    type: float
    restore_value: yes
    initial_value: '73'
  - id: band_temp_target_mid
    type: float
    restore_value: yes
    initial_value: '64'

  - id: band_temp_high_sr
    type: float
    restore_value: yes
    initial_value: '72'
  - id: band_temp_high_sm
    type: float
    restore_value: yes
    initial_value: '86'
  - id: band_temp_high_ss
    type: float
    restore_value: yes
    initial_value: '80'
  - id: band_temp_high_mid
    type: float
    restore_value: yes
    initial_value: '70'

