  # ─── ENV-2: night econ-heat suppression (Vanda day/night-drop companion) ───
  # When enabled, the IDLE econ VPD-rescue heat path is suppressed at night so
  # we never chase overnight humidity with heat (which would erase the >=10F
  # diurnal drop). v2: "night" = solar phase >= 2.0 (on-chip ephemeris); the
  # fixed night_start_hour/night_end_hour clock window is retired.
  - id: sw_night_econ_heat_suppress_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  # ─── FRT-6 / FRT-7: post-feed absorption hold ───
  # feed_hold_until_ms is the millis() deadline (uint32, wrap-aware compare)
  # until which ALL clean wetting is blocked after a fertilizer feed. Armed by
  # the irrigation state machine when a fert job finishes; the post-fert clean
  # flush is relocated to fire AFTER the hold. 0 = no hold armed.
  - id: feed_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Minutes of absorption hold after a feed completes (default 90).
  - id: post_feed_hold_min
    type: int
    restore_value: no
    initial_value: '90'

  # ─── FRT-8 / F3 / F1: AM-only feed window ───
  # Authoritative VPD-INDEPENDENT rail. Every fertilizer job (scheduled fert
  # states 2/4/7/8 AND the manual fert buttons) is rejected outside the local
  # [feed_start_hour, feed_end_hour) morning window, regardless of VPD stress.
  # Default 06:00-09:00 places the once-daily Vanda feed at ~06:30 (F1: the
  # dispatcher pushes irrig_center_start_hour/minute to 06:30; this gate is the
  # firmware backstop so PM/dusk/overnight feeds can never run even if a
  # schedule or manual press lands off-window). Dispatcher-overridable per
  # season. feed_start_hour == feed_end_hour fails SAFE (no feed).
  - id: feed_start_hour
    type: int
    restore_value: no
    initial_value: '6'

  - id: feed_end_hour
    type: int
    restore_value: no
    initial_value: '9'

  # ─── IRR-3 (dawn rehydrate) / IRR-4 (midday drench) ───
  # Two time-anchored CENTER-ZONE mist cadence OVERRIDES for the bare-root
  # Vanda. They do NOT create a new relay path or mode — they make the existing
  # center-mist pulse cadence (mister_pulse_on_s / mister_pulse_gap_s) DENSER
  # inside two short pre-dusk windows so the velamen re-saturates after the
  # overnight dry-down (dawn) and gets a deeper soak at the solar/thermal peak
  # (midday). West/south/east cadence is untouched. The burst fires only when
  # the center is already eligible to wet (climate wet-assist rails: not
  # feed-hold, not past dusk, dew margin OK, VPD above the center target) and
  # still counts toward / is bounded by the SAF-4 duty cap + daily-volume
  # ceiling — a burst can never exceed the cap. Switches default ON so the
  # feature ships active in the OTA; operator-toggleable.
  #
  # IRR-3 dawn: window START anchors to the dispatched sunrise hour
  # (gl_sunrise_hour) in controls.yaml; only the minute/duration/on/gap live
  # here. 12-min window, 90s-ON / 20s-GAP — denser than the 60/45 base.
  - id: sw_dawn_rehydrate_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: dawn_rehydrate_window_min
    type: int
    restore_value: no
    initial_value: '12'       # dawn rehydrate window length (minutes)

  - id: dawn_rehydrate_on_s
    type: int
    restore_value: no
    initial_value: '90'       # center pulse ON during dawn window (s) — longer than 60s base

  - id: dawn_rehydrate_gap_s
    type: int
    restore_value: no
    initial_value: '20'       # center pulse GAP during dawn window (s) — shorter than 45s base → denser

  # IRR-4 midday: firmware-v2 anchors the window START to solar-noon +
  # midday_boost_offset_min (on-chip ephemeris). 11-min window, deeper
  # 120s-ON / 25s-GAP soak. Still pre-taper (blocked by the wet-taper rule).
  - id: sw_midday_drench_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: midday_drench_window_min
    type: int
    restore_value: no
    initial_value: '11'       # midday drench window length (minutes)

  - id: midday_drench_on_s
    type: int
    restore_value: no
    initial_value: '120'      # center pulse ON during midday window (s) — deeper soak than dawn

  - id: midday_drench_gap_s
    type: int
    restore_value: no
    initial_value: '25'       # center pulse GAP during midday window (s) — still denser than 45s base

  # (CYC-4 overnight micro-pulse path DELETED in firmware-v2: night emergency
