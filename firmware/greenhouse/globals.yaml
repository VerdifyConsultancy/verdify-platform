    type: uint32_t
    restore_value: no
    initial_value: '99999'  # Start stale; direct Tempest is primary.

  # Sprint-14: gate cfg_* readback publishes until the first direct band push
  # lands. Without this gate, cfg_* sensors publish the
  # firmware-default globals at boot (before the dispatcher has pushed
  # real values) and the resulting rows poison setpoint_snapshot
  # analytics (observed: min=0 for temp_high/vpd_low/safety_* across
  # the 30-day trailing window). The four band number set_actions flip this
  # true. cfg_* sensors return NAN while false; ingestor skips NAN.
  - id: cfg_first_pull_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  # ─── Sprint-15: summer thermal-driven vent gate tunables ──────────
  # Operator-tunable parameters for the new gate that pre-empts
  # VPD-seal entry when outdoor air is cooler+drier than indoor.
  # Defaults match the spec; clamps live in ESPHome tunables and dispatcher validation.
  # See docs/firmware-sprint-15-summer-vent-spec.md.
  - id: sw_summer_vent_enabled
    type: bool
    restore_value: no
    initial_value: 'true'    # ON by default — sealing is wrong in summer

  - id: vent_prefer_temp_delta_f
    type: float
    restore_value: no
    initial_value: '5.0'

  - id: vent_prefer_dp_delta_f
    type: float
    restore_value: no
    initial_value: '5.0'

  - id: outdoor_staleness_max_s
    type: int
    restore_value: no
    initial_value: '600'     # sprint-15.1: 10 min — 2× dispatcher cadence, covers push jitter

  - id: summer_vent_min_runtime_s
    type: int
    restore_value: no
    initial_value: '180'

  # ─── Phase-2 dwell gate ───────────────────────────────────────────
  # 5-min hold on non-safety mode transitions to kill whipsaw. Default
  # OFF for shadow-mode bake; planner flips to ON after 14d replay +
  # shadow validation. See plan Phase 2 in
  # .claude-agents/iris-dev/plans/yo-iris-dev-you-help-humming-stonebraker.md
  - id: sw_dwell_gate_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: dwell_gate_ms
    type: int
    restore_value: no
    initial_value: '300000'   # 5 min

  # ─── Unified band-first controller ───────────────────────────────────────
  # Compatibility/readback field for planner and dispatcher contracts.
  # The ESPHome control loop forces it ON so there is one live controller path:
  # temp-band first, VPD-band second, failed sealed misting enters backoff.
  - id: sw_fsm_controller_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: mist_backoff_s
    type: int
    restore_value: no
    initial_value: '600'

  # ─── Occupancy-based mist inhibit ───
  - id: greenhouse_occupied
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: occupancy_inhibit_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: occupancy_last_true_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: occupancy_override_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

