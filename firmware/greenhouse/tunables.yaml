    min_value: 1
    max_value: 4
    step: 1
    lambda: "return id(zone_priority_east);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          int val = int(roundf(x));
          if(val < 1) val = 1;
          if(val > 4) val = 4;
          id(zone_priority_east) = val;
          id(num_zone_priority_east).publish_state(val);

