  # --- Relay min on/off timing (seconds) ------------------------------
  - platform: template
    id: num_min_heat_on
    name: "Min Heat ON (s)"
    min_value: 30
    max_value: 300
    step: 10
    lambda: "return id(min_heat_on_s);"
    set_action:
      - lambda: |
          int val = int(roundf(x));
          if(val < 30) val = 30;
          if(val > 300) val = 300;
          id(min_heat_on_s) = val;
          id(num_min_heat_on).publish_state(val);
  - platform: template
    id: num_min_heat_off
    name: "Min Heat OFF (s)"
    min_value: 60
    max_value: 600
    step: 10
    lambda: "return id(min_heat_off_s);"
    set_action:
      - lambda: |
          int val = int(roundf(x));
          if(val < 60) val = 60;
          if(val > 600) val = 600;
          id(min_heat_off_s) = val;
          id(num_min_heat_off).publish_state(val);
  - platform: template
