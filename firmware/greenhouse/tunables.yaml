    lambda: "return id(mister_pulse_on_s);"
    set_action:
      - lambda: |
          id(mister_pulse_on_s) = (int)x;
          id(num_mister_pulse_on).publish_state(x);

  - platform: template
    id: num_mister_pulse_gap
