###############################################################################
# greenhouse/tunables.yaml -- user-adjustable settings exposed to Home Assistant
###############################################################################

number:
  # --- Temperature band (°F) -----------------------------------------
  # Wide min/max — dispatcher pushes real crop band each planner cycle.
  - platform: template
    id: num_temp_low
    name: "Set Temp Low °F"
    min_value: 30
    max_value: 80
    step: 0.5
    lambda: "return id(target_temp_low_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(target_temp_low_f) = x;
          id(num_temp_low).publish_state(x);

  - platform: template
    id: num_temp_high
    name: "Set Temp High °F"
    min_value: 40
    max_value: 100
    step: 0.5
    lambda: "return id(target_temp_high_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(target_temp_high_f) = x;
          id(num_temp_high).publish_state(x);

  # --- Stage‑2 deltas (°F) -------------------------------------------
  - platform: template
    id: num_stage2_heat
    name: "Δ Heat Stage‑2 °F"
    min_value: 2
    max_value: 15
    step: 0.5
    lambda: "return id(stage2_heat_delta_f);"
    set_action:
      - lambda: |
          id(stage2_heat_delta_f) = x;
          id(num_stage2_heat).publish_state(x);
  - platform: template
    id: num_stage2_cool
    name: "Δ Cool Stage‑2 °F"
    min_value: 2
    max_value: 15
    step: 0.5
    lambda: "return id(stage2_cool_delta_f);"
    set_action:
      - lambda: |
          id(stage2_cool_delta_f) = x;
          id(num_stage2_cool).publish_state(x);

  # Firmware-side prototype: planner registry promotion is a coordinator
  # handoff. Until then these are local/HA knobs with cfg_* readbacks.
  - platform: template
    id: num_cool_stage2_over_high
    name: "Cool Stage 2 Over High °F"
    min_value: 0
    max_value: 3
    step: 0.1
    lambda: "return id(cool_stage2_over_high_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(cool_stage2_over_high_f) = x;
          id(num_cool_stage2_over_high).publish_state(x);

  - platform: template
    id: num_cool_exit_hysteresis
    name: "Cool Exit Hysteresis °F"
    min_value: 0.3
    max_value: 3
    step: 0.1
    lambda: "return id(cool_exit_hysteresis_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(cool_exit_hysteresis_f) = x;
          id(num_cool_exit_hysteresis).publish_state(x);

  # BC-8 (ADR0003 §6.5): fan1->fan2 de-escalation hysteresis (latch hold band below
  # the stage-2 entry) — symmetric twin of the heat2 latch so fan2 cannot chatter.
  - platform: template
    id: num_cool_stage2_exit_hyst
    name: "Cool Stage 2 Exit Hyst °F"
    min_value: 0.3
    max_value: 3
    step: 0.1
    lambda: "return id(cool_stage2_exit_hysteresis_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(cool_stage2_exit_hysteresis_f) = x;
          id(num_cool_stage2_exit_hyst).publish_state(x);

  # BC-3 (ADR0003 §6.1): control-band tracking tightness. 0 = float-envelope (no
  # longer the default), 1 = track target exactly; default 0.50. Bounded planner knob.
  - platform: template
    id: num_band_track_fraction
    name: "Band Track Fraction"
    min_value: 0
    max_value: 1
    step: 0.05
    lambda: "return id(band_track_fraction);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(band_track_fraction) = x;
          id(num_band_track_fraction).publish_state(x);

  # BC-13 (ADR0003 §6.4): AI-tunable air-exchange fraction for the moisture-exchange
  # estimator's vent VPD-gain projection. Default 0.30; rails [0.1,0.6].
  - platform: template
    id: num_vent_exchange_fraction
    name: "Vent Exchange Fraction"
    min_value: 0.1
    max_value: 0.6
    step: 0.05
    lambda: "return id(vent_exchange_fraction);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(vent_exchange_fraction) = x;
          id(num_vent_exchange_fraction).publish_state(x);

  - platform: template
    id: num_cold_vent_guard_delta
    name: "Cold Vent Guard Delta °F"
    min_value: 0
    max_value: 15
    step: 0.5
    lambda: "return id(cold_vent_guard_delta_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(cold_vent_guard_delta_f) = x;
          id(num_cold_vent_guard_delta).publish_state(x);

  # --- Temperature hysteresis (°F) -----------------------------------
  - platform: template
    id: num_hyst_temp
    name: "Temp Hysteresis °F"
    min_value: 0.5
    max_value: 3
    step: 0.1
    lambda: "return id(hyst_temp_f);"
    set_action:
      - lambda: |
          id(hyst_temp_f) = x;
          id(num_hyst_temp).publish_state(x);

  - platform: template
    id: num_heat_hysteresis
    name: "Heat Hysteresis °F"
    min_value: 0
    max_value: 3
    step: 0.1
    lambda: "return id(heat_hysteresis_f);"
    set_action:
      - lambda: |
          id(heat_hysteresis_f) = x;
          id(num_heat_hysteresis).publish_state(x);

  # --- VPD set‑band (kPa) --------------------------------------------
