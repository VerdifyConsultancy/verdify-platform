  # --- Lead/lag rotation timeout (seconds) ----------------------------
  - platform: template
    id: num_lead_rotate
    name: "Lead Rotate (s)"
    min_value: 60
    max_value: 1800
    step: 30
    lambda: "return id(lead_rotate_timeout_s);"
    set_action:
      - lambda: |
          int val = int(roundf(x));
          if(val < 60) val = 60;
          if(val > 1800) val = 1800;
          id(lead_rotate_timeout_s) = val;
