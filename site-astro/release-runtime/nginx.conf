server {
    listen 8080;
    server_name _;
    root /srv/lab-cache/current/tree;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        default_type text/plain;
        root /run/verdify-lab-release;
        try_files /readyz =503;
    }

    location = /metrics {
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        default_type text/plain;
        alias /run/verdify-lab-release/metrics;
    }

    location = /.well-known/verdify-release.json {
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        default_type application/json;
        alias /run/verdify-lab-release/release.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^(.+)/$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        if (-f $document_root$1.html) {
            return 308 $1$is_args$args;
        }
        try_files $uri/index.html =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* ^/(?:_astro|pagefind)/.*\.(?:css|js|json|woff2?|wasm|pagefind|pf_fragment|pf_index|pf_meta)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ "^/evidence/blobs/sha256/[a-f0-9]{64}\\.png$" {
        include /etc/nginx/conf.d/security-headers.inc;
        types { image/png png; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.m3u8$ {
        include /etc/nginx/conf.d/security-headers.inc;
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.ts$ {
        include /etc/nginx/conf.d/security-headers.inc;
        types { video/mp2t ts; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:mp4|m4v)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        types { video/mp4 mp4 m4v; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges "bytes" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
