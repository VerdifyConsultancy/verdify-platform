        notes: {type: [string, 'null']}
        operator: {type: [string, 'null']}
    PlantingDetail:
      type: object
      description: 'A planting with every place it has been, its events (newest first) and its harvests.'
      required: [id, crop, planted_date, active]
      properties:
        id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        crop_catalog_slug: {type: [string, 'null']}
        count: {type: [integer, 'null']}
        stage: {type: [string, 'null']}
        planted_date: {type: string, format: date}
        active: {type: boolean}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        recorded_by: {anyOf: [{$ref: '#/components/schemas/Actor'}, {type: 'null'}]}
        zones: {type: array, items: {type: string}}
        shelves: {type: array, items: {type: string}}
        cells: {type: array, items: {type: string}}
        where: {type: [string, 'null']}
        places: {type: array, items: {$ref: '#/components/schemas/Place'}}
        history: {type: array, items: {$ref: '#/components/schemas/Place'}}
        events: {type: array, items: {$ref: '#/components/schemas/PlantingEvent'}}
        harvests: {type: array, items: {$ref: '#/components/schemas/HarvestRecord'}}
    PlantingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Planting'}}
    Occupant:
      type: object
      required: [planting_id, crop, since]
      properties:
        planting_id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        since: {type: string, format: date-time}
        count: {type: [integer, 'null']}
    WaterLine:
      type: object
      required: [line_id, name]
      properties:
        line_id: {type: string}
        name: {type: string}
        note: {type: [string, 'null']}
    CellView:
      type: object
      required: [label]
      properties:
        label: {type: string}
        number: {type: [integer, 'null']}
        mount_type: {type: [string, 'null']}
        layout_group: {type: [string, 'null']}
        layout_row: {type: [integer, 'null']}
        layout_col: {type: [integer, 'null']}
        occupant: {anyOf: [{$ref: '#/components/schemas/Occupant'}, {type: 'null'}]}
    ShelfView:
      type: object
      required: [slug, name, kind]
      properties:
        slug: {type: string}
        name: {type: string}
        kind: {type: string}
        tier: {type: [integer, 'null']}
        wall: {type: [string, 'null']}
        display_order: {type: [integer, 'null']}
        label_short: {type: [string, 'null']}
        water_lines: {type: array, items: {$ref: '#/components/schemas/WaterLine'}}
        plantings: {type: array, items: {$ref: '#/components/schemas/Occupant'}}
        cells: {type: array, items: {$ref: '#/components/schemas/CellView'}}
    ZoneView:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        plantings: {type: array, items: {$ref: '#/components/schemas/Occupant'}}
        shelves: {type: array, items: {$ref: '#/components/schemas/ShelfView'}}
    Locations:
      type: object
      description: 'The location tree with what each place holds now: zone- and shelf-level plantings and each cell''s occupant.'
      required: [zones, cell_count, occupied_cells, active_plantings, server_time]
      properties:
        zones: {type: array, items: {$ref: '#/components/schemas/ZoneView'}}
        cell_count: {type: integer}
        occupied_cells: {type: integer}
        active_plantings: {type: integer}
        server_time: {type: string, format: date-time}
    Tenure:
      type: object
      description: 'One planting''s time in a cell; until null while it is there.'
      required: [planting_id, crop, since]
      properties:
        planting_id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        since: {type: string, format: date-time}
        until: {type: [string, 'null'], format: date-time}
        count: {type: [integer, 'null']}
    PositionHistory:
      type: object
      description: 'Who has held one cell: the current occupant first, then the rest newest first.'
      required: [label, zone, shelf, items]
      properties:
        label: {type: string}
        zone: {type: string}
        shelf: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/Tenure'}}
    CatalogEntry:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        category: {type: [string, 'null']}
    Catalog:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
    ResolvedPlace:
      type: object
      required: [zone]
      properties:
        zone: {type: string}
        shelf: {type: [string, 'null']}
        cell: {type: [string, 'null']}
    Conflict:
      type: object
      required: [cell, planting_id, crop, since]
      properties:
        cell: {type: string}
        planting_id: {type: integer}
        crop: {type: string}
        since: {type: string, format: date-time}
        until: {type: [string, 'null'], format: date-time}
    Resolution:
      type: object
      description: What a place text means and what holds those cells at at. Nothing is written.
      required: [places, cells, where, at]
      properties:
        places: {type: array, items: {$ref: '#/components/schemas/ResolvedPlace'}}
        cells: {type: array, items: {type: string}}
        where: {type: string}
        at: {type: string, format: date-time}
        conflicts: {type: array, items: {$ref: '#/components/schemas/Conflict'}}
    PlantingCreate:
      type: object
      description: 'A new planting (API-CROP-07, MCP record_planting). crop is a catalog slug or name (lettuce, basil) or a free name; count is the number of plants, unknown when omitted; count_per_cell is stored on each cell''s occupancy. planted_at defaults to now; a date means local midnight. replace ends or trims whatever holds a requested cell instead of refusing with position_occupied.'
      additionalProperties: false
      required: [crop, positions]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        crop: {type: string, maxLength: 200, minLength: 1}
        variety: {type: [string, 'null'], maxLength: 200}
        positions: {type: array, items: {type: string}, maxItems: 40, minItems: 1}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        count_per_cell: {type: [integer, 'null'], maximum: 1000, minimum: 0}
        planted_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        stage: {type: [string, 'null'], enum: [seed, germination, seedling, vegetative, flowering, fruiting, harvest, cleared, null]}
        notes: {type: [string, 'null'], maxLength: 2000}
        replace: {type: boolean, default: false}
    PlantingMove:
      type: object
      description: 'Move a planting (API-CROP-08, MCP move_planting): from_positions (default: everywhere it is now) close at moved_at and to_positions open then. Both ranges stay in history.'
      additionalProperties: false
      required: [to_positions]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        to_positions: {type: array, items: {type: string}, maxItems: 40, minItems: 1}
        from_positions: {anyOf: [{type: array, items: {type: string}, maxItems: 40, minItems: 1}, {type: 'null'}]}
        moved_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        replace: {type: boolean, default: false}
    PlantingHarvest:
      type: object
      description: 'Record a harvest (API-CROP-09, MCP harvest_planting). Partial by default: the planting stays. Cells in positions are cleared; final ends the planting as harvested.'
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        weight_kg: {type: [number, 'null'], maximum: 10000, minimum: 0}
        positions: {anyOf: [{type: array, items: {type: string}, maxItems: 40, minItems: 1}, {type: 'null'}]}
        final: {type: boolean, default: false}
        harvested_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        notes: {type: [string, 'null'], maxLength: 2000}
    PlantingEnd:
      type: object
      description: 'End a planting without a harvest (API-CROP-10, MCP remove_planting): every open place closes at at.'
      additionalProperties: false
      required: [end_reason]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        end_reason: {type: string, enum: [failed, removed, reconciled]}
        at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        note: {type: [string, 'null'], maxLength: 2000}
    PlantingPatch:
      type: object
      description: 'Edit a planting''s record (API-CROP-11): only the fields sent change. count null means unknown.'
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        variety: {type: [string, 'null'], maxLength: 200}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        stage: {type: [string, 'null'], enum: [seed, germination, seedling, vegetative, flowering, fruiting, harvest, cleared, null]}
        notes: {type: [string, 'null'], maxLength: 2000}
        expected_harvest: {type: [string, 'null'], format: date}
