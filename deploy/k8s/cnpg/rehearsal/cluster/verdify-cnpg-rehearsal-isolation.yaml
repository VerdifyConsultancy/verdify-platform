apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-cnpg-rehearsal-isolation
  namespace: verdify-db-rehearsal
  labels: &id001
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: cnpg-rehearsal
spec:
  podSelector:
    matchLabels: *id001
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels: *id001
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187
  egress:
  - to:
    - podSelector:
        matchLabels: *id001
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 192.168.7.10/32
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-apps-traefik-apps
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - ipBlock:
        cidr: 192.168.30.240/32
    - ipBlock:
        cidr: 192.168.30.31/32
    - ipBlock:
        cidr: 192.168.30.32/32
    - ipBlock:
        cidr: 192.168.30.33/32
    ports:
    - protocol: TCP
      port: 6443
