# S2 actual runtime clients: distinct labels avoid the broad rehearsal server
# policy and historical client policy. NetworkPolicy allows are additive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-s2-runtime-client-only
  namespace: verdify-db-rehearsal
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: cnpg-s2-runtime-qualification
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: verdify
      app.kubernetes.io/component: cnpg-s2-runtime-qualification
      verdify.ai/qualification-target: verdify-cnpg-s2
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: verdify-cnpg-s2
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-s2-runtime-client-ingress
  namespace: verdify-db-rehearsal
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: cnpg-s2-runtime-qualification
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: verdify-cnpg-s2
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: verdify
          app.kubernetes.io/component: cnpg-s2-runtime-qualification
          verdify.ai/qualification-target: verdify-cnpg-s2
    ports:
    - protocol: TCP
      port: 5432
