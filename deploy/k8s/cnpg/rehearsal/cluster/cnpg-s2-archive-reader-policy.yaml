apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-s2-archive-reader-only
  namespace: verdify-db-rehearsal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: verdify
      app.kubernetes.io/component: cnpg-s2-archive-reader
      verdify.ai/qualification-target: verdify-cnpg-s2
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 192.168.7.10/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-apps-traefik-apps
    ports:
    - protocol: TCP
      port: 8443
