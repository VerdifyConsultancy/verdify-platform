# verdify-dev CNPG validation stack (HA-4.1 #243).
#
# Applies the TimescaleDB-on-CNPG cluster into the verdify-dev namespace (absent
# today; create it first). It deploys ALONGSIDE the legacy dev StatefulSet
# `verdify-db` (different object name + different services) — nothing is
# replaced or migrated by this kustomization.
#
# The dev MinIO WAL store, the scheduled base backup and the PITR drill were
# removed on 2026-09-24: MinIO is deprecated estate-wide. A revived WAL/PITR
# drill uses a bucket requested from jvallery/storage-infra on Garage
# (s3-hdd.vallery.net) through the CNPG barman-cloud plugin.
#
# NOT wired into any ArgoCD Application yet: this is a dev-first validation
# fixture applied manually (kubectl apply -k) for the failover drill.
# Promotion to a managed App + the prod variant is #244/#245.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: verdify-dev

resources:
  - 10-cluster.yaml
  - 20-networkpolicy.yaml
