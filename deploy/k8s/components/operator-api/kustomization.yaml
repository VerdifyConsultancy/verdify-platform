apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# verdify-operator-api (#1148): the dashboard's private API, a second Deployment of the verdify-api image
# (`uvicorn operator_api:app` on 8090, api/operator_api.py) behind a ClusterIP Service with no IngressRoute.
# api.verdify.ai forwards every path to the public app on 8080, so no operator path may live there.
#
# Not listed in deploy/k8s/overlays/prod: R1's wiring PR (#1143) adds the component line, operator-api in
# allow-db-from-app and the dashboard login's bootstrap entry, once Secrets verdify-operator-api and
# verdify-dashboard-runtime-db exist in verdify-prod (deploy/k8s/SECRETS.md). Rendered there, the overlay's
# `images:` entry and release-pins.yaml pin the image to the verdify-api release digest, and egress-deny-management
# covers the pod (operator-api is not in its NotIn list), so no egress policy is declared here.
# tests/test_operator_api_manifests.py checks this render, alone and wired into a copy of the overlay.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
