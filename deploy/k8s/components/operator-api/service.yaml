# ClusterIP only, on 8090. There is no IngressRoute and no route on api.verdify.ai: the BFF calls
# http://verdify-operator-api.verdify-prod.svc:8090.
apiVersion: v1
kind: Service
metadata:
  name: verdify-operator-api
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: operator-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: operator-api
  ports:
    - name: http
      port: 8090
      targetPort: http
