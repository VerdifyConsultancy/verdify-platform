apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-restore-rehearsal
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-restore-rehearsal
  annotations:
    # This hook rehearses schema compatibility and effective ACLs for the
    # disposable non-superuser role. It is not a production-superuser denial
    # proof and it does not contact the production database.
    argocd.argoproj.io/hook: PreSync
    # Keep the successful Job and its pod log as the release evidence. A later
    # deliberate rehearsal replaces it; this one-shot hook must not erase its
    # own proof on success.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: experiment-v2-restore-rehearsal
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: candidate-migration-source
          # Logical transformer key only: the prod overlay renders this to the
          # candidate registry.vallery.net digest before the component is wired.
          image: ghcr.io/verdifyconsultancy/verdify-migrate
          command: ["/bin/sh", "-ec"]
          args:
            - |
              install -d /work/db /work/bin /work/scripts
              cp -R /db/. /work/db/
              cp /usr/local/bin/apply-migrations.sh /work/bin/apply-migrations.sh
              cp /scripts/check_migration_rollback_safety.py /work/scripts/check_migration_rollback_safety.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: candidate-source
              mountPath: /work
      containers:
        - name: restore-and-verify
          image: timescale/timescaledb:2.25.2-pg16@sha256:0af03ecf697825f6ddae76fd275d16bf46007bed6d00eb3d754779cb7db96fa6
          command: ["/bin/bash", "/scripts/rehearse.sh"]
          env:
            - name: PGDATA
              value: /restore/pgdata
            - name: PGHOST
              value: /run/postgresql
            - name: PGPORT
              value: "55432"
            - name: PGUSER
              value: verdify
            - name: PGDATABASE
              value: verdify_rehearsal
            - name: DB_HOST
              value: /run/postgresql
            - name: DB_PORT
              value: "55432"
            - name: DB_NAME
              value: verdify_rehearsal
            - name: DB_USER
              value: verdify
            - name: DB_PASS
              value: unused-local-trust-auth
            - name: VERDIFY_MIGRATIONS_DIR
              value: /work/db/migrations
            - name: VERDIFY_LEDGER_DIR
              value: /work/db/ledger
            - name: VERDIFY_SAFETY_CLASSIFIER
              value: /work/scripts/check_migration_rollback_safety.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: dumps
              mountPath: /backups
              readOnly: true
            - name: candidate-source
              mountPath: /work
              readOnly: true
            - name: restore-data
              mountPath: /restore
            - name: postgres-run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: rehearsal-script
              mountPath: /scripts/rehearse.sh
              subPath: rehearse.sh
              readOnly: true
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: verdify-db-dumps
            readOnly: true
        - name: candidate-source
          emptyDir: {}
        - name: restore-data
          emptyDir:
            sizeLimit: 20Gi
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: rehearsal-script
          configMap:
            name: verdify-experiment-v2-restore-rehearsal
            defaultMode: 0555
