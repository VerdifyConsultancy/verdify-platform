      ledger_exists="$(psql -X -v ON_ERROR_STOP=1 -At -d "${PGDATABASE}" \
        -c "SELECT to_regclass('public.schema_migrations') IS NOT NULL")"
      : > "${destination}"
      if [[ "${ledger_exists}" != "t" ]]; then
        return
      fi
      psql -X -v ON_ERROR_STOP=1 -At -d "${PGDATABASE}" <<'SQL' \
        | LC_ALL=C sort > "${destination}"
    SELECT md5(concat_ws(
             E'\x1f',
             source,
             filename,
             coalesce(seq::text, '<NULL>'),
             coalesce(sha256, '<NULL>'),
             to_char(applied_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'),
             stamp_method,
             coalesce(duration_ms::text, '<NULL>'),
             coalesce(applied_by, '<NULL>')
           ))
      FROM public.schema_migrations;
    SQL
    }

