apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-experiment-v2-restore-rehearsal
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-restore-rehearsal
  annotations:
    # The PreSync Job mounts this script, so the ConfigMap must exist in an
    # earlier hook wave rather than waiting for the normal Sync phase.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
data:
  rehearse.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 077

    # The Alpine postgres image defines postgres as uid 70, while this Job
    # deliberately runs as the shared backup-plane uid 999, which has no passwd
    # entry in the image. initdb requires getpwuid() to resolve the effective
    # uid, so use the image's bundled nss_wrapper — the same mechanism the
    # upstream postgres entrypoint uses to support arbitrary uids.
    if ! getent passwd "$(id -u)" >/dev/null 2>&1; then
      printf 'postgres:x:%s:%s:postgres:/tmp:/bin/sh\n' "$(id -u)" "$(id -g)" > /tmp/nss_passwd
      printf 'postgres:x:%s:\n' "$(id -g)" > /tmp/nss_group
      export LD_PRELOAD=/usr/lib/libnss_wrapper.so
      export NSS_WRAPPER_PASSWD=/tmp/nss_passwd
      export NSS_WRAPPER_GROUP=/tmp/nss_group
    fi

    # The rehearsal container image is Alpine-based: its busybox find has no
    # -printf. Enumerate direct children via the shell glob (same depth bound)
    # and stat each regular non-symlink file for an integer epoch mtime,
    # producing the identical '<epoch> <path>' record contract.
    latest_record="$({
      for candidate in /backups/verdify-*.dump; do
        [ -f "${candidate}" ] && [ ! -L "${candidate}" ] || continue
        printf '%s %s\n' "$(stat -c %Y -- "${candidate}")" "${candidate}"
      done
    } | sort -nr | sed -n '1p')"
    if [[ -z "${latest_record}" ]]; then
      echo "[restore-rehearsal] FATAL: no completed verdify dump is available" >&2
      exit 1
    fi
    dump_path="${latest_record#* }"
    dump_mtime_raw="${latest_record%% *}"
    dump_mtime_seconds="${dump_mtime_raw%%.*}"
    now_seconds="$(date +%s)"
    max_dump_age_seconds=$((26 * 60 * 60))
    if [[ ! "${dump_mtime_seconds}" =~ ^[0-9]+$ ]]; then
      echo "[restore-rehearsal] FATAL: latest dump has an invalid modification time" >&2
      exit 1
    fi
    dump_age_seconds=$((now_seconds - dump_mtime_seconds))
    if (( dump_age_seconds < 0 || dump_age_seconds >= max_dump_age_seconds )); then
      echo "[restore-rehearsal] FATAL: latest dump age must be >=0 and <26h (age=${dump_age_seconds}s)" >&2
      exit 1
    fi
    case "${dump_path}" in
      /backups/verdify-*.dump) ;;
      *)
        echo "[restore-rehearsal] FATAL: resolved dump path escaped the bounded PVC directory" >&2
        exit 1
        ;;
    esac
    dump_name="$(basename -- "${dump_path}")"
    dump_size="$(du -h -- "${dump_path}" | awk '{print $1}')"
    dump_sha256="$(sha256sum -- "${dump_path}" | awk '{print $1}')"
    echo "[restore-rehearsal] source=${dump_name} age=${dump_age_seconds}s size=${dump_size} sha256=${dump_sha256}"

    # Bootstrap the throwaway cluster with verdify as the superuser, matching
    # production CNPG (superuser = db owner = extension owner = verdify). This is
    # what makes migration 217 run as verdify and touch nothing it would not touch
    # in the live forward migration.
    initdb -D "${PGDATA}" --username=verdify --auth-local=trust --auth-host=reject >/dev/null
    pg_ctl -D "${PGDATA}" \
      -o "-k ${PGHOST} -p ${PGPORT} -c listen_addresses=''" \
      -w start >/dev/null
    cleanup() {
      pg_ctl -D "${PGDATA}" -m fast -w stop >/dev/null 2>&1 || true
    }
    trap cleanup EXIT

    psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
    DO $role$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'verdify') THEN
        CREATE ROLE verdify SUPERUSER NOLOGIN;
      END IF;
      -- Production's CNPG cluster superuser IS 'verdify'; the extension, database,
      -- and every object share that one owner. Reproduce that here so migration
      -- 217's owner normalization is a no-op exactly as it is in production
      -- (a local 'postgres'-owned extension would make 217 try to re-own the
      -- extension catalog, which fails or trips its trust assertions).
      ALTER ROLE verdify SUPERUSER;
    END;
    $role$;
    SQL
    # pg_dump carries no cluster-level roles, so any role a LEDGER-STAMPED
    # migration created in production exists in the restored ledger's world view
    # but not in this fresh cluster; replaying only unstamped migrations can then
    # assert roles nothing recreated (observed live: production had stamped
    # 214-216 during an earlier failed sync, so the replay skipped 214 and 217's
    # owner-role assertion failed). Pre-seed the exact role inventory of the
    # stampable candidate migrations with the same idempotent normalization those
    # migrations enforce; when a migration does run, its own bootstrap re-asserts
    # every attribute. A real production restore needs this same step (or
    # pg_dumpall --globals-only) — the DR runbook gap is tracked on the packet.
    psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
    DO $seed$
    DECLARE
      r text;
    BEGIN
      FOREACH r IN ARRAY ARRAY[
          'verdify_experiment_v2_owner',
          'verdify_experiment_shadow_scheduler',
          'verdify_experiment_randomizer',
          'verdify_experiment_lifecycle',
          'verdify_experiment_component_executor',
          'verdify_experiment_outcome_freezer',
          'verdify_experiment_blinded_analyst',
          'verdify_experiment_equipment_source_collector'
      ] LOOP
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
          EXECUTE format('CREATE ROLE %I NOLOGIN', r);
        END IF;
        EXECUTE format('ALTER ROLE %I NOLOGIN NOCREATEDB NOCREATEROLE NOINHERIT NOSUPERUSER NOREPLICATION NOBYPASSRLS', r);
      END LOOP;
      FOREACH r IN ARRAY ARRAY[
          'verdify_experiment_v2_shadow_scheduler_login',
          'verdify_experiment_v2_randomizer_login',
          'verdify_experiment_v2_lifecycle_login',
          'verdify_experiment_v2_component_executor_login',
          'verdify_experiment_v2_outcome_freezer_login',
          'verdify_experiment_v2_equipment_source_collector_login'
      ] LOOP
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
          EXECUTE format('CREATE ROLE %I LOGIN', r);
        END IF;
        EXECUTE format('ALTER ROLE %I LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', r);
      END LOOP;
      -- Role MEMBERSHIPS live in pg_auth_members — cluster state pg_dump cannot
      -- carry either. Reconstruct the exact one-duty-per-login pairings the
      -- stamped candidate migrations establish (GRANT is idempotent).
      GRANT verdify_experiment_shadow_scheduler TO verdify_experiment_v2_shadow_scheduler_login;
      GRANT verdify_experiment_randomizer TO verdify_experiment_v2_randomizer_login;
      GRANT verdify_experiment_lifecycle TO verdify_experiment_v2_lifecycle_login;
      GRANT verdify_experiment_component_executor TO verdify_experiment_v2_component_executor_login;
      GRANT verdify_experiment_outcome_freezer TO verdify_experiment_v2_outcome_freezer_login;
      GRANT verdify_experiment_equipment_source_collector TO verdify_experiment_v2_equipment_source_collector_login;
    END;
    $seed$;
    SQL
    createdb -O verdify "${PGDATABASE}"
    # Create the extension AS verdify (SET ROLE, verdify is superuser) so its
    # ~700 catalog/config/cache/internal tables are owned by verdify, matching
    # production. Otherwise they are owned by the local bootstrap superuser and
    # 217's runtime-boundary trust assertion flags them as untrusted-owner.
    psql -X -v ON_ERROR_STOP=1 -d "${PGDATABASE}" \
      -c 'SET ROLE verdify; CREATE EXTENSION IF NOT EXISTS timescaledb;' >/dev/null
    psql -X -v ON_ERROR_STOP=1 -d "${PGDATABASE}" \
      -c 'SELECT timescaledb_pre_restore()' >/dev/null
    # pg_restore hardens each session with an empty search_path (CVE-2018-1058),
    # so the dump's REFRESH MATERIALIZED VIEW entries fail on any matview whose
    # defining functions call other public functions unqualified (live example:
    # mv_band_curve -> fn_zone_vpd_targets -> fn_current_season()). Restore the
    # TOC without matview DATA entries, then refresh every matview afterward
    # under a normal search_path — the same sequencing a real production restore
    # requires. Refresh iterates to a fixed point so inter-matview dependency
    # order never matters.
    pg_restore -l "${dump_path}" > /tmp/restore.toc
    grep -v 'MATERIALIZED VIEW DATA' /tmp/restore.toc > /tmp/restore.toc.filtered
    # Restore WITH owners and privileges: ledger-stamped migrations are skipped by
    # the replay, so their REVOKE/GRANT posture exists only in the dump's ACLs —
    # dropping them (--no-privileges) leaves every function at the default
    # PUBLIC-execute ACL and 217's posture assertions rightly fail. Ownership and
    # grants need every referenced role to exist first; pg_dump carries no roles,
    # so pre-create (NOLOGIN, create-if-missing only) every role the archive TOC
    # references as an owner or ACL grantee. Managed roles are normalized by the
    # candidate migrations when they run.
    awk '$1 ~ /^[0-9]+;$/ { print $NF }' /tmp/restore.toc | sort -u > /tmp/roles.owners
    grep -E '^[0-9]+; .* ACL ' /tmp/restore.toc > /tmp/restore.toc.acl || true
    : > /tmp/roles.grantees
    if [ -s /tmp/restore.toc.acl ]; then
      pg_restore --use-list=/tmp/restore.toc.acl -f /tmp/acl.sql "${dump_path}"
      grep -oE '(TO|FROM) "?[A-Za-z_][A-Za-z0-9_]*"?' /tmp/acl.sql \
        | awk '{print $2}' | tr -d '"' | sort -u > /tmp/roles.grantees
    fi
    sort -u /tmp/roles.owners /tmp/roles.grantees | while read -r referenced_role; do
      [ -n "${referenced_role}" ] || continue
      case "${referenced_role}" in
        PUBLIC|postgres|CURRENT_USER|SESSION_USER|CURRENT_ROLE|GROUP) continue ;;
      esac
      psql -X -v ON_ERROR_STOP=1 -d postgres \
        -v role="${referenced_role}" <<'ROLESQL'
    SELECT format('CREATE ROLE %I NOLOGIN', :'role')
     WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role')
    \gexec
    ROLESQL
    done
    # The candidate migrations' ownership-normalization passes key off the
    # DATABASE owner, while the restored objects carry production's true owners.
    # A postgres-owned rehearsal database would make migration 217 try to re-own
    # every restored relation — including TimescaleDB compressed chunks, which
    # refuse a direct ALTER ... OWNER. Mirror production's owner (the archive's
    # schema-public owner; baseline fallback) so the normalization no-ops exactly
    # as it does in production.
    dump_db_owner="$(awk '$1 ~ /^[0-9]+;$/ && $4 == "SCHEMA" && $6 == "public" { print $NF }' /tmp/restore.toc | head -n1)"
    [ -n "${dump_db_owner}" ] || dump_db_owner=verdify
    psql -X -v ON_ERROR_STOP=1 -d postgres \
      -c "$(printf 'ALTER DATABASE %s OWNER TO %s' "\"${PGDATABASE}\"" "\"${dump_db_owner}\"")"
    echo "[restore-rehearsal] rehearsal database owner mirrored to ${dump_db_owner}"
    # Restore AS verdify (SET ROLE via --role) so every restored object —
    # including TimescaleDB-internal compressed chunks that pg_restore creates
    # rather than copies with an explicit owner — is owned by verdify, matching
    # production (all internal chunks are datdba-owned there). Otherwise those
    # chunks are owned by the connecting superuser and migration 217's owner
    # normalization tries a direct ALTER TABLE on them (unsupported on chunks).
    pg_restore --exit-on-error --role verdify \
      --use-list=/tmp/restore.toc.filtered \
      --dbname="${PGDATABASE}" "${dump_path}"
    psql -X -v ON_ERROR_STOP=1 -d "${PGDATABASE}" \
      -c 'SELECT timescaledb_post_restore()' >/dev/null
    matviews_remaining="$(psql -X -At -d "${PGDATABASE}" \
      -c "SELECT count(*) FROM pg_matviews WHERE NOT ispopulated")"
    refresh_rounds=0
    while [ "${matviews_remaining}" -gt 0 ]; do
      refresh_rounds=$((refresh_rounds + 1))
      if [ "${refresh_rounds}" -gt 10 ]; then
        echo "[restore-rehearsal] FATAL: matview refresh did not reach a fixed point" >&2
        exit 1
      fi
      progressed=0
      while IFS='|' read -r schema name; do
        [ -n "${name}" ] || continue
        if psql -X -v ON_ERROR_STOP=1 -d "${PGDATABASE}" \
             -c "REFRESH MATERIALIZED VIEW \"${schema}\".\"${name}\"" >/dev/null 2>&1; then
          progressed=1
        fi
      done <<MATVIEWS
    $(psql -X -At -d "${PGDATABASE}" -c "SELECT schemaname, matviewname FROM pg_matviews WHERE NOT ispopulated" | tr '|' '|')
    MATVIEWS
      matviews_remaining="$(psql -X -At -d "${PGDATABASE}" \
        -c "SELECT count(*) FROM pg_matviews WHERE NOT ispopulated")"
      if [ "${progressed}" -eq 0 ] && [ "${matviews_remaining}" -gt 0 ]; then
        echo "[restore-rehearsal] FATAL: ${matviews_remaining} materialized view(s) cannot be refreshed" >&2
        exit 1
      fi
    done
    echo "[restore-rehearsal] recent production dump restored; all matviews refreshed (rounds=${refresh_rounds})"

    candidate_object_snapshot() {
      psql -X -v ON_ERROR_STOP=1 -At -d "${PGDATABASE}" <<'SQL'
    WITH candidate_relations AS (
      SELECT relation.oid
        FROM pg_class relation
        JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
       WHERE namespace.nspname = 'public'
         AND (
           relation.relname LIKE 'experiment_v2\_%' ESCAPE '\'
           OR relation.relname LIKE 'v_experiment_v2\_%' ESCAPE '\'
           OR relation.relname LIKE 'v_runtime\_%\_write' ESCAPE '\'
           OR relation.relname IN (
             'climate',
             'climate_action_log',
             'diagnostics',
             'energy',
             'equipment_state',
             'esp32_logs',
             'forecast_deviation_log',
             'gpu_power',
             'infra_cpu',
             'override_events',
             'setpoint_changes',
             'setpoint_clamps',
             'setpoint_plan',
             'setpoint_snapshot',
             'system_state',
             'weather_forecast',
             'forecast_action_rules',
             'forecast_action_log',
             'forecast_action_log_id_seq',
             'v_greenhouse_now',
             'v_system_health_score',
             'v_relay_stuck',
             'v_climate_merged',
             'mv_band_curve',
             'v_slack_crop_tasks_due',
             'slack_alert_runbooks',
             'dli_validity_intervals',
             'equipment_counter_samples',
             'equipment_direct_state_snapshots',
             'equipment_state_source_receipts',
             'runtime_ordinary_login_attestation_receipts',
             'planner_trigger_ledger',
             'v_planner_trigger_health'
           )
         )
    ), candidate_identity AS (
      SELECT format(
               'relation|%s|%s|%s|%s|acl=%s|options=%s|rls=%s|force_rls=%s|populated=%s|view=%s',
               relation.oid,
               relation.relname,
               relation.relkind,
               relation.relowner,
               coalesce((
                 SELECT string_agg(
                          format('%s:%s:%s:%s', acl.grantor, acl.grantee,
                                 acl.privilege_type, acl.is_grantable),
                          ',' ORDER BY acl.grantor, acl.grantee,
                                       acl.privilege_type, acl.is_grantable)
                   FROM aclexplode(relation.relacl) acl
               ), '<NULL>'),
               coalesce((
                 SELECT string_agg(option, ',' ORDER BY option)
                   FROM unnest(relation.reloptions) option
               ), '<NULL>'),
               relation.relrowsecurity,
               relation.relforcerowsecurity,
               relation.relispopulated,
               CASE WHEN relation.relkind IN ('v', 'm')
                    THEN pg_get_viewdef(relation.oid, true)
                    ELSE '<NOT-VIEW>'
                END
             ) AS identity
        FROM pg_class relation
       WHERE relation.oid IN (SELECT oid FROM candidate_relations)
      UNION ALL
      SELECT format(
               'column|%s|%s|%s|%s|%s|default=%s|acl=%s',
               attribute.attrelid,
               attribute.attnum,
               attribute.attname,
               format_type(attribute.atttypid, attribute.atttypmod),
               attribute.attnotnull,
               coalesce(pg_get_expr(default_value.adbin, default_value.adrelid), '<NULL>'),
               coalesce((
                 SELECT string_agg(
                          format('%s:%s:%s:%s', acl.grantor, acl.grantee,
                                 acl.privilege_type, acl.is_grantable),
                          ',' ORDER BY acl.grantor, acl.grantee,
                                       acl.privilege_type, acl.is_grantable)
                   FROM aclexplode(attribute.attacl) acl
               ), '<NULL>')
             )
        FROM pg_attribute attribute
        LEFT JOIN pg_attrdef default_value
          ON default_value.adrelid = attribute.attrelid
         AND default_value.adnum = attribute.attnum
       WHERE attribute.attrelid IN (SELECT oid FROM candidate_relations)
         AND attribute.attnum > 0
         AND NOT attribute.attisdropped
      UNION ALL
      SELECT format(
               'constraint|%s|%s|%s',
               constraint_row.conrelid,
               constraint_row.conname,
               pg_get_constraintdef(constraint_row.oid, true)
             )
        FROM pg_constraint constraint_row
       WHERE constraint_row.conrelid IN (SELECT oid FROM candidate_relations)
      UNION ALL
      SELECT format(
               'trigger|%s|%s|enabled=%s|definition=%s',
               trigger_row.tgrelid,
               trigger_row.tgname,
               trigger_row.tgenabled,
               pg_get_triggerdef(trigger_row.oid, true)
             )
        FROM pg_trigger trigger_row
       WHERE trigger_row.tgrelid IN (SELECT oid FROM candidate_relations)
         AND NOT trigger_row.tgisinternal
      UNION ALL
      SELECT format(
               'rule|%s|%s|event=%s|enabled=%s|instead=%s|definition=%s',
               rewrite_row.ev_class,
               rewrite_row.rulename,
               rewrite_row.ev_type,
               rewrite_row.ev_enabled,
               rewrite_row.is_instead,
               pg_get_ruledef(rewrite_row.oid, true)
             )
        FROM pg_rewrite rewrite_row
       WHERE rewrite_row.ev_class IN (SELECT oid FROM candidate_relations)
      UNION ALL
      SELECT format(
               'policy|%s|%s|command=%s|permissive=%s|roles=%s|using=%s|check=%s',
               policy_row.polrelid,
               policy_row.polname,
               policy_row.polcmd,
               policy_row.polpermissive,
               policy_row.polroles::text,
               coalesce(pg_get_expr(policy_row.polqual,
                                    policy_row.polrelid, true), '<NULL>'),
               coalesce(pg_get_expr(policy_row.polwithcheck,
                                    policy_row.polrelid, true), '<NULL>')
             )
        FROM pg_policy policy_row
       WHERE policy_row.polrelid IN (SELECT oid FROM candidate_relations)
      UNION ALL
      SELECT format(
               'function|%s|%s|owner=%s|definition=%s|acl=%s',
               procedure_row.oid,
               procedure_row.oid::regprocedure,
               procedure_row.proowner,
               md5(pg_get_functiondef(procedure_row.oid)),
               coalesce(procedure_row.proacl::text, '<NULL>')
             )
        FROM pg_proc procedure_row
        JOIN pg_namespace namespace ON namespace.oid = procedure_row.pronamespace
       WHERE namespace.nspname = 'public'
         AND (
           procedure_row.proname LIKE 'fn_experiment_v2\_%' ESCAPE '\'
           OR procedure_row.proname LIKE 'fn_record_equipment\_%' ESCAPE '\'
           OR procedure_row.proname LIKE 'fn_runtime\_%' ESCAPE '\'
           OR procedure_row.proname =
              'normalize_planner_trigger_terminal_state'
           OR procedure_row.oid = ANY (ARRAY[
             'public.fn_band_setpoints(timestamptz)'::regprocedure,
             'public.fn_band_trace(timestamptz,timestamptz,text)'::regprocedure,
             'public.fn_band_setpoint_provenance(timestamptz,text)'::regprocedure,
             'public.fn_center_band_setpoints(timestamptz)'::regprocedure,
             'public.fn_compliance_pct(interval)'::regprocedure,
             'public.fn_compliance_v2(interval)'::regprocedure,
             'public.fn_crop_band_value(text,text,timestamptz,text,text,text)'::regprocedure,
             'public.fn_current_season()'::regprocedure,
             'public.fn_diurnal_interp(timestamptz,double precision,double precision)'::regprocedure,
             'public.fn_dli_validity(timestamptz,text)'::regprocedure,
             'public.fn_dli_proxy_lesson_invalid(text,text)'::regprocedure,
             'public.fn_dli_source_invalid_reason(double precision)'::regprocedure,
             'public.fn_equip_at(text,timestamptz)'::regprocedure,
             'public.fn_equipment_health()'::regprocedure,
             'public.fn_forecast_correction(text,numeric)'::regprocedure,
             'public.fn_grade_credit(numeric,numeric,numeric,numeric,numeric)'::regprocedure,
             'public.fn_heat_staging_inversion()'::regprocedure,
             'public.fn_hermite_phase(double precision,double precision,double precision,double precision,double precision,double precision)'::regprocedure,
             'public.fn_house_vpd_control_band(timestamptz)'::regprocedure,
             'public.fn_lighting_circuit_policy(timestamptz,text)'::regprocedure,
             'public.fn_lighting_lux_threshold_recommendation(timestamptz,text,interval)'::regprocedure,
             'public.fn_lighting_minutes_policy(timestamptz,text)'::regprocedure,
             'public.fn_lighting_policy(timestamptz,text)'::regprocedure,
             'public.fn_plan_transition_audit(text,interval,interval)'::regprocedure,
             'public.fn_planner_scorecard(date)'::regprocedure,
             'public.fn_setpoint_at(text,timestamptz)'::regprocedure,
             'public.fn_setpoint_at(text,text,timestamptz)'::regprocedure,
             'public.fn_solar_altitude(timestamptz)'::regprocedure,
             'public.fn_solar_phase(timestamptz)'::regprocedure,
             'public.fn_solar_sunrise_hour(timestamptz)'::regprocedure,
             'public.fn_solar_sunset_hour(timestamptz)'::regprocedure,
             'public.fn_system_health()'::regprocedure,
             'public.fn_zone_vpd_targets(timestamptz)'::regprocedure,
             'public.fn_zone_band(text,timestamptz,text)'::regprocedure,
             'public.fn_zone_band_grade(timestamptz,timestamptz,text)'::regprocedure
           ])
         )
      UNION ALL
      SELECT format(
               'type|%s|%s|%s|%s',
               type_row.oid,
               type_row.typname,
               type_row.typtype,
               type_row.typowner
             )
        FROM pg_type type_row
        JOIN pg_namespace namespace ON namespace.oid = type_row.typnamespace
       WHERE namespace.nspname = 'public'
         AND type_row.typname LIKE 'experiment_v2\_%' ESCAPE '\'
      UNION ALL
      SELECT format(
               'role|%s|%s|%s|%s|%s|%s|%s|%s|%s|config=%s',
               role_row.oid,
               role_row.rolname,
               role_row.rolsuper,
               role_row.rolinherit,
               role_row.rolcreaterole,
               role_row.rolcreatedb,
               role_row.rolcanlogin,
               role_row.rolreplication,
               role_row.rolbypassrls,
               coalesce((
                 SELECT string_agg(setting, ',' ORDER BY setting)
                   FROM unnest(role_row.rolconfig) setting
               ), '<NULL>')
             )
       FROM pg_roles role_row
       WHERE role_row.rolname LIKE 'verdify_experiment\_%' ESCAPE '\'
          OR role_row.rolname IN (
               'verdify_api_runtime',
               'verdify_ingestor_runtime',
               'verdify_api_runtime_login',
               'verdify_ingestor_runtime_login'
             )
      UNION ALL
      SELECT format(
               'membership|%s|%s|admin=%s|inherit=%s|set=%s|grantor=%s',
               duty_role.rolname,
               member_role.rolname,
               membership.admin_option,
               membership.inherit_option,
               membership.set_option,
               grantor_role.rolname
             )
        FROM pg_auth_members membership
        JOIN pg_roles duty_role ON duty_role.oid = membership.roleid
        JOIN pg_roles member_role ON member_role.oid = membership.member
        JOIN pg_roles grantor_role ON grantor_role.oid = membership.grantor
       WHERE duty_role.rolname LIKE 'verdify_experiment\_%' ESCAPE '\'
          OR member_role.rolname LIKE 'verdify_experiment\_%' ESCAPE '\'
          OR duty_role.rolname IN (
               'verdify_api_runtime',
               'verdify_ingestor_runtime',
               'verdify_api_runtime_login',
               'verdify_ingestor_runtime_login'
             )
          OR member_role.rolname IN (
               'verdify_api_runtime',
               'verdify_ingestor_runtime',
               'verdify_api_runtime_login',
               'verdify_ingestor_runtime_login'
             )
      UNION ALL
      SELECT format(
               'public-schema|%s|%s',
               namespace.nspowner,
               coalesce(namespace.nspacl::text, '<NULL>')
             )
        FROM pg_namespace namespace
       WHERE namespace.nspname = 'public'
    )
    SELECT md5(coalesce(string_agg(identity, E'\n' ORDER BY identity), ''))
      FROM candidate_identity;
    SQL
    }

    ledger_snapshot() {
      local ledger_exists
      ledger_exists="$(psql -X -v ON_ERROR_STOP=1 -At -d "${PGDATABASE}" \
        -c "SELECT to_regclass('public.schema_migrations') IS NOT NULL")"
      if [[ "${ledger_exists}" != "t" ]]; then
        echo '0:d41d8cd98f00b204e9800998ecf8427e'
        return
      fi
      psql -X -v ON_ERROR_STOP=1 -At -d "${PGDATABASE}" <<'SQL'
    SELECT count(*)::text || ':' || md5(coalesce(string_agg(
             concat_ws(
               E'\x1f',
               source,
               filename,
               coalesce(seq::text, '<NULL>'),
               coalesce(sha256, '<NULL>'),
               to_char(applied_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'),
               stamp_method,
               coalesce(duration_ms::text, '<NULL>'),
               coalesce(applied_by, '<NULL>')
             ),
             E'\n' ORDER BY source, filename
           ), ''))
      FROM public.schema_migrations;
    SQL
    }

    write_ledger_row_snapshot() {
