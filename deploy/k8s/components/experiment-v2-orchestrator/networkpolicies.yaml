# All three pods are ingress-dark and can reach only DNS + the in-namespace DB.
# Selector alone receives TCP/443 egress for the official OpenAI endpoint.
# Kubernetes NetworkPolicy cannot express an FQDN, so the process independently
# locks api.openai.com and rejects non-global DNS answers before connecting.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-lifecycle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-lifecycle
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-selector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-selector
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
            # The component replacement expands cidr to public IPv4 because
            # NetworkPolicy cannot name api.openai.com. Keep private, device,
            # loopback, link-local, benchmark, documentation, and multicast
            # ranges unreachable even if application/DNS validation regresses.
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-freezer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-freezer
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
---
# The namespace DB has default-deny ingress in production. This component owns
# its narrow reciprocal rule so removing the component removes its DB reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-experiment-v2-orchestrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - experiment-v2-lifecycle
                  - experiment-v2-selector
                  - experiment-v2-freezer
      ports:
        - {protocol: TCP, port: 5432}
