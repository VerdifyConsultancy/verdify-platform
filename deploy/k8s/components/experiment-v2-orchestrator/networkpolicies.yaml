# All three pods are ingress-dark and can reach only DNS + the in-namespace DB.
# Selector alone receives one additional exact single-IP TCP/443 rule injected
# from the component ConfigMap. No policy contains a device-subnet destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-lifecycle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-lifecycle
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-selector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-selector
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiment-v2-freezer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-freezer
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db
      ports:
        - {protocol: TCP, port: 5432}
---
# The namespace DB has default-deny ingress in production. This component owns
# its narrow reciprocal rule so removing the component removes its DB reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-experiment-v2-orchestrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - experiment-v2-lifecycle
                  - experiment-v2-selector
                  - experiment-v2-freezer
      ports:
        - {protocol: TCP, port: 5432}
