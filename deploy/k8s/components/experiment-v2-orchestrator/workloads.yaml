          readinessProbe:
            exec:
              command: ["python", "-m", "experiment_orchestrator.readiness", "check"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: selector-identity
              mountPath: /etc/verdify/experiment-v2-selector
              readOnly: true
            - name: runtime
              mountPath: /run/verdify
      volumes:
        - name: selector-identity
          configMap:
            name: verdify-experiment-v2-selector-identity
            optional: true
        - name: runtime
          emptyDir: {}
---
