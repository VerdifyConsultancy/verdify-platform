# One image, three separately attested non-device duties. Each optional Secret
# is named for exactly one login; absence leaves that worker non-actuating but,
# when capability is enabled, intentionally unready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-v2-lifecycle
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-lifecycle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: experiment-v2-lifecycle
  template:
    metadata:
      annotations:
        verdify.io/config-revision: "e7db51a9906e"
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: experiment-v2-lifecycle
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifecycle
          # Logical transformer key. The prod overlay rewrites this to the
          # exact registry.vallery.net digest produced by fleet Kaniko.
          image: ghcr.io/verdifyconsultancy/verdify-experiment-v2-orchestrator
          args: ["--mode", "lifecycle"]
          envFrom:
            - configMapRef:
                name: verdify-config
                optional: true
            - configMapRef:
                name: experiment-v2-orchestrator-config
          env:
            - name: VERDIFY_EXPERIMENT_SHADOW_SCHEDULER_DB_USER
              value: verdify_experiment_v2_shadow_scheduler_login
            - name: VERDIFY_EXPERIMENT_SHADOW_SCHEDULER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-experiment-v2-shadow-scheduler-db
                  key: password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          # Feature-off publishes Ready immediately. Enabled workers become
          # Ready only after attestation plus a successful server cycle and go
          # unready after three consecutive failures or a stale heartbeat.
          # Deliberately no liveness probe: a DB outage must not cause restarts.
          readinessProbe:
            exec:
              command: ["python", "-m", "experiment_orchestrator.readiness", "check"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: lifecycle-plan
              mountPath: /etc/verdify/experiment-v2-lifecycle
              readOnly: true
            - name: runtime
              mountPath: /run/verdify
      volumes:
        - name: lifecycle-plan
          configMap:
            name: verdify-experiment-v2-lifecycle-plan
            optional: true
        - name: runtime
          emptyDir: {}
---
apiVersion: apps/v1
