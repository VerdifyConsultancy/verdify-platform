      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: experiment-v2-selector
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: selector
          image: ghcr.io/verdifyconsultancy/verdify-experiment-v2-orchestrator
          args: ["--mode", "selector"]
          envFrom:
            - configMapRef:
                name: verdify-config
                optional: true
            - configMapRef:
                name: experiment-v2-orchestrator-config
          env:
            - name: VERDIFY_EXPERIMENT_RANDOMIZER_DB_USER
              value: verdify_experiment_v2_randomizer_login
            - name: VERDIFY_EXPERIMENT_RANDOMIZER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-experiment-v2-randomizer-db
                  key: password
