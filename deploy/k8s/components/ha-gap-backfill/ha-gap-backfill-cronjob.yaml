# Verdify HA gap backfill reconciler.
#
# Read path: Home Assistant recorder history + Verdify DB SELECT.
# Write path: missing telemetry rows only; no ESP32/HA service calls, no device
# commands, and no planner/action synthesis.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-ha-gap-backfill
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: ha-gap-backfill
spec:
  # Hourly: DB-first gap detection is cheap; HA history is queried only when a
  # gap exists. Full historical reconciliation is a manual script mode.
  schedule: "23 * * * *"
  # Phase-one rollout gate. While #382 leaves state on emptyDir, the gated
  # Recreate must first prove the OLD pod's spool empty. Then the paired ingestor
  # must pass explicit mode-specific readiness on the exact reviewed digest;
  # that includes an empty current-pod spool. Only a separate reviewed change
  # may set this false for natural-cadence proof.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: ha-gap-backfill
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: ha-gap-backfill
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
            - name: ghcr-jvallery-readonly
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backfill
              # Reuse the exact ingestor runtime for asyncpg + verdify_schemas +
              # entity_map + the shared climate-spool write fence. The mounted
              # script fails closed on an older image. Pin both resources to the
              # same reviewed digest while this CronJob remains suspended; roll
              # and prove the singleton Ready before a later gated unsuspend.
              image: ghcr.io/verdifyconsultancy/verdify-ingestor
              command:
                - python
                - /opt/verdify-ha-gap-backfill/backfill-ha-gaps.py
              args:
                - --apply
                - --lookback-days=30
                - --max-gap-minutes=10
                - --max-backfill-minutes=720
                - --max-windows=12
                # Sparse equipment/system transitions have no sample cadence
                # from which to infer gaps. Always reconcile one overlapping
                # natural-cadence tail so events cannot fall between runs.
                - --event-reconcile-minutes=240
                # Bounded HA Recorder history policy (#575). The 1200s fetch
                # budget leaves 600s inside activeDeadlineSeconds for DB work
                # and cleanup; one timeout retry precedes adaptive splitting.
                # Body and decoded-point ceilings bound in-memory accumulation.
                - --history-request-timeout-seconds=60
                - --history-transport-retries=1
                - --history-retry-backoff-seconds=2
                - --history-request-max-minutes=60
                - --history-request-min-minutes=5
                - --history-max-requests=512
                - --history-fetch-budget-seconds=1200
                - --history-max-split-depth=12
                - --history-max-points=250000
                - --history-response-max-bytes=33554432
                # Bound the shared advisory-fence section. The live ingestor
                # uses a non-blocking try-lock and spools locally instead of
                # waiting behind a history repair.
                - --write-transaction-timeout-seconds=30
              envFrom:
                - configMapRef:
                    name: verdify-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
                - name: HA_TOKEN_FILE
                  value: /mnt/agents/shared/credentials/ha_token.txt
                - name: PYTHONPATH
                  value: /app/ingestor:/app
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: script
                  mountPath: /opt/verdify-ha-gap-backfill
                  readOnly: true
                - name: ha-token
                  mountPath: /mnt/agents/shared/credentials
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 768Mi
          volumes:
            - name: script
              configMap:
                name: verdify-ha-gap-backfill-script
                defaultMode: 0555
            - name: ha-token
              secret:
                secretName: verdify-ha-token
                items:
                  - key: ha_token.txt
                    path: ha_token.txt
            - name: tmp
              emptyDir: {}
---
# The base namespace default-denies DB ingress and only lists app components in
# allow-db-from-app. This job is a separate DB client, so it gets a narrow
# component-scoped ingress allow to verdify-db:5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-ha-gap-backfill
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: ha-gap-backfill
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ha-gap-backfill
      ports:
        - protocol: TCP
          port: 5432
