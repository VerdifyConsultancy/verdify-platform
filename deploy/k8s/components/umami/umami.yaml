# Verdify Umami analytics (analytics.verdify.ai) — residual web tier (#130 M6.2 /
# #88 Phase 4). Ported from docker-compose.yml:256 (`umami-db`) + :274 (`umami`).
#
# STATE (#130 MIGRATE class): umami_db_data:/var/lib/postgresql/data is the Umami
# Postgres store (the analytics event history + the share token referenced by the
# analytics.verdify.ai/ -> /share/dceaeb6aa6d60a01 redirect). It is a SEPARATE
# Postgres from verdify-db, is NOT in the verdify pg_dump, and NOT in
# verdify-vault — so it is a MIGRATE item. It lands on its OWN StatefulSet PVC on
# the volume1 'synology-iscsi-ssd' StorageClass. Restore method (pg_dump of the
# umami DB -> pg_restore into this StatefulSet) is documented in
# docs/runbooks/iris-state-preservation.md.
#
# WHY A KUSTOMIZE COMPONENT (not a base resource): #5 hard rule — anything added
# to deploy/k8s/base renders into overlays/staging, which the live
# verdify-local-staging ArgoCD app syncs; we must not add a new workload to
# staging. DESIGNED-FOR overlays/prod ONLY (analytics.verdify.ai is a prod host).
# NO device path — pure web-analytics tier.
#
# NOT YET WIRED into overlays/prod (the prod-promote diff guard, #82, treats a
# prod-overlay edit as a digest-only promotion). The overlay `components:` entry +
# its placeholder Secret land at the human-gated cutover as a separate follow-on,
# same posture as db/restore-job.yaml. See iris-state-preservation.md §10.
#
# IMAGES: postgres:16-alpine + ghcr.io/umami-software/umami are UPSTREAM. Compose
# pinned umami to the MUTABLE :postgresql-latest tag; that tag is carried forward
# here (a real @sha256 digest must be resolved + pinned by laptop-root at apply
# time so a reconcile never silently rolls the schema-bearing app — see the
# runbook's "pin the residual upstream images" note). Neither is a verdify-*
# name, so the overlay images: transformer leaves them untouched.
apiVersion: v1
kind: Service
metadata:
  name: verdify-umami-db
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami-db
spec:
  # Headless Service for the StatefulSet (stable DNS verdify-umami-db.<ns>.svc).
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/component: umami-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verdify-umami-db
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami-db
spec:
  serviceName: verdify-umami-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: umami-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: umami-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # postgres uid in postgres:16-alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: umami
            - name: POSTGRES_USER
              value: umami
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-umami-secrets
                  key: UMAMI_DB_PASSWORD
                  # optional so a standalone `kustomize build` of this Component
                  # renders without a placeholder Secret; the real
                  # verdify-umami-secrets is delivered out-of-band before reconcile.
                  optional: true
            # Subdir so the PVC root (lost+found on some CSIs) is not the data dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U umami -d umami"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U umami -d umami"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: verdify
          app.kubernetes.io/component: umami-db
      spec:
        accessModes: ["ReadWriteOnce"]
        # volume1 iSCSI SSD class (laptop-root-provisioned). Same gate as the
        # per-env verdify-db StatefulSets; INERT until the StorageClass exists.
        storageClassName: synology-iscsi-ssd
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-umami
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: umami
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: umami
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-umami-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h verdify-umami-db -p 5432 -U umami; do echo "waiting for umami-db"; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: umami
          # UPSTREAM image. The umami app owns its own schema migrations, so a
          # silent :latest roll could migrate the store — laptop-root MUST resolve
          # this :postgresql-latest tag to an immutable @sha256 at apply time (see
          # the runbook). Tag carried forward verbatim from compose for now.
          image: ghcr.io/umami-software/umami:postgresql-latest
          ports:
            - name: http
              containerPort: 3000
          env:
            # DATABASE_URL embeds the umami DB password; assemble it from the
            # Secret so no plaintext lands in the manifest. $(VAR) resolves
            # against the env entries below.
            - name: DATABASE_TYPE
              value: postgresql
            - name: UMAMI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-umami-secrets
                  key: UMAMI_DB_PASSWORD
                  optional: true
            - name: DATABASE_URL
              value: postgresql://umami:$(UMAMI_DB_PASSWORD)@verdify-umami-db:5432/umami
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: verdify-umami-secrets
                  key: UMAMI_APP_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-umami
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami
spec:
  # ClusterIP only — public front door is the shared apps Traefik via the prod
  # IngressRoute (analytics.verdify.ai + the /share redirect middleware, ported
  # from the compose traefik labels into the IngressRoute). No per-app LB.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: umami
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Ingress allow: base default-deny-ingress drops all inbound. Accept 3000 on the
# umami app from the shared apps-ingress namespace (analytics.verdify.ai public).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-umami-from-ingress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: umami
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-apps
      ports:
        - protocol: TCP
          port: 3000
---
# Ingress allow: the umami-db StatefulSet accepts 5432 ONLY from the umami app
# pod (it is a private analytics store, never reached from the edge).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-umami-db-from-umami
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami-db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: umami-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: umami
      ports:
        - protocol: TCP
          port: 5432
