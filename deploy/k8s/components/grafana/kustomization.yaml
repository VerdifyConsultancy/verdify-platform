apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: OUR OWN Verdify Grafana (graphs.verdify.ai, #498). The
# residual, independent observability tier reading the IN-CLUSTER prod
# TimescaleDB (verdify-db:5432). DESIGNED-FOR overlays/prod ONLY (graphs is a
# prod host) — NOT a base resource, so each overlay must opt in explicitly.
#
# Resources:
#   - grafana.yaml            : Deployment (stateless, emptyDir) + Service +
#                               NetworkPolicy
#   - grafana-render-cache.yaml: bounded nginx cache for public `/render/` PNGs
#   - graphs-ingressroute.yaml: tier-2 verdify-traefik IngressRoute for
#                               interactive Grafana plus the cached PNG split
#   - generated/provisioning-cm.yaml: datasource (uid verdify-tsdb ->
#                               verdify-db:5432) + dashboard provider ConfigMap
#   - generated/dashboards-cm-{0,1,2,3}.yaml: provisioned public dashboards
#                               (split to stay under the 1MiB limit)
#
# Upstream Grafana, image-renderer, and nginx images are immutable-digest-pinned
# in their Deployments (NOT transformer-rewritten — not verdify-* names). Required
# admin/database/renderer keys come via secretKeyRef. Grafana and the renderer
# share verdify-grafana-secrets/GRAFANA_RENDERER_TOKEN; its value is delivered
# out of band and never committed. Renderer port isolation remains mandatory.
resources:
  - grafana.yaml
  - grafana-render-cache.yaml
  - graphs-ingressroute.yaml
  - generated/provisioning-cm.yaml
  - generated/dashboards-cm-0.yaml
  - generated/dashboards-cm-1.yaml
  - generated/dashboards-cm-2.yaml
  - generated/dashboards-cm-3.yaml
  - band-curve-refresh-cronjob.yaml

configMapGenerator:
  - name: verdify-grafana-render-cache-config
    files:
      - default.conf=nginx-render-cache.conf
