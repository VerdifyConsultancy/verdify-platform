            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "fillOpacity": 88,
                "lineWidth": 0
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "",
                      "color": "rgba(38,166,154,0.30)",
                      "index": 0
                    },
                    "1": {
                      "text": "",
                      "color": "#2196F3",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "rgba(140,140,140,0.30)",
                    "value": null
                  },
                  {
                    "color": "#2196F3",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "maxDataPoints": 60000,
          "transparent": true
        },
