        {
          "id": 12,
          "type": "timeseries",
          "title": "VPD Compliance Band",
          "description": "Indoor VPD against the green firmware compliance band, with only the dehumidify/fan entry and fog entry thresholds rendered. Crop/planner provenance, dispatcher math, cfg readbacks, and padding details remain in the band traceability SQL contract.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT f.ts AS time, f.vpd_kpa AS \"Forecast Outdoor VPD\" FROM weather_forecast f WHERE f.ts > now() - interval '72 hours' AND f.ts < now() + interval '24 hours' ORDER BY 1",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT c.ts AS time, avg(c.vpd_avg) OVER (ORDER BY c.ts ROWS BETWEEN 29 PRECEDING AND CURRENT ROW) AS \"Actual Indoor VPD\" FROM climate c WHERE c.ts > now() - interval '72 hours' ORDER BY 1",
              "editorMode": "code"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT ts AS time,\n    projected_vpd_low::float AS \"Compliant Low\",\n    projected_vpd_high::float AS \"Compliant High\"\nFROM fn_band_timeline($__timeFrom(), $__timeTo(), interval '30 minutes', 'vallery')\nORDER BY ts",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "postgres",
                "uid": "P44368ADAD746BC27"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "WITH bounds AS MATERIALIZED (\n  SELECT\n    $__timeFrom()::timestamptz AS from_ts,\n    LEAST($__timeTo()::timestamptz, now()) AS to_ts,\n    interval '5 minutes' AS step,\n    date_trunc('hour', $__timeFrom()::timestamptz) AS seed_start_ts\n),\nbuckets AS MATERIALIZED (\n  SELECT generate_series(time_bucket(b.step, b.seed_start_ts), b.to_ts, b.step) AS time\n  FROM bounds b\n),\nlane_metrics AS MATERIALIZED (\n  SELECT *\n  FROM (VALUES\n    ('heat2'::text, 'Heat 2 (Gas)'::text, 'Heat 2 (Gas) Base'::text, -0.46::double precision, -0.24::double precision),\n    ('heat1'::text, 'Heat 1 (Electric)'::text, 'Heat 1 (Electric) Base'::text, -0.18::double precision, 0.04::double precision),\n    ('mister_south'::text, 'Mister South'::text, 'Mister South Base'::text, 1.72::double precision, 2.0::double precision),\n    ('mister_west'::text, 'Mister West'::text, 'Mister West Base'::text, 2.06::double precision, 2.34::double precision),\n    ('mister_center'::text, 'Mister Center'::text, 'Mister Center Base'::text, 2.4::double precision, 2.68::double precision),\n    ('fog'::text, 'Fog'::text, 'Fog Base'::text, 2.74::double precision, 3.02::double precision)\n  ) AS m(equipment, top_metric, base_metric, lane_low, lane_high)\n),\nstate_seed AS MATERIALIZED (\n  SELECT bd.seed_start_ts AS time, m.equipment, COALESCE(seed.state, false) AS state\n  FROM bounds bd\n  CROSS JOIN lane_metrics m\n  LEFT JOIN LATERAL (\n    SELECT e.state\n    FROM equipment_state e\n    WHERE e.greenhouse_id = 'vallery'\n      AND e.equipment = m.equipment\n      AND e.ts <= bd.seed_start_ts\n    ORDER BY e.ts DESC\n    LIMIT 1\n  ) seed ON true\n),\nstate_events AS MATERIALIZED (\n  SELECT e.ts AS time, e.equipment, e.state\n  FROM equipment_state e, bounds bd\n  WHERE e.greenhouse_id = 'vallery'\n    AND e.equipment IN ('heat2', 'heat1', 'mister_south', 'mister_west', 'mister_center', 'fog')\n    AND e.ts >= bd.seed_start_ts\n    AND e.ts <= bd.to_ts\n),\nstate_timeline AS MATERIALIZED (\n  SELECT\n    e.time,\n    e.equipment,\n    e.state,\n    lead(e.time, 1, (SELECT to_ts FROM bounds)) OVER (PARTITION BY e.equipment ORDER BY e.time) AS next_time\n  FROM (\n    SELECT time, equipment, state FROM state_seed\n    UNION ALL\n    SELECT time, equipment, state FROM state_events\n  ) e\n),\nstate_segments AS MATERIALIZED (\n  SELECT\n    greatest(st.time, bd.seed_start_ts) AS start_time,\n    least(st.next_time, bd.to_ts) AS end_time,\n    st.equipment\n  FROM state_timeline st\n  CROSS JOIN bounds bd\n  WHERE st.state\n    AND st.time < bd.to_ts\n    AND st.next_time > bd.seed_start_ts\n),\nlanes AS (\n  SELECT\n    b.time,\n    m.top_metric AS metric,\n    CASE WHEN EXISTS (\n      SELECT 1\n      FROM state_segments s\n      WHERE s.equipment = m.equipment\n        AND s.start_time < b.time + bd.step\n        AND s.end_time > b.time\n    ) THEN m.lane_high ELSE NULL::double precision END AS value\n  FROM buckets b\n  CROSS JOIN bounds bd\n  CROSS JOIN lane_metrics m\n  WHERE b.time >= bd.from_ts\n    AND b.time <= bd.to_ts\n  UNION ALL\n  SELECT b.time, m.base_metric, m.lane_low\n  FROM buckets b\n  CROSS JOIN bounds bd\n  CROSS JOIN lane_metrics m\n  WHERE b.time >= bd.from_ts\n    AND b.time <= bd.to_ts\n)\nSELECT time, metric, value\nFROM lanes\nORDER BY time, metric",
              "refId": "E",
              "sql": {
