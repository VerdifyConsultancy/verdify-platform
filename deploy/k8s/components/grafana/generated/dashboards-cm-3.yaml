apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-grafana-dashboards-3
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
data:
  weather.json: |
    {
      "uid": "greenhouse-weather",
      "title": "Greenhouse: Weather",
      "description": "Tempest station observations + Open-Meteo 16-day forecast. Solid lines = observed, dashed = forecast.",
      "timezone": "America/Denver",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now+48h"
      },
      "timepicker": {
        "refresh_intervals": [
          "5m",
          "15m",
          "30m",
          "1h"
        ],
        "time_options": [
          "1h",
          "6h",
          "12h",
          "24h",
          "3d",
          "7d",
          "14d",
          "16d",
          "30d",
          "90d"
        ],
        "quick_ranges": [
          {
            "display": "Forecast 16d",
            "from": "now",
            "to": "now+16d"
          },
          {
            "display": "Past Week + Forecast",
            "from": "now-7d",
            "to": "now+7d"
          },
          {
            "display": "Full Range",
            "from": "now-7d",
            "to": "now+16d"
          },
          {
            "display": "Past 30d",
            "from": "now-30d",
            "to": "now"
          },
          {
            "display": "Past 90d",
            "from": "now-90d",
            "to": "now"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(255,255,255,0.4)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [
        {
          "title": "Live Operations",
          "url": "/d/greenhouse-live-ops",
          "type": "link",
          "icon": "dashboard"
        },
        {
          "title": "Plant Health",
          "url": "/d/greenhouse-plant-health",
          "type": "link",
          "icon": "dashboard"
        },
        {
          "title": "Lighting",
          "url": "/d/greenhouse-lighting",
          "type": "link",
          "icon": "dashboard"
        }
      ],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Current Conditions",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Temperature",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "uid": "verdify-tsdb",
            "type": "grafana-postgresql-datasource"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#42A5F5",
                    "value": null
                  },
                  {
                    "color": "#73BF69",
                    "value": 40
                  },
                  {
                    "color": "#FDD835",
                    "value": 75
                  },
                  {
                    "color": "#EF5350",
                    "value": 90
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "area",
            "colorMode": "background_solid",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              },
              "rawSql": "SELECT ts AS time, outdoor_temp_f AS \"Temperature\" FROM climate WHERE ts > now() - interval '1 hour' AND outdoor_temp_f IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "refId": "A"
            }
          ],
          "description": "Shows temperature behavior over time for this part of the greenhouse system."
        },
