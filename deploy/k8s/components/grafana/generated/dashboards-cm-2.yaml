apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-grafana-dashboards-2
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
data:
  confirmed-component-experiment-v2.json: |
    {
      "uid": "confirmed-component-experiment-v2",
      "title": "Experiment: Confirmed Component V2 Safety & Integrity",
      "description": "Blinded-safe operational board for the OFF-gated confirmed-component experiment lane. No comparative efficacy or X/Y mapping is exposed.",
      "tags": [
        "experiment",
        "safety",
        "integrity",
        "standardized"
      ],
      "timezone": "America/Denver",
      "editable": false,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Scope and blinding",
          "gridPos": {
            "h": 4,
            "w": 18,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "This board shows lifecycle, work, derived cfg-readback equality, exposure, generations, fallback, outcome completeness, and rollback readiness. Future randomized work/assignment identity is database-clock masked. It intentionally omits the randomization secret, X/Y mapping, physical-arm resolution, and comparative efficacy. Any red state requires the rollout runbook's close/recover/yield action before advance."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Actionable integrity states",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "rawSql": "SELECT count(*)::integer AS \"Actionable\" FROM public.fn_experiment_v2_ops_status() WHERE alert_severity IS NOT NULL",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  },
                  {
                    "color": "#EF5350",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 3,
          "type": "table",
          "title": "Lifecycle, authority, and current typed work",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "rawSql": "SELECT experiment_id AS \"Experiment\", lifecycle_status AS \"Lifecycle\", execution_phase AS \"Phase\", admission_state AS \"Admission\", component_enabled AS \"Capability\", lease_generation AS \"Lease gen\", operation_kind AS \"Operation\", work_id AS \"Work\", assignment_id AS \"Assignment\", future_randomized_identity_masked AS \"Future masked\", safety_state AS \"Safety\", fallback_state AS \"Fallback\" FROM public.fn_experiment_v2_ops_status() ORDER BY experiment_id",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Derived readback, exposure, and writer truth",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "rawSql": "SELECT experiment_id AS \"Experiment\", expected_observed_equal AS \"Expected = observed\", observation_truth AS \"Observation truth\", observation_evidence_count AS \"Receipts\", observation_age_seconds AS \"Age s\", open_exposure_count AS \"Open exposures\", writer_generation AS \"Writer gen\", connection_generation AS \"Connection gen\", expected_state_content_sha256 AS \"Expected state hash\", observed_state_content_sha256 AS \"Observed state hash\" FROM public.fn_experiment_v2_ops_status() ORDER BY experiment_id",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Outcome completeness and rollback readiness",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "rawSql": "SELECT experiment_id AS \"Experiment\", frozen_outcome_count AS \"Frozen outcomes\", expected_outcome_count AS \"Expected outcomes\", outcomes_complete AS \"Complete\", rollback_ready AS \"Rollback ready\" FROM public.fn_experiment_v2_ops_status() ORDER BY experiment_id",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Action required",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "rawSql": "SELECT experiment_id AS \"Experiment\", alert_severity AS \"Severity\", alert_reason AS \"Reason\", safety_state AS \"Safety\", admission_state AS \"Admission\", resolved_at AS \"Evaluated at\" FROM public.fn_experiment_v2_ops_status() WHERE alert_severity IS NOT NULL ORDER BY CASE alert_severity WHEN 'critical' THEN 0 ELSE 1 END, experiment_id",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1,
      "style": "light"
    }
  band-tuning-diurnal.json: |
    {
      "uid": "band-tuning-diurnal",
      "title": "Band Tuning \u2014 Diurnal Adjustment",
      "editable": true,
      "schemaVersion": 39,
      "timezone": "America/Denver",
      "style": "light",
      "tags": [
        "greenhouse",
        "bands",
        "tuning",
        "agronomy"
      ],
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "crop",
            "label": "Crop",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "verdify-tsdb"
            },
            "query": "SELECT DISTINCT crop_type FROM crop_target_profiles ORDER BY 1",
            "current": {
              "text": "orchid",
              "value": "orchid"
            },
            "refresh": 1,
            "includeAll": false
          },
          {
            "name": "season",
            "label": "Season",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "verdify-tsdb"
            },
            "query": "SELECT DISTINCT season FROM crop_target_profiles ORDER BY 1",
            "current": {
              "text": "spring",
              "value": "spring"
            },
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "time": {
        "from": "now/d",
        "to": "now/d+1d"
      },
      "panels": [
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "Diurnal temperature band (temp_ideal_min/max) per hour for $crop / $season. The orchid 'time-of-day' swing is this curve. Authored in crop_target_profiles; resolved to setpoints by fn_band_setpoints.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto"
              },
              "unit": "fahrenheit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "type": "timeseries",
          "title": "Temperature ideal band across the day (\u00b0F)",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT timestamp '2026-01-01 00:00:00' + (hour_of_day * interval '1 hour') AS time, temp_ideal_min AS \"temp_lo\", temp_ideal_max AS \"temp_hi\" FROM crop_target_profiles WHERE crop_type = '$crop' AND season = '$season' ORDER BY hour_of_day",
              "refId": "temp"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "Diurnal VPD band (vpd_ideal_min/max) per hour for $crop / $season. Align the VPD shoulders with the temperature shoulders above for a coherent band.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto"
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "type": "timeseries",
          "title": "VPD ideal band across the day (kPa)",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT timestamp '2026-01-01 00:00:00' + (hour_of_day * interval '1 hour') AS time, vpd_ideal_min AS \"vpd_lo\", vpd_ideal_max AS \"vpd_hi\" FROM crop_target_profiles WHERE crop_type = '$crop' AND season = '$season' ORDER BY hour_of_day",
              "refId": "vpd"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "temp_ideal_max - temp_ideal_min per hour. Width < ~6\u00b0F (red threshold) risks unachievable-compliance churn. Watch where the band is too tight to hold.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto"
              },
              "unit": "fahrenheit"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "temp_width"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 6
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "line"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "id": 3,
          "type": "timeseries",
          "title": "Temperature band WIDTH across the day (\u00b0F)",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT timestamp '2026-01-01 00:00:00' + (hour_of_day * interval '1 hour') AS time, (temp_ideal_max - temp_ideal_min) AS \"temp_width\" FROM crop_target_profiles WHERE crop_type = '$crop' AND season = '$season' ORDER BY hour_of_day",
              "refId": "tw"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "vpd_ideal_max - vpd_ideal_min per hour. Width < ~0.30 kPa (red threshold) risks churn.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto"
              },
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "vpd_width"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 0.3
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "line"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "id": 4,
          "type": "timeseries",
          "title": "VPD band WIDTH across the day (kPa)",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT timestamp '2026-01-01 00:00:00' + (hour_of_day * interval '1 hour') AS time, (vpd_ideal_max - vpd_ideal_min) AS \"vpd_width\" FROM crop_target_profiles WHERE crop_type = '$crop' AND season = '$season' ORDER BY hour_of_day",
              "refId": "vw"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "What fn_band_setpoints actually resolves hour-by-hour for the next 24h \u2014 the SERVED band = intersection (MAX(min)/MIN(max)) across ALL active crops, smooth-interpolated. If this differs from the $crop curve above, another active crop is the binding constraint that hour.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 5,
          "type": "timeseries",
          "title": "Resolved SERVED setpoints fn_band_setpoints() \u2014 next 24h (all active crops)",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT g.h AS time, b.temp_low, b.temp_high, b.vpd_low, b.vpd_high FROM generate_series(date_trunc('day', now()), date_trunc('day', now()) + interval '23 hours', interval '1 hour') AS g(h), LATERAL fn_band_setpoints(g.h) AS b ORDER BY g.h",
              "refId": "served"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ]
    }
