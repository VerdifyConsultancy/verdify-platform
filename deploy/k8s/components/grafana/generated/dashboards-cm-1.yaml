apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-grafana-dashboards-1
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
data:
  site-climate-controller.json: |
    {
      "refresh": "1m",
      "uid": "site-climate-controller",
      "title": "Site: Climate \u2014 Controller",
      "editable": true,
      "panels": [
        {
          "id": 10,
          "type": "stat",
          "title": "WiFi RSSI",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT wifi_rssi AS \"dBm\" FROM diagnostics ORDER BY ts DESC LIMIT 1",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dBm",
              "thresholds": {
                "steps": [
                  {
                    "color": "#EF5350",
                    "value": null
                  },
                  {
                    "color": "#FDD835",
                    "value": -75
                  },
                  {
                    "color": "#73BF69",
                    "value": -60
                  }
                ]
              }
            }
          },
          "transparent": true,
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Free Heap",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT ROUND(heap_bytes::numeric, 0) AS \"KB\" FROM diagnostics ORDER BY ts DESC LIMIT 1",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kbytes",
              "thresholds": {
                "steps": [
                  {
                    "color": "#EF5350",
                    "value": null
                  },
                  {
                    "color": "#FDD835",
                    "value": 30
                  },
                  {
                    "color": "#73BF69",
                    "value": 50
                  }
                ]
              }
            }
          },
          "transparent": true,
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Uptime",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT uptime_s FROM diagnostics ORDER BY ts DESC LIMIT 1",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "transparent": true,
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Case Temp",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT temp_case AS \"\u00b0F\" FROM climate WHERE temp_case IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "thresholds": {
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  },
                  {
                    "color": "#FDD835",
                    "value": 100
                  },
                  {
                    "color": "#EF5350",
                    "value": 120
                  }
                ]
              }
            }
          },
          "transparent": true,
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Reboots (30d)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT COUNT(*) AS \"Reboots\" FROM v_reboot_log",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  },
                  {
                    "color": "#FDD835",
                    "value": 5
                  },
                  {
                    "color": "#EF5350",
                    "value": 15
                  }
                ]
              },
              "unit": "short"
            }
          },
          "transparent": true,
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 15,
          "type": "table",
          "title": "Last Reset",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "rawSql": "SELECT COALESCE((SELECT reset_reason FROM diagnostics WHERE reset_reason IS NOT NULL ORDER BY ts DESC LIMIT 1), 'none') AS reset_reason",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "transparent": true
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Heap + RSSI (30d)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "rawSql": "SELECT $__time(ts), ROUND(heap_bytes::numeric, 0) AS \"Heap (KB)\" FROM diagnostics WHERE $__timeFilter(ts) ORDER BY ts",
              "refId": "A",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            },
            {
              "rawSql": "SELECT $__time(ts), wifi_rssi AS \"RSSI (dBm)\" FROM diagnostics WHERE $__timeFilter(ts) ORDER BY ts",
              "refId": "B",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "RSSI (dBm)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  }
                ]
              }
            ],
            "defaults": {
              "custom": {
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "lineWidth": 1
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "transparent": true
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Case Temp + Uptime (30d)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "rawSql": "SELECT $__time(ts), temp_case AS \"Case Temp (\u00b0F)\" FROM climate WHERE $__timeFilter(ts) AND temp_case IS NOT NULL ORDER BY ts",
              "refId": "A",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            },
            {
              "rawSql": "SELECT $__time(ts), uptime_s / 3600.0 AS \"Uptime (hrs)\" FROM diagnostics WHERE $__timeFilter(ts) ORDER BY ts",
              "refId": "B",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime (hrs)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ],
            "defaults": {
              "custom": {
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "lineWidth": 1,
                "axisLabel": "Hours"
              },
              "unit": "fahrenheit"
            }
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "transparent": true
        },
        {
          "id": 24,
          "type": "timeseries",
          "title": "Transition Rate (hourly)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "rawSql": "SELECT $__time(hour), transitions AS \"Transitions/hr\" FROM v_state_transition_rate WHERE $__timeFilter(hour) ORDER BY hour",
              "refId": "A",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 40,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "lineWidth": 1
              },
              "unit": "currencyUSD"
            }
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "transparent": true
        },
        {
          "id": 25,
          "type": "piechart",
          "title": "State Distribution (24h)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "rawSql": "SELECT value AS \"State\", COUNT(*) AS \"Count\" FROM system_state WHERE entity = 'greenhouse_state' AND ts > now() - interval '24 hours' GROUP BY value ORDER BY 2 DESC",
              "refId": "A",
              "format": "table",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "transparent": true
        },
        {
          "id": 45,
          "type": "heatmap",
          "title": "Oscillation Heatmap (param \u00d7 hour)",
          "gridPos": {
            "h": 8,
            "w": 18,
            "x": 6,
            "y": 58
          },
          "targets": [
            {
              "rawSql": "SELECT $__time(hour), parameter AS \"metric\", oscillations AS \"value\" FROM v_setpoint_velocity WHERE $__timeFilter(hour) AND oscillations > 0 ORDER BY hour",
              "refId": "A",
              "format": "time_series",
              "datasource": {
                "uid": "verdify-tsdb",
                "type": "grafana-postgresql-datasource"
              }
            }
          ],
          "options": {
            "yAxis": {
              "axisPlacement": "left"
            },
            "color": {
              "scheme": "RdYlGn",
              "reverse": true
            }
          },
          "transparent": true
        },
        {
          "description": "Shows the sequence of controller states over the last 24 hours.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 88,
                "lineWidth": 0
              },
              "unit": "none",
              "noValue": "No data",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "IDLE": {
                      "text": "Idle",
                      "color": "#66BB6A",
                      "index": 0
                    },
                    "VENTILATE": {
                      "text": "Ventilate",
                      "color": "#FFCA28",
                      "index": 1
                    },
                    "THERMAL_RELIEF": {
                      "text": "Thermal relief",
                      "color": "#F57C00",
                      "index": 2
                    },
                    "DEHUM_VENT": {
                      "text": "Dehum vent",
                      "color": "#7E57C2",
                      "index": 3
                    },
                    "SEALED_MIST_S1": {
                      "text": "Mist S1",
                      "color": "#26A69A",
                      "index": 4
                    },
                    "SEALED_MIST_S2": {
                      "text": "Mist S2",
                      "color": "#00897B",
                      "index": 5
                    },
                    "SEALED_MIST_FOG": {
                      "text": "Mist + fog",
                      "color": "#00ACC1",
                      "index": 6
                    },
                    "SEALED_MIST_WATCH": {
                      "text": "Mist watch",
                      "color": "#80CBC4",
                      "index": 7
                    },
                    "SAFETY_COOL": {
                      "text": "Safety cool",
                      "color": "#D32F2F",
                      "index": 8
                    },
                    "TEMP_IDLE_HUM_IDLE": {
                      "text": "Temp idle / hum idle",
                      "color": "#81C784",
                      "index": 9
                    },
                    "TEMP_IDLE_HUMID_S1": {
                      "text": "Temp idle / humid S1",
                      "color": "#4DB6AC",
                      "index": 10
                    },
                    "TEMP_IDLE_VPD_WATCH": {
                      "text": "Temp idle / VPD watch",
                      "color": "#B2DFDB",
                      "index": 11
                    },
                    "HEAT_S1_HUM_IDLE": {
                      "text": "Heat S1 / hum idle",
                      "color": "#FFB74D",
                      "index": 12
                    },
                    "HEAT_S1_HUMID_S1": {
                      "text": "Heat S1 / humid S1",
                      "color": "#FFCC80",
                      "index": 13
                    },
                    "HEAT_S1_VPD_WATCH": {
                      "text": "Heat S1 / VPD watch",
                      "color": "#FFE0B2",
                      "index": 14
                    },
                    "HEAT_S2_HUM_IDLE": {
                      "text": "Heat S2 / hum idle",
                      "color": "#F4511E",
                      "index": 15
                    },
                    "HEAT_S2_HUMID_S1": {
                      "text": "Heat S2 / humid S1",
                      "color": "#E64A19",
                      "index": 16
                    },
                    "HEAT_S2_VPD_WATCH": {
                      "text": "Heat S2 / VPD watch",
                      "color": "#BF360C",
                      "index": 17
                    },
                    "COOL_S1_HUM_IDLE": {
                      "text": "Cool S1 / hum idle",
                      "color": "#64B5F6",
                      "index": 18
                    },
                    "COOL_S1_HUMID_S1": {
                      "text": "Cool S1 / humid S1",
                      "color": "#42A5F5",
                      "index": 19
                    },
                    "COOL_S1_HUMID_S2": {
                      "text": "Cool S1 / humid S2",
                      "color": "#1E88E5",
                      "index": 20
                    },
                    "COOL_S1_VPD_WATCH": {
                      "text": "Cool S1 / VPD watch",
                      "color": "#90CAF9",
                      "index": 21
                    },
                    "COOL_S2_HUMID_S1": {
                      "text": "Cool S2 / humid S1",
                      "color": "#1976D2",
                      "index": 22
                    },
                    "COOL_S2_HUMID_S2": {
                      "text": "Cool S2 / humid S2",
                      "color": "#0D47A1",
                      "index": 23
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "transparent",
                      "index": 24
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "rgba(100, 100, 100, 0.3)",
                    "value": null
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 39
          },
          "id": 119,
          "options": {
            "mergeValues": false
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "time_series",
              "rawSql": "SELECT $__time(ts), value AS \"State\" FROM system_state WHERE entity = 'greenhouse_state' AND $__timeFilter(ts) ORDER BY ts",
              "refId": "A"
            }
          ],
          "title": "Controller State Timeline",
          "type": "state-timeline",
          "transparent": true
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "verdify-tsdb"
          },
          "description": "Indoor temperature against the green firmware compliance band, with only the heat entry and fan/cooling entry thresholds rendered. Crop/planner provenance, dispatcher math, cfg readbacks, and padding details remain in the band traceability SQL contract.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": true,
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "\u00b0F",
                "axisPlacement": "auto",
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "unit": "fahrenheit",
              "decimals": 1
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Indoor"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#73BF69",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Outdoor Forecast"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#8C8C8C",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        5
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Outdoor"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#8C8C8C",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Solar W/m\u00b2"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#FDD835",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 0
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 85
                  },
                  {
                    "id": "custom.gradientMode",
                    "value": "opacity"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "watt/m\u00b2"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1200
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Solar Forecast"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#FFE66D",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 0
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 85
                  },
                  {
                    "id": "custom.gradientMode",
                    "value": "opacity"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "watt/m\u00b2"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1200
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        5
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Heat 1"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#FF9800",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.drawStyle",
