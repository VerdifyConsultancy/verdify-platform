                  },
                  {
                    "id": "custom.pointSize",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Heat 2 (gas)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "rgba(255,140,50,0.7)",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.drawStyle",
                    "value": "points"
                  },
                  {
                    "id": "custom.pointSize",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Compliant High"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "#73BF69",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 0
                  },
                  {
                    "id": "custom.fillBelowTo",
                    "value": "Compliant Low"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 22
                  },
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "legend": true,
                      "tooltip": true,
                      "viz": false
                    }
                  },
                  {
                    "id": "custom.gradientMode",
                    "value": "none"
                  }
