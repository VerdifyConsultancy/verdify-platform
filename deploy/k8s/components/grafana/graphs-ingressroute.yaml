# Tier-2 IngressRoute for graphs.verdify.ai (#498).
#
# Claimed ONLY by the dedicated verdify-traefik (tier-2) instance:
#   - entryPoints: [verdify-web]   -> an entryPoint only IT defines
#   - label traefik-tier=verdify   -> matches its --labelselector
# The shared apps Traefik (tier-1) forwards every *.verdify.ai host (except the
# explicit exclusions) to verdify-traefik:80, which then routes here. This is the
# graphs.verdify.ai rule that the tier-2 routes table left staged-but-blocked
# pending this Grafana Service.
#
# strip-identity-headers mirrors the other tier-2 routes: the public edge trusts
# no inbound forward-auth identity. Grafana exposes only approved native public shares without sign-in.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: verdify-t2-graphs
  namespace: verdify-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
    traefik-tier: verdify
spec:
  entryPoints: [verdify-web]
  routes:
    # Only public metadata is filtered for panel embeds. Native saved-query
    # POSTs remain on Grafana and accept no caller-supplied SQL.
    - kind: Rule
      match: Host(`graphs.verdify.ai`) && Method(`GET`) && PathRegexp(`^/api/public/dashboards/[a-f0-9]{32}$`)
      priority: 200
      middlewares:
        - name: verdify-strip-identity-headers
      services:
        - name: verdify-api
          port: 8080
    # Server-rendered PNGs are browser-neutral but expensive to produce. Route
    # only this public path through the bounded shared cache; interactive
    # dashboards and API requests continue to reach Grafana directly.
    - kind: Rule
      match: Host(`graphs.verdify.ai`) && PathPrefix(`/render/`)
      priority: 100
      middlewares:
        - name: verdify-strip-identity-headers
      services:
        - name: verdify-grafana-render-cache
          port: 8080
          # Cache storage is intentionally pod-local. Pin a browser to one
          # replica for the bounded cache lifetime so an immediate repeat
          # render is a HIT instead of a second cold render on its peer.
          # This cookie carries no identity or authorization state.
          sticky:
            cookie:
              name: verdify_render_cache
              httpOnly: true
              secure: true
              sameSite: Lax
              path: /render/
              maxAge: 300
    - kind: Rule
      match: Host(`graphs.verdify.ai`)
      middlewares:
        - name: verdify-strip-identity-headers
      services:
        - name: verdify-grafana
          port: 3000
