# A Grafana `/render/` response launches headless Chromium and takes several
# seconds when cold. Keep a bounded shared cache in front of that endpoint so
# Quartz, Astro, Chrome, and Safari all receive the same lightweight PNG path.
#
# One-minute freshness matches the site's refresh cadence. Expired entries are
# served while one background request refreshes them, so only the first-ever
# render of a panel is allowed to block a viewer.
proxy_cache_path /var/cache/nginx/render
                 levels=1:2
                 keys_zone=render_cache:10m
                 max_size=200m
                 inactive=24h
                 use_temp_path=off;

server {
    listen 8080;
    server_name _;

    location = /cache-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /render/ {
        # Older site builds appended `_qts` as a refresh marker. It is not part
        # of the rendered panel identity and must not fragment the shared cache.
        set $cache_key_uri $request_uri;
        if ($cache_key_uri ~ "^(.*)([?&])_qts=[^&]*&?(.*)$") {
            set $cache_key_uri "$1$2$3";
        }

        proxy_cache render_cache;
        proxy_cache_key "$scheme$proxy_host$cache_key_uri";
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 65s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating timeout error http_429 http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 1m;
        proxy_cache_valid 429 500 502 503 504 5s;

        # Grafana marks anonymous rendered images private. This proxy is only
        # reachable through the already-public `/render/` route, so replace
        # that directive with an explicit short public browser-cache contract.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://verdify-grafana:3000;
        # The shared cache must have one public identity. Never let a browser's
        # Grafana session or an authorization header influence a response that
        # can subsequently be served to anonymous visitors.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # The dedicated service is not a second Grafana front door.
    location / {
        return 404;
    }
}
