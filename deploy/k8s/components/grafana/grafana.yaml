# Verdify Grafana — graphs.verdify.ai (#498 / #130 M6.2 / #88 Phase 4).
#
# OUR OWN Grafana, IN-CLUSTER, in ns verdify-prod, reading the IN-CLUSTER prod
# TimescaleDB (verdify-db:5432). DELIBERATELY independent from the fleet obs
# stack and from the now-OFF .150 VM and the retired .100 Grafana. It restores
# the public solo-panel embeds on lab.verdify.ai (/d-solo/site-home panels
# 30/31/36) and the /d/site-home dashboard.
#
# STATELESS: anonymous-Viewer + provisioned datasource + provisioned dashboards
# means there is NO durable org/user/dashboard state worth a PVC — the SQLite
# store is rebuilt from git provisioning on every start. /var/lib/grafana is an
# emptyDir (no synology-iscsi-ssd PVC; no MIGRATE item). That permits a surge-first
# rollout: the old pod remains available until the complete new pod is Ready.
#
# DATASOURCE (verdify-grafana-provisioning CM): uid `verdify-tsdb` — the exact
# uid every site-*.json panel target references — pointed at verdify-db:5432.
# Password is $POSTGRES_PASSWORD from verdify-app-secrets (secretKeyRef; never
# inline / never printed).
#
# DASHBOARDS: all grafana/dashboards/site-*.json provisioned via the
# verdify-grafana-dashboards-{0,1} ConfigMaps (split to stay under the 1MiB
# ConfigMap limit) mounted under /etc/grafana/provisioning/dashboards/json.
#
# PUBLIC EMBED: anonymous Viewer + allow_embedding + cookie_samesite=none/secure
# + root_url=https://graphs.verdify.ai, so the cross-site lab.verdify.ai
# /d-solo iframes render with no login.
#
# IMAGES: upstream Grafana and renderer are hand-pinned by immutable multi-arch
# digest. Grafana 11.6.0 is past support and the former renderer 3.12.6 is in
# CVE-2025-11539's affected range. Both containers receive the same required
# renderer token from verdify-grafana-secrets/GRAFANA_RENDERER_TOKEN. The value
# is delivered out of band and never committed; port isolation remains mandatory.
# The unsafe upstream default is unused.
#
# COMPONENT (not base): graphs.verdify.ai is a prod host; wiring lives in
# overlays/prod only, never staging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-grafana
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472          # grafana uid in the upstream image
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # CANVAS RECOLOR (brand dark green): Grafana's stock dark canvas is
        # #111217; the lab.verdify.ai homepage embeds are transparent-panel
        # /d-solo views, so that canvas shows as a lighter box on the dark-green
        # (#071512) site. Grafana OSS has no theme/CSS lever, so inject a tiny
        # <style> override into a COPY of public/views (the root FS is
        # read-only) that the main container mounts. The panels are transparent,
        # so recoloring the canvas makes the graphs render in the brand green and
        # blend into the site. The exact pinned Grafana 12 image path and injection
        # are preflight-tested. A future path move intentionally blocks the new pod
        # at init while the rolling strategy retains the old ready pod. CSS lives in
        # verdify-grafana-canvas-css (iterate there + rollout restart).
        - name: inject-canvas-css
          image: grafana/grafana:12.4.5@sha256:26b8f35a9e4e4431995cf64c3f396505a4faf17bcfc19f9ed84943ec6bfd5ecd
          command:
            - sh
            - -c
            - |
              set -eu
              cp -a /usr/share/grafana/public/views/. /views/
              STYLE="$(printf '<style>%s</style>' "$(tr '\n' ' ' < /css/canvas.css)")"
              awk -v st="$STYLE" '{ if (index($0,"</head>")>0 && !d){ sub(/<\/head>/, st "</head>"); d=1 } print }' \
                /usr/share/grafana/public/views/index.html > /views/index.html
              echo "canvas CSS injected: /views/index.html = $(wc -c < /views/index.html) bytes"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "64Mi"
          volumeMounts:
            - name: views
              mountPath: /views
            - name: css-inject
              mountPath: /css
              readOnly: true
      containers:
        - name: grafana
          image: grafana/grafana:12.4.5@sha256:26b8f35a9e4e4431995cf64c3f396505a4faf17bcfc19f9ed84943ec6bfd5ecd
          ports:
            - name: http
              containerPort: 3000
          env:
            # --- public front door ---
            - name: GF_SERVER_ROOT_URL
              value: https://graphs.verdify.ai
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_SERVER_DOMAIN
              value: graphs.verdify.ai
            # --- anonymous public viewing (no login for the embeds) ---
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: "Main Org."
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "false"
            # --- cross-site embedding for the lab.verdify.ai /d-solo iframes ---
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: "none"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            # --- admin (out-of-band required Secret). Kustomize rendering does
            #     not resolve Secrets. Kubernetes admits the workload reference,
            #     but container creation stays CreateContainerConfigError if the
            #     Secret or key is missing. Login stays on for the admin only. ---
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-grafana-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # --- lean tier: no alerting / explore / external snapshots ---
            - name: GF_SNAPSHOTS_EXTERNAL_ENABLED
              value: "false"
            - name: GF_EXPLORE_ENABLED
              value: "false"
            - name: GF_ALERTING_ENABLED
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            - name: GF_HIDE_VERSION
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # Grafana 11.6 ships preinstalled apps (grafana-lokiexplore-app,
            # pyroscope, …) whose module.js 404s on `react/jsx-runtime` and throws
            # an uncaught exception that CRASHES the headless-render page (frame
            # detached -> 500 on /render). We use none of them; disable the
            # preinstall so the render page loads cleanly.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            # --- image renderer (in-pod sidecar on localhost:8081) ---
            # The lab.verdify.ai homepage embeds BOTH live /d-solo iframes AND
            # /render/d-solo server-side PNGs (as <img> fallbacks). Without a
            # renderer the /render PNGs are a "no renderer" placeholder, so the
            # sidecar IS needed to fully restore the lab embeds. Callback stays on
            # this pod's loopback so a surge rollout cannot send a render key to
            # the other Grafana pod through the load-balanced Service.
            - name: GF_RENDERING_SERVER_URL
              value: http://localhost:8081/render
            # Required out-of-band Secret key shared with the renderer. The
            # source contains only its name/key contract, never its value.
            - name: GF_RENDERING_RENDERER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-grafana-secrets
                  key: GRAFANA_RENDERER_TOKEN
            - name: GF_RENDERING_CALLBACK_URL
              value: http://127.0.0.1:3000/
            - name: GF_RENDERING_CONCURRENT_RENDER_REQUEST_LIMIT
              value: "4"
            # --- datasource password (the provisioned datasource reads
            #     $POSTGRES_PASSWORD); same key the api/mcp/planner read. ---
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            # Canvas-recolor: serve the initContainer-patched public/views
            # (index.html with the brand dark-green canvas <style>) instead of
            # the stock image copy. Overlays only views/ (index/error/swagger).
            - name: views
              mountPath: /usr/share/grafana/public/views
              readOnly: true
            # Grafana only scans provisioning/datasources/*.y*ml and
            # provisioning/dashboards/*.y*ml — mount each config via subPath into
            # its expected subdir.
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            # All site-*.json land in the provider's scan dir.
            - name: dashboards-0
              mountPath: /etc/grafana/provisioning/dashboards/json/bucket0
              readOnly: true
            - name: dashboards-1
              mountPath: /etc/grafana/provisioning/dashboards/json/bucket1
              readOnly: true
            # bucket2: band-tuning-diurnal (#252) — additive, separate ConfigMap.
            - name: dashboards-2
              mountPath: /etc/grafana/provisioning/dashboards/json/bucket2
              readOnly: true
            # bucket3: legacy dashboard UIDs still embedded by lab.verdify.ai.
            - name: dashboards-3
              mountPath: /etc/grafana/provisioning/dashboards/json/bucket3
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
        # Renderer sidecar — same pod, reached at localhost:8081. Powers the
        # /render/d-solo PNG embeds on lab.verdify.ai. grafana-image-renderer,
        # pinned (UPSTREAM image; not transformer-rewritten).
        - name: renderer
          image: grafana/grafana-image-renderer:v5.10.0@sha256:c0eb7b915a181c7bbe451718f9b633843678bef93703b5ed5fda2f28fa508986
          ports:
            - name: renderer
              containerPort: 8081
          env:
            - name: SERVER_ADDR
              value: ":8081"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-grafana-secrets
                  key: GRAFANA_RENDERER_TOKEN
            - name: LOG_LEVEL
              value: warn
            # Renderer v5 uses a memory-aware limiter instead of the retired
            # Node clustering knobs. Preserve the former four-render ceiling.
            - name: RATE_LIMIT_MAX_LIMIT
              value: "4"
            - name: RATE_LIMIT_MIN_LIMIT
              value: "1"
            - name: BROWSER_READINESS_TIMEOUT
              value: 30s
            - name: BROWSER_TIMEZONE
              value: America/Denver
            # Keep the Chromium profile on the dedicated writable scratch volume
            # instead of writing it into the image layer.
            - name: HOME
              value: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: renderer
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: renderer
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            # The pinned v5 image declares USER 65532 and WORKDIR
            # /home/nonroot (0770, owned by that uid). Override the pod's Grafana
            # uid for this container only so OCI startup can enter its working
            # directory; inherited gid/fsGroup 472 retain emptyDir access.
            runAsUser: 65532
            allowPrivilegeEscalation: false
            # The headless-Chromium renderer needs a writable scratch + cannot run
            # under a fully RO root FS; keep the rest of the hardening.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: renderer-tmp
              mountPath: /tmp
            # Memory-backed /dev/shm (256Mi vs the 64Mi default) for Chromium.
            - name: renderer-shm
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Writable copy of public/views the initContainer patches with the
        # canvas-recolor <style> (root FS is read-only, can't patch in place).
        - name: views
          emptyDir: {}
        - name: css-inject
          configMap:
            name: verdify-grafana-canvas-css
        - name: renderer-tmp
          emptyDir: {}
        - name: renderer-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: provisioning
          configMap:
            name: verdify-grafana-provisioning
        - name: dashboards-0
          configMap:
            name: verdify-grafana-dashboards-0
        - name: dashboards-1
          configMap:
            name: verdify-grafana-dashboards-1
        - name: dashboards-2
          configMap:
            name: verdify-grafana-dashboards-2
        - name: dashboards-3
          configMap:
            name: verdify-grafana-dashboards-3
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-grafana
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  # ClusterIP — public front door is the tier-2 verdify-traefik IngressRoute
  # (graphs.verdify.ai), same one-pattern as www/lab/api/mcp.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Ingress allow: the base default-deny-ingress otherwise drops all inbound.
# Accept 3000 from the in-namespace tier-2 verdify-traefik (the public edge for
# graphs.verdify.ai) AND from any in-namespace pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-from-ingress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # tier-2 verdify-traefik + in-namespace callers.
        - podSelector: {}
        # shared apps Traefik (tier-1 forward) if it ever targets us directly.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-apps
      ports:
        - protocol: TCP
          port: 3000
---
# DB reachability: the base allow-db-from-app only admits api/mcp/ingestor/migrate
# (+planner) to verdify-db:5432. This legacy Grafana datasource still uses the
# application credential, so NetworkPolicy does NOT make it read-only. The site
# unification canary must not reuse this trust boundary; DEC-SITE-015 requires a
# reporting-only store/login before public graph cutover. This prod-only policy
# merely preserves current reachability while the image security patch is validated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-grafana
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: grafana
      ports:
        - protocol: TCP
          port: 5432
---
# Canvas-recolor CSS (see the inject-canvas-css initContainer). Brand dark-green
# (#071512) canvas so the transparent-panel /d-solo embeds on lab.verdify.ai
# blend into the dark-green site instead of showing Grafana's stock #111217 box.
# Iterate the selectors here, then `kubectl rollout restart deploy/verdify-grafana`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-grafana-canvas-css
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
data:
  canvas.css: |
    body.theme-dark.app-grafana { background-color: #071512 !important; }
    .theme-dark #reactRoot { background-color: #071512 !important; }
    .theme-dark .main-view { background-color: #071512 !important; }
    .theme-dark [class*=dashboard] { background-color: #071512 !important; }
    .theme-dark [class*=canvas] { background-color: #071512 !important; }
