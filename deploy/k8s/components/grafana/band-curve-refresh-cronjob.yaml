# Refreshes mv_band_curve (migration 167), mv_equipment_runtime_daily
# (migration 200) and mv_daily_kpi (migration 203) twice an hour so Grafana
# compliance panels and fn_planner_scorecard read pre-computed snapshots
# instead of the live views that OOM'd the DB on 2026-07-14/15.
#
# Cadence (2026-10-11 cluster CronJob cadence review; was */10): :02 and :32
# UTC. America/Denver is a whole-hour UTC offset in both MST and MDT, so the
# :02 run always lands two minutes after local midnight and a completed local
# day becomes snapshot-complete as fast as it did under */10. Mid-day values
# are up to ~30 min stale, which suits the daily views and Grafana panels and
# cuts the CONCURRENTLY refresh scans on the single DB by two thirds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-band-curve-refresh
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  schedule: "2,32 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            # Keep maintenance Pods outside the Grafana Service selector. A
            # refresh Pod has no HTTP port and must never become a Grafana
            # EndpointSlice target while the Job is running.
            app.kubernetes.io/component: grafana-maintenance
        spec:
          restartPolicy: Never
          # Prefer the DB node to reduce overlay traffic, but keep maintenance
          # schedulable while that node is cordoned. The dedicated maintenance
          # peer in grafana.yaml permits the service connection across nodes.
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: db
                    topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: timescale/timescaledb:2.25.2-pg16@sha256:5d523957b04041e1c8dc776dd086a2d68fd1ebc9d4ac3e948b65f02c88550140
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/sh
                - -ceu
                - |
                  tries=0
                  until pg_isready -h "${PGHOST}" -p "${PGPORT:-5432}" -U "${PGUSER}" -d "${PGDATABASE}" >/dev/null 2>&1; do
                    tries=$((tries + 1))
                    [ "$tries" -ge 60 ] && { echo "db never became reachable"; exit 1; }
                    echo "waiting for db (${tries}/60)"
                    sleep 5
                  done
                  attested="$(psql -X --no-password -v ON_ERROR_STOP=1 -t -A -q -c 'SELECT verdify_matview_refresh_runtime.fn_attest_login()')"
                  [ "$attested" = t ] || { echo "refresh database identity refused"; exit 1; }
                  # Each fixed-target call retains its own transaction and the
                  # original first-population/concurrent-refresh distinction.
                  psql -X --no-password -v ON_ERROR_STOP=1 -c 'SELECT verdify_matview_refresh_runtime.fn_refresh_mv_band_curve()'
                  echo "mv_band_curve refreshed $(date -u +%FT%TZ)"
                  psql -X --no-password -v ON_ERROR_STOP=1 -c 'SELECT verdify_matview_refresh_runtime.fn_refresh_mv_equipment_runtime_daily()'
                  echo "mv_equipment_runtime_daily refreshed $(date -u +%FT%TZ)"
                  psql -X --no-password -v ON_ERROR_STOP=1 -c 'SELECT verdify_matview_refresh_runtime.fn_refresh_mv_daily_kpi()'
                  echo "mv_daily_kpi refreshed $(date -u +%FT%TZ)"
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef: { key: DB_HOST, name: verdify-config }
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef: { key: DB_PORT, name: verdify-config }
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: { key: DB_NAME, name: verdify-config }
                - name: PGUSER
                  value: verdify_matview_refresh_runtime_login
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { key: password, name: verdify-matview-refresh-runtime-db }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
