# Refreshes mv_band_curve (migration 167) every 10 min so Grafana compliance
# panels read the pre-computed deterministic solar band / per-zone VPD target
# curves instead of calling fn_crop_band_value live.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-band-curve-refresh
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: grafana
        spec:
          restartPolicy: Never
          # Co-locate with the DB pod so the refresh connection never crosses
          # the Flannel overlay mesh. DB ingress is allowed by the grafana DB
          # NetworkPolicy in grafana.yaml.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: db
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: timescale/timescaledb:2.25.2-pg16
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/sh
                - -ceu
                - |
                  tries=0
                  until pg_isready -h "${PGHOST}" -p "${PGPORT:-5432}" -U "${PGUSER}" -d "${PGDATABASE}" >/dev/null 2>&1; do
                    tries=$((tries + 1))
                    [ "$tries" -ge 60 ] && { echo "db never became reachable"; exit 1; }
                    echo "waiting for db (${tries}/60)"
                    sleep 5
                  done
                  populated="$(psql -v ON_ERROR_STOP=1 -t -A -c "SELECT COALESCE((SELECT ispopulated FROM pg_matviews WHERE schemaname = 'public' AND matviewname = 'mv_band_curve'), false)")"
                  if [ "$populated" = "t" ]; then
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW CONCURRENTLY mv_band_curve;"
                  else
                    echo "mv_band_curve is not populated; running initial non-concurrent refresh"
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW mv_band_curve;"
                  fi
                  echo "mv_band_curve refreshed $(date -u +%FT%TZ)"
                  # Equipment-runtime dashboard snapshot (migration 200): the
                  # live view exceeds Grafana query timeouts — panels read this
                  # matview (the 2026-07-12 "fans not running" false alarm).
                  if [ "$(psql -v ON_ERROR_STOP=1 -t -A -c "SELECT COALESCE((SELECT ispopulated FROM pg_matviews WHERE schemaname='public' AND matviewname='mv_equipment_runtime_daily'), false)")" = "t" ]; then
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW CONCURRENTLY mv_equipment_runtime_daily;"
                  else
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW mv_equipment_runtime_daily;"
                  fi
                  echo "mv_equipment_runtime_daily refreshed $(date -u +%FT%TZ)"
                  # Daily-KPI scorecard snapshot (migration 203): 27 live
                  # v_daily_kpi scans per fn_planner_scorecard call OOM-crashed
                  # the DB on 2026-07-14/15 — the function reads this matview.
                  if [ "$(psql -v ON_ERROR_STOP=1 -t -A -c "SELECT COALESCE((SELECT ispopulated FROM pg_matviews WHERE schemaname='public' AND matviewname='mv_daily_kpi'), false)")" = "t" ]; then
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW CONCURRENTLY mv_daily_kpi;"
                  else
                    psql -v ON_ERROR_STOP=1 -c "REFRESH MATERIALIZED VIEW mv_daily_kpi;"
                  fi
                  echo "mv_daily_kpi refreshed $(date -u +%FT%TZ)"
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef: { key: DB_HOST, name: verdify-config }
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef: { key: DB_PORT, name: verdify-config }
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: { key: DB_NAME, name: verdify-config }
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef: { key: DB_USER, name: verdify-config }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { key: POSTGRES_PASSWORD, name: verdify-app-secrets }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
