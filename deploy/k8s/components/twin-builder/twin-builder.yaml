# verdify-twin in-cluster image build — Kaniko into the zot origin (#587,
# audit §8.9/§8.10 rollout step 4).
#
# WHAT THIS IS: a SUSPENDED CronJob used purely as a reusable Job template
# (the firmware-builder idiom), building twin/Dockerfile at an EXACT git
# revision and pushing registry.vallery.net/verdifyconsultancy/verdify-twin
# to the zot origin (ADR-0021 — never ghcr). AUTHORED, NOT RUN: running it is
# a rollout-step action, and the resulting digest is then pinned in the
# consuming overlay's images: transformer (see
# ../firmware-twin/twin-shadow-deployment.yaml).
#
# CANONICAL ALTERNATIVE: the fleet's normal image path is submitting the
# agent-fleet-ci `repo-build` Argo WorkflowTemplate (Kaniko inside; see
# docs/runbooks/prod-promotion.md), e.g.:
#
#   kubectl create -n agent-fleet-ci -f - <<'WF'
#   apiVersion: argoproj.io/v1alpha1
#   kind: Workflow
#   metadata:
#     generateName: verdify-platform-build-twin-
#     labels: {agent-fleet.vallery.net/repo: verdify-platform}
#   spec:
#     workflowTemplateRef: {name: repo-build}
#     arguments:
#       parameters:
#         - {name: repo, value: https://github.com/VerdifyConsultancy/verdify-platform.git}
#         - {name: revision, value: <exact main sha>}
#         - {name: dockerfile, value: twin/Dockerfile}
#         - {name: context, value: "."}
#         - {name: image, value: verdifyconsultancy/verdify-twin}
#         - {name: push_secret, value: zot-origin-verdifyconsultancy-ci-dockerconfig}
#   WF
#
# This component is the equivalent build expressed as an app-owned manifest so
# the twin build is reviewable/refreshable next to the twin component it
# feeds, without depending on agent-fleet-ci namespace access. Same executor
# image (digest-pinned below, matching the fleet's repo-build pin), same
# dockerfile/context/destination/push-secret contract.
#
# TRIGGER (operator, at rollout step 4 — never automatic):
#   kubectl -n verdify-prod create job \
#     --from=cronjob/verdify-twin-builder twin-build-$(date +%s)
#   # override TWIN_BUILD_REVISION for a non-default revision the same way the
#   # firmware-builder FLASH override works (--dry-run=client -o json | edit env).
# Then read the digest from the job log tail / --digest-file output and commit
# the digest pin. Images are ALWAYS consumed by @sha256 digest; the :build tag
# below exists only because kaniko requires a named destination — it is never
# referenced by a manifest.
#
# SECRETS (by NAME only): zot push auth comes from the dockerconfig Secret
# `zot-origin-verdifyconsultancy-ci-dockerconfig`, delivered out-of-band by
# the fleet secret backend (same by-name posture as every other secret here).
# The repo is public — the clone needs no token.
#
# SECURITY: kaniko is the standard unprivileged in-cluster builder (no
# docker.sock, no privileged flag), but the executor itself must run as root
# INSIDE its container to unpack image layers — hence no runAsNonRoot on the
# kaniko container (documented deviation; the clone initContainer stays
# non-root). Egress is constrained by the NetworkPolicy below to DNS + TLS
# (github clone + zot push); no device VLAN, no DB.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-twin-builder
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: twin-builder
spec:
  schedule: "0 0 31 2 *"   # Feb 31 never occurs; belt for the suspenders below
  suspend: true             # NEVER runs on schedule — template-only (firmware-builder idiom)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: twin-builder
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          initContainers:
            # Exact-revision checkout into the shared workspace (public repo,
            # no token). Pin by digest at rollout alongside the twin digest pin
            # if a stricter supply chain is wanted; the builder never renders
            # into a synced overlay, so a tag here does not violate the
            # digest-only rendering rule.
            - name: clone
              image: alpine/git:v2.47.2
              command:
                - sh
                - -ceu
                - |
                  git clone --filter=blob:none \
                    https://github.com/VerdifyConsultancy/verdify-platform.git /workspace/src
                  cd /workspace/src
                  git checkout -q "${TWIN_BUILD_REVISION}"
                  echo "checked out $(git rev-parse HEAD)"
              env:
                # Override per-run (job-from-cronjob + env edit) to build an
                # exact commit; 'main' is only the template default.
                - name: TWIN_BUILD_REVISION
                  value: "main"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            # Same pinned executor as the fleet repo-build template (its
            # WorkflowTemplate pin as of 2026-08-02).
            - name: kaniko
              image: gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
              args:
                - --context=dir:///workspace/src
                - --dockerfile=twin/Dockerfile
                # kaniko requires a named destination; consumers pin the
                # DIGEST (printed below + written to the digest file), never
                # this tag.
                - --destination=registry.vallery.net/verdifyconsultancy/verdify-twin:build
                - --digest-file=/workspace/verdify-twin.digest
                - --compressed-caching=false   # matches the fleet repo-build setting
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: zot-push-auth
                  mountPath: /kaniko/.docker
                  readOnly: true
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 6Gi
              securityContext:
                # kaniko must be root in-container to unpack layers; still no
                # privilege escalation and no added caps beyond its defaults.
                allowPrivilegeEscalation: false
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 5Gi
            - name: zot-push-auth
              secret:
                secretName: zot-origin-verdifyconsultancy-ci-dockerconfig
                items:
                  - key: .dockerconfigjson
                    path: config.json
---
# Egress for the builder ONLY: DNS + TLS (github.com clone, zot origin push).
# Deliberately NO DB, NO device VLAN, NO plain-HTTP registries — the
# base-images-only pull-through cache is never a push target (ADR-0021).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-twin-builder-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: twin-builder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: twin-builder
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
