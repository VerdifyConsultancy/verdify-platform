apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-direct-launch-bootstrap
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-direct-launch-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: migrate
        app.kubernetes.io/name: verdify-experiment-v2-direct-launch-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: direct-launch-bootstrap
          # The migrate image now carries asyncpg and has repeatedly acquired
          # working PreSync sandboxes; the bootstrap itself remains unchanged.
          image: ghcr.io/verdifyconsultancy/verdify-migrate
          command: ["python", "/etc/verdify/direct-bootstrap/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: ORDINARY_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_USER
            - name: ORDINARY_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_PASSWORD
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
            # Prove that the same credential required by the enforcing MCP
            # rollout is present for Hermes. Only shape is checked; the value
            # is never logged or transmitted.
            - name: MCP_IRIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: direct-launch-bootstrap
              mountPath: /etc/verdify/direct-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: direct-launch-bootstrap
          configMap:
            name: experiment-v2-direct-launch-bootstrap
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
