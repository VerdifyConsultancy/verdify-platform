apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-credential-bootstrap
  annotations:
    # Temporary, exact-scope placement: after the same hook failed its sandbox
    # on nodes 4, 5, 6, and 7, both adjacent PreSync pods repeatedly acquired
    # fresh node6 sandboxes. Reuse that currently observed-good placement for
    # this combined credential/bootstrap hook.
    operations.vallery.net/temporary-node-placement: vm-k3s-node6:adjacent-presync-sandboxes-healthy:2026-08-27
spec:
  # One pod sandbox now owns credential attestation and the exact-study
  # bootstrap. The latter may wait briefly for first-install credentials, and
  # cold image materialization remains bounded by the shared hook deadline.
  activeDeadlineSeconds: 600
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [vm-k3s-node6]
      containers:
        - name: direct-launch-bootstrap
          image: ghcr.io/verdifyconsultancy/verdify-api
          command: ["python", "/etc/verdify/direct-bootstrap/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: ORDINARY_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_USER
            - name: ORDINARY_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_PASSWORD
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
            # Prove that the same credential required by the enforcing MCP
            # rollout is present for Hermes. Only shape is checked; the value
            # is never logged or transmitted.
            - name: MCP_IRIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: direct-launch-bootstrap
              mountPath: /etc/verdify/direct-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: direct-launch-bootstrap
          configMap:
            name: experiment-v2-direct-launch-bootstrap
