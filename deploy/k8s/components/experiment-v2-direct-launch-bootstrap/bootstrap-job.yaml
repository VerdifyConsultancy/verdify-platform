apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-runtime-role-bootstrap
  annotations:
    # The separate experiment hook failed to acquire a CNI sandbox on all four
    # workers while this adjacent PreSync hook repeatedly succeeded. Reuse its
    # pod for the ordinary-role, experiment-credential, and exact-study duties.
    operations.vallery.net/temporary-pod-reuse: runtime-role-bootstrap:three-duties-one-sandbox:2026-08-27
spec:
  # One pod sandbox owns ordinary-role bootstrap, experiment credential
  # attestation, and exact-study bootstrap. The direct duty waits for the
  # first-install credentials, and all three remain bounded together.
  activeDeadlineSeconds: 600
  template:
    spec:
      containers:
        - name: direct-launch-bootstrap
          image: ghcr.io/verdifyconsultancy/verdify-api
          command: ["python", "/etc/verdify/direct-bootstrap/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: ORDINARY_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_USER
            - name: ORDINARY_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_PASSWORD
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
            # Prove that the same credential required by the enforcing MCP
            # rollout is present for Hermes. Only shape is checked; the value
            # is never logged or transmitted.
            - name: MCP_IRIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: direct-launch-bootstrap
              mountPath: /etc/verdify/direct-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: direct-launch-bootstrap
          configMap:
            name: experiment-v2-direct-launch-bootstrap
