apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-direct-launch-bootstrap
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-direct-launch-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Migration 221 runs at wave 0 and the credential attestation at wave 2.
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        # Reuse the existing DB-only migration network-policy duty. This label
        # deliberately does not match any application Service selector.
        app.kubernetes.io/component: migrate
        app.kubernetes.io/name: verdify-experiment-v2-direct-launch-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/verdifyconsultancy/verdify-api
          command: ["python", "/etc/verdify/direct-bootstrap/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: ORDINARY_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_USER
            - name: ORDINARY_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_API_RUNTIME_DB_PASSWORD
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
            # PreSync proof that the same credential required by the enforcing
            # MCP rollout is already present for Hermes. The bootstrap checks
            # only bounded shape and never logs or transmits the value.
            - name: MCP_IRIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/verdify/direct-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: experiment-v2-direct-launch-bootstrap
        - name: tmp
          emptyDir: {}
