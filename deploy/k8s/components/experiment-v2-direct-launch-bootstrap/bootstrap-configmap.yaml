apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment-v2-direct-launch-bootstrap
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-direct-launch-bootstrap
  annotations:
    # The wave-2 credential/direct-bootstrap Job mounts this payload. It must
    # exist during PreSync, before ordinary Sync resources are applied.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
data:
  bootstrap.json: |
    {
      "schema": "verdify-experiment-v2-direct-bootstrap-v1",
      "study": {
        "experiment_id": "45039c86-c1d9-52f6-a0a9-d94a17bc4b14",
        "greenhouse_id": "vallery",
        "kind": "randomized",
        "name": "Verdify confirmed-component AI-vs-frozen-FSM switchback v2",
        "timezone": "America/Denver",
        "study_id": "verdify-confirmed-component-switchback-v2-2026-08",
        "assignment_namespace_uuid": "0c162b58-5a4c-5ddb-91fd-7d0ca68ff81f"
      },
      "candidate": {
        "firmware_revision": "2026.7.10.1500.09ee886",
        "config_revision": "4dbb2e691d91",
        "registry_revision": "tunable-registry-v1:sha256:5de3c7485b5f9d989602b9cbed29fbe7cc64e7a7f531bab7556148243b5d3b3b",
        "grid_revision": "live-entity-grid-v1:sha256:c10f21f692f4772acd98a41f7ee28e43e534e03d4009d3f963fc2e0fb96aa436"
      },
      "profiles_artifact_sha256": "c185909cfd2a097c7dc3c7b820f4ebc4609b1261a555b7af8ed6294669ee1ea1",
      "wire_schema": {
        "field_count": 48,
        "manifest_digest_sha256": "0bdd80472f2a9845c24a78cd7d6662e0523314afc5f3149233c08a8e8aedb318",
        "version": 2
      },
      "profiles": {
        "aggressive": {
          "field_count": 48,
          "wire_bytes": 178,
          "wire_hex": "",
          "policy_state_content_sha256": "34728bbe9d89599d6725974a8a27178e83b253381a7f71def64250f24e43935c"
        },
        "baseline": {
          "field_count": 48,
          "wire_bytes": 178,
          "wire_hex": "",
          "policy_state_content_sha256": "4fbbab8b067c978500f1b45878d7fd11ae2a36c25feeff26dd2e7334b2c2b574"
        },
        "moderate": {
          "field_count": 48,
          "wire_bytes": 178,
          "wire_hex": "",
          "policy_state_content_sha256": "0484db1f9b03ae3cffa7a69eb95306a63444d8e93671cc6d4ada887ce485d173"
