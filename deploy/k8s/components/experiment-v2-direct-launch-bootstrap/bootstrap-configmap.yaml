  bootstrap.py: |
    import asyncio
    import hashlib
    import json
    import os
    import uuid
    from pathlib import Path

    import asyncpg

    SPEC_PATH = Path("/etc/verdify/direct-bootstrap/bootstrap.json")
    EXPECTED_SCHEMA = "verdify-experiment-v2-direct-bootstrap-v1"
    EXPECTED_EXPERIMENT_ID = "45039c86-c1d9-52f6-a0a9-d94a17bc4b14"
    EXPECTED_PROFILES = {"baseline", "moderate", "aggressive"}

    STATUS_SQL = """
    SELECT experiment_id::text, protocol_version, experiment_kind,
           lifecycle_status, execution_phase, admission_state,
           component_enabled, lease_generation, revision_bundle_sha256,
           firmware_revision, config_revision, registry_revision, grid_revision,
           design_lock_sha256, open_exposure_count
      FROM public.fn_experiment_v2_api_status($1::uuid)
    """
    CREATE_SQL = """
    SELECT experiment_id::text, greenhouse_id, kind, status, name, timezone
      FROM public.fn_runtime_v1_create_experiment(
        $1::uuid, $2::text, $3::text, $4::text, $5::text,
        NULL::text, NULL::text, NULL::text, NULL::text, NULL::text,
        NULL::text, NULL::text[], NULL::text[])
    """
    CONFIGURE_SQL = """
    SELECT configured.experiment_id::text, configured.protocol_version,
           configured.status, configured.execution_phase,
           configured.admission_state, configured.component_enabled,
           configured.lease_generation, configured.revision_bundle_sha256
      FROM public.fn_experiment_v2_configure(
        $1::uuid, 'legacy_components_v1'::text,
        $2::text, $3::text, $4::text, $5::text, $6::text, $7::uuid,
        $8::text, $9::bigint, $10::text) configured
    """
    REGISTER_SQL = """
    SELECT state.state_artifact_id::text, state.profile,
           state.revision_bundle_sha256, state.state_content_sha256
      FROM public.fn_experiment_v2_register_state(
        $1::uuid, $2::text, $3::smallint,
        $4::bytea, $5::bytea, $6::text) state
    """
    PROOF_REPLAY_SQL = """
    SELECT public.fn_experiment_v2_direct_proof_begin(
        $1::uuid,
        'https://github.com/VerdifyConsultancy/verdify-platform/issues/641#issuecomment-5448897035'::text,
        tstzrange('2026-08-28 06:00:00+00'::timestamptz,
                  '2026-08-28 18:00:00+00'::timestamptz, '[)'),
        'Jason Vallery'::text, 'Jason Vallery'::text,
        'gitops:issue-641-direct-proof-retry'::text
    )::text
    """
    ATTEMPT_SQL = """
    SELECT authorization_id::text, attempt_number,
           revision_bundle_sha256, attempt_failed, attempt_superseded,
           resolution_kind, emergency_recovery_complete,
           proof_receipt_id::text
      FROM public.fn_experiment_v2_direct_proof_attempt_status($1::uuid)
    """

    def fail(message):
        raise RuntimeError(message)

    def state_hash(version, manifest, vector):
        return hashlib.sha256(
            b"verdify-policy-state-content-v1"
            + b"\x00"
            + bytes([version])
            + manifest
            + vector
        ).hexdigest()

    def load_spec():
        iris_token = os.environ.get("MCP_IRIS_TOKEN", "")
        if len(iris_token) < 16 or any(character.isspace() for character in iris_token):
            fail("protected Iris MCP credential is absent or malformed")
        spec = json.loads(SPEC_PATH.read_text(encoding="utf-8"))
        if spec.get("schema") != EXPECTED_SCHEMA:
            fail("bootstrap schema mismatch")
        study = spec.get("study", {})
        if study.get("experiment_id") != EXPECTED_EXPERIMENT_ID:
            fail("bootstrap experiment identity mismatch")
        uuid.UUID(study["experiment_id"])
        uuid.UUID(study["assignment_namespace_uuid"])
        if set(spec.get("profiles", {})) != EXPECTED_PROFILES:
            fail("bootstrap requires exactly three frozen profiles")
        wire = spec.get("wire_schema", {})
        manifest = bytes.fromhex(wire.get("manifest_digest_sha256", ""))
        if wire.get("version") != 2 or wire.get("field_count") != 48 or len(manifest) != 32:
            fail("bootstrap wire schema mismatch")
        for name, profile in spec["profiles"].items():
            vector = bytes.fromhex(profile.get("wire_hex", ""))
            if profile.get("field_count") != 48 or profile.get("wire_bytes") != 178 or len(vector) != 178:
                fail(f"{name} wire shape mismatch")
            if state_hash(wire["version"], manifest, vector) != profile.get("policy_state_content_sha256"):
                fail(f"{name} state identity mismatch")
        return spec

    async def connect(user_name, password_name):
        user = os.environ.get(user_name, "")
        password = os.environ.get(password_name, "")
        if not user or not password:
            fail(f"protected database identity is incomplete: {user_name}/{password_name}")
        for attempt in range(60):
            try:
                return await asyncpg.connect(
                    host=os.environ["DB_HOST"],
                    port=int(os.environ.get("DB_PORT", "5432")),
                    database=os.environ["DB_NAME"],
                    user=user,
                    password=password,
                    server_settings={
                        "application_name": "verdify-experiment-v2-direct-bootstrap",
                        "statement_timeout": "10s",
                    },
                )
            except (OSError, asyncpg.PostgresError):
                if attempt == 59:
                    raise
                await asyncio.sleep(2)
        fail("database credential did not become ready")

    def assert_feature_off(row, revision):
        expected = (2, "randomized", "draft", "shadow", "closed", False, revision, None, 0)
        actual = (
            row["protocol_version"], row["experiment_kind"], row["lifecycle_status"],
            row["execution_phase"], row["admission_state"], row["component_enabled"],
            row["revision_bundle_sha256"], row["design_lock_sha256"], row["open_exposure_count"],
        )
        if actual != expected:
            fail("bootstrap did not leave the exact feature-off draft state")

    async def main():
        spec = load_spec()
        study = spec["study"]
        candidate = spec["candidate"]
        lifecycle = await connect("LIFECYCLE_DB_USER", "LIFECYCLE_DB_PASSWORD")
        ordinary = None
        try:
            before = await lifecycle.fetchrow(STATUS_SQL, study["experiment_id"])
            attempt = await lifecycle.fetchrow(ATTEMPT_SQL, study["experiment_id"])
            if before is None:
                ordinary = await connect("ORDINARY_API_DB_USER", "ORDINARY_API_DB_PASSWORD")
                created = await ordinary.fetchrow(
                    CREATE_SQL,
                    study["experiment_id"], study["greenhouse_id"], study["kind"],
                    study["name"], study["timezone"],
                )
                if created is None or tuple(created[key] for key in (
                    "experiment_id", "greenhouse_id", "kind", "status", "name", "timezone"
                )) != (
                    study["experiment_id"], study["greenhouse_id"], study["kind"],
                    "draft", study["name"], study["timezone"],
                ):
                    fail("protocol-v1 seed replay differs from the exact study")

            async with lifecycle.transaction(isolation="serializable"):
                observed = await lifecycle.fetchrow(STATUS_SQL, study["experiment_id"])
                if observed is not None and tuple(observed[key] for key in (
                    "protocol_version", "experiment_kind", "lifecycle_status",
                    "execution_phase", "admission_state", "component_enabled",
                    "design_lock_sha256", "open_exposure_count",
                )) == (2, "randomized", "draft", "commissioning",
                       "emergency_hold", False, None, 0):
                    if (
                        attempt is None
                        or attempt["authorization_id"] is None
                        or attempt["revision_bundle_sha256"]
                            != observed["revision_bundle_sha256"]
                        or attempt["attempt_superseded"]
                        or attempt["proof_receipt_id"] is not None
                    ):
                        fail("emergency hold does not match the latest unresolved proof attempt")
                    for key in ("firmware_revision", "config_revision", "registry_revision", "grid_revision"):
                        if observed[key] != candidate[key]:
                            fail(f"emergency proof candidate mismatch: {key}")
                    print(json.dumps({
                        "status": "pass",
                        "experiment_id": study["experiment_id"],
                        "mode": "exact-emergency-proof-awaiting-bounded-recovery",
                        "lifecycle_status": "draft",
                        "execution_phase": "commissioning",
                        "admission_state": "emergency_hold",
                        "component_enabled": False,
                    }, sort_keys=True))
                    return
                if observed is not None and tuple(observed[key] for key in (
                    "protocol_version", "experiment_kind", "lifecycle_status",
                    "execution_phase", "component_enabled",
                    "design_lock_sha256", "open_exposure_count",
                )) == (2, "randomized", "draft", "commissioning",
                       True, None, 0) and observed["admission_state"] in (
                           "baseline_recovery", "open"):
                    for key in ("firmware_revision", "config_revision", "registry_revision", "grid_revision"):
                        if observed[key] != candidate[key]:
                            fail(f"in-progress proof candidate mismatch: {key}")
                    if (
                        attempt is not None
                        and attempt["attempt_failed"]
                        and attempt["resolution_kind"] == "bounded_baseline_recovery"
                        and not attempt["emergency_recovery_complete"]
                    ):
                        print(json.dumps({
                            "status": "pass",
                            "experiment_id": study["experiment_id"],
                            "mode": "bounded-emergency-recovery-in-progress",
                            "lifecycle_status": "draft",
                            "execution_phase": "commissioning",
                            "admission_state": "baseline_recovery",
                            "component_enabled": True,
                        }, sort_keys=True))
                        return
                    proof_work_id = await lifecycle.fetchval(
                        PROOF_REPLAY_SQL, study["experiment_id"]
                    )
                    if proof_work_id is None:
                        fail("in-progress proof replay returned no work identifier")
                    uuid.UUID(str(proof_work_id))
                    print(json.dumps({
                        "status": "pass",
                        "experiment_id": study["experiment_id"],
                        "mode": "exact-attended-proof-in-progress",
                        "lifecycle_status": "draft",
                        "execution_phase": "commissioning",
                        "admission_state": observed["admission_state"],
                        "component_enabled": True,
                    }, sort_keys=True))
                    return
                expected_revision = observed["revision_bundle_sha256"] if observed else None
                expected_lease = observed["lease_generation"] if observed else 0
                configured = await lifecycle.fetchrow(
                    CONFIGURE_SQL,
                    study["experiment_id"], candidate["firmware_revision"],
                    candidate["config_revision"], candidate["registry_revision"],
                    candidate["grid_revision"], study["study_id"],
                    study["assignment_namespace_uuid"], expected_revision,
                    expected_lease, "gitops:issue-642-direct-bootstrap",
                )
                if configured is None:
                    fail("configure returned no receipt")
                revision = configured["revision_bundle_sha256"]
                configured_axes = tuple(configured[key] for key in (
                    "experiment_id", "protocol_version", "status", "execution_phase",
                    "admission_state", "component_enabled"
                ))
                expected_axes = (study["experiment_id"], 2, "draft", "shadow", "closed", False)
                if configured_axes != expected_axes:
                    fail(
                        "configure returned the wrong feature-off state: "
                        + json.dumps(
                            {"actual": configured_axes, "expected": expected_axes},
                            separators=(",", ":"),
                        )
                    )

                wire = spec["wire_schema"]
                for profile_name in sorted(EXPECTED_PROFILES):
                    profile = spec["profiles"][profile_name]
                    registered = await lifecycle.fetchrow(
                        REGISTER_SQL, study["experiment_id"], profile_name,
                        wire["version"], bytes.fromhex(wire["manifest_digest_sha256"]),
                        bytes.fromhex(profile["wire_hex"]),
                        f"gitops:issue-642-state-{profile_name}",
                    )
                    if registered is None or (
                        registered["profile"] != profile_name
                        or registered["revision_bundle_sha256"] != revision
                        or registered["state_content_sha256"] != profile["policy_state_content_sha256"]
                    ):
                        fail(f"{profile_name} registration receipt mismatch")
                    replayed = await lifecycle.fetchrow(
                        REGISTER_SQL, study["experiment_id"], profile_name,
                        wire["version"], bytes.fromhex(wire["manifest_digest_sha256"]),
                        bytes.fromhex(profile["wire_hex"]),
                        f"gitops:issue-642-state-{profile_name}-replay",
                    )
                    if replayed is None or replayed["state_artifact_id"] != registered["state_artifact_id"]:
                        fail(f"{profile_name} exact replay was not idempotent")

                after = await lifecycle.fetchrow(STATUS_SQL, study["experiment_id"])
                if after is None:
                    fail("configured experiment is absent")
                assert_feature_off(after, revision)
                for key in ("firmware_revision", "config_revision", "registry_revision", "grid_revision"):
                    if after[key] != candidate[key]:
                        fail(f"candidate revision mismatch: {key}")
            print(json.dumps({
                "status": "pass",
                "experiment_id": study["experiment_id"],
                "lifecycle_status": "draft",
                "execution_phase": "shadow",
                "component_enabled": False,
                "profile_count": 3,
                "revision_bundle_sha256": revision,
            }, sort_keys=True))
        finally:
            if ordinary is not None:
                await ordinary.close()
            await lifecycle.close()

    asyncio.run(main())
