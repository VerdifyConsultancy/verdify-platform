apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: firmware digital-twin — durable Tier-1 form
# (#34 / #255 / FW-OPT-6 / #587).
#
# Stands up the twin as a read-only / INSERT-only shadow running the PRE-BAKED
# twin image (twin/Dockerfile, built in-cluster via
# ../twin-builder/twin-builder.yaml and pushed to the zot origin). See
# twin-shadow-deployment.yaml for the four-layer safety model, the #31
# divergence-trust gate, and the digest-pin rollout note. This component is
# NOT referenced by any overlay yet — wiring it into overlays/prod is §8.10
# rollout step 4.
#
# The vendored src/ ConfigMap of the dev-proof shape is RETIRED: the image
# builds from the canonical firmware sources at an exact git revision, so
# there are no copies to drift (the old tests/test_19 byte-identity gate went
# with it; scripts/ci-local.sh still syntax-checks the exact image compile).
#
# The verdify-twin-secrets Secret (TWIN_DSN_BASE + TWIN_DB_PASSWORD for the
# INSERT-only twin login user) is provisioned out-of-band (never in a
# manifest/migration), exactly like the grafana-admin / obs by-name secrets.
resources:
  - twin-shadow-deployment.yaml

configMapGenerator:
  # Trimmed replay sample the shadow loops through (well under the 1MiB
  # ConfigMap limit). The §8.10 step-4 LIVE twin replaces this corpus feed
  # with the as-of adapter view (Lane B/E) — corpus stays for the shadow form.
  - name: verdify-twin-corpus
    files:
      - corpus/replay_sample.csv

generatorOptions:
  disableNameSuffixHash: true
