# Firmware digital-twin — PROD-SHADOW deployment (#34 / #255 / FW-OPT-6).
#
# Design: docs/design/firmware-digital-twin.md §2.1 (native logic twin), §5.3
# (read-only / no-actuation safety model, layer L2), §6 Phase-1 (prod twin
# shadowing + divergence dashboard).
#
# WHAT THIS IS: the merged-but-not-deployed twin (twin/Dockerfile +
# twin/offline_driver.py + migration 155) stood up in k3s as a SHADOW. It runs
# the EXACT ESP32 control logic (the -DREPLAY_EMIT_STREAM build of
# firmware/test/replay_emit.cpp — the same code the rule-8 replay-diff gate
# trusts), replays a telemetry corpus through it, and writes predicted decisions
# to twin_decisions via the INSERT-only `twin_ro`/`twin` role (migration 155).
#
# READ-ONLY BY CONSTRUCTION (§5.3 four independent guarantees):
#   L1  no actuation client, no MQTT, no ESP32 route — only DB INSERT.
#   L2  connects as the INSERT-only `twin` login user (member of twin_ro); the
#       driver asserts at startup it CANNOT write equipment_state and aborts if
#       it can.
#   L3  runs in its own pod; no docker.sock, no privileged caps, read-only
#       rootfs, runAsNonRoot.
#   L4  egress is only the verdify-db Service (NetworkPolicy below).
#
# NO IMAGE BUILD/PUSH: an initContainer (gcc:13) compiles replay_emit_follow
# from the firmware sources mounted via the verdify-twin-src ConfigMap into a
# shared emptyDir; the runtime container (python:3.12-slim) pip-installs psycopg
# and runs offline_driver.py. This keeps the shadow self-contained for the dev
# proof. The Tier-1 image (twin/Dockerfile) is the durable prod form.
#
# ── #31 GATE (NOT closed) ───────────────────────────────────────────────────
# replay_emit_follow itself warns that 48 sp_* Setpoints fields are absent from
# the export corpus and fall back to default_setpoints() — so for any field the
# dispatcher tuned away from default, the twin diverges for a CONFIG reason, not
# a code reason. The prod-vs-reality DIVERGENCE METRIC is therefore NOT
# trustworthy as a gate until #31 (setpoint coverage) closes. This shadow proves
# the pipeline + dashboard render; it does NOT yet license acting on divergence.
#
# The old verdify-dev safe-shadow environment is retired. Any future verdify-prod
# shadow additionally needs migration 155 applied to the prod DB + a prod `twin`
# login user — GATED on the runtime preflight (live-prod schema change), see the runbook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-twin-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: firmware-twin
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: firmware-twin
    spec:
      # L3: no privilege, non-root, no service-account token (no API surface).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Compile the gated --stream follower (TWIN-1). The stock batch binary is
        # byte-for-byte unchanged by -DREPLAY_EMIT_STREAM, so rule-8 is unaffected.
        - name: build-follower
          image: gcc:13-bookworm
          workingDir: /tmp
          env:
            - name: TMPDIR
              value: /tmp
          command:
            - bash
            - -ceu
            - |
              g++ -std=c++17 -O2 -DREPLAY_EMIT_STREAM \
                -I /src/firmware/lib \
                -o /shared/replay_emit_follow \
                /src/firmware/test/replay_emit.cpp
              cp /src/twin/offline_driver.py /shared/offline_driver.py
              echo "built replay_emit_follow + staged driver"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: src
              mountPath: /src/firmware/lib/greenhouse_logic.h
              subPath: greenhouse_logic.h
            - name: src
              mountPath: /src/firmware/lib/greenhouse_types.h
              subPath: greenhouse_types.h
            - name: src
              mountPath: /src/firmware/test/replay_emit.cpp
              subPath: replay_emit.cpp
            - name: src
              mountPath: /src/twin/offline_driver.py
              subPath: offline_driver.py
            - name: shared
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: twin
          image: python:3.12-slim
          command:
            - bash
            - -ceu
            - |
              export HOME=/tmp PYTHONUSERBASE=/tmp/pip
              pip install --no-cache-dir --quiet --user "psycopg[binary]>=3.1"
              export PYTHONPATH="$(python -c 'import site,os; print(site.getusersitepackages())')"
              # Pass the password via libpq's PGPASSWORD env (unambiguous, never
              # in the URI / argv / logs). The driver's psycopg.connect(dsn)
              # picks PGPASSWORD up from the environment.
              export PGPASSWORD="${TWIN_DB_PASSWORD}"
              export TWIN_DSN="${TWIN_DSN_BASE}"
              # The driver asserts read-only at startup (L2), then replays the
              # corpus, INSERT-only into twin_decisions. Loop the corpus so the
              # shadow keeps producing rows for the dashboard.
              while true; do
                TWIN_BINARY=/shared/replay_emit_follow \
                TWIN_CSV=/corpus/replay_sample.csv \
                python /shared/offline_driver.py
                echo "[twin] corpus pass complete; sleeping ${TWIN_LOOP_SLEEP:-300}s"
                sleep "${TWIN_LOOP_SLEEP:-300}"
              done
          env:
            - name: TWIN_ENV
              value: prod
            - name: TWIN_REF
              # Pinned to the deployed last-good; the rollback-floor refresh
              # (#256) advances last-good, and this value should track it.
              value: "2026.5.30.1418.aa6518c"
            - name: TWIN_LOOP_SLEEP
              value: "300"
            - name: TWIN_DSN_BASE
              valueFrom:
                secretKeyRef:
                  name: verdify-twin-secrets
                  key: TWIN_DSN_BASE
            - name: TWIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-twin-secrets
                  key: TWIN_DB_PASSWORD
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: src
          configMap:
            name: verdify-twin-src
        - name: corpus
          configMap:
            name: verdify-twin-corpus
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# L4: egress restricted to the verdify-db Service + DNS. No device, no internet
# beyond what pip needs at boot (kept open to TCP 443 for the one-time install;
# tighten to a pre-baked image in the durable Tier-1 form).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-twin-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: firmware-twin
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # verdify-db (Postgres) — the only data egress in steady state.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: verdify
              app.kubernetes.io/component: db
      ports:
        - protocol: TCP
          port: 5432
    # pip bootstrap (one-time at container start); remove in the pre-baked image.
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
# Ingress allowance ON THE DB for the twin. The namespace runs default-deny
# ingress + an allow-db-from-app that only lists api/mcp/ingestor/migrate, so
# the twin's connection is dropped without this. Kept here (own policy) rather
# than mutating the shared allow-db-from-app, so the twin's db reach is
# self-contained and removable with the component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-firmware-twin
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: verdify
      app.kubernetes.io/component: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: firmware-twin
      ports:
        - protocol: TCP
          port: 5432
