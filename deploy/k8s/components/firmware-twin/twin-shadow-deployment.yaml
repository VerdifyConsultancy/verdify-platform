# Firmware digital-twin — durable Tier-1 form (#34 / #255 / #587, audit §8.9).
#
# Design: docs/design/firmware-digital-twin.md §2.1 (native logic twin), §5.3
# (read-only / no-actuation safety model), §6 Phase-1; productionization per
# audit §8.9/§8.10 and issue #587.
#
# WHAT CHANGED (Lane F, #587): the dev-proof shape (gcc:13 initContainer
# compiling vendored src/ copies + startup `pip install` + an open TCP-443
# egress for pip) is REPLACED by the pre-baked twin image built from
# twin/Dockerfile — the same -DREPLAY_EMIT_STREAM compile of
# firmware/test/replay_emit.cpp the rule-8 replay-diff gate trusts, plus the
# offline driver, with psycopg already installed. The vendored source copies
# and their byte-identity CI gate are retired: the image builds from the
# CANONICAL firmware sources in this repo at an exact revision (see
# ../twin-builder/twin-builder.yaml), so there are no copies to drift.
#
# IMAGE / ROLLOUT: the image reference below is `images:`-transformable
# (verdify-twin). The digest is pinned by the consuming overlay's images:
# transformer AFTER the in-cluster twin-builder run pushes to the zot origin —
# e.g.
#   - name: registry.vallery.net/verdifyconsultancy/verdify-twin
#     digest: sha256:<pinned-at-rollout>          # placeholder — no digest yet
# This component is deliberately NOT referenced by any overlay kustomization
# yet (nothing deploys); wiring it into overlays/prod is §8.10 rollout step 4.
#
# READ-ONLY BY CONSTRUCTION (§5.3 four independent guarantees):
#   L1  no actuation client, no MQTT, no ESP32 route — only DB INSERT.
#   L2  connects as the INSERT-only `twin` login user (member of twin_ro); the
#       driver asserts at startup it CANNOT write equipment_state and aborts if
#       it can.
#   L3  runs in its own pod; no docker.sock, no privileged caps, read-only
#       rootfs, runAsNonRoot, no SA token.
#   L4  egress is ONLY DNS + the verdify-db Service (NetworkPolicy below). The
#       former TCP-443 pip-bootstrap egress is REMOVED — the image is pre-baked.
#
# ── #31 GATE (NOT closed) ───────────────────────────────────────────────────
# replay_emit_follow warns that 48 sp_* Setpoints fields are absent from the
# export corpus and fall back to default_setpoints() — so for any field the
# dispatcher tuned away from default, the twin diverges for a CONFIG reason,
# not a code reason. The divergence metric is NOT trustworthy as a gate until
# #31 (setpoint coverage) closes. The §8.10 step-4 LIVE twin is now wired:
# TWIN_MODE=live (below) runs twin/live_driver.py against migration 211's
# v_policy_twin_asof_input + twin_live_results grants, and
# twin/report_agreement.py computes the 7–14d shadow agreement gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-twin-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: firmware-twin
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: firmware-twin
    spec:
      # L3: no privilege, non-root, no service-account token (no API surface).
      automountServiceAccountToken: false
      # zot-origin pull auth (ADR-0021) — same by-name secret as the other
      # workloads; the twin image lives ONLY on the zot origin (never ghcr).
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twin
          # Pre-baked Tier-1 image (twin/Dockerfile): replay_emit_follow +
          # offline_driver.py + psycopg, USER twin (uid 10001). Pinned to an
          # immutable @sha256 digest by the consuming overlay's images:
          # transformer at rollout — placeholder digest, see header.
          image: registry.vallery.net/verdifyconsultancy/verdify-twin
          command:
            - bash
            - -ceu
            - |
              # Pass the password via libpq's PGPASSWORD env (unambiguous,
              # never in the URI / argv / logs). psycopg.connect(dsn) picks
              # PGPASSWORD up from the environment.
              export PGPASSWORD="${TWIN_DB_PASSWORD}"
              export TWIN_DSN="${TWIN_DSN_BASE}"
              export TWIN_BINARY=/usr/local/bin/replay_emit_follow
              if [ "${TWIN_MODE:-corpus}" = "live" ]; then
                # §8.9 LIVE follower (#587): incremental
                # v_policy_twin_asof_input polling, decode of the paired
                # device-confirmed 48-field vector, INSERT-only into
                # twin_live_results. Requires migration 211 (view + results
                # grants for the twin login's group role). Same L1-L4
                # read-only construction; still no actuation, no device
                # egress (the NetworkPolicy below is unchanged).
                exec python /usr/local/bin/live_driver.py
              fi
              # Corpus shadow (default): the driver asserts read-only at
              # startup (L2), then replays the corpus, INSERT-only into
              # twin_decisions. Loop the corpus so the shadow keeps
              # producing rows for the dashboard.
              while true; do
                TWIN_CSV=/corpus/replay_sample.csv \
                python /usr/local/bin/offline_driver.py
                echo "[twin] corpus pass complete; sleeping ${TWIN_LOOP_SLEEP:-300}s"
                sleep "${TWIN_LOOP_SLEEP:-300}"
              done
          env:
            # corpus (default) replays the mounted sample; live follows
            # v_policy_twin_asof_input (§8.9). Flip via a component/overlay
            # patch at §8.10 rollout step 4 — never by editing the cluster.
            - name: TWIN_MODE
              value: corpus
            - name: TWIN_ENV
              value: prod
            - name: TWIN_REF
              # Pinned to the deployed last-good; the rollback-floor refresh
              # (#256) advances last-good, and this value should track it.
              value: "2026.5.30.1418.aa6518c"
            - name: TWIN_LOOP_SLEEP
              value: "300"
            - name: TWIN_DSN_BASE
              valueFrom:
                secretKeyRef:
                  name: verdify-twin-secrets
                  key: TWIN_DSN_BASE
            - name: TWIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-twin-secrets
                  key: TWIN_DB_PASSWORD
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: corpus
          configMap:
            name: verdify-twin-corpus
        - name: tmp
          emptyDir: {}
---
# L4: egress restricted to DNS + the verdify-db Service. NOTHING else: no
# device VLAN, no MQTT, no internet — the pip-bootstrap TCP-443 rule of the
# dev-proof shape is gone (pre-baked image). NO-ACTUATION is a network
# property here, not just a code property.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-twin-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: firmware-twin
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # verdify-db (Postgres) — the ONLY data egress.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: verdify
              app.kubernetes.io/component: db
      ports:
        - protocol: TCP
          port: 5432
---
# Ingress allowance ON THE DB for the twin. The namespace runs default-deny
# ingress + an allow-db-from-app that only lists api/mcp/ingestor/migrate, so
# the twin's connection is dropped without this. Kept here (own policy) rather
# than mutating the shared allow-db-from-app, so the twin's db reach is
# self-contained and removable with the component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-firmware-twin
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-twin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: verdify
      app.kubernetes.io/component: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: firmware-twin
      ports:
        - protocol: TCP
          port: 5432
