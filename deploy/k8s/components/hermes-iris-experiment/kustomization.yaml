apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: the DARK Hermes experiment planner profile (#585,
# audit §8.8). Deliberately NOT referenced by any overlay — the Lane F
# rollout flips the hermes profile seed from components/hermes-iris to this
# variant when the controlled experiment arms. Keeping it a component (rather
# than loose YAML) means the flip is a one-line overlay `components:` edit
# reviewed like any other delivery, with zero cluster drift until then.
resources:
  # Experiment-audience Hermes profile: VERDIFY_MCP_TOKEN_EXPERIMENT bearer +
  # tools.include == the MCP `experiment` audience (drift-tested against
  # mcp/server.py TOOL_AUDIENCES in tests/test_mcp_audience_auth.py).
  - hermes-config.yaml
