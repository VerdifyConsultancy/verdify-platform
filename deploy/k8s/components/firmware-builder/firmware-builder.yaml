# Suspended compile/archive/sign template. It has no device egress and cannot flash.
# Use scripts/firmware-release-job.py to bind one exact revision across containers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-firmware-artifacts
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-builder
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-v1-workspace-rwo
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-firmware-toolchain-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-builder
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-v1-rebuildable-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-firmware-builder-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-builder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: firmware-builder
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.168.0.0/16
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
    ports:
    - port: 443
      protocol: TCP
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-firmware-builder
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: firmware-builder
spec:
  schedule: 0 0 31 2 *
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: firmware-builder
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: artifacts
            persistentVolumeClaim:
              claimName: verdify-firmware-artifacts
          - name: cache
            emptyDir:
              sizeLimit: 10Gi
          - name: work
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: release-tools
            configMap:
              name: verdify-firmware-release-tools
          - name: trust
            configMap:
              name: verdify-firmware-release-trust
          - name: signing
            secret:
              secretName: verdify-firmware-signing
              items:
              - key: cosign.key
                path: cosign.key
              defaultMode: 288
          automountServiceAccountToken: false
          initContainers:
          - name: builder
            image: ghcr.io/esphome/esphome:2026.6.5@sha256:ffe23402d169fc9b8ff29fc3c9fc13b3c47e8a53726fce4569e2280bd534c84c
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            env:
            - name: FW_REVISION
              value: ''
            - name: FW_VERSION
              value: ''
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-github-token
                  key: GITHUB_TOKEN
            - name: OTA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-firmware-ota
                  key: ota_password
            - name: API_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: ESP32_API_KEY
            - name: WIFI_SSID
              valueFrom:
                secretKeyRef:
                  name: verdify-firmware-wifi
                  key: wifi_ssid
            - name: WIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-firmware-wifi
                  key: wifi_password
            - name: PLATFORMIO_CORE_DIR
              value: /cache/platformio
            - name: ESPHOME_DATA_DIR
              value: /work/firmware/.esphome
            - name: ESPHOME_DEFAULT_COMPILE_PROCESS_LIMIT
              value: '1'
            - name: HOME
              value: /tmp
            command:
            - bash
            - -euo
            - pipefail
            - -c
            args:
            - |
              # Refuse mutable refs before clone, secrets assembly or compilation.
              if [[ ! "${FW_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "[builder] FW_REVISION must be a reviewed full lowercase commit SHA" >&2
                exit 64
              fi
              test ! -e "/artifacts/${FW_REVISION}" || { echo "[builder] immutable artifact already exists" >&2; exit 64; }
              [ "${FLASH:-0}" = "0" ] || { echo "[builder] compile template refuses FLASH" >&2; exit 64; }
              echo "[builder] cloning verdify-platform @ ${FW_REVISION}"
              git clone --filter=blob:none "https://x-access-token:${GIT_TOKEN}@github.com/VerdifyConsultancy/verdify-platform.git" /work
              cd /work
              test "$(git cat-file -t "${FW_REVISION}")" = commit
              git checkout --detach -q "${FW_REVISION}"
              test "$(git rev-parse HEAD)" = "${FW_REVISION}"
              SHORT_SHA="$(git rev-parse --short HEAD)"
              if [ -z "${FW_VERSION}" ]; then
                FW_VERSION="$(date +%Y.%-m.%-d.%H%M).${SHORT_SHA}"
              fi
              echo "[builder] fw_version=${FW_VERSION}"

              # secrets.yaml lives only in the pod's tmpfs-backed workdir;
              # values are NEVER echoed.
              umask 077
              cat > /work/firmware/secrets.yaml <<SECRETS
              wifi_ssid: "${WIFI_SSID}"
              wifi_password: "${WIFI_PASSWORD}"
              ota_password: "${OTA_PASSWORD}"
              api_encryption_key: "${API_ENCRYPTION_KEY}"
              SECRETS

              cd /work/firmware
              echo "[builder] compiling (downloads the xtensa toolchain into the per-Job cache)"
              esphome -s fw_version "${FW_VERSION}" compile greenhouse.yaml

              BUILD_DIR="${ESPHOME_DATA_DIR}/build/greenhouse/.pioenvs/greenhouse"
              echo "[builder] build dir: ${BUILD_DIR}"
              sha256sum "${BUILD_DIR}/firmware.ota.bin"

              echo "[builder] archiving to the artifacts PVC"
              cd /work
              ARTIFACT_ROOT=/artifacts ARTIFACT_DIRECTORY_NAME="${FW_REVISION}" BUILD_DIR="${BUILD_DIR}" \
                bash scripts/archive-firmware-artifacts.sh "${FW_VERSION}"
              (cd "/artifacts/${FW_REVISION}" && sha256sum -c SHA256SUMS)
              python3 /release-tools/firmware_release.py manifest --revision "${FW_REVISION}" \
                --firmware-version "${FW_VERSION}" --toolchain "ghcr.io/esphome/esphome@sha256:ffe23402d169fc9b8ff29fc3c9fc13b3c47e8a53726fce4569e2280bd534c84c"

              echo "[builder] compile and archive complete; no device contact"
            volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: cache
              mountPath: /cache
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: release-tools
              mountPath: /release-tools
              readOnly: true
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '4'
                memory: 6Gi
          containers:
          - name: signer
            image: ghcr.io/sigstore/cosign/cosign@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: FW_REVISION
              value: ''
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-firmware-signing
                  key: password
            - name: HOME
              value: /tmp
            args:
            - sign-blob
            - --yes
            - --key=/signing/cosign.key
            - --signing-config=/trust/offline-signing.json
            - --bundle=/artifacts/$(FW_REVISION)/release.sigstore.json
            - /artifacts/$(FW_REVISION)/release.json
            volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: signing
              mountPath: /signing
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
