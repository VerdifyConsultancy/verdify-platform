apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-direct-proof
  labels:
    app.kubernetes.io/part-of: verdify
    # Reuse the existing exact DB-egress policy selector; this Job has no
    # service account token or non-DB network requirement.
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    operations.vallery.net/temporary-node-exclusion: vm-k3s-node4,vm-k3s-node6:cni-pod-sandbox-timeout:2026-08-27
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 4500
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [vm-k3s-node4, vm-k3s-node6]
      containers:
        - name: direct-proof
          image: ghcr.io/verdifyconsultancy/verdify-api
          command: ["python", "/etc/verdify/direct-proof/proof.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          volumeMounts:
            - name: direct-proof
              mountPath: /etc/verdify/direct-proof
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: direct-proof
          configMap:
            name: experiment-v2-direct-proof
        - name: tmp
          emptyDir: {}
