apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-direct-proof
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-direct-proof
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Safe component default. A fresh attended activation must explicitly patch
  # this to false in the isolated activation render after supplying a new exact
  # authorization/window and enabling only the existing singleton ingestor.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 7800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: experiment-v2-direct-proof
    spec:
      restartPolicy: Never
      serviceAccountName: verdify-experiment-v2-direct-proof
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      containers:
        - name: direct-proof
          image: ghcr.io/verdifyconsultancy/verdify-experiment-v2-orchestrator
          command: ["python", "/etc/verdify/direct-proof/proof.py"]
          envFrom:
            - configMapRef:
                name: verdify-config
            - configMapRef:
                name: experiment-v2-direct-proof-activation
          env:
            - name: LIFECYCLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_USER
            - name: LIFECYCLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_EXPERIMENT_LIFECYCLE_DB_PASSWORD
            - name: READ_DB_USER
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_INGESTOR_RUNTIME_DB_USER
            - name: READ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: VERDIFY_INGESTOR_RUNTIME_DB_PASSWORD
            - name: VERDIFY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
            - name: VERDIFY_EXPERIMENT_SELECTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: OPENAI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: direct-proof
              mountPath: /etc/verdify/direct-proof
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: direct-proof
          configMap:
            name: experiment-v2-direct-proof
        - name: tmp
          emptyDir: {}
        - name: backups
          persistentVolumeClaim:
            claimName: verdify-db-dumps
            readOnly: true
