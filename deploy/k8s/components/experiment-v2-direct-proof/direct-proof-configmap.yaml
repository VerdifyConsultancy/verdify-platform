apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment-v2-direct-proof
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-direct-proof
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  proof.py: |
    import asyncio
    import json
    import os
    import re
    import uuid
    from datetime import UTC, datetime, timedelta

    import asyncpg

    EXPERIMENT_ID = "45039c86-c1d9-52f6-a0a9-d94a17bc4b14"
    AUTHORIZATION_REF = (
        "https://github.com/VerdifyConsultancy/verdify-platform/"
        "issues/641#issuecomment-5448897035"
    )
    FACILITY_AUTHORIZATION_REF = (
        "https://github.com/VerdifyConsultancy/verdify-platform/"
        "issues/641#issuecomment-5448546177"
    )
    AUTHORIZED_FROM = datetime(2026, 8, 28, 6, 0, tzinfo=UTC)
    AUTHORIZED_TO = datetime(2026, 8, 28, 18, 0, tzinfo=UTC)
    ACTOR = "gitops:issue-641-direct-proof-retry"
    RUNTIME_REGISTRATION_SETTLE_SECONDS = 5 * 60
    SHA256 = re.compile(r"^[0-9a-f]{64}$")

    STATUS_SQL = """
    SELECT experiment_id::text, protocol_version, experiment_kind,
           lifecycle_status, execution_phase, admission_state,
           component_enabled, lease_generation, revision_bundle_sha256,
           firmware_revision, config_revision, registry_revision, grid_revision,
           design_lock_sha256, open_exposure_count, resolved_at
      FROM public.fn_experiment_v2_api_status($1::uuid)
    """
    BEGIN_SQL = """
    SELECT public.fn_experiment_v2_direct_proof_begin(
        $1::uuid, $2::text, $3::tstzrange, $4::text, $5::text, $6::text
    )::text
    """
    ATTEMPT_SQL = """
    SELECT authorization_id::text, attempt_number,
           revision_bundle_sha256, proof_valid_range,
           aggressive_work_id::text, baseline_after_work_id::text,
           attempt_failed, attempt_superseded, resolution_id::text,
           resolution_kind, recovery_work_id::text, recovery_valid_range,
           emergency_recovery_complete, proof_receipt_id::text
      FROM public.fn_experiment_v2_direct_proof_attempt_status($1::uuid)
    """
    BEGIN_EMERGENCY_RECOVERY_SQL = """
    SELECT (public.fn_experiment_v2_direct_proof_begin_emergency_recovery(
        $1::uuid, $2::uuid, $3::text, $4::bigint, $5::tstzrange,
        $6::text, $7::text, $8::text
    )).resolution_id::text
    """
    RETRY_EMERGENCY_RECOVERY_SQL = """
    SELECT (public.fn_experiment_v2_direct_proof_retry_emergency_recovery(
        $1::uuid, $2::uuid, $3::uuid, $4::text, $5::bigint,
        $6::tstzrange, $7::text, $8::text, $9::text
    )).resolution_id::text
    """
    FINISH_EMERGENCY_RECOVERY_SQL = """
    SELECT (public.fn_experiment_v2_direct_proof_finish_emergency_recovery(
        $1::uuid, $2::uuid, $3::text
    )).resolution_id::text
    """
    OPEN_SQL = """
    SELECT (public.fn_experiment_v2_direct_proof_open_aggressive(
        $1::uuid, $2::uuid, $3::text
    )).experiment_id::text
    """
    BASELINE_AFTER_SQL = """
    SELECT public.fn_experiment_v2_direct_proof_begin_baseline_after(
        $1::uuid, $2::uuid, $3::text
    )::text
    """
    FINISH_SQL = """
    SELECT (public.fn_experiment_v2_direct_proof_finish(
        $1::uuid, $2::text
    )).proof_receipt_id::text
    """
    SET_RECOVERY_SQL = """
    SELECT (public.fn_experiment_v2_set_admission(
        $1::uuid, 'baseline_recovery'::text, $2::text, $3::text
    )).experiment_id::text
    """
    REQUEST_RECOVERY_SQL = """
    SELECT public.fn_experiment_v2_request_recovery(
        $1::uuid, $2::uuid, $3::tstzrange, $4::timestamptz,
        $5::text, $6::text
    )::text
    """

    class ProofError(RuntimeError):
        pass

    def fail(message):
        raise ProofError(message)

    def assert_authorized_clock(minimum_remaining_seconds=0):
        now = datetime.now(UTC)
        if not AUTHORIZED_FROM <= now < AUTHORIZED_TO:
            fail("attended authorization window is not active")
        if (AUTHORIZED_TO - now).total_seconds() < minimum_remaining_seconds:
            fail("attended authorization window has insufficient time remaining")

    def assert_status(
        row,
        *,
        lifecycle,
        phase,
        admission,
        enabled,
        revision=None,
        lease=None,
        open_exposures=None,
    ):
        if row is None:
            fail("exact experiment status is absent")
        actual = (
            row["experiment_id"],
            row["protocol_version"],
            row["experiment_kind"],
            row["lifecycle_status"],
            row["execution_phase"],
            row["admission_state"],
            row["component_enabled"],
        )
        expected = (
            EXPERIMENT_ID,
            2,
            "randomized",
            lifecycle,
            phase,
            admission,
            enabled,
        )
        if actual != expected:
            fail(
                "experiment authority axes changed outside the direct proof: "
                + json.dumps(
                    {"actual": actual, "expected": expected},
                    separators=(",", ":"),
                )
            )
        if not SHA256.fullmatch(row["revision_bundle_sha256"] or ""):
            fail("candidate revision is absent or malformed")
        if revision is not None and row["revision_bundle_sha256"] != revision:
            fail("candidate revision changed during the direct proof")
        if lease is not None and row["lease_generation"] != lease:
            fail("lease generation changed during the direct proof")
        if row["config_revision"] != "4dbb2e691d91":
            fail("runtime candidate config revision is not the corrected source")
        if open_exposures is not None and row["open_exposure_count"] != open_exposures:
            fail("open exposure count differs from the expected proof boundary")

    async def read_status(connection):
        return await connection.fetchrow(STATUS_SQL, EXPERIMENT_ID)

    async def read_attempt(connection):
        return await connection.fetchrow(ATTEMPT_SQL, EXPERIMENT_ID)

    async def retry_emergency_finish(
        connection,
        *,
        resolution_id,
        revision,
        lease,
        timeout_seconds,
    ):
        deadline = asyncio.get_running_loop().time() + timeout_seconds
        retry_fragments = (
            "finishes only from its exact current-lease recovered baseline work",
            "requires two receipt-bound baseline epochs",
        )
        while True:
            assert_authorized_clock(90)
            row = await read_status(connection)
            assert_status(
                row,
                lifecycle="draft",
                phase="commissioning",
                admission="baseline_recovery",
                enabled=True,
                revision=revision,
                lease=lease,
            )
            try:
                result = await connection.fetchval(
                    FINISH_EMERGENCY_RECOVERY_SQL,
                    EXPERIMENT_ID,
                    resolution_id,
                    ACTOR,
                )
                if result is None:
                    fail("emergency recovery finish returned no durable identifier")
                uuid.UUID(str(result))
                print(json.dumps(
                    {"stage": "emergency-recovery-sealed", "status": "pass"},
                    sort_keys=True,
                ))
                return
            except asyncpg.exceptions.RaiseError as exc:
                message = exc.message or str(exc)
                if not any(fragment in message for fragment in retry_fragments):
                    fail("emergency recovery was rejected outside its bounded not-ready condition")
                if asyncio.get_running_loop().time() >= deadline:
                    fail("emergency recovery timed out before its required physical evidence")
                await asyncio.sleep(5)

    async def recover_failed_attempt(connection, status, attempt):
        if attempt is None or attempt["authorization_id"] is None:
            fail("emergency hold has no append-only proof attempt")
        if attempt["proof_receipt_id"] is not None or attempt["attempt_superseded"]:
            fail("emergency hold does not belong to the latest unresolved proof attempt")
        revision = status["revision_bundle_sha256"]
        lease = status["lease_generation"]
        if attempt["revision_bundle_sha256"] != revision:
            fail("emergency attempt revision differs from current authority")

        resolution_id = attempt["resolution_id"]
        if resolution_id is None:
            if status["admission_state"] != "emergency_hold" or status["component_enabled"]:
                fail("new emergency recovery requires yielded emergency authority")
            recovery_from = datetime.now(UTC)
            recovery_to = min(recovery_from + timedelta(minutes=30), AUTHORIZED_TO)
            if (recovery_to - recovery_from).total_seconds() < 3 * 60:
                fail("attended window cannot contain a bounded emergency recovery")
            resolution_id = await connection.fetchval(
                BEGIN_EMERGENCY_RECOVERY_SQL,
                EXPERIMENT_ID,
                attempt["authorization_id"],
                revision,
                lease,
                asyncpg.Range(
                    recovery_from,
                    recovery_to,
                    lower_inc=True,
                    upper_inc=False,
                ),
                FACILITY_AUTHORIZATION_REF,
                "Jason-confirmed physical baseline after interrupted baseline-before",
                ACTOR,
            )
            if resolution_id is None:
                fail("emergency recovery begin returned no durable identifier")
            uuid.UUID(str(resolution_id))
            print(json.dumps(
                {"stage": "emergency-recovery-admitted", "status": "pass"},
                sort_keys=True,
            ))
        else:
            if attempt["resolution_kind"] != "bounded_baseline_recovery":
                fail("failed attempt does not have the authorized bounded recovery kind")
            if attempt["emergency_recovery_complete"]:
                fail("completed emergency recovery cannot remain in commissioning authority")

            if status["admission_state"] == "emergency_hold":
                # A PostSync Job can become Ready before the replacement
                # ingestor starts its task scheduler and registers its new
                # runtime instance. Waiting here prevents the retry guard from
                # observing an older, already-stable generation while startup
                # reconciliation is still draining on the new writer.
                assert_authorized_clock(RUNTIME_REGISTRATION_SETTLE_SECONDS + 90)
                print(json.dumps(
                    {
                        "stage": "emergency-recovery-runtime-settle-wait",
                        "status": "waiting",
                    },
                    sort_keys=True,
                ))
                await asyncio.sleep(RUNTIME_REGISTRATION_SETTLE_SECONDS)
                print(json.dumps(
                    {
                        "stage": "emergency-recovery-runtime-settle-complete",
                        "status": "pass",
                    },
                    sort_keys=True,
                ))
                deadline = asyncio.get_running_loop().time() + 12 * 60
                failed_resolution_id = resolution_id
                while True:
                    assert_authorized_clock(90)
                    current = await read_status(connection)
                    current_attempt = await read_attempt(connection)
                    assert_status(
                        current,
                        lifecycle="draft",
                        phase="commissioning",
                        admission="emergency_hold",
                        enabled=False,
                        revision=revision,
                        lease=lease,
                        open_exposures=0,
                    )
                    if (
                        current_attempt is None
                        or current_attempt["authorization_id"]
                        != attempt["authorization_id"]
                        or str(current_attempt["resolution_id"])
                        != str(failed_resolution_id)
                        or not current_attempt["attempt_failed"]
                        or current_attempt["attempt_superseded"]
                        or current_attempt["emergency_recovery_complete"]
                    ):
                        fail("emergency retry predecessor changed outside the append-only chain")
                    recovery_from = datetime.now(UTC)
                    recovery_to = min(
                        recovery_from + timedelta(minutes=30), AUTHORIZED_TO
                    )
                    if (recovery_to - recovery_from).total_seconds() < 3 * 60:
                        fail("attended window cannot contain a bounded emergency retry")
                    try:
                        resolution_id = await connection.fetchval(
                            RETRY_EMERGENCY_RECOVERY_SQL,
                            EXPERIMENT_ID,
                            attempt["authorization_id"],
                            failed_resolution_id,
                            revision,
                            lease,
                            asyncpg.Range(
                                recovery_from,
                                recovery_to,
                                lower_inc=True,
                                upper_inc=False,
                            ),
                            FACILITY_AUTHORIZATION_REF,
                            (
                                "restart-stable retry after startup authority-hold "
                                "interrupted recovery"
                            ),
                            ACTOR,
                        )
                        if resolution_id is None:
                            fail("emergency recovery retry returned no durable identifier")
                        uuid.UUID(str(resolution_id))
                        print(json.dumps(
                            {
                                "stage": "emergency-recovery-retry-admitted",
                                "status": "pass",
                            },
                            sort_keys=True,
                        ))
                        break
                    except asyncpg.exceptions.RaiseError as exc:
                        if (
                            "current writer generation is not yet stable for "
                            "direct-proof emergency recovery retry"
                            not in (exc.message or str(exc))
                        ):
                            fail(
                                "emergency retry was rejected outside its bounded "
                                "writer-stability condition"
                            )
                        if asyncio.get_running_loop().time() >= deadline:
                            fail("writer did not become stable before emergency retry timeout")
                        await asyncio.sleep(5)

        await retry_emergency_finish(
            connection,
            resolution_id=resolution_id,
            revision=revision,
            lease=lease,
            timeout_seconds=25 * 60,
        )
        recovered = await read_status(connection)
        assert_status(
            recovered,
            lifecycle="draft",
            phase="shadow",
            admission="closed",
            enabled=False,
            revision=revision,
            lease=lease + 1,
            open_exposures=0,
        )
        return recovered

    async def retry_exact(
        connection,
        *,
        label,
        sql,
        args,
        retry_fragment,
        lifecycle,
        phase,
        admission,
        enabled,
        revision,
        lease,
        timeout_seconds,
    ):
        deadline = asyncio.get_running_loop().time() + timeout_seconds
        while True:
            assert_authorized_clock(90)
            row = await read_status(connection)
            assert_status(
                row,
                lifecycle=lifecycle,
                phase=phase,
                admission=admission,
                enabled=enabled,
                revision=revision,
                lease=lease,
            )
            try:
                result = await connection.fetchval(sql, *args)
                if result is None:
                    fail(f"{label} returned no durable identifier")
                uuid.UUID(str(result))
                print(json.dumps({"stage": label, "status": "pass"}, sort_keys=True))
                return str(result)
            except asyncpg.exceptions.RaiseError as exc:
                if retry_fragment not in (exc.message or str(exc)):
                    fail(f"{label} was rejected outside its bounded not-ready condition")
                if asyncio.get_running_loop().time() >= deadline:
                    fail(f"{label} timed out before its required physical evidence")
                await asyncio.sleep(5)

    async def main():
        assert_authorized_clock(15 * 60)
        user = os.environ.get("LIFECYCLE_DB_USER", "")
        password = os.environ.get("LIFECYCLE_DB_PASSWORD", "")
        if not user or not password:
            fail("function-only lifecycle database identity is incomplete")
        connection = await asyncpg.connect(
            host=os.environ["DB_HOST"],
            port=int(os.environ.get("DB_PORT", "5432")),
            database=os.environ["DB_NAME"],
            user=user,
            password=password,
            server_settings={
                "application_name": "verdify-experiment-v2-direct-proof",
                "statement_timeout": "10s",
            },
        )
        aggressive_work_id = None
        try:
            before = await read_status(connection)
            attempt = await read_attempt(connection)
            if attempt is not None and attempt["proof_receipt_id"] is not None:
                assert_status(
                    before,
                    lifecycle="draft",
                    phase="shadow",
                    admission="closed",
                    enabled=False,
                    revision=attempt["revision_bundle_sha256"],
                    open_exposures=0,
                )
                print(json.dumps({
                    "experiment_id": EXPERIMENT_ID,
                    "proof_receipt_id": attempt["proof_receipt_id"],
                    "status": "pass",
                    "stage": "proof-already-sealed",
                }, sort_keys=True))
                return
            if before["design_lock_sha256"] is not None:
                fail("direct proof cannot start after design lock")

            if (
                before["lifecycle_status"] == "draft"
                and before["execution_phase"] == "commissioning"
                and before["admission_state"] == "emergency_hold"
                and before["component_enabled"] is False
            ):
                assert_status(
                    before,
                    lifecycle="draft",
                    phase="commissioning",
                    admission="emergency_hold",
                    enabled=False,
                    open_exposures=0,
                )
                before = await recover_failed_attempt(connection, before, attempt)
                attempt = await read_attempt(connection)
            elif (
                before["lifecycle_status"] == "draft"
                and before["execution_phase"] == "commissioning"
                and before["admission_state"] == "baseline_recovery"
                and before["component_enabled"] is True
                and attempt is not None
                and attempt["attempt_failed"]
                and attempt["resolution_kind"] == "bounded_baseline_recovery"
                and not attempt["emergency_recovery_complete"]
            ):
                # An Argo retry after the recovery was admitted resumes the
                # one immutable work/range instead of creating another range.
                before = await recover_failed_attempt(connection, before, attempt)
                attempt = await read_attempt(connection)

            revision = before["revision_bundle_sha256"]
            if (
                before["lifecycle_status"] == "draft"
                and before["execution_phase"] == "shadow"
                and before["admission_state"] == "closed"
                and before["component_enabled"] is False
            ):
                assert_status(
                    before,
                    lifecycle="draft",
                    phase="shadow",
                    admission="closed",
                    enabled=False,
                    open_exposures=0,
                )
                initial_lease = before["lease_generation"]
                proof_lease = initial_lease + 1
            elif (
                before["lifecycle_status"] == "draft"
                and before["execution_phase"] == "commissioning"
                and before["admission_state"] in ("baseline_recovery", "open")
                and before["component_enabled"] is True
                and attempt is not None
                and not attempt["attempt_failed"]
                and not attempt["attempt_superseded"]
            ):
                proof_lease = before["lease_generation"]
            else:
                fail("direct proof cannot resume from the observed authority state")

            aggressive_work_id = await connection.fetchval(
                BEGIN_SQL,
                EXPERIMENT_ID,
                AUTHORIZATION_REF,
                asyncpg.Range(
                    AUTHORIZED_FROM,
                    AUTHORIZED_TO,
                    lower_inc=True,
                    upper_inc=False,
                ),
                "Jason Vallery",
                "Jason Vallery",
                ACTOR,
            )
            if aggressive_work_id is None:
                fail("direct proof begin returned no aggressive work identifier")
            uuid.UUID(str(aggressive_work_id))
            begun = await read_status(connection)
            attempt = await read_attempt(connection)
            if attempt is None or str(attempt["aggressive_work_id"]) != str(aggressive_work_id):
                fail("direct proof begin is not bound to the latest append-only attempt")

            if attempt["baseline_after_work_id"] is None and begun["admission_state"] == "baseline_recovery":
                assert_status(
                    begun,
                    lifecycle="draft",
                    phase="commissioning",
                    admission="baseline_recovery",
                    enabled=True,
                    revision=revision,
                    lease=proof_lease,
                )
                print(json.dumps(
                    {"stage": "baseline-before-admitted", "status": "pass"},
                    sort_keys=True,
                ))
                await retry_exact(
                    connection,
                    label="aggressive-admitted",
                    sql=OPEN_SQL,
                    args=(EXPERIMENT_ID, aggressive_work_id, ACTOR),
                    retry_fragment=(
                        "direct aggressive admission requires the active exact attempt "
                        "and its receipt-confirmed baseline-before work"
                    ),
                    lifecycle="draft",
                    phase="commissioning",
                    admission="baseline_recovery",
                    enabled=True,
                    revision=revision,
                    lease=proof_lease,
                    timeout_seconds=20 * 60,
                )
                begun = await read_status(connection)

            if attempt["baseline_after_work_id"] is None and begun["admission_state"] == "open":
                await retry_exact(
                    connection,
                    label="baseline-after-admitted",
                    sql=BASELINE_AFTER_SQL,
                    args=(EXPERIMENT_ID, aggressive_work_id, ACTOR),
                    retry_fragment=(
                        "direct baseline-after requires the completed current aggressive "
                        "exposure, its single baseline-before, and enough elapsed proof duration"
                    ),
                    lifecycle="draft",
                    phase="commissioning",
                    admission="open",
                    enabled=True,
                    revision=revision,
                    lease=proof_lease,
                    timeout_seconds=30 * 60,
                )
            elif attempt["baseline_after_work_id"] is None:
                fail("direct proof did not converge to aggressive admission")

            proof_receipt_id = await retry_exact(
                connection,
                label="proof-sealed",
                sql=FINISH_SQL,
                args=(EXPERIMENT_ID, ACTOR),
                retry_fragment="direct proof requires exactly two linked recovered baselines",
                lifecycle="draft",
                phase="commissioning",
                admission="baseline_recovery",
                enabled=True,
                revision=revision,
                lease=proof_lease,
                timeout_seconds=20 * 60,
            )
            after = await read_status(connection)
            assert_status(
                after,
                lifecycle="draft",
                phase="shadow",
                admission="closed",
                enabled=False,
                revision=revision,
                lease=proof_lease + 1,
                open_exposures=0,
            )
            print(
                json.dumps(
                    {
                        "experiment_id": EXPERIMENT_ID,
                        "proof_receipt_id": proof_receipt_id,
                        "status": "pass",
                    },
                    sort_keys=True,
                )
            )
        except Exception:
            # Fail safe without hiding the original failure. If aggressive
            # admission is open, atomically revoke it and request the exact
            # linked baseline through the ordinary recovery function. The
            # executor remains the only device writer and closes the exposure
            # at its recovery claim boundary. Any failure of this best-effort
            # fallback leaves the hook failed for attended intervention.
            if aggressive_work_id is not None and not connection.is_closed():
                try:
                    row = await read_status(connection)
                    if (
                        row is not None
                        and row["lifecycle_status"] == "draft"
                        and row["execution_phase"] == "commissioning"
                        and row["admission_state"] == "open"
                        and row["component_enabled"] is True
                        and datetime.now(UTC) < AUTHORIZED_TO
                    ):
                        await connection.fetchval(
                            SET_RECOVERY_SQL,
                            EXPERIMENT_ID,
                            ACTOR,
                            "direct-proof-runner-failure",
                        )
                        recovery_from = datetime.now(UTC)
                        await connection.fetchval(
                            REQUEST_RECOVERY_SQL,
                            EXPERIMENT_ID,
                            aggressive_work_id,
                            asyncpg.Range(
                                recovery_from,
                                AUTHORIZED_TO,
                                lower_inc=True,
                                upper_inc=False,
                            ),
                            AUTHORIZED_TO,
                            "direct-proof-runner-failure",
                            ACTOR,
                        )
                        print(
                            json.dumps(
                                {"stage": "safety-recovery-requested", "status": "pass"},
                                sort_keys=True,
                            )
                        )
                except Exception:
                    pass
            raise
        finally:
            await connection.close()

    asyncio.run(main())
