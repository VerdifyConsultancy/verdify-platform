# Verdify planner — the standalone LangGraph planner service (planner_graph/,
# folded into the monorepo from VerdifyConsultancy/verdify-planner in #102).
# Built from planner_graph/Dockerfile (uvicorn factory planner_graph.app:create_app
# via `python -m planner_graph.server`, listens on $PORT=8080, exposes GET /health
# at planner_graph/api.py:35).
#
# WHY A KUSTOMIZE COMPONENT (not a base resource): the planner is a prod-serving
# workload that should be opted into explicitly by the live overlay, not added to
# every base render. The old dev/staging overlays are retired; keep this as a
# component so future overlays must choose it deliberately.
#
# DB: the planner reads DB_DSN first (planner_graph/config.py:_build_postgres_dsn),
# falling back to POSTGRES_* / localhost. We construct DB_DSN from the shared
# verdify-config connection fields + the verdify-app-secrets password, exactly as
# verdify-mcp does. PLANNER_STORE_BACKEND auto-selects postgres when a DSN is
# present. Per-env DB hosts (3 separate TimescaleDB StatefulSets) come from each
# overlay's verdify-config (DB_HOST), not hardcoded here.
#
# OPENAI: OPENAI_API_KEY is sourced from the verdify-app-secrets Secret. It is
# OPTIONAL at the manifest level (key may be absent in a given env's sealed
# secret); the planner degrades to non-LLM paths if unset. No plaintext secret
# is ever written here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-planner
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: planner
  strategy:
    # Run state lives in Postgres, but graph execution is a leased side effect.
    # Recreate is the deployment-level defense against rollout overlap; the
    # renewable Postgres lease remains the authoritative process fence.
    type: Recreate
  template:
    metadata:
      annotations:
        # GitOps-owned rollout trigger (#587, audit §8.10): verdify-config is
        # consumed via envFrom, so a ConfigMap edit alone does NOT restart this
        # pod. Maintained by scripts/gen-config-revision.sh — do NOT hand-edit
        # (the CI gate recomputes it).
        verdify.io/config-revision: "00df02adc4fc"
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: planner
    spec:
      # Same in-org pull secret as the other workloads (ghcr.io host-level auth).
      imagePullSecrets:
        - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Gate startup on the per-env DB being reachable, mirroring verdify-api.
        - name: wait-for-db
          image: timescale/timescaledb:2.25.2-pg16
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do echo "waiting for db"; sleep 2; done
          envFrom:
            - configMapRef:
                name: verdify-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: planner
          # Pinned to an immutable @sha256 digest by each overlay's images:
          # transformer (NEVER a mutable tag). Image name only here.
          image: ghcr.io/verdifyconsultancy/verdify-planner
          # planner_graph/Dockerfile default CMD already runs the server; keep it
          # explicit so the contract is visible in the manifest.
          command: ["python", "-m", "planner_graph.server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: verdify-config   # DB_HOST/DB_PORT/DB_NAME/DB_USER + APP_ENV (overlay-patched)
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            # planner_graph/config.py reads DB_DSN first. Construct it from the
            # ConfigMap connection fields + the Secret password ($(VAR) resolves
            # against the envFrom + env entries above), same as verdify-mcp.
            - name: DB_DSN
              value: "postgresql://$(DB_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            # OPTIONAL: the GPT-5.5 client key. optional: true so a sealed secret
            # without this key still mounts (planner degrades gracefully).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: OPENAI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-planner
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: planner
spec:
  # ClusterIP only — the planner is reached in-cluster (by Hermes/Iris and the
  # cron replan), never via a raw LB IP. External exposure, if any, is an
  # overlay IngressRoute decision, not a base-shape one.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: planner
  ports:
    - name: http
      port: 8080
      targetPort: http
