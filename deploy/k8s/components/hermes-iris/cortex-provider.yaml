apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-hermes-cortex-provider
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
data:
  plugin.yaml: |
    name: verdify-cortex-provider
    version: 1.0.0
    description: Verdify Cortex request contract for the Hermes custom provider
    kind: model-provider
  __init__.py: |
    """Verdify Cortex request contract for Hermes revision 404640a.

    User provider plugins load after bundled profiles. Registering ``custom``
    here preserves the existing runtime/auth selection while adding the vLLM
    chat-template argument that Hermes's bundled custom provider omits.
    """

    from typing import Any

    from providers import register_provider
    from providers.base import ProviderProfile


    class VerdifyCortexProfile(ProviderProfile):
        """Pin medium reasoning for the planner's Cortex route."""

        def build_api_kwargs_extras(
            self,
            *,
            reasoning_config: dict | None = None,
            ollama_num_ctx: int | None = None,
            **ctx: Any,
        ) -> tuple[dict[str, Any], dict[str, Any]]:
            extra_body: dict[str, Any] = {}

            # Preserve the bundled custom profile's Ollama compatibility even
            # though Verdify's selected endpoint is vLLM-backed Cortex.
            if ollama_num_ctx:
                extra_body["options"] = {"num_ctx": ollama_num_ctx}

            disabled = bool(
                isinstance(reasoning_config, dict)
                and (
                    reasoning_config.get("enabled") is False
                    or str(reasoning_config.get("effort") or "").strip().lower()
                    == "none"
                )
            )
            if disabled:
                extra_body["think"] = False
            else:
                # Cortex contract: vLLM's Qwen chat template consumes effort
                # here, not as OpenAI's top-level reasoning_effort field.
                extra_body["chat_template_kwargs"] = {
                    "reasoning_effort": "medium",
                }

            return extra_body, {}


    verdify_cortex = VerdifyCortexProfile(
        name="custom",
        aliases=("ollama", "local", "vllm", "llamacpp", "llama.cpp", "llama-cpp"),
        env_vars=(),
        base_url="",
    )

    register_provider(verdify_cortex)
