# verdify-hermes-iris-config (#213) — the Iris planner Hermes profile, delivered
# as IaC so it can NEVER silently drift on the PVC again.
#
# ROOT CAUSE THIS CLOSES: Hermes reads its profile from $HERMES_HOME/config.yaml
# (= /opt/data/config.yaml on the RWO state PVC). That file was historically
# seeded by the VM-era `make hermes-deploy-config` and was NEVER IaC in k3s, so
# the live PVC ended up holding the STOCK hermes-agent template — model
# anthropic/claude-opus-4.6 + provider auto -> base_url openrouter.ai. With no
# OPENROUTER_API_KEY in the verdify-hermes Secret, every planner LLM call 401'd
# ("Missing Authentication header"), so all scheduled + crop-deviation plan
# DELIVERY failed. The verdify-hermes Secret's OPENAI_API_KEY is VALID (proven:
# 200 on api.openai.com + a gpt-5.5 completion). The bug was the drifted profile
# pointing at the wrong provider/model, NOT a missing/bad key.
#
# This is the repo-canonical hermes/iris/config.yaml (Cortex route
# llm.primary.longctx / provider custom / base_url cortex.vallery.net/v1)
# with ONE k3s edit: mcp_servers.verdify_greenhouse.url is the in-cluster
# ClusterIP
# verdify-mcp.verdify-prod.svc:8000/mcp (was the VM compose host.docker.internal).
# The seed initContainer in hermes-iris.yaml installs this onto the PVC at every
# pod start (idempotent), so a pod restart always restores the correct profile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-hermes-iris-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
data:
  tool-readiness.py: |
    """Hermes probes: configured tools, MCP server, and in-process client state."""
    import argparse
    import datetime
    import fcntl
    import json
    import math
    import os
    import re
    import sys
    import time
    import urllib.request
    from pathlib import Path

    REQUIRED = {
        "acknowledge_trigger", "alerts", "climate", "crop_history",
        "crop_lifecycle", "crops", "equipment_state", "forecast",
        "get_setpoints", "history", "knowledge_search", "lessons",
        "lessons_manage", "lessons_search", "observations", "plan_evaluate",
        "plan_status", "position_current", "scorecard", "set_plan",
        "set_tunable", "slack_ops", "topology",
    }
    PROBE_STATE_SCHEMA = 1
    MCP_LOG_LINE = re.compile(
        r"^(?P<stamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) "
        r"(?:DEBUG|INFO|WARNING|ERROR|CRITICAL)(?: \[[^]\r\n]+\])? "
        r"tools\.mcp_tool: (?P<message>.*)$"
    )
    FULL_DISCOVERY = re.compile(
        r"^MCP server 'verdify_greenhouse' \(HTTP\): registered \d+ tool\(s\): .*$"
    )
    DISCONNECTED = (
        re.compile(
            r"^MCP server 'verdify_greenhouse': reconnect requested — "
            r"tearing down (?:SSE|HTTP|legacy HTTP) session$"
        ),
        re.compile(
            r"^MCP server 'verdify_greenhouse' connection lost "
            r"\(attempt \d+/\d+\), reconnecting in \d+s: .*$"
        ),
        re.compile(
            r"^Failed to connect to MCP server 'verdify_greenhouse'"
            r"(?: \(command=.*\))?: .*$"
        ),
    )
    FATAL = (
        re.compile(
            r"^MCP server 'verdify_greenhouse' failed after \d+ "
            r"reconnection attempts, giving up: .*$"
        ),
        re.compile(
            r"^MCP server 'verdify_greenhouse' failed initial connection after "
            r"\d+ attempts, giving up: .*$"
        ),
    )

    def configured_tool_names(config):
        """Parse only the exact tools.include YAML sequence, without substrings."""
        tools_indent = None
        include_indent = None
        names = set()
        for raw_line in config.splitlines():
            if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                continue
            indent = len(raw_line) - len(raw_line.lstrip())
            stripped = raw_line.strip()
            if tools_indent is None:
                if stripped == "tools:":
                    tools_indent = indent
                continue
            if include_indent is None:
                if indent <= tools_indent:
                    tools_indent = None
                    if stripped == "tools:":
                        tools_indent = indent
                    continue
                if stripped == "include:":
                    include_indent = indent
                continue
            if indent <= include_indent:
                break
            if stripped.startswith("- "):
                name = stripped[2:].split("#", 1)[0].strip().strip("'\"")
                if name:
                    names.add(name)
        return names

    def process_start_epoch(pid=1):
        """Return the container main process start time from procfs."""
        with open("/proc/stat", encoding="utf-8") as proc_stat:
            boot_epoch = next(
                float(line.split()[1])
                for line in proc_stat
                if line.startswith("btime ")
            )
        with open(f"/proc/{pid}/stat", encoding="utf-8") as process_stat:
            start_ticks = float(process_stat.read().split()[21])
        return boot_epoch + (start_ticks / os.sysconf("SC_CLK_TCK"))

    def _lifecycle_event(line):
        """Parse only lifecycle records emitted by the pinned MCP client logger."""
        match = MCP_LOG_LINE.match(line)
        if not match:
            return None
        stamp = datetime.datetime.strptime(match.group("stamp"), "%Y-%m-%d %H:%M:%S,%f")
        event_at = stamp.replace(tzinfo=datetime.timezone.utc).timestamp()
        message = match.group("message")
        if any(pattern.fullmatch(message) for pattern in FATAL):
            return event_at, "fatal", message
        if FULL_DISCOVERY.fullmatch(message):
            return event_at, "full_discovery", message
        if any(pattern.fullmatch(message) for pattern in DISCONNECTED):
            return event_at, "disconnect", message
        return None

    def _new_client_state(started_at):
        return {
            "schema_version": PROBE_STATE_SCHEMA,
            "process_started_at": started_at,
            "state": "unknown",
            "fatal": False,
            "last_event_at": None,
            "unacknowledged_disconnect_since": None,
            "signal_source": "none",
        }

    def _load_client_state(path, started_at):
        try:
            payload = json.loads(path.read_text(encoding="utf-8"))
        except (FileNotFoundError, json.JSONDecodeError, OSError):
            return _new_client_state(started_at)
        try:
            same_process = abs(float(payload["process_started_at"]) - started_at) < 0.001
        except (KeyError, TypeError, ValueError):
            same_process = False
        if (
            not isinstance(payload, dict)
            or payload.get("schema_version") != PROBE_STATE_SCHEMA
            or not same_process
            or payload.get("state") not in {"unknown", "connected", "disconnected", "fatal"}
            or not isinstance(payload.get("fatal"), bool)
        ):
            return _new_client_state(started_at)
        return payload

    def _write_client_state(path, state):
        temporary = path.with_name(f".{path.name}.{os.getpid()}.tmp")
        try:
            with temporary.open("w", encoding="utf-8") as stream:
                json.dump(state, stream, sort_keys=True)
                stream.write("\n")
                stream.flush()
                os.fsync(stream.fileno())
            os.chmod(temporary, 0o600)
            os.replace(temporary, path)
        finally:
            try:
                temporary.unlink()
            except FileNotFoundError:
                pass

    def _log_candidates(log_paths):
        """Read active logs plus one rotation; the persisted latch spans later rotation."""
        seen = set()
        for raw_path in log_paths:
            for candidate in (Path(raw_path), Path(f"{raw_path}.1")):
                if candidate not in seen:
                    seen.add(candidate)
                    yield candidate

    def _lifecycle_events(log_paths, started_at):
        events = []
        identities = set()
        for source_order, path in enumerate(_log_candidates(log_paths)):
            try:
                with path.open(encoding="utf-8", errors="replace") as stream:
                    for sequence, line in enumerate(stream):
                        event = _lifecycle_event(line)
                        if event is None or event[0] < started_at:
                            continue
                        identity = event
                        if identity in identities:
                            continue
                        identities.add(identity)
                        events.append((*event, source_order, sequence))
            except FileNotFoundError:
                continue
        return sorted(events, key=lambda item: (item[0], item[3], item[4]))

    def _reduce_client_events(state, events):
        baseline = state.get("last_event_at")
        for event_at, kind, _message, _source_order, _sequence in events:
            if baseline is not None and event_at <= baseline:
                continue
            if kind == "fatal":
                state["state"] = "fatal"
                state["fatal"] = True
                state["unacknowledged_disconnect_since"] = (
                    state.get("unacknowledged_disconnect_since") or event_at
                )
                state["signal_source"] = "fatal_log"
            elif kind == "full_discovery":
                state["state"] = "connected"
                state["fatal"] = False
                state["unacknowledged_disconnect_since"] = None
                state["signal_source"] = "full_discovery_log"
            elif kind == "disconnect":
                if state.get("state") not in {"disconnected", "fatal"}:
                    state["unacknowledged_disconnect_since"] = event_at
                if not state.get("fatal"):
                    state["state"] = "disconnected"
                state["signal_source"] = "disconnect_log"
            state["last_event_at"] = event_at
        return state

    def hermes_client_state(log_paths, started_at, state_path=None):
        """Persist the first post-start negative event across Hermes log rotation.

        The pinned client logs full discovery only at initial registration; a
        successful automatic background reconnect is silent. Therefore a
        disconnect remains unacknowledged until a real later full-discovery log
        or process replacement. This is a negative latch, not a live socket test.
        """
        if state_path is None:
            return _reduce_client_events(
                _new_client_state(started_at),
                _lifecycle_events(log_paths, started_at),
            )
        path = Path(state_path)
        lock_path = path.with_name(f".{path.name}.lock")
        with lock_path.open("a+", encoding="utf-8") as lock_file:
            fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)
            state = _load_client_state(path, started_at)
            state = _reduce_client_events(state, _lifecycle_events(log_paths, started_at))
            _write_client_state(path, state)
            return state

    def unacknowledged_disconnect_for_seconds(client, now=None):
        """Age of the first negative marker not followed by full discovery."""
        disconnected_since = client.get("unacknowledged_disconnect_since")
        if client.get("state") not in {"disconnected", "fatal"} or disconnected_since is None:
            return None
        observed_at = time.time() if now is None else now
        return max(0.0, observed_at - disconnected_since)

    def unacknowledged_disconnect_restart_policy(raw):
        """Parse the opt-in negative-latch threshold without creating restart loops."""
        if raw is None or not raw.strip():
            return None, None
        try:
            seconds = float(raw)
        except ValueError:
            return None, "not_numeric"
        if not math.isfinite(seconds) or not 60 <= seconds <= 86400:
            return None, "outside_60_86400_seconds"
        return seconds, None

    def mcp_server_ready():
        url = os.environ.get(
            "HERMES_MCP_READINESS_URL",
            "http://verdify-mcp.verdify-prod.svc:8000/readyz",
        )
        try:
            with urllib.request.urlopen(url, timeout=4) as response:
                payload = json.load(response)
                status = response.status
        except Exception as exc:
            return False, [], type(exc).__name__
        missing = sorted(REQUIRED - set(payload.get("required_tools", [])))
        ready = status == 200 and payload.get("ready") is True and not missing
        return ready, missing, None

    def main(argv=None):
        parser = argparse.ArgumentParser()
        parser.add_argument("--mode", choices=("readiness", "liveness"), default="readiness")
        args = parser.parse_args(argv)
        configured_start = os.environ.get("HERMES_PROCESS_START_EPOCH")
        started_at = float(configured_start) if configured_start else process_start_epoch()
        log_paths = os.environ.get(
            "HERMES_CLIENT_LOG_PATHS",
            "/opt/data/logs/agent.log:/opt/data/logs/errors.log",
        ).split(":")
        state_path = os.environ.get(
            "HERMES_MCP_PROBE_STATE_PATH",
            "/tmp/verdify-hermes-mcp-probe-state.json",
        )
        probe_state_error = None
        try:
            client = hermes_client_state(log_paths, started_at, state_path=state_path)
        except Exception as exc:
            # A broken probe state must remove the pod from readiness without
            # creating an opaque liveness restart loop.
            probe_state_error = type(exc).__name__
            client = {
                "schema_version": PROBE_STATE_SCHEMA,
                "process_started_at": started_at,
                "state": "probe_error",
                "fatal": False,
                "last_event_at": None,
                "unacknowledged_disconnect_since": None,
                "signal_source": "probe_state_error",
            }
        if args.mode == "liveness":
            unacknowledged_restart_seconds, timeout_config_error = (
                unacknowledged_disconnect_restart_policy(
                    os.environ.get("HERMES_MCP_UNACKNOWLEDGED_DISCONNECT_RESTART_SECONDS")
                )
            )
            unacknowledged_for = unacknowledged_disconnect_for_seconds(client)
            restart_reason = None
            if client["fatal"]:
                restart_reason = "fatal_reconnect_exhaustion"
            elif (
                unacknowledged_restart_seconds is not None
                and unacknowledged_for is not None
                and unacknowledged_for >= unacknowledged_restart_seconds
            ):
                restart_reason = "mcp_client_unacknowledged_disconnect_timeout"
            alive = restart_reason is None
            print(json.dumps({
                "alive": alive,
                "client": client,
                "unacknowledged_disconnect_for_seconds": unacknowledged_for,
                "unacknowledged_disconnect_restart_seconds": unacknowledged_restart_seconds,
                "timeout_config_error": timeout_config_error,
                "probe_state_error_class": probe_state_error,
                "restart_reason": restart_reason,
            }, sort_keys=True))
            return 0 if alive else 1

        with open("/opt/data/config.yaml", encoding="utf-8") as config_file:
            configured = configured_tool_names(config_file.read())
        missing_configured = sorted(REQUIRED - configured)
        unexpected_configured = sorted(configured - REQUIRED)
        server_ready, missing_server_tools, server_error = mcp_server_ready()
        ready = (
            not missing_configured
            and not unexpected_configured
            and server_ready
            and client["state"] == "connected"
            and not client["fatal"]
        )
        print(json.dumps({
            "ready": ready,
            "client": client,
            "missing_configured_tools": missing_configured,
            "unexpected_configured_tools": unexpected_configured,
            "missing_server_tools": missing_server_tools,
            "mcp_server_error_class": server_error,
            "probe_state_error_class": probe_state_error,
        }, sort_keys=True))
        return 0 if ready else 1

    if __name__ == "__main__":
        sys.exit(main())

  config.yaml: |
    # Hermes profile config for the Verdify Iris planner — single profile,
    # Cortex OpenAI-compatible 98K text route with explicit context/output budgets,
    # tool-call guidance, and an MCP-only tool surface.
    #
    # Canonical source: hermes/iris/config.yaml (this repo).
    # Runtime location: /var/lib/verdify/hermes/iris/config.yaml (bind-mounted into
    # the hermes-iris Docker container per docker-compose.yml).
    #
    # Deploy: this file is copied to the runtime location via
    # `make hermes-deploy-config`. Runtime secrets live in
    # /etc/verdify/hermes-iris.env, are injected by docker-compose.yml, and are
    # NEVER versioned.

    model:
      # Hermes reaches OpenAI-compatible endpoints through the "custom" provider.
      # The existing OPENAI_API_KEY environment contract remains unchanged;
      # llm.primary.longctx is Cortex's text-only planner route alias, not a raw
      # model name. Pin the published route contract explicitly so Hermes never
      # falls back to its 256K unknown-model assumption.
      default: "llm.primary.longctx"
      provider: "custom"
      base_url: "https://cortex.vallery.net/v1"
      context_length: 98304
      # Use Cortex's verified 16,384-token route cap. The former 8,192-token client
      # fence could truncate a serialized set_plan call before it reached MCP;
      # Cortex still bounds every response at this value server-side.
      max_tokens: 16384

    agent:
      # The bundled custom transport does not forward this scalar. Cortex route 42
      # supplies the verified medium default server-side on vLLM 0.27.1; retaining
      # it here records the client contract and catches future provider support.
      reasoning_effort: medium
      # Iris's longest cycles (SUNRISE/SUNSET) read ~6-10 MCP tools in sequence
      # plus write a plan. 30 turns is generous; over that, suspect a tool-call
      # loop and surface as a Hermes alert instead of letting the cycle run away.
      max_turns: 30
      # Hermes-side capabilities Verdify doesn't want in the production planner.
      # Memory: Verdify already has TimescaleDB-backed plan_journal + planner_lessons.
      # Web/browser/terminal/filesystem: Iris must not browse the live site, exec
      # shell commands, read raw files, or hit arbitrary URLs. Every write goes
      # through the MCP allowlist below.
      disabled_toolsets:
        - memory
        - web
        - terminal
        - filesystem
        - browser

    mcp_servers:
      verdify_greenhouse:
        url: "http://verdify-mcp.verdify-prod.svc:8000/mcp"   # k3s: was host.docker.internal:8000 (VM compose); in-cluster ClusterIP (#211/#119 R7)
        headers:
          Authorization: "Bearer ${VERDIFY_MCP_TOKEN}"
        tools:
          include:
            # Monitoring
            - climate
            - scorecard
            - equipment_state
            - forecast
            - get_setpoints
            - plan_status
            - history
            - alerts
            - slack_ops
            # Knowledge
            - lessons
            - lessons_search       # Phase 3
            - knowledge_search     # Phase 3
            # Crops + topology
            - crops
            - observations
            - topology
            - position_current
            - crop_history
            - crop_lifecycle
            # Writes — all carry trigger_id + planner_instance audit
            - set_plan
            - set_tunable
            - acknowledge_trigger
            - plan_evaluate
            - lessons_manage
          exclude:
            - query  # raw-SQL escape hatch — deliberately denied in production
          resources: false
          prompts: false

    skills:
      # Hermes own skill system is dormant for Verdify — Iris's identity + tactics
      # come from gather-plan-context.sh + _STANDING_DIRECTIVES + _PLANNER_CORE
      # in ingestor/iris_planner.py. Guarding new skills protects against drift.
      guard_agent_created: true

    # API server: loopback only. The ingestor calls /v1/runs from the same host.
    # api_server platform: Hermes reads under platforms.<name>.extra (see
    # /opt/hermes/gateway/config.py:PlatformConfig). API_SERVER_KEY env var
    # is the actual auth source — config.api_key_env is not a Hermes schema.
    platforms:
      api_server:
        enabled: true
        extra:
          host: "0.0.0.0"   # container-internal; docker-compose binds 127.0.0.1
          port: 8642

    # Dashboard off — the API server is the only interface. Avoids accidental
    # port-forward exposure.
    dashboard:
      enabled: false
