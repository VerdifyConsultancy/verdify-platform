apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: the hermes-iris planner gateway (#119). Referenced by
# overlays/prod via `components:` — NOT a base resource, so each overlay must
# opt in explicitly. The image is the UPSTREAM nousresearch/hermes-agent @sha256
# digest from compose, deliberately PRESERVED (the overlay images: transformer
# only matches the verdify-* app names, so it is left byte-identical). State PVC +
# verdify-hermes / verdify-hermes-slack Secrets are provided out-of-band; this
# component is INERT until the verdify-prod ArgoCD app + Longhorn storage
# classes exist (laptop-root gate). See hermes-iris.yaml header.
resources:
  - hermes-iris.yaml
  # #213 IaC Hermes profile (gpt-5.6-sol/xhigh/OpenAI + in-cluster MCP url), seeded onto the
  # state PVC by the seed-config initContainer so it can never silently drift back
  # to the stock openrouter/anthropic template that 401'd every planner LLM call.
  - hermes-config.yaml
