apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: the hermes-iris planner gateway (#119). Referenced by
# overlays/prod via `components:` — NOT a base resource, so it never renders into
# overlays/staging (the only overlay the live verdify-local-staging ArgoCD app
# syncs). The image is the UPSTREAM nousresearch/hermes-agent @sha256 digest from
# compose, deliberately PRESERVED (the overlay images: transformer only matches
# the verdify-* app names, so it is left byte-identical). State PVC +
# verdify-hermes / verdify-hermes-slack Secrets are provided out-of-band; this
# component is INERT until the verdify-prod ArgoCD app + synology-iscsi-ssd
# StorageClass exist (laptop-root gate). See hermes-iris.yaml header.
resources:
  - hermes-iris.yaml
