# Verdify hermes-iris — the sole planner gateway (#119).
# Ported from docker-compose.yml:357 (the `hermes` profile service).
#
# WHY A KUSTOMIZE COMPONENT (not a base resource): #5 hard rule — adding this to
# deploy/k8s/base would render it into overlays/staging, which the live
# verdify-local-staging ArgoCD app syncs; we must not add a new workload to
# staging. Referenced ONLY by overlays/prod (and optionally dev). hermes is NOT a
# device writer (it reaches the MCP tool surface in-cluster), but its run state +
# OpenAI key make it a prod-anchored gateway; prod is its canonical home.
#
# IMAGE DIGEST PRESERVED (NOT transformer-rewritten): the image is the upstream
# nousresearch/hermes-agent pinned to the EXACT @sha256 from compose
# (a7111ab1...aec72e). It is NOT a ghcr.io/verdifyconsultancy/* app image, so the
# overlay images: transformer (which only matches the verdify-* names) leaves it
# untouched — the digest stays byte-identical to the live VM gateway. No mutable
# tag is ever rendered.
#
# LOOPBACK -> CLUSTERIP: on the VM hermes binds 127.0.0.1:8642 and reaches MCP via
# the `host.docker.internal:host-gateway` hack (compose:381). In-cluster both
# become ClusterIP DNS: this Service is verdify-hermes-iris.<ns>.svc:8642 (the
# ingestor's HERMES_URL repoints to it via verdify-config), and hermes reaches MCP
# at verdify-mcp.<ns>.svc:8000. The container still binds 0.0.0.0 inside the pod;
# the surface is ClusterIP + NetworkPolicy (never an LB, never WAN) — same posture
# as the loopback bind it replaces.
#
# MCP-URL GATE (migration doc R7): the MCP URL hermes calls lives in the
# out-of-band /etc/verdify/hermes-iris.env (verdify-hermes Secret), NOT in this
# repo. It MUST be repointed to verdify-mcp.<ns>.svc:8000 in that sealed env
# BEFORE the systemd MCP is stopped, or hermes fails at tool-call time (not
# startup). This manifest is the reviewable target shape; the env repoint is a
# gated handoff step.
#
# STATE PVC: compose mounts host /var/lib/verdify/hermes/iris -> /opt/data. In
# k3s this is a PVC on the volume1 'synology-iscsi-ssd' StorageClass (laptop-root
# gate, same as the per-env DBs). The slack.yaml referenced by
# VERDIFY_SLACK_CONFIG=/opt/data/slack.yaml lives on that PVC; the NON-SECRET
# slack channel config is also available from the verdify-hermes-slack mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-hermes-iris-data
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
spec:
  accessModes: ["ReadWriteOnce"]
  # volume1 iSCSI SSD class (laptop-root-provisioned). Same gate as the per-env
  # DB StatefulSets; INERT until the StorageClass exists.
  storageClassName: synology-iscsi-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-hermes-iris
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: hermes-iris
  strategy:
    # Recreate: single gateway holding the RWO state PVC; no two pods mount it.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: hermes-iris
    spec:
      imagePullSecrets:
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes-iris
          # UPSTREAM image, digest PRESERVED from compose:363 (NOT rewritten by
          # the overlay images: transformer — name does not match verdify-*).
          image: nousresearch/hermes-agent@sha256:a7111ab1cc43b5a1bc76090a505d6462aa1af4b43f603f0113bf5eb121aec72e
          # MUST be `args:`, NOT `command:`. The image ENTRYPOINT is
          # `tini -g -- /opt/hermes/docker/entrypoint.sh` (verified on the live VM
          # container 2026-06-07), and that entrypoint script is what resolves the
          # `gateway` binary onto PATH. Setting k8s `command:` OVERRIDES the
          # ENTRYPOINT, so the kubelet exec'd `gateway` directly and crashed with
          # `exec: "gateway": executable file not found in $PATH`
          # (CrashLoopBackOff, verified verdify-prod 2026-06-07). `args:` maps to
          # Docker CMD (compose had Cmd=`gateway run`), preserving the entrypoint.
          # Lane-3 fix — this is NOT a NetworkPolicy/DB issue (hermes has no DB dep).
          args: ["gateway", "run"]
          ports:
            - name: gateway
              containerPort: 8642
          envFrom:
            # The OpenAI key + any HERMES_* runtime env (compose env_file
            # /etc/verdify/hermes-iris.env) come from this Secret. Provided
            # out-of-band by the SOPS backend; referenced BY NAME only. The MCP
            # URL inside it MUST point at verdify-mcp.<ns>.svc:8000 (R7 gate).
            - secretRef:
                name: verdify-hermes
          env:
            # compose:375 VERDIFY_SLACK_CONFIG=/opt/data/slack.yaml (on the PVC).
            - name: VERDIFY_SLACK_CONFIG
              value: /opt/data/slack.yaml
            # BIND THE :8642 API SERVER ON 0.0.0.0 (CrashLoop fix, verdify-prod
            # 2026-06-07). The api_server platform (the /v1/runs listener the
            # ingestor calls) is auto-enabled because verdify-hermes provides
            # API_SERVER_KEY (gateway/config.py:1386 `if api_server_enabled or
            # api_server_key`). But Hermes' DEFAULT_HOST is 127.0.0.1
            # (gateway/platforms/api_server.py:57) — proven: with only the secret
            # the gateway binds 127.0.0.1:8642, so the kubelet tcpSocket probe to
            # the POD IP is refused, fails 3x, SIGTERMs the gateway -> CrashLoop.
            # On the VM hermes/iris/config.yaml set platforms.api_server.extra
            # host: 0.0.0.0 (and docker-compose published 127.0.0.1 externally);
            # in k3s /opt/data is an empty PVC so that config.yaml is absent and
            # the entrypoint falls back to the cli-config example (no api_server,
            # default 127.0.0.1). These two env vars are the k8s-native port of
            # that config.yaml host override — non-secret bind params only; the
            # ClusterIP Service + allow-hermes-from-ingestor NetworkPolicy keep the
            # surface in-namespace (never LB, never WAN). API_SERVER_KEY stays the
            # auth source (in verdify-hermes, never in this repo).
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
          securityContext:
            allowPrivilegeEscalation: false
            # hermes writes run state under /opt/data (PVC); root FS can stay RO.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # From compose deploy.resources.limits (4G / 2 cpu).
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # NON-SECRET slack channel config (compose:371 /etc/verdify/slack RO).
            - name: slack-config
              mountPath: /etc/verdify/slack
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verdify-hermes-iris-data
        - name: slack-config
          secret:
            secretName: verdify-hermes-slack
            optional: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-hermes-iris
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
spec:
  # ClusterIP only — replaces the VM loopback 127.0.0.1:8642 bind. The ingestor
  # reaches it via HERMES_URL=http://verdify-hermes-iris.<ns>.svc:8642. Never an
  # LB, never WAN.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: hermes-iris
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
---
# Ingress allow: the base default-deny-ingress otherwise drops all inbound. Accept
# 8642 only from the in-namespace ingestor (the sole caller of /v1/runs). hermes
# itself reaches MCP via plain egress (in-namespace ClusterIP), covered by the
# namespace's egress posture.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-from-ingestor
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: hermes-iris
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hermes-iris
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ingestor
      ports:
        - protocol: TCP
          port: 8642
