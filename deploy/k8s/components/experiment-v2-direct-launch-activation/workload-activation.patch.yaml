apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    metadata:
      annotations:
        # Preserve the attended-proof pod-template token byte-for-byte while
        # authority moves to the durable launch component. The identical env
        # and annotation avoid a second Recreate of the sole device writer.
        verdify.io/direct-proof-activation: "2026-08-27-jason-vallery"
    spec:
      containers:
        - name: ingestor
          image: registry.vallery.net/verdifyconsultancy/verdify-ingestor@sha256:f918ec3405d75e205d601e3adfbbcf000131170c973acd98778be8da47e760cb
          env:
            - name: VERDIFY_POLICY_VECTOR_MODE
              value: "off"
            - name: VERDIFY_COMPONENT_EXPERIMENT_ENABLED
              value: "enabled"
            - name: VERDIFY_ACTIVE_EXPERIMENT_ID
              value: "45039c86-c1d9-52f6-a0a9-d94a17bc4b14"
---
