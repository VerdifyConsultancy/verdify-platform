apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
spec:
  template:
    spec:
      containers:
        - name: mcp
          env:
            # Dedicated protocol-only audience; no operational tool permissions.
            # Source-owned Secret must reconcile before this workload rollout.
            - name: VERDIFY_MCP_TOKEN_OBSERVER
              valueFrom:
                secretKeyRef:
                  name: verdify-mcp-observer
                  key: token
