apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: the verdify-lab Quartz research-site workload (#124).
# Referenced explicitly by the live prod overlay via `components:` —
# deliberately NOT a base resource so it never auto-renders into every future
# overlay. See lab-site.yaml for the full rationale. This is the legacy Quartz
# bootstrap runtime pending #482; routine content comes from the S3-backed
# publisher. Any replacement image follows the in-cluster Kaniko/Zot promotion
# path, never the retired cross-repository GitHub publisher.
resources:
  - lab-site.yaml
  - lab-publisher.yaml
