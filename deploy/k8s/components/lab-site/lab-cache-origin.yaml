apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-lab-cache-origin-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-cache-origin
data:
  default.conf: "server {\n  listen 8080;\n  server_name _;\n  absolute_redirect off;\n\
    \  add_header Cache-Control \"no-store\" always;\n  location = /manifest.json\
    \ { alias /origin/publisher/manifests/public.json; default_type application/json;\
    \ }\n  location = /publication-status.json { alias /origin/publisher/state/publish-status.json;\
    \ default_type application/json; }\n  location /public/ { alias /origin/publisher/public/;\
    \ autoindex off; }\n  location / { return 404; }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-lab-cache-origin
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-cache-origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: lab-cache-origin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: lab-cache-origin
        verdify.ai/lab-cache-cohort: portable-rwo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                verdify.ai/lab-cache-cohort: portable-rwo
            topologyKey: kubernetes.io/hostname
      containers:
      - name: origin
        image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /manifest.json
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: origin
          mountPath: /origin
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: origin
        persistentVolumeClaim:
          claimName: verdify-lab-site-cache
          readOnly: true
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: config
        configMap:
          name: verdify-lab-cache-origin-config
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-lab-cache-origin
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-cache-origin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: lab-cache-origin
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-lab-cache-origin
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-cache-origin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lab-cache-origin
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: lab-site
    ports:
    - port: 8080
      protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-lab-serving-cache-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-site
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lab-site
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: lab-cache-origin
    ports:
    - port: 8080
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
