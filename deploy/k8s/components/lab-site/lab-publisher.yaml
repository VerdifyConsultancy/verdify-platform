apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-lab-site-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-site
    app.kubernetes.io/name: verdify-lab
    storage.vallery.net/policy: rebuildable-single-replica
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-v1-rebuildable-rwo
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-lab-publisher-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
data:
  LAB_S3_PREFIX: lab
  LAB_PUBLISH_REASON: k3s-cron
  LAB_LOCAL_TIMEZONE: America/Denver
  TZ: America/Denver
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-lab-publisher
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
spec:
  schedule: "*/10 * * * *"
  # Re-enabled after the repaired image passed its production recovery canary
  # on 2026-07-11: one bounded attempt per step, 323 pages emitted, all S3
  # deltas completed, and the database restart count remained unchanged.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # The publisher itself is normally brief, but preparing the private work
      # root can take about 12 minutes when the durable cache must pull the
      # current ~400 MiB S3 tree. Allow that cold-cache phase plus the bounded
      # five-minute rebuild without letting a disconnected generator retain the
      # DB or cache PVC indefinitely. Forbid concurrency still prevents overlap
      # with the ten-minute schedule while a run is active.
      activeDeadlineSeconds: 1800
      # A failed publisher can leave its canceled/disconnected PostgreSQL query
      # running until the backend reaches a send boundary. Retrying the pod in
      # the same Job then overlaps another full export despite Forbid at the
      # CronJob level, which exhausted the production DB memory limit.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: lab-publisher
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
            - name: ghcr-jvallery-readonly
          # STORAGE PLACEMENT (load-bearing). verdify-lab-site-cache is
          # ReadWriteOnce on longhorn-v1-rebuildable-rwo and attached to node6. An
          # RWO volume can be mounted by several pods only when they share a node,
          # so the surge pod of a rolling update must land on the same node as the
          # pod it replaces. Without this pin the new pod can be scheduled
          # elsewhere, fail to attach, and stall the rollout indefinitely (the old
          # pod keeps serving, so it fails quietly rather than loudly). Was live as
          # an unrecorded hand patch until 2026-07-27; codified here so a sync
          # cannot drop it.
          nodeSelector:
            kubernetes.io/hostname: vm-k3s-node6
          tolerations:
            - key: maintenance.vallery.net/longhorn-recovery
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: prepare-private-work-root
              image: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
              imagePullPolicy: IfNotPresent
              command:
                - prepare-lab-cache
                - --root
                - /work/publisher
                - --legacy
                - /work/public
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: lab-cache
                  mountPath: /work
          containers:
            - name: publisher
              image: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
              imagePullPolicy: IfNotPresent
              command: ["lab-publish-k3s"]
              envFrom:
                - configMapRef:
                    name: verdify-config
                - configMapRef:
                    name: verdify-lab-publisher-config
                - secretRef:
                    name: verdify-lab-publisher-s3
              env:
                - name: LAB_WORK_ROOT
                  value: /work/publisher
                # Production CronJobs fail soft after one bounded attempt per
                # generator. Host/manual publishers retain the script's retry
                # default, but repeating a 45s analytical/API failure inside a
                # scheduled Job previously created the DB-pressure storm in
                # #454.
                - name: VERDIFY_PUBLISH_STEP_RETRIES
                  value: "1"
                # 60 -> 180 (2026-07-11 21:00Z): the Quartz rebuild step
                # exceeds 60s on a cold site cache (the cache PVC was
                # recreated in the storage migration), so every run since
                # ~17:45Z failed that step. One attempt per step and the
                # 45s DB statement_timeout keep the #454 pressure profile.
                - name: VERDIFY_PUBLISH_STEP_TIMEOUT
                  value: "180"
                # Quartz crossed the generic 180-second generator ceiling as
                # the public tree grew. Keep generators tightly bounded while
                # allowing only the final local rebuild up to five minutes.
                # The Job's 1800-second deadline remains the outer hard stop.
                - name: VERDIFY_PUBLISH_REBUILD_TIMEOUT
                  value: "300"
                # Bound report-generation queries so a public-site refresh can
                # never starve the control database. PGOPTIONS is consumed by
                # the psql shim/libpq clients used by the publisher scripts.
                - name: PGOPTIONS
                  value: "-c application_name=verdify-lab-publisher -c statement_timeout=45000 -c work_mem=4MB -c max_parallel_workers_per_gather=1"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              volumeMounts:
                - name: lab-cache
                  mountPath: /work
          volumes:
            - name: lab-cache
              persistentVolumeClaim:
                claimName: verdify-lab-site-cache
