apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-lab-site-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-site
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-v1-rebuildable-rwo
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-lab-publisher-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
data:
  LAB_S3_PREFIX: lab
  LAB_PUBLISH_REASON: k3s-cron
  LAB_LOCAL_TIMEZONE: America/Denver
  TZ: America/Denver
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-lab-publisher
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
spec:
  schedule: "*/10 * * * *"
  # Production verification on 2026-07-10 found that the publisher's internal
  # per-step retries can still drive unsafe DB pressure despite the statement
  # timeout and Job backoff guards below. Keep paused until #454 is accepted.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # The normal publish is roughly 1-3 minutes. Bound cold-cache/S3 cases to
      # ten minutes so a disconnected optional generator cannot retain the DB
      # or cache PVC indefinitely.
      activeDeadlineSeconds: 600
      # A failed publisher can leave its canceled/disconnected PostgreSQL query
      # running until the backend reaches a send boundary. Retrying the pod in
      # the same Job then overlaps another full export despite Forbid at the
      # CronJob level, which exhausted the production DB memory limit.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: lab-publisher
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-jvallery-readonly
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              image: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
              imagePullPolicy: IfNotPresent
              command: ["lab-publish-k3s"]
              envFrom:
                - configMapRef:
                    name: verdify-config
                - configMapRef:
                    name: verdify-lab-publisher-config
                - secretRef:
                    name: verdify-lab-publisher-s3
              env:
                # Production CronJobs fail soft after one bounded attempt per
                # generator. Host/manual publishers retain the script's retry
                # default, but repeating a 45s analytical/API failure inside a
                # scheduled Job previously created the DB-pressure storm in
                # #454.
                - name: VERDIFY_PUBLISH_STEP_RETRIES
                  value: "1"
                - name: VERDIFY_PUBLISH_STEP_TIMEOUT
                  value: "60"
                # Bound report-generation queries so a public-site refresh can
                # never starve the control database. PGOPTIONS is consumed by
                # the psql shim/libpq clients used by the publisher scripts.
                - name: PGOPTIONS
                  value: "-c application_name=verdify-lab-publisher -c statement_timeout=45000 -c work_mem=4MB -c max_parallel_workers_per_gather=1"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              volumeMounts:
                - name: lab-cache
                  mountPath: /work
          volumes:
            - name: lab-cache
              persistentVolumeClaim:
                claimName: verdify-lab-site-cache
