apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-lab-site-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-site
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-nvme-agent-rwx
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-lab-publisher-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
data:
  LAB_S3_PREFIX: lab
  LAB_PUBLISH_REASON: k3s-cron
  LAB_LOCAL_TIMEZONE: America/Denver
  TZ: America/Denver
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-lab-publisher
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-publisher
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: lab-publisher
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-jvallery-readonly
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              image: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
              imagePullPolicy: IfNotPresent
              command: ["lab-publish-k3s"]
              envFrom:
                - configMapRef:
                    name: verdify-config
                - configMapRef:
                    name: verdify-lab-publisher-config
                - secretRef:
                    name: verdify-lab-publisher-s3
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              volumeMounts:
                - name: lab-cache
                  mountPath: /work
          volumes:
            - name: lab-cache
              persistentVolumeClaim:
                claimName: verdify-lab-site-cache
