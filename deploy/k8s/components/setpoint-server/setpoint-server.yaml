# Verdify setpoint-server — grow-light writer + setpoint diagnostics (#118).
# Built from scripts/Dockerfile.setpoint-server (scripts/setpoint-server.py).
#
# WHY A KUSTOMIZE COMPONENT (not a base resource): components are opt-in so the
# prod overlay controls exactly which workloads render. This component is
# referenced ONLY by overlays/prod. It is a DEVICE-AFFECTING writer (toggles the
# live grow lights via HA), so it is PROD-ONLY. Same containment posture as the
# prod-only fan-out mqtt-broker.
#
# DEVICE SAFETY: the grow-light write reaches Home Assistant (192.168.30.107:8123)
# on the services VLAN, which the prod allow-ingestor-device-egress NetworkPolicy
# already permits for the prod namespace. The :6053 ESP32 native-API path is NOT
# used by this service (the ESP32 is push-target of the ingestor, not the
# dispatcher — migration doc §0.1). Bringing the live grow-light path onto k3s is
# a safety-checked cutover (handoff §6); this manifest is the reviewable target shape.
#
# DB + HA TOKEN (migration doc §A1 code gate): the running script today resolves
# localhost:5432 and reads HA_TOKEN_FILE=/mnt/agents/shared/credentials/ha_token.txt.
# Here we supply DB via verdify-config (DB_HOST=verdify-db) + the verdify-app-secrets
# password, and mount the HA token Secret (verdify-ha-token) at the SAME path so
# load_token() keeps working unchanged. The env-first DSN refactor (setpoint-server.py
# :241) is the gated prerequisite to actually run in-cluster — see the Dockerfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-setpoint-server
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: setpoint-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: setpoint-server
  strategy:
    # Recreate: a single grow-light writer at a time (mirrors the ingestor
    # single-writer posture for any device-affecting path). Light state is held
    # in the DB (equipment_state), not in the pod.
    type: Recreate
  template:
    metadata:
      annotations:
        # GitOps-owned rollout trigger (#587, audit §8.10): verdify-config is
        # consumed via envFrom, so a ConfigMap edit alone does NOT restart this
        # pod. Maintained by scripts/gen-config-revision.sh — do NOT hand-edit
        # (the CI gate recomputes it).
        verdify.io/config-revision: "a850d82acadb"
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: setpoint-server
    spec:
      imagePullSecrets:
        - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
        - name: ghcr-jvallery-readonly
      # The HA writer needs services-VLAN access but no GPU. Select the general
      # worker class without hard-pinning a hostname so scheduler failover stays
      # available across the eligible pool.
      nodeSelector:
        agentfleet.vallery.net/node-class: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: timescale/timescaledb:2.25.2-pg16
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do echo "waiting for db"; sleep 2; done
          envFrom:
            - configMapRef:
                name: verdify-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: setpoint-server
          # Pinned to an immutable @sha256 digest by the overlay images:
          # transformer (NEVER a mutable tag). Image name only here.
          image: ghcr.io/verdifyconsultancy/verdify-setpoint-server
          command: ["python", "scripts/setpoint-server.py"]
          ports:
            - name: http
              containerPort: 8200
          envFrom:
            - configMapRef:
                name: verdify-config   # DB_HOST/DB_PORT/DB_NAME/DB_USER + HA_URL
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            # NO composed VERDIFY_DB_DSN here: k8s $(VAR) expansion cannot see
            # envFrom variables, so the composed value arrived as a raw
            # "$(DB_USER):..." literal. The §A1 env-first get_db_url() (landed
            # 2026-06-10) builds the DSN from DB_HOST/DB_PORT/DB_NAME/DB_USER
            # (envFrom verdify-config) + POSTGRES_PASSWORD (secretKeyRef) at
            # runtime instead.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # HA token mounted at the SAME path the script reads
            # (HA_TOKEN_FILE=/mnt/agents/shared/credentials/ha_token.txt) so
            # load_token() works unchanged. Real token via the verdify-ha-token
            # Secret (out-of-band SOPS); local builds use the placeholder file.
            - name: ha-token
              mountPath: /mnt/agents/shared/credentials
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ha-token
          secret:
            secretName: verdify-ha-token
            items:
              - key: ha_token.txt
                path: ha_token.txt
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-setpoint-server
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: setpoint-server
spec:
  # ClusterIP only — diagnostics surface, NOT ESP32-facing (the ESP32 is a
  # passive ESPHome device pushed to by the ingestor; migration doc §0.1). No LB.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: setpoint-server
  ports:
    - name: http
      port: 8200
      targetPort: http
