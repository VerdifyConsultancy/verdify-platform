apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Staged ordinary API/ingestor database-owner retirement (migration 217).
# No active overlay references this component. Provision the four named Secret
# keys first, render and review the target, then activate it as a distinct
# GitOps rollout while the experiment component remains OFF. The application
# processes independently attest the exact login/duty pair at startup.
resources:
  - bootstrap-job.yaml

images:
  # Declare the logical key inside the Component so the consuming overlay's
  # immutable migrate transformer also reaches this late-added hook resource.
  - name: ghcr.io/verdifyconsultancy/verdify-migrate

patches:
  - path: api-runtime.patch.yaml
  - path: ingestor-runtime.patch.yaml
