apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Ordinary API/ingestor database-owner retirement (migration 217). Production
# adopts this component only after the four protected Secret keys have a
# metadata-only reconciliation receipt. The PreSync bootstrap installs and
# attests both roles before the rollout while the experiment remains OFF; each
# ordinary process independently attests its exact login/duty pair at startup.
resources:
  - bootstrap-job.yaml

images:
  # Declare the logical key inside the Component so the consuming overlay's
  # immutable migrate transformer also reaches this late-added hook resource.
  - name: ghcr.io/verdifyconsultancy/verdify-migrate

patches:
  - path: api-runtime.patch.yaml
  - path: ingestor-runtime.patch.yaml
