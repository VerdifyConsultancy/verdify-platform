apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    metadata:
      annotations:
        verdify.io/randomized-day1-stage: "emergency-hold"
    spec:
      containers:
        - name: ingestor
          env:
            - name: VERDIFY_POLICY_VECTOR_MODE
              value: "off"
            - name: VERDIFY_COMPONENT_EXPERIMENT_ENABLED
              value: "off"
            - name: VERDIFY_ACTIVE_EXPERIMENT_ID
              value: ""
---
