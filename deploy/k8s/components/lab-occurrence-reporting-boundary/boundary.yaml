apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-lab-occurrence-reporting-boundary
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-occurrence-exporter
data:
  activation: blocked
  policyVersion: lab-public-reporting-v2
  sourceOccurrenceManifestSha256: e455309736cf785914141d1641ec2569f623e048cf9073b3ea6fce181726160d
  reportingFeedContract: verdify.operator-public-reporting-feed/v1
  reportingFeedAuthority: operator-owned
  reportingFeedDirection: one-way-read-only
  reportingCredentialClass: reporting-read-only
  trackAPrimaryRoleAllowed: "false"
  existingAnonymousGraphsAllowed: "false"
  sourceWatermarkP95TargetSeconds: "900"
  sourceWatermarkStaleAfterSeconds: "1800"
  maxBatchProcessingDelaySeconds: "300"
  maxClockSkewSeconds: "60"
  cameraMethod: GET
  cameraOrigin: https://api.verdify.ai
  cameraPathAllowlist: /api/v1/public/cameras/greenhouse_1/latest.jpg?h=1080,/api/v1/public/cameras/greenhouse_2/latest.jpg?h=1080
  cameraRedirectsAllowed: "false"
  cameraAuthorization: forbidden
  cameraRequestProvenance: sha256-of-occurrence-method-exact-url-redirect-auth-cookie-contract
  cameraSanitization: decode-reencode-rgb-or-rgba-png-metadata-free
  futureEgressContract: api.verdify.ai:443-and-occurrence-store-only
  requiredSafeguards: source-activated-policy,operator-owned-reporting-feed,least-privilege-reporting-credential
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-lab-occurrence-exporter
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-occurrence-exporter
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-lab-occurrence-exporter-until-activation
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: lab-occurrence-exporter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lab-occurrence-exporter
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
