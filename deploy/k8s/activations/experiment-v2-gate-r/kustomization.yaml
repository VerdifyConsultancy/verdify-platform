apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberate recovery-only render. No ArgoCD Application points here and the
# ordinary production overlay never includes this component.
resources:
  - ../../overlays/prod

# During the attended M8.1 recovery transaction the exact component and
# activation patch live in the canonical production overlay so the Argo
# Application source remains deploy/k8s/overlays/prod. Restore this standalone
# dormant wrapper after the one-shot receipt is retained.
