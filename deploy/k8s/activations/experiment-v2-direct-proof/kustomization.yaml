apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberate one-shot render only. No ArgoCD Application points here, and the
# ordinary deploy/k8s/overlays/prod render never references this directory.
resources:
  - ../../overlays/prod

# Do not rely on Argo CD's destination namespace injection for the outer
# component resources.  The nested production overlay already uses this exact
# namespace, so this also makes local and server-side render validation match
# the one-sync production apply.
namespace: verdify-prod

# The canonical prod overlay contains this component during the one-shot
# activation. Readding it here would duplicate object IDs; this outer render
# remains a dormant verification shape through its local override patch.

patches:
  - path: activation-values.patch.yaml
