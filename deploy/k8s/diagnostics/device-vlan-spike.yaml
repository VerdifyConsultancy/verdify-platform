# ============================================================================
# THROWAWAY DIAGNOSTIC POD — Device-VLAN reachability + latency spike (§3.4)
# ============================================================================
#
# Handoff refs: §3.3 (ingestor is the only device-touching workload) and §3.4
# (device-VLAN reachability is the single biggest design risk for moving the
# control loop to k3s). This Pod answers ONE question, read-only:
#
#   "Can a pod on the k3s cluster reach the device-VLAN endpoints the ingestor
#    needs, and is the round-trip latency well inside the 5-10s occupancy->light
#    control SLA?"
#
# IT IS A BARE TCP-CONNECT + RTT PROBE. IT MUST NOT:
#   - open an aioesphomeapi / ESPHome native-API session,
#   - authenticate to the ESP32 (no Noise PSK is mounted; none is referenced),
#   - subscribe to MQTT or publish anything,
#   - push any setpoint / occupancy / OTA, or
#   - mutate the live greenhouse in any way.
# The FIRST real API session or setpoint push from a pod is a SEPARATE, gated
# step that requires exact-target validation (handoff §6, P7 STOP-and-ask).
# This probe deliberately stops at "the TCP handshake completed" and measures
# only how long that handshake took. Track A (greenhouse stays alive) > Track B.
#
# GATING — this Pod does NOT run by default and is NOT in any kustomization:
#   - It lives OUTSIDE deploy/k8s/base and the overlays on purpose; ArgoCD never
#     sees it. It is applied by hand, once, then deleted (restartPolicy: Never).
#   - It only returns meaningful results once a route from pod-net to the device
#     VLANs exists. Per the 2026-05-30 laptop-root spike, plain L3 routing
#     (via 192.168.30.1) already reaches the ESP32 at ~8ms with NO firewall
#     change. ENABLING/CHANGING that route is a STOP-and-ask-Jason / laptop-root
#     networking step and is NOT performed by this manifest. See the runbook:
#     docs/runbooks/device-vlan-spike.md.
#   - No egress NetworkPolicy is bundled here. If the namespace later carries a
#     default-deny-egress policy, the operator adds a scoped, temporary egress
#     allow for THIS pod as a separate validated step (the gated-§3.4 placeholder
#     in deploy/k8s/base/networkpolicy.yaml documents the eventual shape).
#
# HOW TO READ IT: the container prints one line per target:
#   "<name> <host:port> reachable=<y|n> rtt_ms=<float|->  (SLA budget ...)"
# then a PASS/FAIL summary. PASS = every REQUIRED target reachable AND the worst
# RTT is orders of magnitude under the SLA. FAIL on the ESP32 target = the
# ingestor CANNOT move to k3s yet (it stays VM-side; handoff §3.4 Option 2).
# Full interpretation + the PASS/FAIL gate are in the runbook.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: device-vlan-spike
  namespace: verdify-staging
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: diagnostic
    verdify.ai/diagnostic: device-vlan-spike
    verdify.ai/throwaway: "true"
  annotations:
    verdify.ai/purpose: >-
      Read-only device-VLAN TCP-connect + RTT spike (handoff §3.4). No ESPHome
      session, no auth, no setpoint, no MQTT pub/sub. Delete after one run.
    verdify.ai/gated-by: >-
      Route from pod-net to device VLANs is a STOP-and-ask-Jason / laptop-root
      networking step; NOT enabled by this manifest.
spec:
  # Throwaway: run once, exit, never restart. Operator deletes the Pod after.
  restartPolicy: Never
  # No secrets, no service account token — this probe needs neither.
  automountServiceAccountToken: false
  # Tolerate up to ~3 min then self-terminate even if a target hangs (each
  # python connect has its own 3s timeout, so the script finishes far sooner;
  # this is a hard backstop so a wedged probe never lingers).
  activeDeadlineSeconds: 180
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      # Minimal stdlib-only image. python:3.12-alpine ships socket + time; no
      # extra deps, no aioesphomeapi, no paho-mqtt — by design, so this image
      # CANNOT open a device session even by accident.
      image: python:3.12-alpine
      command: ["python3", "-c"]
      args:
        - |
          import socket, time, sys

          # (name, host, port, required, sla_note)
          # REQUIRED targets gate the cutover. Frigate ports are informational
          # (occupancy still flows HA->MQTT even if go2rtc is unreachable).
          TARGETS = [
              ("esp32-native-api", "192.168.10.111", 6053, True,
               "SLA-critical: setpoint/occupancy push + telemetry; <10s budget"),
              ("home-assistant",   "192.168.30.107", 8123, True,
               "REST: Shelly/Tempest/hydro/Lutron service calls + occupancy"),
              ("local-mqtt",       "192.168.30.107", 1883, True,
               "Sentinel occupancy bridge + ESP32 state"),
              ("frigate-api",      "192.168.30.142", 5000, False,
               "go2rtc/Frigate occupancy+camera (informational)"),
              ("frigate-go2rtc",   "192.168.30.142", 1984, False,
               "go2rtc stream API (informational)"),
          ]
          # NOTE: Tempest weather is a DIRECT UDP LAN broadcast to the ESP32
          # (L2-local). It terminates at the ESP32 and is OUT of the pod's path
          # entirely (handoff §3.4 option 3). We deliberately do NOT probe it.

          CONNECT_TIMEOUT = 3.0   # seconds per target
          # Control-loop SLA: occupancy->light must complete in ~5-10s end to
          # end across MANY hops. A single TCP RTT to one device should be a few
          # ms; we flag anything over this as "investigate", not an SLA failure.
          RTT_WATCH_MS = 250.0

          def probe(host, port):
              # Bare TCP connect: SYN/SYN-ACK/ACK only, then immediate close.
              # No payload is sent, no protocol bytes, no auth. This is the
              # least-invasive liveness check possible against the device.
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(CONNECT_TIMEOUT)
              t0 = time.perf_counter()
              try:
                  s.connect((host, port))
                  rtt_ms = (time.perf_counter() - t0) * 1000.0
                  return True, rtt_ms
              except Exception as e:
                  return False, str(e)
              finally:
                  try:
                      s.close()
                  except Exception:
                      pass

          print("=== Verdify device-VLAN reachability spike (read-only) ===")
          print("connect timeout per target: %.1fs | RTT watch: %.0fms\n"
                % (CONNECT_TIMEOUT, RTT_WATCH_MS))

          required_ok = True
          worst_rtt = 0.0
          for name, host, port, required, note in TARGETS:
              ok, info = probe(host, port)
              tag = "REQUIRED" if required else "info"
              if ok:
                  worst_rtt = max(worst_rtt, info)
                  flag = "" if info <= RTT_WATCH_MS else "  [!] over RTT watch"
                  print("%-18s %-22s reachable=y rtt_ms=%.2f  [%s] %s%s"
                        % (name, "%s:%d" % (host, port), info, tag, note, flag))
              else:
                  print("%-18s %-22s reachable=n rtt_ms=-     [%s] %s  err=%s"
                        % (name, "%s:%d" % (host, port), tag, note, info))
                  if required:
                      required_ok = False

          print("\n=== SUMMARY ===")
          print("worst observed TCP RTT: %.2f ms (SLA budget 5000-10000 ms)"
                % worst_rtt)
          if required_ok:
              print("RESULT: PASS — all REQUIRED targets reachable; RTT << SLA.")
              print("Meaning: the ingestor CAN move to k3s (Option 1) pending")
              print("  the egress NetworkPolicy + single-writer cutover")
              print("  choreography (both still protected by runtime safeguards).")
              sys.exit(0)
          else:
              print("RESULT: FAIL — a REQUIRED target is unreachable from the pod.")
              print("Meaning: the ingestor STAYS VM-SIDE (handoff §3.4 Option 2).")
              print("  Do NOT proceed to containerized device pushes. This is a")
              print("  routing/posture finding for Jason/laptop-root, NOT a")
              print("  change to make here.")
              sys.exit(1)
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
