apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This candidate proves the release/cache runtime without creating a public
# route. It is intentionally absent from every active overlay.
namespace: verdify-platform

resources:
  - workload.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: verdify-lab-release-runtime
      verdify.ai/environment: lab-candidate
      verdify.ai/traffic-state: disconnected
    includeSelectors: false
