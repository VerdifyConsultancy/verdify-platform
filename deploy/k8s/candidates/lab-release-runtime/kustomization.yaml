apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This candidate proves the release/cache runtime without creating a public
# route. Lab stage includes it only through a replicas: 0 dormant patch and
# zero-digest image sentinels; no overlay activates it.
namespace: verdify-platform

resources:
  - workload.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: verdify-lab-release-runtime
      verdify.ai/environment: lab-candidate
      verdify.ai/traffic-state: disconnected
    includeSelectors: false
