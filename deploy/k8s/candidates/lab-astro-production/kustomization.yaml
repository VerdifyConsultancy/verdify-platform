apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is a disconnected production cutover candidate, not another environment.
# It is deliberately absent from overlays/prod until its immutable image digest
# is promoted and the separate human cutover gate is approved.
namespace: verdify-prod

resources:
  - workload.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: verdify-lab-astro-green
      verdify.ai/environment: production
      verdify.ai/release-track: green
      verdify.ai/traffic-state: disconnected
    includeSelectors: false
