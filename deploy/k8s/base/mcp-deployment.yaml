# Verdify MCP — the Iris/Hermes planner's ONLY tool surface (mcp/server.py,
# FastMCP streamable-http). ClusterIP-only, non-root (handoff §3.2).
#
# DANGER SURFACE: enforce mode authenticates every /mcp request before FastMCP
# handles initialize or exposes tool inventory, then applies the audience matrix
# again at tool dispatch. NetworkPolicy additionally restricts ingress to
# in-namespace clients and to pods labelled `verdify.ai/mcp-agent: "true"`
# (allow-mcp-from-named-agents, VD-59); this service is NEVER given a raw LB IP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
  annotations:
    # Argo waits for this Deployment to become Healthy before advancing to
    # Hermes, so the gateway never starts against a half-rolled tool surface.
    # Deployment metadata only: changing the wave does not replace MCP pods.
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        # GitOps-owned rollout trigger (#587, audit §8.10): verdify-config is
        # consumed via envFrom, so a ConfigMap edit alone does NOT restart this
        # pod. Maintained by scripts/gen-config-revision.sh — do NOT hand-edit
        # (the CI gate recomputes it).
        verdify.io/config-revision: "71e8b8510a2c"
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: verdify-mcp
      automountServiceAccountToken: false
      # Private in-org images live at ghcr.io/verdifyconsultancy/*. The
      # ghcr-jvallery-readonly secret in the namespace carries host-level
      # (ghcr.io) auth that covers both orgs; reference it explicitly here so
      # the kubelet can pull the pinned @sha256 digests (the namespace default
      # SA has no imagePullSecrets, and we do not mutate it from the overlay).
      imagePullSecrets:
        - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/verdifyconsultancy/verdify-mcp  # pinned to a @sha256 digest by the kustomization images: transformer
          command: ["python", "mcp/server.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: verdify-config   # provides MCP_HTTP_HOST=0.0.0.0, MCP_HTTP_PORT=8000, DB_HOST/PORT/NAME/USER
          env:
            - name: DB_USER
              value: verdify_mcp_runtime_login
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-mcp-runtime-db
                  key: password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-mcp-runtime-db
                  key: password
            # #1351: lessons_search/knowledge_search embed queries with local Cortex
            # embed.main (config/ai.yaml models.embedding); no OpenAI key or host.
            - name: VERDIFY_EMBEDDING_KEY_FILE
              value: /vembed/api_key.txt
            - name: VERDIFY_MCP_RUNTIME_DB_ROLE_REQUIRED
              value: "1"
            # The DB_DSN and the psql helper both use this isolated login.
            - name: DB_DSN
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            # Server-side audience credential for the only currently active
            # MCP client. Hermes receives this same protected value under the
            # legacy VERDIFY_MCP_TOKEN name from verdify-hermes; mapping the
            # existing key to the server's explicit IRIS audience avoids any
            # duplicate secret material. Required (not optional): an absent
            # credential must block the rollout rather than reopen MCP.
            - name: VERDIFY_MCP_TOKEN_IRIS
              valueFrom:
                secretKeyRef:
                  name: verdify-hermes
                  key: VERDIFY_MCP_TOKEN
            # The legacy VM uses a local systemd path unit for immediate site
            # publishing. In k3s, the source-owned lab-publisher CronJob is the
            # publisher; disable the VM-only file trigger instead of writing to
            # the container's intentionally read-only root filesystem.
            # Post-merge restart: verdify-mcp.
            - name: VERDIFY_SITE_PUBLISH_TRIGGER_PATH
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # VD-59: named agent keys, one file per agent (name → bearer token).
            # No subPath: a subPath mount never sees Secret updates, and MCP
            # re-reads this directory at most every 60 s to admit or refuse an
            # agent without a restart. The path is server.py's default
            # VERDIFY_MCP_AGENT_KEYS_DIR.
            - name: mcp-agents
              mountPath: /etc/verdify/mcp-agents
              readOnly: true
            # #1351: the embed.main-only Cortex key (Secret verdify-embedding-cortex).
            - name: embedding-key
              mountPath: /vembed
              readOnly: true
          # GRACEFUL DRAIN (HA #231, Lane C). preStop sleep so Traefik/kube-proxy
          # drop this pod's endpoint before the server stops accepting, avoiding a
          # mid-rollout 503 (same drain contract as www/lab/api).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Liveness remains DB-independent, but readiness is tool-aware: a
          # listening socket is not usable by Hermes if required tools vanished
          # or the DB boundary is unavailable.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
      # Endpoint-drain window for the preStop hook above (HA #231); 30s explicit.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        # Secret verdify-mcp-agents is sealed by Jason in the jvallery/agents
        # KSOPS lane (jvallery/agents#5993). Optional: until it exists the
        # directory is empty, no agent is admitted and MCP runs unchanged.
        # 0440 with the pod's fsGroup 1000 lets the non-root server read it.
        - name: mcp-agents
          secret:
            secretName: verdify-mcp-agents
            optional: true
            defaultMode: 0440
        # verdify-embedding-cortex: a Cortex identity limited to embed.main (key
        # api_key.txt), live in verdify-prod; KSOPS adoption is jvallery/agents#6079.
        # Optional so a missing key fails the two semantic tools closed
        # (embedding_credential_missing) instead of blocking every MCP tool.
        - name: embedding-key
          secret:
            secretName: verdify-embedding-cortex
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP   # never a raw LB IP — DANGER surface (handoff §3.2)
  # mcp/server.py uses MCP SDK >=1.27's stateless Streamable HTTP mode. Every
  # request carries its own bearer audience and protocol context, so kube-proxy
  # may distribute calls across both replicas without Mcp-Session-Id loss.
  sessionAffinity: None
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
