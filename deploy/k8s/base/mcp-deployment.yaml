# Verdify MCP — the Iris/Hermes planner's ONLY tool surface (mcp/server.py,
# FastMCP streamable-http). ClusterIP-only, non-root (handoff §3.2).
#
# DANGER SURFACE: mcp/server.py is on the firmware/safety change list and today
# has NO transport auth (fails open — gravity's "MCP transport failed open"
# anti-pattern). The target adds a fail-CLOSED auth guard, but that is a
# tool-surface code change requiring the full firmware PR artifact set +
# coordinator(iris-dev) + Iris concurrence. This manifest WRAPS/containerizes
# the server WITHOUT changing tool semantics. NetworkPolicy restricts ingress to
# in-namespace clients only; it is NEVER given a raw LB IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: mcp
    spec:
      # Private in-org images live at ghcr.io/verdifyconsultancy/*. The
      # ghcr-jvallery-readonly secret in the namespace carries host-level
      # (ghcr.io) auth that covers both orgs; reference it explicitly here so
      # the kubelet can pull the pinned @sha256 digests (the namespace default
      # SA has no imagePullSecrets, and we do not mutate it from the overlay).
      imagePullSecrets:
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/verdifyconsultancy/verdify-mcp  # pinned to a @sha256 digest by the kustomization images: transformer
          command: ["python", "mcp/server.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: verdify-config   # provides MCP_HTTP_HOST=0.0.0.0, MCP_HTTP_PORT=8000, DB_HOST/PORT/NAME/USER
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            # #81 DB-env reconcile: mcp/server.py reads ONLY DB_DSN (server.py:81)
            # — it does NOT build a DSN from DB_HOST/DB_PASS the way api/main.py
            # does. Without DB_DSN it falls back to localhost:5432 / password
            # 'verdify' (a hardcoded /srv/verdify/.env path that does not exist
            # in-container), so in-cluster it would never reach verdify-db.
            # Construct the DSN here from the ConfigMap connection fields +
            # the Secret password. $(VAR) references resolve against the other
            # env entries (POSTGRES_PASSWORD above + DB_* from envFrom).
            - name: DB_DSN
              value: "postgresql://$(DB_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            # OPENAI_API_KEY: mcp/server.py reads it from the environment for the
            # lessons_search / knowledge_search embedding queries (server.py:2260).
            # There is NO mcp-side .env in-container (the server.py fallback that
            # parses an OPENAI_API_KEY= line from a dotenv path will not find one),
            # so the embedding tools depend on this env being injected. optional:
            # true so the rest of the tool surface still serves if the key is
            # absent — server.py returns a clear "requires OPENAI_API_KEY" error
            # for the two embedding tools rather than crashing (server.py:2340/2405).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: OPENAI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # FastMCP (mcp/server.py) serves the streamable-http MCP protocol at
          # /mcp, not a plain GET /health (the staging proof saw httpGet /health
          # return 404 -> pod never Ready). A tcpSocket probe confirms the process
          # is listening without touching the server.py DANGER surface (handoff
          # §3.2: no tool-semantic edits to add a /health route).
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP   # never a raw LB IP — DANGER surface (handoff §3.2)
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
