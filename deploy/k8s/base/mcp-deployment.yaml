# Verdify MCP — the Iris/Hermes planner's ONLY tool surface (mcp/server.py,
# FastMCP streamable-http). ClusterIP-only, non-root (handoff §3.2).
#
# DANGER SURFACE: mcp/server.py is on the firmware/safety change list and today
# has NO transport auth (fails open — gravity's "MCP transport failed open"
# anti-pattern). The target adds a fail-CLOSED auth guard, but that is a
# tool-surface code change requiring the full firmware PR artifact set +
# coordinator(iris-dev) + Iris compatibility validation. This manifest WRAPS/containerizes
# the server WITHOUT changing tool semantics. NetworkPolicy restricts ingress to
# in-namespace clients only; it is NEVER given a raw LB IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        # GitOps-owned rollout trigger (#587, audit §8.10): verdify-config is
        # consumed via envFrom, so a ConfigMap edit alone does NOT restart this
        # pod. Maintained by scripts/gen-config-revision.sh — do NOT hand-edit
        # (the CI gate recomputes it).
        verdify.io/config-revision: "95cd4503345c"
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: mcp
    spec:
      # Private in-org images live at ghcr.io/verdifyconsultancy/*. The
      # ghcr-jvallery-readonly secret in the namespace carries host-level
      # (ghcr.io) auth that covers both orgs; reference it explicitly here so
      # the kubelet can pull the pinned @sha256 digests (the namespace default
      # SA has no imagePullSecrets, and we do not mutate it from the overlay).
      imagePullSecrets:
        - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/verdifyconsultancy/verdify-mcp  # pinned to a @sha256 digest by the kustomization images: transformer
          command: ["python", "mcp/server.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: verdify-config   # provides MCP_HTTP_HOST=0.0.0.0, MCP_HTTP_PORT=8000, DB_HOST/PORT/NAME/USER
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            # #81 DB-env reconcile: mcp/server.py reads ONLY DB_DSN (server.py:81)
            # — it does NOT build a DSN from DB_HOST/DB_PASS the way api/main.py
            # does. Without DB_DSN it falls back to localhost:5432 / password
            # 'verdify' (a hardcoded /srv/verdify/.env path that does not exist
            # in-container), so in-cluster it would never reach verdify-db.
            # Construct the DSN here from the ConfigMap connection fields +
            # the Secret password. $(VAR) references resolve against the other
            # env entries (POSTGRES_PASSWORD above + DB_* from envFrom).
            - name: DB_DSN
              value: "postgresql://$(DB_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            # The legacy VM uses a local systemd path unit for immediate site
            # publishing. In k3s, the source-owned lab-publisher CronJob is the
            # publisher; disable the VM-only file trigger instead of writing to
            # the container's intentionally read-only root filesystem.
            - name: VERDIFY_SITE_PUBLISH_TRIGGER_PATH
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # GRACEFUL DRAIN (HA #231, Lane C). preStop sleep so Traefik/kube-proxy
          # drop this pod's endpoint before the server stops accepting, avoiding a
          # mid-rollout 503 (same drain contract as www/lab/api).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Liveness remains DB-independent, but readiness is tool-aware: a
          # listening socket is not usable by Hermes if required tools vanished
          # or the DB boundary is unavailable.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
      # Endpoint-drain window for the preStop hook above (HA #231); 30s explicit.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP   # never a raw LB IP — DANGER surface (handoff §3.2)
  # FastMCP streamable-http keeps session state in-process. Keep each client pod
  # pinned to one MCP replica so Hermes session requests do not bounce between
  # pods and return 404/session-terminated during tool calls.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
