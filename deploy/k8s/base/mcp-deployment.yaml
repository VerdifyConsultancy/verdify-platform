# Verdify MCP — the Iris/Hermes planner's ONLY tool surface (mcp/server.py,
# FastMCP streamable-http). ClusterIP-only, non-root (handoff §3.2).
#
# DANGER SURFACE: mcp/server.py is on the firmware/safety change list and today
# has NO transport auth (fails open — gravity's "MCP transport failed open"
# anti-pattern). The target adds a fail-CLOSED auth guard, but that is a
# tool-surface code change requiring the full firmware PR artifact set +
# coordinator(iris-dev) + Iris concurrence. This manifest WRAPS/containerizes
# the server WITHOUT changing tool semantics. NetworkPolicy restricts ingress to
# in-namespace clients only; it is NEVER given a raw LB IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/jvallery/verdify-mcp:latest  # pinned to a digest by the overlay
          command: ["python", "mcp/server.py"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: verdify-config   # provides MCP_HTTP_HOST=0.0.0.0, MCP_HTTP_PORT=8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-mcp
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP   # never a raw LB IP — DANGER surface (handoff §3.2)
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
