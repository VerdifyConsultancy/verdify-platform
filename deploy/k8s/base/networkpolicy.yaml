# NetworkPolicies for the Verdify APP (handoff §2.6 / §3.4). Default-deny
# ingress, then scoped allows. NOTE (2026-06-07): the live cluster CNI DOES
# enforce these Ingress policies at L3/L4 — empirically, a pod whose component
# is absent from an allow-set (e.g. the planner before this fix) gets connection
# refused to verdify-db. Treat every allow-set here as load-bearing, not merely
# declarative. This is also the file where the §3.4 device-VLAN egress allow
# lives (commented, gated).

# 1. Default-deny ALL ingress in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2. DB accepts connections only from api, mcp, ingestor, the migration Job, the
#    planner, and the lab publisher in this namespace. Never from ingress. The
#    planner's wait-for-db init (pg_isready) + its DATABASE_URL connect straight
#    to verdify-db:5432, so DB clients MUST be in this allow-set or they hang at
#    Init:0/1 or get connection-refused (verified live in verdify-prod
#    2026-06-07 and again for lab-publisher on 2026-06-14 — this CNI DOES
#    enforce ingress; see header note).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-app
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "mcp", "ingestor", "migrate", "planner", "lab-publisher"]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdify-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/component: lab-publisher
        # CNI fallback for short-lived CronJob pods: live testing on 2026-06-14
        # showed new Job pods still got connection-refused through the podSelector
        # allow while long-running planner pods could connect. Keep this scoped to
        # the cluster pod CIDR and DB port only; the DB password is still required.
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 5432
---
# 3. API accepts traffic from the Traefik apps ingress namespace (Authentik-
#    fronted, identity headers injected only at that hop and not spoofable).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-ingress
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # MetalLB L2 LoadBalancer traffic for the apps-pool surface arrives from
        # outside the cluster on the apps VLAN.
        - ipBlock:
            cidr: 192.168.7.0/24
      ports:
        - protocol: TCP
          port: 8080
---
# 4. MCP accepts traffic ONLY from in-namespace clients (the planner reaches it
#    by cluster DNS). DANGER surface — never exposed via ingress or LB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-internal
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # hermes-iris (#213): the planner gateway is an MCP CLIENT — its Iris
        # profile reaches the MCP tool surface at verdify-mcp:8000/mcp
        # (repo-owned config mcp_servers). It was missing from this allow,
        # so every hermes->MCP connect was refused ([Errno 111]) the moment the
        # LLM-provider fix let a run reach tool-call time. hermes-iris is a
        # prod-only Component (no such pod in dev/staging), so adding it to this
        # base allow is inert in those overlays. (#119 R7 wired the env URL but
        # never extended this NetworkPolicy — latent until the LLM 401 cleared.)
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "ingestor", "hermes-iris"]
      ports:
        - protocol: TCP
          port: 8000
---
# 5. Allow the observability namespace to scrape /metrics on api & mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "mcp"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: observability
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8000
# ============================================================================
# 6. gated-§3.4 — DEVICE-VLAN EGRESS ALLOW for the ingestor.  *** PLACEHOLDER ***
#
# This is the SINGLE BIGGEST DESIGN RISK and a GATED SPIKE. The egress allow
# below would let the ingestor pod reach the ESP32 (192.168.10.0/24:6053),
# Home Assistant / local MQTT (192.168.30.107), and Frigate (192.168.30.142)
# across VLANs. It is INTENTIONALLY COMMENTED OUT and MUST NOT be enabled here:
#   - It touches firewall/router posture (a *third* VLAN allowance beyond the
#     two-VLAN apps/agents model) and requires explicit Jason confirmation
#     (handoff §3.4 / §6 hard boundary).
#   - It is only meaningful once the device-VLAN reachability + 5-10s latency
#     spike has been PROVEN from a real pod. Until then the ingestor stays
#     VM-side.
# Enabling it is a separate, gated PR — not part of this manifest tree.
# ----------------------------------------------------------------------------
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-ingestor-device-egress
#   labels:
#     app.kubernetes.io/part-of: verdify
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/component: ingestor
#   policyTypes: ["Egress"]
#   egress:
#     # ESP32 ESPHome native API (greenhouse VLAN) — telemetry + setpoint/occupancy push
#     - to:
#         - ipBlock:
#             cidr: 192.168.10.0/24
#       ports:
#         - protocol: TCP
#           port: 6053
#     # Home Assistant REST + local MQTT (services VLAN)
#     - to:
#         - ipBlock:
#             cidr: 192.168.30.107/32
#       ports:
#         - protocol: TCP
#           port: 8123
#         - protocol: TCP
#           port: 1883
#     # Frigate / go2rtc occupancy (services VLAN)
#     - to:
#         - ipBlock:
#             cidr: 192.168.30.142/32
#       ports:
#         - protocol: TCP
#           port: 5000
#         - protocol: TCP
#           port: 1984
# ============================================================================
---
# allow-db-from-agent (#302): admit an in-cluster dev/coding agent pod to the DB
# for READ-ONLY queries (it logs in as the `agent` user — member of agent_ro /
# pg_read_all_data, SELECT-only; DSN in verdify-agent-secrets, migration 184).
# NOTE: today the agent reads prod via `kubectl exec` + scripts/verdify-db.sh,
# which rides the API-server channel and BYPASSES NetworkPolicy — so this rule is
# forward-looking for a future in-namespace agent pod (label
# app.kubernetes.io/component=agent). Mirrors allow-db-from-grafana. A cross-namespace
# agent (e.g. agent-fleet-runners) would need its own namespaceSelector rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-agent
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: 5432
