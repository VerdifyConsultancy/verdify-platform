# NetworkPolicies for the Verdify APP (handoff §2.6 / §3.4). Default-deny
# ingress, then scoped allows. NOTE (2026-06-07): the live cluster CNI DOES
# enforce these Ingress policies at L3/L4 — empirically, a pod whose component
# is absent from an allow-set (e.g. the planner before this fix) gets connection
# refused to verdify-db. Treat every allow-set here as load-bearing, not merely
# declarative. This is also the file where the §3.4 device-VLAN egress allow
# lives (commented, gated).

# 1. Default-deny ALL ingress in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2. DB accepts connections only from api, mcp, ingestor, the migration Job, and
#    the planner in this namespace. Never from ingress. The planner's wait-for-db
#    init (pg_isready) + its DATABASE_URL connect straight to verdify-db:5432, so
#    it MUST be in this allow-set or it hangs at Init:0/1 (verified live in
#    verdify-prod 2026-06-07 — this CNI DOES enforce ingress; see header note).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-app
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "mcp", "ingestor", "migrate", "planner"]
      ports:
        - protocol: TCP
          port: 5432
---
# 3. API accepts traffic from the Traefik apps ingress namespace (Authentik-
#    fronted, identity headers injected only at that hop and not spoofable).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-ingress
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # MetalLB L2 LoadBalancer traffic for the apps-pool surface arrives from
        # outside the cluster on the apps VLAN.
        - ipBlock:
            cidr: 192.168.7.0/24
      ports:
        - protocol: TCP
          port: 8080
---
# 4. MCP accepts traffic ONLY from in-namespace clients (the planner reaches it
#    by cluster DNS). DANGER surface — never exposed via ingress or LB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-internal
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "ingestor"]
      ports:
        - protocol: TCP
          port: 8000
---
# 5. Allow the observability namespace to scrape /metrics on api & mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "mcp"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: observability
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8000
