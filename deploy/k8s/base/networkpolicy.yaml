# 6. gated-§3.4 — DEVICE-VLAN EGRESS ALLOW for the ingestor.  *** PLACEHOLDER ***
#
# This is the SINGLE BIGGEST DESIGN RISK and a GATED SPIKE. The egress allow
# below would let the ingestor pod reach the ESP32 (192.168.10.0/24:6053),
# Home Assistant / local MQTT (192.168.30.107), and Frigate (192.168.30.142)
# across VLANs. It is INTENTIONALLY COMMENTED OUT and MUST NOT be enabled here:
#   - It touches firewall/router posture (a *third* VLAN allowance beyond the
#     two-VLAN apps/agents model) and requires explicit Jason confirmation
#     (handoff §3.4 / §6 hard boundary).
#   - It is only meaningful once the device-VLAN reachability + 5-10s latency
#     spike has been PROVEN from a real pod. Until then the ingestor stays
#     VM-side.
