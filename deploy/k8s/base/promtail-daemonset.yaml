# Promtail — ships pod logs to Loki. DaemonSet (one per node) reading the
# node's pod log dirs.
#
# RUN-READINESS: STAGED — PodSecurity conflict. Node-log collection requires
# hostPath mounts (/var/log/pods, /var/lib/docker/containers) which the
# `restricted` PodSecurity profile enforced on verdify-staging / verdify-prod
# FORBIDS. So this DaemonSet will be REJECTED by the namespace admission
# controller as-is. Two resolutions (laptop-root / monitoring-owner call):
#   (a) run the verdify-tier Promtail in a PSA-baseline/privileged namespace, or
#   (b) DROP this DaemonSet and rely on the cluster's central log collector in
#       the `monitoring` ns (the VM promtail already shipped to an external Loki
#       at 192.168.30.100:3100 — the central collector likely supersedes it).
# Resolution (b) is the most likely given a `monitoring` ns already exists.
# Authored here so the tier is complete + reviewable; do NOT include in an
# overlay that targets a `restricted` namespace without resolving the PSA first.
# (It is intentionally NOT wired into base/kustomization.yaml — see note there.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: verdify-promtail
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: promtail
    spec:
      serviceAccountName: verdify-promtail
      securityContext:
        runAsNonRoot: false   # needs root to read node log files (PSA conflict)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args:
            - -config.file=/etc/promtail/config.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: verdify-promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-promtail
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: promtail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-promtail-config
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: promtail
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      # In-cluster verdify Loki. Repoint to the central monitoring Loki if the
      # tier consolidates there (see DaemonSet header resolution (b)).
      - url: http://verdify-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - target_label: project
            replacement: verdify
