# Idempotent DB migration / restore Job. Runs as an ArgoCD PreSync hook so it
# completes BEFORE the api/mcp/ingestor pods reconcile, and so those pods never
# race each other applying schema changes.
#
# RE-RUNNABLE: on a populated DB the runner verifies the core schema and, when
# the owning overlay explicitly enables VERDIFY_MIGRATE_LEDGER, applies only
# pending numbered migrations under an advisory lock with exact SHA receipts.
# On a fresh DB it first builds the schema snapshot and repairs hypertable
# metadata. The hook-delete-policy replaces the Job on every sync.
#
# DATA MIGRATION SAFETY (handoff §3.6): this Job applies schema migrations
# against the in-cluster verdify-db. The copy-not-move TimescaleDB restore
# (pg_dump -Fc from the VM, plus the row-count + hypertable + compression
# verification) is a SEPARATE, gated, directly executed runbook — it is deliberately NOT
# wired into this Job. Never let the VM stack and the k3s stack write the same DB.
apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-migrate
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: migrate
  annotations:
    # ArgoCD: run before the app syncs; replace the Job each reconcile.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Private in-org migrate image lives at ghcr.io/verdifyconsultancy/*. The
      # ghcr-jvallery-readonly secret in the namespace carries host-level
      # (ghcr.io) auth that covers both orgs; reference it explicitly so the
      # PreSync hook Job pod can pull the pinned @sha256 digest (the namespace
      # default SA has no imagePullSecrets, and we do not mutate it from the
      # overlay). The wait-for-db init container shares this one pod spec.
      imagePullSecrets:
        - name: zot-origin-cluster-pull  # zot origin (ADR-0021); ghcr kept during transition
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: timescale/timescaledb:2.25.2-pg16
          command:
            - sh
            - -c
            - until pg_isready -h verdify-db -p 5432 -U verdify; do echo "waiting for db"; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          # verdify-migrate (db/Dockerfile.migrate): a thin psql client carrying
          # db/schema.sql + migration 000. Pinned to a sha-<gitsha> by the
          # overlay/CI image-pin; `latest` here is the kustomize validation tag.
          image: ghcr.io/verdifyconsultancy/verdify-migrate  # pinned to a @sha256 digest by the kustomization images: transformer
          # Real runner: verify a populated DB then apply explicitly enabled
          # ledgered migrations, or build schema.sql + migration 000 only for a
          # genuinely fresh DB. DB_HOST/DB_NAME/DB_USER come from verdify-config;
          # DB_PASS comes from the Secret reference below.
          command: ["/usr/local/bin/migrate.sh"]
          envFrom:
            - configMapRef:
                name: verdify-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
            # api/main.py builds the DSN from DB_HOST/DB_NAME/DB_USER/DB_PASS;
            # surface the secret as DB_PASS too so the runner can connect either way.
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
