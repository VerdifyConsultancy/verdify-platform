# Umami (analytics.verdify.ai) — privacy-friendly website analytics for the
# public lab site. Two workloads: umami-db (its OWN postgres, NOT verdify-db)
# and the umami app.
#
# RUN-READINESS: STAGED-ON-STORAGE. umami-db needs the durable volume1/SSD PVC
# (verdify-umami-db-data → synology-iscsi-ssd, laptop-root #84). Until that SC
# exists, umami-db cannot bind and the umami app (which depends on it) cannot
# become ready. Authored + validated as the target shape.
#
# SECRETS (new keys, handed off to laptop-root for the verdify-app-secrets seal):
#   UMAMI_DB_PASSWORD — umami's own postgres password (NOT POSTGRES_PASSWORD)
#   UMAMI_APP_SECRET  — umami session/signing secret
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verdify-umami-db
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami-db
spec:
  serviceName: verdify-umami-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: umami-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: umami-db
    spec:
      imagePullSecrets:
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # postgres uid in postgres:alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: umami
            - name: POSTGRES_USER
              value: umami
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: UMAMI_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: umami-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "umami", "-d", "umami"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "umami", "-d", "umami"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: umami-db-data
          persistentVolumeClaim:
            claimName: verdify-umami-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-umami-db
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: umami-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-umami
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: umami
    spec:
      imagePullSecrets:
        - name: ghcr-jvallery-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-umami-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h verdify-umami-db -p 5432 -U umami; do echo "waiting for umami-db"; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-v2.18.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_TYPE
              value: postgresql
            # DSN assembled from the sealed db password; host is the in-cluster
            # umami-db Service.
            - name: DATABASE_URL
              value: postgresql://umami:$(UMAMI_DB_PASSWORD)@verdify-umami-db:5432/umami
            - name: UMAMI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: UMAMI_DB_PASSWORD
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: verdify-app-secrets
                  key: UMAMI_APP_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-umami
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: umami
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: umami
  ports:
    - name: http
      port: 3000
      targetPort: http
