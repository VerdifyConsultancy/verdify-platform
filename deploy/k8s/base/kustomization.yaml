apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Verdify APP base. One instance = one overlay of this base
# (overlays/staging, overlays/prod).
#
# NAMESPACE: the base intentionally does NOT carry a Namespace object or a
# `namespace:` directive. Each overlay owns its namespace (verdify-staging /
# verdify-prod) so a single base feeds both instances without a hardcoded name.
# The namespace string is PINNED per overlay and MUST be byte-identical to the
# ArgoCD Application destination.namespace and every sealed-secret target.
#
# NOTE: the verdify-app-secrets Secret is NOT defined here. It is managed by the
# fleet SOPS+age secret backend (encrypted secret + registry meta) and applied
# by the GitOps secret-delivery step BEFORE this app reconciles. The manifests
# reference it BY NAME ONLY. For a throwaway local `kustomize build`, each
# overlay layers a config.kubernetes.io/local-config placeholder so the tree
# renders + lints without the secret backend.
#
# The `labels:` transformer below is why kustomize v5.4.3 is required (the
# k8s-manifests.yml CI gate pins that version).

labels:
  - pairs:
      app.kubernetes.io/part-of: verdify
    includeSelectors: false

resources:
  - configmap.yaml
  - db-statefulset.yaml
  - migration-job.yaml
  - api-deployment.yaml
  - mcp-deployment.yaml
  - ingestor-deployment.yaml
  - networkpolicy.yaml
  # ---- Web + observability tier (#88/#63) --------------------------------
  # verdify-site is STATELESS (content baked into the image). The obs workloads
  # (grafana/umami/loki) are STAGED-ON-STORAGE: their PVCs reference
  # synology-iscsi-ssd (volume1/SSD, laptop-root #84) and stay Pending until
  # that SC exists. goaccess is RUN-READY (no PVC). The verdify-site
  # IngressRoute is overlay-scoped (staging), not here. promtail-daemonset.yaml
  # is intentionally NOT listed — it needs hostPath which the `restricted` PSA
  # forbids; see its header for the resolution (central monitoring Loki).
  - site-deployment.yaml
  - obs-pvcs.yaml
  - grafana-config.yaml
  - grafana-deployment.yaml
  - umami-deployment.yaml
  - goaccess-deployment.yaml
  - loki-deployment.yaml

# Image namespace. Canonical org namespace is
# ghcr.io/verdifyconsultancy/verdify-{api,mcp,ingestor,migrate} (NEVER
# jvallery/*). The base leaves these UNPINNED (image name only, no tag); the
# overlays' `images:` transformer pins each to an immutable @sha256 digest.
# A later stage writes the real digests into overlays/staging (in-repo digest
# write-back; no cross-repo PR, no ArgoCD Image Updater). No mutable
# :latest/:staging tag is ever rendered.
images:
  - name: ghcr.io/verdifyconsultancy/verdify-api
  - name: ghcr.io/verdifyconsultancy/verdify-mcp
  - name: ghcr.io/verdifyconsultancy/verdify-ingestor
  - name: ghcr.io/verdifyconsultancy/verdify-migrate
  # verdify-site (lab.verdify.ai Quartz) is an IN-ORG app image, content baked
  # at build time (verdify-site/Dockerfile.k3s). Overlays pin it to a @sha256.
  - name: ghcr.io/verdifyconsultancy/verdify-site
