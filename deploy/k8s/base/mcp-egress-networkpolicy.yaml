# #1011: no direct Internet, LAN, NAS, device or API egress.
# #1351: the only non-cluster destination is local Cortex (traefik-apps 192.168.7.10:443) for
# embed.main. MCP needs no verdify-outbound relay port: the chat relay (8082) left with #1352 and the
# OpenAI embeddings relay (8081) with #1351.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-mcp-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: db
    ports:
    - protocol: TCP
      port: 5432
  # #1351: Cortex embed.main for lessons_search/knowledge_search. cortex.vallery.net
  # resolves to traefik-apps in cluster DNS; no other LAN host or port.
  - to:
    - ipBlock:
        cidr: 192.168.7.10/32
    ports:
    - protocol: TCP
      port: 443
  # kube-proxy DNATs the 192.168.7.10 LoadBalancer VIP to the traefik-apps pods before policy is
  # evaluated, so the ipBlock above never matches pod traffic: the real destination is the traefik
  # pod's websecure port 8443. Estate pattern (cortex-ai-compute open-webui); excludes 9443/9444/8080.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8443
