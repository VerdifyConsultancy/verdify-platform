# #1011: no direct Internet, LAN, NAS, device or API egress; fixed-host relay only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-mcp-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: outbound
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
