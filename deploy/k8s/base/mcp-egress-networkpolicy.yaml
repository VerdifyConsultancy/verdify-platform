# #1011: no direct Internet, LAN, NAS, device or API egress; fixed-host relay only.
# #1351: plus local Cortex (traefik-apps 192.168.7.10:443) for embed.main; the OpenAI
# embeddings relay port 8081 is no longer reachable from MCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verdify-mcp-egress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: mcp
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: outbound
    ports:
    - protocol: TCP
      port: 8082
  # #1351: Cortex embed.main for lessons_search/knowledge_search. cortex.vallery.net
  # resolves to traefik-apps in cluster DNS; no other LAN host or port.
  - to:
    - ipBlock:
        cidr: 192.168.7.10/32
    ports:
    - protocol: TCP
      port: 443
