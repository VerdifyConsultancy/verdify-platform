apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-config
  labels:
    app.kubernetes.io/part-of: verdify
data:
  # ---- Hardened, non-secret runtime config -------------------------------
  # Security defaults are pinned HERE, not inherited from a mutable plaintext
  # .env on the VM (the exact anti-pattern the gravity audit flagged). The live
  # VM .env wired VERDIFY_ALLOW_UNAUTHENTICATED_WRITES through compose; this
  # ConfigMap deliberately OMITS that key so api/main.py's require_write_access()
  # fails CLOSED (mirrors gravity's AUTH_MODE=optional → required fix, handoff
  # §3.1). Do NOT add VERDIFY_ALLOW_UNAUTHENTICATED_WRITES here.

  # ---- Database (non-secret connection fields; password via Secret) -------
  # The api reads DB_HOST/DB_NAME/DB_USER (api/main.py:192-195) and the ingestor
  # reads the same (ingestor/config.py:20-23). The password is injected from the
  # verdify-app-secrets Secret as POSTGRES_PASSWORD by each workload.
  DB_HOST: "verdify-db"
  DB_PORT: "5432"
  DB_NAME: "verdify"
  DB_USER: "verdify"

  # ---- MCP transport ------------------------------------------------------
  # mcp/server.py binds os.environ MCP_HTTP_HOST default 127.0.0.1 / MCP_HTTP_PORT
  # default 8000 (mcp/server.py:248-249). In-cluster we bind 0.0.0.0 so the
  # ClusterIP Service can reach it; the surface stays ClusterIP + NetworkPolicy
  # (in-namespace only) — never a raw LB. (handoff §3.2)
  MCP_HTTP_HOST: "0.0.0.0"
  MCP_HTTP_PORT: "8000"

  # ---- Device / local-service endpoints (egress targets, §3.4) -----------
  # These are the VLAN-crossing endpoints the ingestor reaches. They are config,
  # not secrets. Whether a k3s pod can actually reach them is the GATED §3.4
  # device-VLAN spike (see networkpolicy.yaml egress placeholder) — declaring
  # the endpoints here does NOT grant reachability and does NOT move the device
  # loop off the VM. The ingestor is expected to stay VM-side initially.
  ESP32_HOST: "192.168.10.111"
  ESP32_PORT: "6053"
  HA_URL: "http://192.168.30.107:8123"
  MQTT_HOST: "192.168.30.107"
  MQTT_PORT: "1883"
  # Frigate moved into k3s on 2026-06-16. Use the in-cluster unauthenticated
  # API port for public-safe camera snapshots; the UI port (8971) requires auth.
  FRIGATE_URL: "http://frigate.frigate.svc.cluster.local:5000"
  VERDIFY_FRIGATE_PUBLIC_BASE_URL: "http://frigate.frigate.svc.cluster.local:5000"
  VERDIFY_GO2RTC_PUBLIC_BASE_URL: ""

  # ---- HA-3.2 single-writer FENCE (#240) ---------------------------------
  # The coordination.k8s.io Lease fence is DEFAULT-OFF here, exactly like the
  # device-write gate (#79). The lease code is fully inert (is_held()→True,
  # behaviour identical to the pre-fence ingestor) until this flag is "1". It is
  # armed ONLY in the prod overlay, and ONLY via the gated live-arm runbook with
  # recorded task authorization (see deploy/k8s/overlays/prod/STAGED-ha3-writer-fence-arm.md).
  # Renew-or-die windows (15s lease / 10s renew / 2s retry) are the writer_lease
  # defaults; overridable per-env via VERDIFY_WRITER_LEASE_* if ever needed.
  # ARMED 2026-06-20 (recorded task authorization, sprint): the exactly-one writer fence is on.
  VERDIFY_WRITER_LEASE_ENABLED: "1"

  # ---- Controlled planner experiment (#587 / #581, audit §8.10) -----------
  # Declarative experiment flags with SAFE DEFAULTS. The base pins the
  # feature-OFF shape; overlays flip these ONLY at the §8.10 rollout steps
  # (shadow mode at step 2, live+ID at steps 5/6/7) via the prod overlay's
  # verdify-config patch — never here, and never in prod-dark (which stays
  # non-actuating). NOTE: any edit to these keys (base or overlay) must be
  # accompanied by a config-revision bump — run scripts/gen-config-revision.sh —
  # because verdify-config is consumed via envFrom and a ConfigMap change alone
  # does NOT restart pods.
  #
  # VERDIFY_POLICY_VECTOR_MODE: off | shadow | live
  #   off    — experiment machinery fully inert: no assignment opens, no
  #            proposals are admitted into vectors, no outbox work is created.
  #   shadow — proposal/arbiter/outbox run and persist, but NOTHING is
  #            delivered to the device (no actuation).
  #   live   — staged device commit path armed. Live admission ADDITIONALLY
  #            requires the device-write flag + writer lease, the exact GitOps
  #            experiment ID below, an armed DB assignment, compatible
  #            firmware, and an already-confirmed baseline (§8.10).
  VERDIFY_POLICY_VECTOR_MODE: "off"
  # Confirmed-component v2 capability: off | enabled. This coarse switch
  # defaults off and never encodes shadow/live authority; audited database
  # execution_phase + admission_state do that. Runtime hard-fails component
  # readiness and claims zero work unless the generalized vector mode above is
  # explicitly "off".
  VERDIFY_COMPONENT_EXPERIMENT_ENABLED: "off"
  # The exact experiment UUID the arbiter/delivery path may serve. Empty means
  # NO experiment is admitted. Set (with mode) only through a reviewed GitOps
  # commit at a rollout step; cleared again on completion/rollback.
  VERDIFY_ACTIVE_EXPERIMENT_ID: ""
  # Legacy direct policy writes (the pre-experiment dispatcher path). "1" keeps
  # the incumbent behaviour. Flipped to "0" only while an experiment is live
  # (steps 5/6/7) so the atomic-vector path is the sole policy writer; restored
  # to "1" during rollback ONLY AFTER the frozen baseline is confirmed
  # on-device (see docs/runbooks/experiment-rollout.md — order matters).
  VERDIFY_LEGACY_DIRECT_POLICY_WRITES_ENABLED: "1"

  # ---- MCP transport authorization (#585/#589, audit §8.7) ----------------
  # Audience authorization for the MCP tool surface (mcp/server.py, merged
  # #589): off -> log -> enforce staged rollout. "off" preserves current
  # behaviour; "log" records would-be denials without blocking (prod flips to
  # "log" in a later, separately-reviewed change); "enforce" fail-closes
  # unauthorized audiences/tools. Same config-revision rule as above applies.
  VERDIFY_MCP_AUTH_MODE: "off"
