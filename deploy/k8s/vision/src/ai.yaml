# Verdify AI Configuration
# Centralized management of models, prompts, keys, and schedules.
# All AI-powered tasks reference this file instead of hardcoding settings.

# ── API Keys ─────────────────────────────────────────────────────
# Keys are stored in external files (never in this config).
# Paths can be overridden via environment variables. Keys without a default
# (openai, gemini, anthropic) have no mounted file and need their env var set.
keys:
  cortex:
    file: ${CORTEX_API_KEY_FILE:-/vcortex/api_key.txt}
    provider: cortex
  openai:
    file: ${OPENAI_API_KEY_FILE}
    provider: openai
  gemini:
    file: ${GEMINI_API_KEY_FILE}
    provider: google-ai-studio
  anthropic:
    file: ${ANTHROPIC_API_KEY_FILE}
    provider: anthropic
  # #1351: Cortex identity limited to embed.main (Secret verdify-embedding-cortex, key api_key.txt).
  cortex_embedding:
    file: ${VERDIFY_EMBEDDING_KEY_FILE:-/vembed/api_key.txt}
    provider: cortex

# ── Models ───────────────────────────────────────────────────────
models:
  planner:
    provider: custom
    model: gpt-6-luna
    base_url: https://api.openai.com/v1
    reasoning_effort: xhigh
    purpose: "Audit metadata for the live Hermes Iris profile. Runtime source: hermes/iris/config.yaml."

  vision:
    provider: cortex
    base_url: ${CORTEX_BASE_URL:-https://cortex.vallery.net/v1}
    model: llm.primary.longctx.mm
    temperature: 0.2
    max_output_tokens: 4096
    purpose: "Camera snapshot crop health analysis"

  # #1351 (Jason 2026-11-05: local-only): the knowledge corpus (knowledge_embeddings, migration 296)
  # and MCP lessons_search/knowledge_search. verdify_schemas/embeddings.py reads this block and refuses
  # any provider or host but Cortex. No `dimensions` request is sent: GPUStack refuses it and 2560 is
  # embed.main's natural size.
  embedding:
    provider: cortex
    base_url: ${CORTEX_BASE_URL:-https://cortex.vallery.net/v1}
    model: embed.main
    dimensions: 2560
    key: cortex_embedding
    batch_size: 16
    timeout_s: 60
    query_instruction: "Given a question about running the greenhouse, retrieve the plans, lessons, playbook sections, docs and observations that answer it"
    purpose: "Knowledge corpus and MCP semantic search (Qwen3-Embedding-4B, halfvec 2560)"

# ── Prompts & Templates ─────────────────────────────────────────
# All templates live in /srv/verdify/templates/.
# Planner prompts are fully embedded in ingestor/iris_planner.py — the
# legacy Jinja templates (planner-prompt.j2, planner-prompt.md) were
# removed 2026-04-19 along with the cron-based planner.py they served.
templates:
  vision:
    prompt: vision-analysis.j2


# ── Schedules ────────────────────────────────────────────────────
# Cron expressions (MDT). Managed via crontab, documented here.
# NOTE: the legacy cron-based `planner` schedule was removed 2026-04-11;
# planning is now event-driven via ingestor/iris_planner.py →
# Hermes /v1/runs. Keep schedules: only for tasks still run by cron.
schedules:
  vision:
    cron: "0 12,16,20,0 * * *"
    script: scripts/frigate-snapshot.py
    description: "Camera snapshots + Gemini 3.1 Pro Preview analysis"
    depends_on: frigate  # Requires Frigate NVR accessible

  embedding:
    cron: null  # The verdify-knowledge-embed CronJob is suspended; run its one-shot Job after a release.
    script: scripts/embed-corpora.py
    description: "Embed the knowledge corpus with Cortex embed.main (resumable, bounded)"

# ── Context Gathering ────────────────────────────────────────────
context:
  gather_script: scripts/gather-plan-context.sh
  static_builder: scripts/gather-static-context.sh
  max_context_chars: 100000
  max_static_chars: 50000

# ── Planner Routing & SLA (Hermes audit labels, contract v1.5) ───
# Runtime knobs for planner trigger severity and audit-label routing. Consumed by:
#   - ingestor/planner_routing.py (classify_severity + pick_instance + sla_for)
#   - ingestor/alert_monitor rule 7 (SLA-breach detection)
# Contract spec: docs/iris-planner-contract.md §2.F (SLA) + §2.G (routing).
# Live planning uses OpenAI GPT-6 Luna through Hermes's custom transport with
# xhigh reasoning. The instance field remains an audit label only.
planner_routing:
  # Required full-plan cycles use the same Hermes/OpenAI profile as other
  # triggers. This value is an audit label carried into plan_delivery_log.
  required_full_plan_instance: opus

  # Severity thresholds — ingestor.classify_severity returns "major" when any
  # is exceeded; "minor" otherwise. Both severities route to local by default.
  forecast_major_delta_vpd_kPa: 0.5    # |Δvpd_outdoor| above → major FORECAST
  forecast_major_delta_temp_F: 10      # |Δtemp_F| above → major FORECAST
  deviation_major_threshold: 0.15      # normalized band-excursion → major DEVIATION
  deviation_prolonged_cycles: 3        # pending >= N cycles → major DEVIATION

planner_sla:
  # SLA in minutes, keyed by (instance, trigger_type). Absent = no SLA.
  # local/opus are audit labels under Hermes. They no longer select different
  # model backends.
  local:
    SUNRISE:    30
    SUNSET:     30
    SOLAR_MAX:  30
    MIDNIGHT:   30
    TRANSITION: 45
    FORECAST:   90
    DEVIATION:  20
    FORECAST_DEVIATION: 20
    HEARTBEAT:  15
  opus:
    SUNRISE:    15
    SUNSET:     15
    SOLAR_MAX:  15
    MIDNIGHT:   15
    FORECAST:   30
    DEVIATION:  10
    FORECAST_DEVIATION: 10
