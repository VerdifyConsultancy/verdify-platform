apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-vision
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: vision
spec:
  schedule: "0 15,18,21,0 * * *"
  # Recovery canary 2026-07-11: the repaired digest/pull-auth shape completed
  # in 53s, captured both greenhouse cameras, finished analysis, and persisted
  # two fresh image_observations. Resume the normal four-times-daily cadence.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: vision
        spec:
          restartPolicy: Never
          # PodSecurity "restricted:latest" is namespace-enforced on
          # verdify-prod: without runAsNonRoot + seccompProfile the
          # job-controller's pod creates are rejected at admission (the
          # 2026-07-11T21:00Z verdify-vision-29730060 wedge — active Job,
          # zero pods, concurrencyPolicy Forbid blocks every later run).
          # runAsUser MUST be numeric-explicit here: the ingestor image's
          # USER is the non-numeric "appuser" (uid 1000, ingestor/Dockerfile),
          # and kubelet cannot verify runAsNonRoot from a named user alone.
          # Same shape as base/ingestor-deployment.yaml (same image, passes
          # restricted today).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000   # appuser in ingestor/Dockerfile
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # zot origin only (ADR-0021 — GHCR is retired). The overlay rewrites
          # the canonical image name below to registry.vallery.net@sha256, so
          # the scoped zot pull credential is the ONLY one this pod needs; the
          # transitional GHCR read-only pull-secret entry was dropped with
          # #436 (tests/test_20_vision_src_sync.py fences it out).
          imagePullSecrets:
            - name: zot-origin-cluster-pull
          containers:
            - name: vision
              # Canonical image-name KEY only (never pulled as-is): the
              # overlays/prod images transformer rewrites it to the pinned
              # registry.vallery.net/verdifyconsultancy/verdify-ingestor@sha256
              # digest, so vision advances in lock-step with the ingestor on
              # every gitops(pin) commit + gated sync.
              image: ghcr.io/verdifyconsultancy/verdify-ingestor
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  cd /app/ingestor
                  python3 /vsrc/frigate-snapshot.py
              env:
                - name: PYTHONPATH
                  value: /app/ingestor
                - name: AI_CONFIG
                  value: /vsrc/ai.yaml
                - name: TEMPLATES_DIR
                  value: /vsrc
                - name: GEMINI_API_KEY_FILE
                  value: /vkey/gemini_api_key.txt
                - name: VERDIFY_FRIGATE_URL
                  value: http://frigate.frigate.svc.cluster.local:5000
                - name: VERDIFY_GO2RTC_PUBLIC_BASE_URL
                  value: http://frigate.frigate.svc.cluster.local:1984
                - name: VERDIFY_SNAPSHOT_DIR
                  value: /snap
                - name: VERDIFY_ZONES_CONFIG
                  value: /vsrc/zones.yaml
                - name: VERDIFY_ANALYZE_SNAPSHOT_SCRIPT
                  value: /vsrc/analyze-greenhouse-snapshot.py
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
                - name: VERDIFY_DB_DSN
                  value: postgresql://verdify:$(POSTGRES_PASSWORD)@verdify-db:5432/verdify
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: vsrc
                  mountPath: /vsrc
                  readOnly: true
                - name: vkey
                  mountPath: /vkey
                  readOnly: true
                - name: snap
                  mountPath: /snap
          volumes:
            - name: vsrc
              configMap:
                name: verdify-vision-src
            - name: vkey
              secret:
                secretName: verdify-vision-key
            - name: snap
              emptyDir: {}
