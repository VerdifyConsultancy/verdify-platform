# #995: adopt the existing namespace in place; preserve every current label.
# Manual non-pruning descheduler Application; no workload, policy or pause change.
apiVersion: v1
kind: Namespace
metadata:
  name: verdify-descheduler
  labels:
    agent-fleet.vallery.net/environment: prod
    agent-fleet.vallery.net/purpose: agent-deployment-namespace
    app.kubernetes.io/part-of: agent-fleet
    kubernetes.io/metadata.name: verdify-descheduler
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
