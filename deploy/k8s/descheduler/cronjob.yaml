# HA-1.9 (#234) — descheduler CronJob.
#
# ENFORCE mode (no `--dry-run`). It shipped dry-run, and GATE 6 of #234 armed it
# live on 2026-06-08 after the dry-run proof (ingestor and every singleton
# absent from the eviction set); the 2026-07-28 maintenance proofs re-verified
# it. This file now records that live state (VP-01, #802), so re-applying it
# no longer silently disarms the controller. Evictions stay gated by the
# policy's exclusion layers (only `verdify.ai/rebalanceable=true` pods in
# verdify-prod), PDBs and maxNoOfPodsToEvictPerNode: 1. Pause state is
# reviewed in Git (#1004); the attended owner sync applies it.
#
# Runs hourly at :15 (was */30; 2026-10-11 cluster CronJob cadence review).
# It only corrects replica spread after node events, so an hour of skew is
# acceptable. Concurrency Forbid + leader-election lease (RBAC role) so two
# runs never overlap. priorityClassName verdify-batch (1000) — the descheduler
# is itself the lowest-priority workload (it must never preempt anything).
#
# Maintenance gate (sched audit 2026-11-04, rule L5): the maintenance-gate init
# container reads Lease kube-system/k3s-planned-maintenance and hands the
# descheduler a no-op policy while the Lease has a holder, so this CronJob never
# evicts next to a cordon or drain. It needs `get` on that one Lease, granted by
# the fleet control plane beside the verdify-descheduler ClusterRole. Without
# that grant the gate fails closed (Job fails, nothing evicted).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: descheduler
  namespace: verdify-descheduler
  labels:
    app.kubernetes.io/name: descheduler
spec:
  # Adopt the existing live false state. A routine pause changes this in Git.
  suspend: false
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 200
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: descheduler
          annotations:
            # Matches live. In descheduler v0.36 this annotation is
            # presence-only (any value marks the pod evictable), so it never
            # prevented self-eviction; the policy scanning only verdify-prod
            # is what keeps this pod out of scope.
            descheduler.alpha.kubernetes.io/evict: "true"
        spec:
          serviceAccountName: descheduler
          priorityClassName: verdify-batch
          restartPolicy: Never
          # Do not schedule onto the cordoned etcd nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: maintenance-gate
              # Same digest-pinned image as the estate descheduler's gate.
              image: python:3.13.5-alpine3.22@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf
              imagePullPolicy: IfNotPresent
              command: ["python3", "-I", "/policy-src/gate.py"]
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: policy-src
                  mountPath: /policy-src
                  readOnly: true
                - name: policy-volume
                  mountPath: /policy-dir
          containers:
            - name: descheduler
              # registry.k8s.io/descheduler/descheduler:v0.36.0 (k8s 1.35 deps),
              # digest-pinned per the cluster's image policy.
              image: registry.k8s.io/descheduler/descheduler:v0.36.0@sha256:7ca92c0a7b4f1c51d306409da6b832005fcadb224e384795646376726734c6e5
              imagePullPolicy: IfNotPresent
              command:
                - "/bin/descheduler"
              args:
                - "--policy-config-file=/policy-dir/policy.yaml"
                - "--descheduling-interval=0"   # CronJob drives the cadence; run once and exit.
                - "--v=4"
                # ENFORCE: no --dry-run (armed under #234 GATE 6). Adding
                # "--dry-run" back is the instant rollback to log-only mode.
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "256Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: policy-volume
                  mountPath: /policy-dir
                  readOnly: true
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: 10258
                  scheme: HTTPS
                initialDelaySeconds: 3
                periodSeconds: 10
          volumes:
            # The gate copies the selected policy here; the descheduler reads
            # only this directory.
            - name: policy-volume
              emptyDir:
                sizeLimit: 1Mi
            - name: policy-src
              configMap:
                name: descheduler-policy
