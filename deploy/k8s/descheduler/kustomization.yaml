# VP-01 (#802): the manual verdify-descheduler Argo Application owns exactly
# these six existing objects, including namespace adoption under #995, plus the two
# network-infra#839 egress NetworkPolicies (vendored management-set deny + kube-API allow).
# The cluster-scoped ClusterRole/ClusterRoleBinding verdify-descheduler moved to
# the fleet control plane (fleet control-plane #5794): a tenant repo may not
# grant cluster RBAC.
# Agents owns the exact Application pin and AppProject. Existing namespace
# labels are preserved; STAGED-rebalanceable-labels-patch.yaml stays historical.
# See descheduler-arm.md for adoption, verification and the non-cascading inverse.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - policy-configmap.yaml
  - cronjob.yaml
  - egress-deny-management.yaml
  - egress-allow-management.yaml

patches:
  - path: source-owned-fields-ssa.patch.yaml
  # network-infra#839: the vendored deny carries no namespace; pin it here (no global
  # `namespace:` so the adopted Namespace object stays untouched).
  - target:
      kind: NetworkPolicy
      name: egress-deny-management
    patch: |-
      - op: add
        path: /metadata/namespace
        value: verdify-descheduler
