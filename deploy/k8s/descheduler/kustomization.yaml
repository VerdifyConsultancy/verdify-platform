# HA-1.9 (#234) — descheduler kustomization (cluster-scoped tool).
#
# Applied via TARGETED additive `kubectl apply -k` (descheduler-arm.md), NOT an
# ArgoCD auto-sync — so it never risks pruning/reverting any live workload.
#
# ENFORCE mode, matching live since #234 GATE 6 (2026-06-08); see cronjob.yaml.
# STAGED-rebalanceable-labels-patch.yaml is deliberately NOT listed here (it
# relabels live stateless deploys; its effect was applied by patch, #802).
# Prefer `kubectl apply -f cronjob.yaml` for CronJob-only changes: applying the
# whole kustomization also re-applies namespace.yaml, whose labels differ from
# live (#802).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - policy-configmap.yaml
  - cronjob.yaml
