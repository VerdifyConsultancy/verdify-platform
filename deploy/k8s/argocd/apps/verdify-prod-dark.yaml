# ArgoCD Application — verdify-prod-dark  (the LIVE greenhouse prod app)
#
# NAME IS A MISNOMER (kept for now): this App is NO LONGER device-dark. As of the
# 2026-06-07 cutover it is the REAL prod — its source is deploy/k8s/overlays/prod
# (the device-WRITER overlay: ingestor replicas:1, allow-ingestor-device-egress,
# VERDIFY_DEVICE_WRITE_ENABLED=1), and its ingestor is the ONE live single writer
# to the greenhouse ESP32 (192.168.10.111:6053) + the in-cluster TimescaleDB. This
# CR is reconciled here to MATCH the live App (path overlays/prod). It is a
# STANDALONE App (no app-of-apps owner) applied imperatively to the argocd ns.
#
# *** CANONICAL APPLICATION IDENTITY ***
# Keep the historical verdify-prod-dark object name. It is only an identifier;
# the source path and destination below define the live production environment.
# The unused duplicate verdify-prod Application manifest and its staged rename
# procedure were retired on 2026-08-30. Reintroducing a second owner for these
# single-writer production resources requires a separately reviewed migration.
#
# *** MANUAL SYNC ON PURPOSE *** — NO syncPolicy.automated block. prod sync is
# operator-initiated (argocd app sync) so a device-writer reconcile is never
# automatic. prune is FALSE — never auto-reap the verdify-db StatefulSet/PVC (the
# live TimescaleDB) or the verdify-db-dumps backup PVC on a manifest reshuffle.
#
# verdify-db STORAGE: overlays/prod restates the verdify-db volumeClaimTemplate.
# During the 2026-07 Synology CSI exit, live prod DB storage moves to
# longhorn-v1-workspace-rwo; adoption still requires an operator-paced
# StatefulSet recreate because volumeClaimTemplates are immutable.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verdify-prod-dark
  namespace: argocd
  labels:
    agent-fleet.vallery.net/environment: prod
    agent-fleet.vallery.net/project: iris-verdify
    app.kubernetes.io/part-of: agent-fleet
  annotations:
    agent-fleet.vallery.net/app-repo: https://github.com/VerdifyConsultancy/verdify-platform.git
    agent-fleet.vallery.net/environment: prod
    agent-fleet.vallery.net/image-tag: ghcr.io/verdifyconsultancy/verdify-api@sha256-digest-pinned
    agent-fleet.vallery.net/source-repo: https://github.com/VerdifyConsultancy/verdify-platform.git
    agent-fleet.vallery.net/source-revision: main
    agent-fleet.vallery.net/url: https://www.verdify.ai
spec:
  project: app-test
  source:
    repoURL: https://github.com/VerdifyConsultancy/verdify-platform.git
    targetRevision: main
    # LIVE prod overlay (device writer). The ArgoCD app name is still
    # verdify-prod-dark for historical reasons; source-of-truth is main.
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: verdify-prod
  ignoreDifferences:
    # Bound fields are assigned by Kubernetes and are not a migration signal.
    # The active portable claim is an explicit desired resource and may not be
    # pruned by an Application reconcile.
    - group: apps
      kind: StatefulSet
      name: verdify-db
      namespace: verdify-prod
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    - kind: PersistentVolumeClaim
      name: verdify-lab-site-cache
      namespace: verdify-prod
      jsonPointers:
        - /spec/volumeMode
        - /spec/volumeName
    - kind: PersistentVolumeClaim
      name: verdify-hermes-iris-data-portable-20260801
      namespace: verdify-prod
      jsonPointers:
        - /spec/volumeMode
        - /spec/volumeName
  # MANUAL SYNC: no automated block (prod adoption is operator-paced; see header).
  # prune stays false at the app level; operator-initiated syncs must use the
  # ArgoCD prune confirmation explicitly and NEVER prune the verdify-db
  # StatefulSet/PVC or the verdify-db-dumps backup PVC.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
