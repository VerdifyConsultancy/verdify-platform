# #1351 / #1363 (Jason 2026-11-05: Verdify runs local-only). Egress for every pod in
# verdify-dashboard: private ranges only, never the public internet, and never the estate
# management set. The web reaches the operator API in verdify-prod and Authentik at
# auth.vallery.net, which cluster DNS answers with the apps ingress 192.168.7.10.
#
# NetworkPolicies are additive, so kustomization.yaml points the vendored egress-deny-management
# (0.0.0.0/0 minus management) at a label no pod here carries. tests/test_dashboard_manifests.py
# checks both, and that the `except` list equals the vendored one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-local-only
  labels:
    app.kubernetes.io/part-of: verdify
    network.vallery.net/policy: egress-local-only
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
            # Same management set as egress-deny-management.yaml (network-infra ipam/management-cidrs.yaml).
            except:
              - 192.168.1.0/24
              - 192.168.7.1/32
              - 192.168.10.1/32
              - 192.168.20.1/32
              - 192.168.30.1/32
              - 192.168.30.31/32
              - 192.168.30.32/32
              - 192.168.30.33/32
              - 192.168.30.50/32
              - 192.168.30.100/32
              - 192.168.30.107/32
              - 192.168.30.126/32
              - 192.168.30.211/32
              - 192.168.30.212/32
              - 192.168.30.213/32
              - 192.168.30.214/32
              - 192.168.30.215/32
              - 192.168.30.216/32
              - 192.168.30.217/32
              - 192.168.30.240/32
              - 192.168.40.1/32
              - 192.168.40.5/32
              - 192.168.50.1/32
              - 192.168.60.1/32
              - 192.168.64.1/32
