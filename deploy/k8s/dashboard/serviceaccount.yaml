# Tokenless identity for the web pods: no RoleBinding and no Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-dashboard-web
  labels:
    app.kubernetes.io/name: verdify-dashboard-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: verdify
automountServiceAccountToken: false
