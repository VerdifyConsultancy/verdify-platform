# Expose the Verdify api on the APPS subnet (VLAN 7) via the MetalLB apps-pool.
# This is the only user-facing surface that gets an LB IP; mcp / db / ingestor
# stay ClusterIP / connect-out. (handoff §2.5)
#
# ADR-15 (Model B′, accepted 2026-05-30): this per-app LoadBalancer is the INTERIM
# path only and is the documented anti-pattern to retire (ADR-15 names
# `verdify-api .7.21` explicitly). verdify-api converges to ClusterIP + a
# host-routed IngressRoute + strip Middleware behind the ONE shared apps-ingress
# VIP, ADD-THEN-DROP (add the IngressRoute, prove it serves, THEN drop this LB),
# gated on the apps-Traefik/VIP existing (get-well-plan C1) and owned by
# laptop-root/registry (reconciler-generated, never hand-mapped). The base
# verdify-api Service is already ClusterIP, so it is ADR-15-ready. See
# docs/runbooks/verdify-cutover-readiness.md "ADR-15 / Model B′ alignment".
#
# apps-pool has autoAssign:false, so the address-pool + loadBalancerIPs
# annotations are REQUIRED. A fixed IP keeps DNS / Authentik stable.
#
# HARD RULES (handoff §2.5):
#   - NEVER also set spec.loadBalancerIP alongside the annotation → MetalLB
#     AllocationFailed (dual mechanism). Use the annotation ONLY.
#   - Do NOT use Cilium lbipam.cilium.io/* annotations — the live cluster honors
#     metallb.universe.tf/* only.
#   - 192.168.7.21 is a PLACEHOLDER inside the apps-pool range
#     (192.168.7.10-192.168.7.250). The real reservation is a laptop-root/Jason
#     networking surface (propose → confirm → reserve in the registry, like
#     gravity's .7.20). Do not assume this IP is allocated.
apiVersion: v1
kind: Service
metadata:
  name: verdify-api
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: api
  annotations:
    metallb.universe.tf/address-pool: apps-pool
    metallb.universe.tf/loadBalancerIPs: 192.168.7.21   # PLACEHOLDER — reserve via registry, confirm with Jason
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
