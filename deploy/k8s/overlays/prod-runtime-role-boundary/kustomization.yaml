apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compatibility/review alias for migration 217's active production credential
# cutover. The ArgoCD source remains overlays/prod, which now owns the component,
# namespace, image transformation, and patch ordering. Keep this alias as a pure
# parent render so review tooling cannot accidentally apply the component twice
# or diverge from the real production target.
resources:
  - ../prod
