# PLACEHOLDER Secret for LOCAL VALIDATION ONLY (#1351). Never applied: the
# config.kubernetes.io/local-config ANNOTATION keeps it out of `kustomize build`, so
# overlays/prod renders zero Secrets (see secrets.placeholder.yaml for the invariant).
# The real verdify-embedding-cortex Secret (key api_key.txt: a Cortex identity limited
# to embed.main) is live in verdify-prod; its KSOPS adoption is jvallery/agents#6079.
apiVersion: v1
kind: Secret
metadata:
  name: verdify-embedding-cortex
  labels:
    app.kubernetes.io/part-of: verdify
  annotations:
    config.kubernetes.io/local-config: "true"   # never applied by GitOps
type: Opaque
stringData:
  api_key.txt: "PLACEHOLDER_NOT_A_REAL_SECRET"
