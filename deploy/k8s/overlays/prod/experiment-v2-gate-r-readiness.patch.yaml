apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment-v2-gate-r-readiness-activation
data:
  VERDIFY_GATE_R_READINESS_APPLICATION_SOURCE: "bc8ad7d5fc6ec6330df8a9ab3a20ccd301aea3e4"
  VERDIFY_GATE_R_READINESS_EXPERIMENT_ID: "45039c86-c1d9-52f6-a0a9-d94a17bc4b14"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-experiment-v2-gate-r-readiness
  annotations:
    verdify.io/gate-r-readiness-activation: "m81-20260830-e27d9831"
spec:
  suspend: false
  template:
    metadata:
      annotations:
        verdify.io/gate-r-readiness-activation: "m81-20260830-e27d9831"
    spec:
      containers:
        - name: readiness
          # Resolved by this overlay's images transformer to the pinned
          # experiment-v2-orchestrator digest, so the readiness hook always runs
          # the same image as the experiment workers (the pin actuator moves both).
          image: ghcr.io/verdifyconsultancy/verdify-experiment-v2-orchestrator
