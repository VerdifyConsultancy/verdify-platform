# Out-of-band writer-presence + telemetry-stall watchdog (2026-07-11 audit P0).
#
# The in-ingestor alert engine self-silences when the writer dies — proven
# twice (2026-06-17 storage incident ~1h dark; 2026-07-11 DB/Longhorn outage
# 7h09m dark, zero alerts). docs/handoff/monitoring-writer-absent-alert.md
# asked monitoring-stack for a PrometheusRule on 2026-06-17 and it was never
# delivered; this CronJob closes the gap from INSIDE this repo's lane, fully
# independent of the ingestor process:
#
#   * writer presence — age of the coordination.k8s.io Lease
#     `verdify-ingestor-writer` (renewed every ~15 s by the live writer only).
#     Stale/absent > 180 s → CRITICAL `writer_absent` (tolerates a normal
#     Recreate roll, catches a real outage — same 3 min rationale as the
#     handoff rule).
#   * telemetry stall — climate max(ts) age > 600 s while the writer looks
#     alive → CRITICAL `telemetry_stall` (connected-but-not-writing).
#
# Paging surface: direct alert_log rows (source='writer_watchdog', deduped,
# auto-resolved by this job when the condition clears) — these show in
# Grafana, the deploy-gate sweeps, and the firmware-OTA critical-alert
# preflight. When the DB itself is unreachable the job emits a Kubernetes
# Warning Event (VerdifyWatchdogDbUnreachable) and fails loudly instead.
# Slack remains unwired until its token is managed as a sealed secret; do not
# add a silent-noop path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-writer-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: writer-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verdify-writer-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: writer-watchdog
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["verdify-ingestor-writer"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verdify-writer-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: writer-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verdify-writer-watchdog
subjects:
  - kind: ServiceAccount
    name: verdify-writer-watchdog
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-writer-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: writer-watchdog
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 90
  jobTemplate:
    spec:
      activeDeadlineSeconds: 100
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: writer-watchdog
        spec:
          serviceAccountName: verdify-writer-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Lease read + k8s Event emission live here: the kube API needs
            # real TLS (SNI/ALPN) that busybox wget in the timescale image
            # cannot speak ("Connection reset by peer", first run 2026-07-11
            # 19:58Z) — python urllib with the SA CA is the proven db-watchdog
            # pattern. Writes /shared/lease_state for the psql container:
            #   ok <age_s> | absent | read_failed
            - name: lease-check
              image: python:3.13-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: [python, -c]
              args:
                - |
                  import json, os, ssl, urllib.request, urllib.error
                  from datetime import datetime, timezone

                  ns = os.environ.get("POD_NAMESPACE", "verdify-prod")
                  host = os.environ["KUBERNETES_SERVICE_HOST"]
                  port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
                  base = f"https://{host}:{port}"
                  token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
                  THRESHOLD = 180

                  def emit_event(reason, message):
                      now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      body = json.dumps({
                          "metadata": {"generateName": "verdify-writer-watchdog-"},
                          "type": "Warning", "reason": reason, "message": message,
                          "involvedObject": {"kind": "CronJob", "name": "verdify-writer-watchdog", "namespace": ns},
                          "source": {"component": "verdify-writer-watchdog"},
                          "firstTimestamp": now, "lastTimestamp": now,
                      }).encode()
                      req = urllib.request.Request(
                          f"{base}/api/v1/namespaces/{ns}/events", data=body, method="POST",
                          headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                      try:
                          urllib.request.urlopen(req, context=ctx, timeout=10)
                      except Exception as e:
                          print(f"event emit failed ({reason}): {e}")

                  state = "read_failed"
                  try:
                      req = urllib.request.Request(
                          f"{base}/apis/coordination.k8s.io/v1/namespaces/{ns}/leases/verdify-ingestor-writer",
                          headers={"Authorization": f"Bearer {token}"})
                      lease = json.load(urllib.request.urlopen(req, context=ctx, timeout=10))
                      renew = lease.get("spec", {}).get("renewTime")
                      if renew:
                          rt = datetime.fromisoformat(renew.replace("Z", "+00:00"))
                          age = int((datetime.now(timezone.utc) - rt).total_seconds())
                          state = f"ok {age}"
                          if age > THRESHOLD:
                              emit_event("VerdifyEsp32WriterAbsent",
                                         f"verdify-ingestor-writer lease stale: age_s={age} > {THRESHOLD}")
                      else:
                          state = "absent"
                          emit_event("VerdifyEsp32WriterAbsent", "verdify-ingestor-writer lease has no renewTime")
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          state = "absent"
                          emit_event("VerdifyEsp32WriterAbsent", "verdify-ingestor-writer lease does not exist")
                      else:
                          print(f"lease read HTTP {e.code}")
                          emit_event("VerdifyWatchdogLeaseReadFailed", f"lease read failed: HTTP {e.code}")
                  except Exception as e:
                      print(f"lease read failed: {e}")
                      emit_event("VerdifyWatchdogLeaseReadFailed", f"lease read failed: {type(e).__name__}")
                  open("/shared/lease_state", "w").write(state)
                  print("lease_state:", state)
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: shared
                  mountPath: /shared
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 128Mi }
          containers:
            - name: watchdog
              # timescaledb image: psql for alert_log paging + busybox wget
              # for the kube API lease read. Same image the DB runs, so it is
              # always present on the storage nodes.
              image: timescale/timescaledb:2.25.2-pg16
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -ceu
                - |
                  LEASE_THRESHOLD_S=180
                  STALL_THRESHOLD_S=600

                  # Lease state comes from the python initContainer (the kube
                  # API needs TLS that busybox wget cannot speak — proven on
                  # the first live run). Format: "ok <age_s>" | absent | read_failed
                  LEASE_STATE="$(cat /shared/lease_state 2>/dev/null || echo read_failed)"
                  echo "lease_state: ${LEASE_STATE}"
                  LEASE_RC=0
                  LEASE_FOUND=false
                  LEASE_AGE_S=""
                  case "$LEASE_STATE" in
                    ok\ *)  LEASE_FOUND=true; LEASE_AGE_S="${LEASE_STATE#ok }" ;;
                    absent) LEASE_FOUND=false ;;
                    *)      LEASE_RC=1 ;;  # read_failed: skip the writer decision
                  esac

                  # ── 2. DB reachability gate for the paging surface ──
                  # (the initContainer already emitted the writer-absent k8s
                  # Event if the lease was stale; a DB outage here fails the
                  # job loudly — failed jobs are the visibility surface until
                  # the monitoring-stack PrometheusRule lands.)
                  if ! pg_isready -h "${PGHOST}" -p "${PGPORT:-5432}" -U "${PGUSER}" -d "${PGDATABASE}" >/dev/null 2>&1; then
                    echo "DB unreachable: cannot write alert_log (lease_state=${LEASE_STATE}); failing the job for visibility"
                    exit 1
                  fi

                  PSQL="psql -v ON_ERROR_STOP=1 -t -A -q"

                  # ── 3. writer_absent lifecycle (skipped when the lease read failed) ──
                  if [ "$LEASE_RC" -eq 0 ] && { [ "$LEASE_FOUND" != "true" ] || [ "${LEASE_AGE_S:-99999}" -gt "$LEASE_THRESHOLD_S" ]; }; then
                    AGE_JSON="${LEASE_AGE_S:-null}"
                    $PSQL -c "INSERT INTO alert_log (alert_type, severity, category, message, details, source)
                      SELECT 'writer_absent', 'critical', 'system',
                             'WRITER ABSENT: verdify-ingestor-writer lease stale/missing (age_s=${LEASE_AGE_S:-absent}). Telemetry, setpoint dispatch, and the in-ingestor alert engine are all down; the ESP32 holds its on-chip band.',
                             json_build_object('lease_found', ${LEASE_FOUND}, 'lease_age_s', ${AGE_JSON}, 'threshold_s', ${LEASE_THRESHOLD_S})::jsonb,
                             'writer_watchdog'
                      WHERE NOT EXISTS (SELECT 1 FROM alert_log WHERE alert_type = 'writer_absent' AND resolved_at IS NULL)"
                    echo "writer_absent: CRITICAL (lease age ${LEASE_AGE_S:-absent}s)"
                  elif [ "$LEASE_RC" -eq 0 ]; then
                    $PSQL -c "UPDATE alert_log SET resolved_at = now(), disposition = 'resolved', resolved_by = 'writer_watchdog',
                              resolution = 'writer lease fresh again'
                       WHERE alert_type = 'writer_absent' AND resolved_at IS NULL" >/dev/null
                  fi

                  # ── 4. telemetry_stall lifecycle ──
                  CLIMATE_AGE="$($PSQL -c "SELECT COALESCE(round(extract(epoch FROM now() - max(ts)))::text, 'none') FROM climate")"
                  echo "climate age_s=${CLIMATE_AGE}"
                  if [ "$CLIMATE_AGE" != "none" ] && [ "$CLIMATE_AGE" -gt "$STALL_THRESHOLD_S" ]; then
                    $PSQL -c "INSERT INTO alert_log (alert_type, severity, category, message, details, source)
                      SELECT 'telemetry_stall', 'critical', 'system',
                             'TELEMETRY STALL: newest climate row is ${CLIMATE_AGE}s old (threshold ${STALL_THRESHOLD_S}s). Writer may be connected but not persisting.',
                             json_build_object('climate_age_s', ${CLIMATE_AGE}, 'threshold_s', ${STALL_THRESHOLD_S})::jsonb,
                             'writer_watchdog'
                      WHERE NOT EXISTS (SELECT 1 FROM alert_log WHERE alert_type = 'telemetry_stall' AND resolved_at IS NULL)"
                    echo "telemetry_stall: CRITICAL"
                  else
                    $PSQL -c "UPDATE alert_log SET resolved_at = now(), disposition = 'resolved', resolved_by = 'writer_watchdog',
                              resolution = 'climate rows landing again'
                       WHERE alert_type = 'telemetry_stall' AND resolved_at IS NULL" >/dev/null
                  fi
                  echo "watchdog sweep complete $(date -u +%FT%TZ)"
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef: { key: DB_HOST, name: verdify-config }
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef: { key: DB_PORT, name: verdify-config }
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: { key: DB_NAME, name: verdify-config }
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef: { key: DB_USER, name: verdify-config }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { key: POSTGRES_PASSWORD, name: verdify-app-secrets }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: shared
                  mountPath: /shared
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 128Mi }
          volumes:
            - name: tmp
              emptyDir: {}
            - name: shared
              emptyDir: {}
