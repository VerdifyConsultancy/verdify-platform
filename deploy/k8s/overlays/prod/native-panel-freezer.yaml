# Freeze yesterday's completed native-route window, if one was declared.
# This pod has only the existing outcome-freezer DB login and uses psql; it
# imports no controller client and has no Kubernetes service-account token.
# The experiment-v2-freezer component label reuses its DB-only network policy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-fixed-panel-native-freezer
  namespace: verdify-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-freezer
spec:
  schedule: "30 0 * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: experiment-v2-freezer
            app.kubernetes.io/name: verdify-fixed-panel-native-freezer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: zot-origin-cluster-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: freeze-native-route-day
              image: timescale/timescaledb:2.25.2-pg16
              command:
                - /bin/sh
                - -ec
                - >-
                  psql -X -qAt -v ON_ERROR_STOP=1
                  -c "SELECT public.fn_freeze_fixed_panel_native_previous_day()::text"
              env:
                - name: PGHOST
                  value: verdify-db
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: verdify
                - name: PGUSER
                  value: verdify_experiment_v2_outcome_freezer_login
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-experiment-v2-outcome-freezer-db
                      key: password
                - name: PGOPTIONS
                  value: "-c search_path=pg_catalog,public,pg_temp -c statement_timeout=300000"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
