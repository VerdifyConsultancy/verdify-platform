# Freeze yesterday's completed native-route window, if one was declared.
# This pod has only the existing outcome-freezer DB login and uses psql; it
# imports no controller client and has no Kubernetes service-account token.
# The experiment-v2-freezer component label reuses its DB-only network policy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-fixed-panel-native-freezer
  namespace: verdify-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: experiment-v2-freezer
spec:
  schedule: "30 0 * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: experiment-v2-freezer
            app.kubernetes.io/name: verdify-fixed-panel-native-freezer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: zot-origin-cluster-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: freeze-native-route-day
              image: timescale/timescaledb:2.25.2-pg16
              command:
                - /bin/sh
                - -ec
                - |
                  psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
                  DO $daily_freezer$
                  DECLARE result jsonb; failure_message text;
                  BEGIN
                    BEGIN
                      result := public.fn_freeze_fixed_panel_native_previous_day();
                    EXCEPTION WHEN SQLSTATE 'P0001' THEN
                      GET STACKED DIAGNOSTICS failure_message = MESSAGE_TEXT;
                      IF failure_message <> 'native previous-day freeze lacks complete prospective target' THEN
                        RAISE;
                      END IF;
                      -- A declared partial-day window cannot become an 18-hour
                      -- receipt. Keep the SQL integrity guard and expose absence;
                      -- do not fail unrelated delivery on this expected outcome.
                      result := jsonb_build_object(
                        'day', (clock_timestamp() AT TIME ZONE 'America/Denver')::date - 1,
                        'status', 'unavailable',
                        'reason', 'incomplete_prospective_18h_target',
                        'receipt_id', NULL, 'route_18h_available', false);
                      RAISE WARNING '%', result;
                      RETURN;
                    END;
                    RAISE NOTICE '%', result;
                  END;
                  $daily_freezer$;
                  SQL
              env:
                - name: PGHOST
                  value: verdify-db
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: verdify
                - name: PGUSER
                  value: verdify_experiment_v2_outcome_freezer_login
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-experiment-v2-outcome-freezer-db
                      key: password
                - name: PGOPTIONS
                  value: "-c search_path=pg_catalog,public,pg_temp -c statement_timeout=300000"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
