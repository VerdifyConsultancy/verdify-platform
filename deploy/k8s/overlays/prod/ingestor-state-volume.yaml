# #382 durable source acceptance. Applying this causes the sole writer Recreate.
# Retain existing SQLite databases/journals and disclose the old memory boundary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    spec:
      containers:
        - name: ingestor
          env:
            # Existing sole-client diagnostics; scope the override to this writer.
            - name: ESP32_LOG_LEVEL
              value: "WARN"
            - name: VERDIFY_SOURCE_SPOOL_ENABLED
              value: "1"
            - name: SOURCE_SPOOL_MAX_ROWS
              value: "30000"
            - name: SOURCE_SPOOL_MAX_BYTES
              value: "134217728"
            - name: VERDIFY_OBSERVATION_SPOOL_ENABLED
              value: "1"
            - name: OBSERVATION_SPOOL_MAX_ROWS
              value: "30000"
            - name: OBSERVATION_SPOOL_MAX_BYTES
              value: "134217728"
            - name: VERDIFY_CLIMATE_EVENT_SPOOL_ENABLED
              value: "1"
            - name: CLIMATE_EVENT_SPOOL_MAX_BYTES
              value: "134217728"
            - name: CLIMATE_SPOOL_MAX_ROWS
              value: "2880"
          volumeMounts:
            - name: state
              mountPath: /srv/verdify/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: verdify-ingestor-state
