# #382 durable source acceptance. Applying this causes the sole writer Recreate.
# Capture and preserve old emptyDir contents before the attended transition.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    spec:
      containers:
        - name: ingestor
          env:
            - name: VERDIFY_SOURCE_SPOOL_ENABLED
              value: "1"
            - name: SOURCE_SPOOL_MAX_ROWS
              value: "30000"
            - name: SOURCE_SPOOL_MAX_BYTES
              value: "134217728"
          volumeMounts:
            - name: state
              mountPath: /srv/verdify/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: verdify-ingestor-state
