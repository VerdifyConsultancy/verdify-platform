# INGESTOR STATE VOLUME (#130) — prod.
#
# The prod ingestor runs with readOnlyRootFilesystem:true and the base only mounts
# an emptyDir at /tmp. The live setpoint dispatcher + MCP-restart paths write to a
# FIXED path /srv/verdify/state (carried over from the VM host layout):
#   - /srv/verdify/state/setpoint-dispatcher.log   (every setpoint_dispatch task)
#   - /srv/verdify/state/mcp-server.log            (every MCP restart attempt)
#   - /srv/verdify/state/spool/climate.jsonl       (DB-outage climate replay)
# Without a writable mount there the live pod throws, observed post-cutover:
#   ERROR Task setpoint_dispatch failed: [Errno 2] No such file or directory:
#     '/srv/verdify/state/setpoint-dispatcher.log'
#   ERROR MCP server restart failed: [Errno 2] No such file or directory:
#     '/srv/verdify/state/mcp-server.log'
# i.e. the dispatcher task and MCP supervisor thrash on every cycle. The device
# pushes themselves still land (direct-push to ESP32 succeeds) but the logging +
# MCP-restart bookkeeping fails, so the dispatcher task is marked failed each run.
#
# TARGET: mount a writable RWO PVC at /srv/verdify/state. The climate spool is
# operational data, not just diagnostic log noise. The live exception below is
# still emptyDir under #382, so every gated Recreate must prove the old-pod spool
# empty before deletion until the retained Longhorn PVC is restored separately.
#
# laptop-root applies the restart that picks this up (single-writer Recreate: the
# old writer pod is torn down fully before the new one starts — no double-writer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    spec:
      containers:
        - name: ingestor
          volumeMounts:
            - name: state
              mountPath: /srv/verdify/state
      volumes:
        # ⚠️ TEMPORARY (#382, 2026-06-20): emptyDir, NOT the iSCSI PVC below. The
        # Synology iSCSI target-cap is exhausted and verdify-ingestor-state won't
        # remount on restart (writer was down ~10min). The LIVE writer runs emptyDir,
        # so this keeps git==live and a sync won't re-wedge the writer. The
        # dispatcher re-seeds /srv/verdify/state on boot (146 cfg readbacks + band
        # setpoints), so losing the prior spool is bounded. The separate broken
        # TEMP-ingestor-state-emptydir.patch.yaml `$patch: replace` never overrode
        # this PVC in the render (it left git=PVC vs live=emptyDir → ArgoCD
        # OutOfSync); defining emptyDir here directly is the reliable fix.
        # Restore the retained Longhorn persistentVolumeClaim below only after a
        # separate storage preflight and explicitly gated Recreate.
        - name: state
          emptyDir: {}
        # PVC (restore when #382/iSCSI is fixed):
        # - name: state
        #   persistentVolumeClaim:
        #     claimName: verdify-ingestor-state
