# #218: retained Longhorn state must be attachable on any Longhorn-attach worker.
# Keep the DB singleton and the existing Recreate strategies for Grafana/Hermes.
# Replacing the whole selector avoids preserving an obsolete hostname pin.
# Sched audit 2026-11-04: control-plane=false replaces node-class=general, which
# only node4/node5 carried among schedulable workers. The dedicated=frigate
# taint keeps these pods off node8 (none tolerates it).
- op: add
  path: /spec/template/spec/nodeSelector
  value:
    kubernetes.io/os: linux
    agentfleet.vallery.net/control-plane: "false"
    storage.vallery.net/longhorn-attach: "true"
