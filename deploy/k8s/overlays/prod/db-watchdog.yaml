# Prod DB self-recovery watchdog.
#
# Failure class covered: Longhorn-backed Postgres pod is CrashLoopBackOff with
# no ready verdify-db endpoint and logs show the mounted PGDATA path returning
# I/O/config-file errors. The safe recovery is a pod recreate, which forces CSI
# detach/reattach and can reschedule the StatefulSet pod onto another storage
# node. This job is deliberately narrow: it can only delete verdify-db-0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdify-db-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verdify-db-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-watchdog
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["verdify-db"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["verdify-db-0"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames: ["verdify-db-0"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verdify-db-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verdify-db-watchdog
subjects:
  - kind: ServiceAccount
    name: verdify-db-watchdog
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-db-watchdog
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-watchdog
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 90
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: db-watchdog
        spec:
          serviceAccountName: verdify-db-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: python:3.13-alpine
              command:
                - python
                - -c
              args:
                - |
                  import json
                  import os
                  import re
                  import ssl
                  import sys
                  import urllib.error
                  import urllib.request

                  ns = os.environ.get("POD_NAMESPACE", "verdify-prod")
                  pod_name = "verdify-db-0"
                  token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  host = os.environ["KUBERNETES_SERVICE_HOST"]
                  port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
                  base = f"https://{host}:{port}/api/v1/namespaces/{ns}"
                  token = open(token_path, encoding="utf-8").read().strip()
                  ctx = ssl.create_default_context(cafile=ca_path)

                  def api(method, path):
                      req = urllib.request.Request(
                          base + path,
                          method=method,
                          headers={"Authorization": f"Bearer {token}"},
                      )
                      with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                          return resp.read()

                  def api_json(path):
                      return json.loads(api("GET", path))

                  endpoints = api_json("/endpoints/verdify-db")
                  endpoint_ips = [
                      addr["ip"]
                      for subset in endpoints.get("subsets", [])
                      for addr in subset.get("addresses", [])
                      if "ip" in addr
                  ]
                  if endpoint_ips:
                      print(f"db endpoint present: {','.join(endpoint_ips)}")
                      sys.exit(0)

                  pod = api_json(f"/pods/{pod_name}")
                  postgres = next(
                      (status for status in pod.get("status", {}).get("containerStatuses", []) if status.get("name") == "postgres"),
                      {},
                  )
                  reason = postgres.get("state", {}).get("waiting", {}).get("reason", "")
                  restarts = int(postgres.get("restartCount") or 0)
                  if reason != "CrashLoopBackOff" or restarts < 3:
                      print(
                          "db endpoint absent, but postgres is not in a mature "
                          f"CrashLoopBackOff (reason={reason or 'none'}, restarts={restarts})"
                      )
                      sys.exit(0)

                  try:
                      logs = api(
                          "GET",
                          f"/pods/{pod_name}/log?container=postgres&previous=true&tailLines=80",
                      ).decode("utf-8", errors="replace")
                  except urllib.error.HTTPError:
                      logs = api(
                          "GET",
                          f"/pods/{pod_name}/log?container=postgres&tailLines=80",
                      ).decode("utf-8", errors="replace")

                  if re.search(r'I/O error|could not open configuration file|configuration file ".+" contains errors', logs, re.I):
                      print(f"matched DB mount/config I/O crash; deleting {pod_name} to force a clean remount")
                      api("DELETE", f"/pods/{pod_name}")
                      sys.exit(0)

                  print("db endpoint absent and CrashLoopBackOff, but logs did not match the safe remount signature")
              env:
                - name: HOME
                  value: /tmp
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 128Mi }
          volumes:
            - name: tmp
              emptyDir: {}
