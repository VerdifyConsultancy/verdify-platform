apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instance: verdify-prod — the production k3s Verdify APP instance. This is the
# instance whose ingestor is the ONE real single writer to the live ESP32. The
# device-write path is enabled HERE and only here (VERDIFY_DEVICE_WRITE_ENABLED=1
# + the allow-ingestor-device-egress NetworkPolicy). Cutting the live control
# loop onto k3s remains a safety-checked step (handoff §6); this overlay is the
# reviewable target shape.
#
# The namespace string is PINNED. It MUST equal:
#   - the Namespace object in this overlay (verdify-prod)
#   - the ArgoCD Application destination.namespace
#   - every registry/secrets/<id>.yaml target.namespace
namespace: verdify-prod

resources:
  - namespace.yaml
  - ../../base

  # Placeholder Secret for local `kustomize build` validation ONLY. Removed for a
  # real apply; the SOPS backend provides the real verdify-app-secrets.
  - secrets.placeholder.yaml
  # PLACEHOLDER HA token Secret for local build ONLY (#118 setpoint-server). Uses
  # the local-config ANNOTATION so it is EXCLUDED from build output (a
  # device-affecting HA token is never emitted). Real verdify-ha-token via SOPS.
  - ha-token.placeholder.yaml
  # PLACEHOLDER hermes gateway Secret for local build ONLY (#119 hermes-iris).
  # hermes-iris references verdify-hermes via envFrom.secretRef; this completes
  # the #30 contract surface so the prod build is lint-able. local-config
  # ANNOTATION -> EXCLUDED from build output (OpenAI key never emitted). Real
  # verdify-hermes via SOPS out-of-band. See hermes-secret.placeholder.yaml.
  - hermes-secret.placeholder.yaml
  # DEVICE WRITE PATH: the SINGLE egress allow letting the prod ingestor reach the
  # live device VLAN. See allow-ingestor-device-egress.yaml.
  - allow-ingestor-device-egress.yaml
  - db-watchdog.yaml
  - writer-watchdog.yaml
  # #382 durable source spool: claim and sole consumer land together.
  - ingestor-state-pvc.yaml
  # #575 / proxmox-infrastructure#86: adopt the already-migrated portable R2
  # Hermes run-state claim in Git. The original component claim is deleted from
  # this production render by the paired retirement patch below.
  - hermes-data-portable-pvc.yaml
  # Plant-observation pipeline (#436): GitOps-owned CronJob + generated
  # verdify-vision-src ConfigMap. Pulls the production ingestor digest from the
  # zot origin with zot-origin-cluster-pull ONLY (ADR-0021 — the transitional
  # GHCR pull credential is gone). The model credential Secret
  # (verdify-vision-key) remains a runtime prerequisite.
  - ../../vision
  # HA-3 (#239): ingestor PDB maxUnavailable:1 (singleton-may-be-disrupted intent;
  # correctness is the Lease fence, not the PDB). Additive — does NOT restart the
  # writer. The fast-failover podSpec patch (priority/tolerations/cpu) is the
  # SEPARATE gated STAGED-ha3-fast-failover-patch.yaml, deliberately NOT listed.
  - ingestor-pdb.yaml
  # #371: freeze only yesterday's declared native-route window at 00:30 local.
  # Uses the existing DB-only outcome-freezer identity and network policy.
  - native-panel-freezer.yaml
  # TWO-TIER TRAEFIK (#199 / D7): the shared apps Traefik (.7.10) tier-1
  # (verdify-tier1-forward) forwards *.verdify.ai to a dedicated in-namespace
  # verdify-traefik tier-2 (verdify-web entryPoint) which host-routes verdify-t2-*
  # to the ClusterIP services. This is the only prod product-domain ingress owner;
  # the older direct www/lab IngressRoutes were retired with the .150 route cleanup.
  # See traefik/ for the full set.
  - traefik
  # HA Sprint ha-1 / LANE B (#230): PodDisruptionBudgets giving every 2-replica
  # stateless surface (www/lab/api/mcp) + tier-2 verdify-traefik a disruption
  # floor (minAvailable:1), and grafana a drain-safe maxUnavailable:1 (RWO PVC
  # singleton). The incident had ZERO PDBs in verdify-prod. See pdb.yaml.
  - pdb.yaml
  # HA Sprint ha-1 / Lane A — resource governance (#226/#227/#229).
  # 4-tier PriorityClasses (cluster-scoped; additive — see priorityclasses.yaml).
  # The device-writer class is CREATED but NOT assigned to the ingestor here
  # (that is gated ha-3); verdify-serving IS assigned to the stateless surfaces
  # via ha-serving-resources.yaml in patches: below.
  - priorityclasses.yaml
  # Conservative namespace LimitRange so future pods aren't unbounded. Sets a
  # mem default + defaultRequest only (NO CPU `default` limit) so it can never
  # inject a throttling CPU limit into the gated device path. See limitrange.yaml.
  - limitrange.yaml

# verdify-planner (#117) + verdify-mqtt fan-out broker (#113) — referenced as
# Components, NOT added to base, so future overlays must opt in explicitly. The
# fan-out broker runs in PROD ONLY. The planner is NOT a device writer.
# Reviewed physical-clone projection for the exact atomic 240–248 migration.
# Argo creates this ConfigMap before the PreSync migrate Job; Kustomize rewrites
# the Job volume reference to its content-hashed name.
configMapGenerator:
  - name: verdify-c0-boundary-contract-240-248
    files:
      - contract.json=c0-boundary-contract-240-248.json
    options:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

components:
  # In-cluster firmware OTA capability (handoff §5.1 closed 2026-07-13):
  # suspended-CronJob build/flash template + durable artifacts PVC (the
  # rollback floor lives HERE now, not on the laptop) + toolchain cache.
  - ../../components/firmware-builder
  # #782 read-only observational winter packet. Suspended until a prospective
  # registration and exact source snapshot are staged on its archive PVC.
  - ../../components/winter-feasibility
  - ../../components/planner
  - ../../components/mqtt-broker
  # #118 verdify-setpoint-server — the grow-light writer + setpoint diagnostics.
  # PROD-ONLY: it is a DEVICE-AFFECTING writer (toggles the live grow lights via
  # HA), so it must stay prod-only.
  - ../../components/setpoint-server
  # #119 hermes-iris — the sole planner gateway, ported from the compose `hermes`
  # profile. prod-anchored (run-state PVC + OpenAI key). Image digest preserved.
  - ../../components/hermes-iris
  # Confirmed-component experiment v2 orchestration workers. The component's
  # base ConfigMap is fail-closed (experiment/vector modes off and no active
  # ID). Its OpenAI selector endpoint/key references cannot be exercised while
  # capability is off, so this remains an inert, observable Gate-1 runtime.
  # Shadow/randomized operation remains a later GitOps change.
  - ../../components/experiment-v2-orchestrator
  # Gate 1 ordinary database-role cutover. The PreSync hook installs and proves
  # the two migration-217 logins before API/ingestor roll, then the pod patches
  # remove the database-owner credential from both ordinary containers. Merge
  # and sync only after the protected four-key reconciliation receipt exists.
  - ../../components/runtime-role-boundary
  # Protocol-only MCP observer. The credential is owned by the agents KSOPS
  # lane and was reconciled before this workload reference.
  - ../../components/mcp-observer
  # Gate 2 experiment credential activation. This remains non-actuating and
  # uses a one-container wave-2 hook while capability and active ID stay off.
  - ../../components/experiment-v2-credential-bootstrap
  # Accepted-risk direct-launch preparation. A one-container wave-3 hook creates
  # only the exact feature-off draft and registers the three frozen profile
  # vectors. It cannot enable the component, open admission, randomize, or write
  # a device. Exact replay is idempotent after migration 221.
  - ../../components/experiment-v2-direct-launch-bootstrap
  # Direct physical proof is deliberately absent from ordinary production.
  # A fresh attended attempt must use the separate, suspended activation render
  # under deploy/k8s/activations/experiment-v2-direct-proof and be removed again
  # after its append-only receipt. Ordinary convergence stays coarse-off.
  # #124 verdify-lab — the public Quartz research site (lab.verdify.ai). Pure web
  # tier with no device path. The publisher owns content; a content-free nginx
  # runtime serves its validated cache PVC.
  - ../../components/lab-site
  # db-backup (M3.3; refs #84/#28/#130) — the verdify-db-dumps NFS PVC + nightly
  # pg_dump -Fc CronJob + retention + allow-db-from-backup. pg_dump is SELECT-only
  # on the DB (NOT a second writer) and only writes the dumps PVC, so it is SAFE
  # in the prod writer shape AND in overlays/prod-dark, and gives a fresh <26h dump
  # before any restore. Renders into the verdify-prod namespace. Root binds
  # verdify-db-dumps to a static NFS PV (dumps-pvc.yaml is storageClassName:"" ->
  # waits for that PV). The cluster-scoped synology-iscsi-ssd StorageClass is NOT
  # pulled here — Root applies it once via components/db-backup/storageclass.
  - ../../components/db-backup
  # #498 verdify-grafana — OUR OWN Grafana on graphs.verdify.ai. Independent,
  # in-cluster, reading the prod TimescaleDB (verdify-db:5432). PROD-ONLY (graphs
  # is a prod host); never staging. Stateless (emptyDir; provisioned datasource +
  # site-*.json dashboards + anonymous-Viewer embeds). Tier-2 IngressRoute routes
  # Host(graphs.verdify.ai) -> verdify-grafana:3000 through the verdify-traefik
  # tier-2 (verdify-web entryPoint). NOT a device writer.
  - ../../components/grafana
  # #211 ingestor-gather-script — the planner context-gather ConfigMap
  # (gather-plan-context.sh + lib/psql-verdify.sh) the ingestor mounts at
  # /srv/verdify/scripts/. prod-only (only prod runs the planner). Adding the
  # ConfigMap does NOT touch the running ingestor; the mount + psql initContainer
  # ship in the gated ingestor patch (see PR / ingestor-gather-mount.patch.yaml).
  - ../../components/ingestor-gather-script
  # HA gap backfill — hourly DB-first reconciliation from Home Assistant recorder
  # history. Read-only against HA and writes only missing Verdify telemetry rows;
  # mounted script means enabling the CronJob does NOT roll the live ingestor.
  - ../../components/ha-gap-backfill

patches:
  # Reconcile the live, verified 2026-08-01 Hermes PVC cutover.
  - path: hermes-data-portable.patch.yaml
  # The old, detached pre-portable claim has a readable Completed backup and no
  # runtime consumer. Keep it absent from desired production state so a later
  # sync cannot recreate it after the attended storage retirement.
  - path: hermes-data-retired.patch.yaml
  # PROD DB STORAGE RECONCILE: restate verdify-db's volumeClaimTemplate onto
  # Longhorn NVMe RWO storage to match the migrated live prod DB. git==live
  # -> no immutable-field StatefulSet patch attempt. See
  # db-storageclass-iscsi.yaml. Reconcile-to-live only; does NOT recreate the STS.
  - path: db-storageclass-iscsi.yaml
  # DEVICE-WRITE INTERLOCK (#79): VERDIFY_DEVICE_WRITE_ENABLED=1 — prod only.
  - path: device-write-configmap.yaml
  # Native callback capture is ingestor-only; use a narrow pod env patch so
  # this activation Recreates only the sole writer, not all config consumers.
  - path: native-panel-ledger-ingestor.patch.yaml
  # Numbered migrations run in the PreSync hook on the same exact revision,
  # before API/ingestor workloads can consume the new schema.
  - path: migration-ledger.patch.yaml
  # #382 state mount now proposes the declared Longhorn claim; adoption
  # changes the sole writer podSpec and needs an attended convergence.
  # HA-3.1 FAST FAILOVER (#239, task-authorized 2026-06-20): pin the ingestor to
  # priorityClassName verdify-device-writer + 20s NoExecute tolerations + a cpu
  # request (no cpu LIMIT) + terminationGracePeriodSeconds:15, so the sole writer
  # reschedules fast on node loss and is never preempted. GATED LIVE-APPLY: this
  # mutates the podSpec -> a Recreate rollout of the live writer. ArgoCD is
  # manual-sync, so committing this does NOT restart the writer; the restart
  # happens only on the next explicit `argocd app sync verdify-prod-dark`. Do that
  # sync in a window when the iSCSI/Longhorn storage is healthy — a writer restart
  # can hit the known PVC-attach wedge (~minutes of writer gap) (observed 2026-06-20).
  - path: STAGED-ha3-fast-failover-patch.yaml
  # #113 publish-all: prod re-emits every flushed telemetry row onto the fan-out
  # bus (verdify-mqtt) so dev/stage subscribers mirror it. prod-only env.
  - path: publish-all-configmap.yaml
  # #212 HERMES_URL: repoint the ingestor's iris_planner gateway POST off the
  # VM-era loopback default (127.0.0.1:8642) onto the in-cluster hermes-iris
  # ClusterIP Service. Env-only override; no ingestor rebuild. See
  # hermes-url-configmap.yaml. (Restart to apply is a gated step — see PR.)
  - path: hermes-url-configmap.yaml
  # #211 gather-script runtime env: VERDIFY_DB_BACKEND=dsn (in-cluster psql) +
  # PYTHON=python3 + PYTHONPATH=/app, consumed ONLY by the mounted gather
  # subprocess (not the ingestor app / device path). See
  # gather-script-env-configmap.yaml. (Picked up on the gated restart.)
  - path: gather-script-env-configmap.yaml
  # #211/#263 gather-path capture plus Gate-1 credential cutover: retain the
  # proven install-psql initContainer, gather-script/pgclient mounts,
  # PATH/LD_LIBRARY_PATH, and HERMES auth. PGPASSWORD deliberately changes from
  # the database-owner key to the ingestor's least-privilege runtime key, matching
  # the component's ordinary-process credential. This causes a controlled
  # single-writer Recreate and is verified after sync. See the patch header.
  - path: ingestor-gather-mount.patch.yaml
  # #130 ingestor state volume: durable RWO PVC at /srv/verdify/state for
  # dispatcher/MCP bookkeeping and DB-outage telemetry spooling.
  - path: ingestor-state-volume.yaml
  # L1 Phase 2 resilience: liveness probe (DB-outage-tolerant — restarts only a
  # wedged writer, never during a DB outage) + soft anti-affinity off the
  # storage-flaky node6. Applying RESTARTS the single ESP32 writer (gated).
  - path: ingestor-resilience.patch.yaml
  # HA Sprint ha-1 / Lane A (#226/#227/#229): add verdify-serving priorityClass +
  # a CPU LIMIT (burst containment, NOT a tight throttle) + tuned mem to the
  # STATELESS surfaces (www/lab/api/mcp/planner/grafana). Strategic-merge by
  # name -> only these deployments + named containers are touched; the device
  # path (ingestor/setpoint-server) is DELIBERATELY EXCLUDED. See
  # ha-serving-resources.yaml.
  - path: ha-serving-resources.yaml
  # ingestor keeps the base replicas:1 + Recreate (single-writer invariant); no
  # replicas:0 pin here (that is staging's two-writer safety pin).
  # HA Sprint ha-1 / LANE B (#230): scale www/lab/api/mcp 1->2, hard hostname
  # spread (DoNotSchedule + matchLabelKeys), zero-downtime rollout. Scoped to
  # overlays/prod so base (api/mcp -> staging) + the www/lab components (-> dev)
  # stay at replicas:1. ingestor/setpoint-server are NOT in this patch.
  - path: ha-stateless-spread.patch.yaml

# Image digests. Workloads name their image by the canonical key
# ghcr.io/verdifyconsultancy/verdify-*; each entry maps it to the zot origin at
# an immutable @sha256 digest (never a tag).
#
# The api, mcp, ingestor, migrate and experiment-v2-orchestrator entries are
# BUILD CANDIDATES. The verdify-platform-ci pin actuator rewrites them after
# every build of main, and they do not decide what production runs: the
# release-pins.yaml transformer at the end of this file replaces their digests
# in the render. Do not hand-edit those five entries or change their
# name/newName/digest shape; the actuator fails unless each appears exactly once.
# The planner, setpoint-server and lab-publisher-k3s entries are release pins,
# advanced by hand.
images:
  - name: ghcr.io/verdifyconsultancy/verdify-api
    newName: registry.vallery.net/verdifyconsultancy/verdify-api
    digest: sha256:51fe7f62f6d780503acbde5a7c09f03038e31d511b11960a6dd88af42b016d32
  - name: ghcr.io/verdifyconsultancy/verdify-mcp
    newName: registry.vallery.net/verdifyconsultancy/verdify-mcp
    digest: sha256:9a93828ebaedfd9cb4197041ef36ee317f5403d147d7781e4eded138f1516688
  - name: ghcr.io/verdifyconsultancy/verdify-ingestor
    newName: registry.vallery.net/verdifyconsultancy/verdify-ingestor
    digest: sha256:2813240dbd5ce3c644d0285fd4603901eef9ae38ad00d28f4e64deb05f46ad2d
  - name: ghcr.io/verdifyconsultancy/verdify-migrate
    newName: registry.vallery.net/verdifyconsultancy/verdify-migrate
    digest: sha256:0e0c9326c850e651f3a40101bc94439ac00dab2c7a2b74327a6b9a89191f45a1
  # Build candidate for the feature-off experiment-v2 orchestrator (its release
  # digest is in release-pins.yaml). The component remains inert until its
  # explicit GitOps feature gate.
  - name: ghcr.io/verdifyconsultancy/verdify-experiment-v2-orchestrator
    newName: registry.vallery.net/verdifyconsultancy/verdify-experiment-v2-orchestrator
    digest: sha256:2efb27f804689a862b1f6fe0f9abcb0fb607f920fc176d22dabff70e32d7b11e
  # Hand-pinned planner: merged source 96a1d6bd includes the #822 liveness fix;
  # built by agent-fleet-ci/verdify-platform-build-planner-96a1d6bd-vdbkv.
  - name: ghcr.io/verdifyconsultancy/verdify-planner
    newName: registry.vallery.net/verdifyconsultancy/verdify-planner
    digest: sha256:61b1e7aaf510edb4feee38f6c39a949758d50f2aa8a572ef50851d2c4c70b66a
  # Hand-pinned grow-light writer: source e32df41e, build-setpoint-server in
  # agent-fleet-ci/verdify-platform-ci-5dgwr. The #399 HA call allowlist confines
  # this prod-only writer to the declared main/grow light switches.
  # hermes-agent is deliberately ABSENT from this transformer — its upstream
  # @sha256 is preserved inline in the component (NOT transformer-pinned).
  - name: ghcr.io/verdifyconsultancy/verdify-setpoint-server
    newName: registry.vallery.net/verdifyconsultancy/verdify-setpoint-server
    digest: sha256:6f2fef6a11c7ba67e0b297807c415fda39aa1f2977dcfa170248689087174952
  # Hand-pinned lab publisher: source e32df41e, build-lab-publisher in
  # agent-fleet-ci/verdify-platform-ci-5dgwr. Includes the route-only
  # observational block, which remains absent until a qualified publication.
  - name: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
    newName: registry.vallery.net/verdifyconsultancy/verdify-lab-publisher-k3s
    digest: sha256:f2e08c6d79c9c3a9f36f95d0612a07e32b027caad9ad8406a9b87084424ba4b0

# Release pins: the digests production runs for the five actuator-managed
# images. kustomize applies `transformers:` after `images:`, so these replace
# the build-candidate digests above in every workload, CronJob and hook Job.
# A build changes Git only; promotion is a digest-only edit of
# release-pins.yaml followed by the gated sync.
transformers:
  - release-pins.yaml
