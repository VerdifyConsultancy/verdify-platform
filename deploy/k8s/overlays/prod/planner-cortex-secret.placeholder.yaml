# PLACEHOLDER Cortex planner Secret for LOCAL VALIDATION ONLY (#1350, components/cortex-planner).
#
# THIS IS NOT A REAL CREDENTIAL. The real verdify-planner-cortex Secret (key api_key.txt, a Cortex
# identity limited to llm.primary.longctx and llm.qwen38u.longctx) lives in verdify-prod and moves
# to the jvallery/agents KSOPS lane (jvallery/agents#6079). The Deployment mounts it optional, so
# its absence fails closed with an alert instead of a crash loop.
#
# config.kubernetes.io/local-config is an ANNOTATION (not a label), so `kustomize build` excludes
# this object and the prod render emits no Secret.
apiVersion: v1
kind: Secret
metadata:
  name: verdify-planner-cortex
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: cortex-planner
  annotations:
    config.kubernetes.io/local-config: "true"   # excluded from build output
type: Opaque
stringData:
  api_key.txt: "PLACEHOLDER_NOT_A_REAL_SECRET"
