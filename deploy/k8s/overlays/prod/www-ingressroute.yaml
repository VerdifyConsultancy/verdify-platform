# prod verdify-www edge exposure on the production www.verdify.ai host (#116).
#
# CONFIRMED ARCHITECTURE: prod owns the bare *.verdify.ai hosts
# (www/lab/api/graphs.verdify.ai); dev/stage live on *.k3s.verdify.ai. This routes
# the prod verdify-www THROUGH the shared apps Traefik (traefik-apps on the .7.10
# VIP) — the ONE conformant front door, the same one-pattern as the api route
# (overlays/staging/ingressroute.yaml api.verdify.ai rule).
#
# INERT-ON-MERGE: there is no verdify-prod ArgoCD Application CR yet (laptop-root
# gate). The live verdify-local-staging app syncs ONLY overlays/staging, so this
# IngressRoute is never reconciled by merging to live/platform-main. It is the
# reviewable target shape. The cloudflared vallery-edge tunnel forwarding
# www.verdify.ai -> .7.10, the *.verdify.ai split-horizon DNS, and a public
# wildcard-verdify-ai Certificate (cert-manager letsencrypt-dns01; the same
# residual gate documented for api.verdify.ai in staging) are platform-layer
# prerequisites. HTTP routing is the shape here.
#
# APEX: verdify.ai is routed to the same backend; the upstream server.mjs serves
# the site at "/" and owns its own internal path redirects (NOT an apex->www
# bounce here — keep edge routing dumb, let the app own redirect policy).
#
# No strip-identity Middleware: the marketing site is fully public and trusts no
# forward-auth identity (unlike the api). tls: {} == Traefik default cert until
# the *.verdify.ai wildcard lands.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: verdify-www
  namespace: verdify-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: www
    agent-fleet.vallery.net/edge: vallery-edge
  annotations:
    agent-fleet.vallery.net/exposure: public
    agent-fleet.vallery.net/auth-mode: none
    agent-fleet.vallery.net/public-dns-gate: intentional-public-content
spec:
  entryPoints:
    - websecure
    - web
  routes:
    # prod www + apex on the product domain. The component verdify-www Service is
    # ClusterIP :8080 (no per-app LoadBalancer — the ADR-15 anti-pattern). Traefik
    # resolves against the Service .spec.ports[].port (8080).
    - kind: Rule
      match: Host(`www.verdify.ai`) || Host(`verdify.ai`)
      services:
        - name: verdify-www
          port: 8080
  tls: {}
