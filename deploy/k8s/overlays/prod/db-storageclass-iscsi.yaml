# PROD storage reconcile: the live prod verdify-db is durable database state and
# belongs on the Longhorn workspace RWO block class. The prod overlay restates the
# full volumeClaimTemplate so git stays equal to the live StatefulSet template
# and ArgoCD does not try to patch the immutable field piecemeal.
#
# This is a RECONCILE-TO-LIVE git change only; it does NOT touch or recreate the
# live StatefulSet (git now equals the running spec). Mirrors the staging
# db-storageclass-iscsi.yaml pattern. The whole volumeClaimTemplate element is
# restated (kustomize keys volumeClaimTemplates by metadata.name and replaces the
# matched element) so accessModes + size are preserved alongside the SC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verdify-db
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: postgres
          # Sched audit 2026-11-04 (#15): requests sized to measured use. 7-day
          # Prometheus readback: CPU p50 0.90 / p95 1.47 / max 2.46 cores;
          # working set p50 2.8Gi / p95 4.2Gi (RSS p95 ~0.7Gi, the rest page
          # cache). The 6Gi limit is unchanged.
          resources:
            requests:
              cpu: "1500m"
              memory: "3584Mi"
            limits:
              memory: "6Gi"
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-v1-workspace-rwo
        resources:
          requests:
            storage: 50Gi
