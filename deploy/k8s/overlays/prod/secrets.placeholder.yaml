# PLACEHOLDER secret for LOCAL VALIDATION ONLY (kustomize build / kubeconform).
#
# THIS IS NOT A REAL CREDENTIAL and MUST NOT be applied to a real cluster. In
# production the verdify-app-secrets Secret is provided by the fleet SOPS+age
# secret backend and applied by the GitOps secret-delivery step BEFORE this app
# reconciles. The config.kubernetes.io/local-config label makes GitOps tooling
# skip this object on real applies; for a real apply, drop the
# `- secrets.placeholder.yaml` line from this overlay kustomization. It exists
# ONLY so `kustomize build` yields a complete, lint-able manifest in CI without
# reaching the secret backend.
#
# Canonical write-secret key is VERDIFY_WRITE_API_KEY (api/main.py write guard).
# ESP32_API_KEY is device-affecting (Noise PSK) and sealed from the canonical
# source; the value here is fake.
apiVersion: v1
kind: Secret
metadata:
  name: verdify-app-secrets
  labels:
    app.kubernetes.io/part-of: verdify
  annotations:
    # MUST be an ANNOTATION (not a label): `kustomize build` only EXCLUDES objects
    # carrying the config.kubernetes.io/local-config ANNOTATION from its output.
    # Previously this was a LABEL, which rendered the placeholder Secret into the
    # prod build (a real GitOps apply would then push PLACEHOLDER values over the
    # SOPS-delivered verdify-app-secrets — DB-auth drift / write-key clobber).
    # Matching staging's corrected annotation form keeps it lint-only.
    config.kubernetes.io/local-config: "true"   # never applied by GitOps
type: Opaque
stringData:
  # CANONICAL verdify-app-secrets key contract — superset of every secretKeyRef
  # in the manifests, so `kustomize build` stays complete. Real values sealed
  # out-of-band by laptop-root (SOPS+age). NEVER inline a real value.
  # ── DB + write guard (hard-required) ──
  POSTGRES_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_WRITE_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  # ── Device + messaging (ESP32 PSK device-affecting — must-not-lose) ──
  ESP32_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_USER: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_PASS: "PLACEHOLDER_NOT_A_REAL_SECRET"
  # ── Planner + embeddings ──
  HERMES_IRIS_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  OPENAI_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  # ── HA long-lived token (ingestor's own; projected to a file) ──
  HA_TOKEN: "PLACEHOLDER_NOT_A_REAL_SECRET"
  # ── Contact-form credentials (api) ──
  VERDIFY_CONTACT_SMTP_USERNAME: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_CONTACT_SMTP_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_TURNSTILE_SECRET: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_CONTACT_HASH_SALT: "PLACEHOLDER_NOT_A_REAL_SECRET"
  # ── Observability tier (#88/#63) — NEW keys, hand off to laptop-root ──
  # GRAFANA_ADMIN_PASSWORD: grafana admin login (VM: GRAFANA_ADMIN_PASSWORD).
  # UMAMI_DB_PASSWORD: umami's OWN postgres password (NOT POSTGRES_PASSWORD).
  # UMAMI_APP_SECRET: umami session/signing secret.
  GRAFANA_ADMIN_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  UMAMI_DB_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  UMAMI_APP_SECRET: "PLACEHOLDER_NOT_A_REAL_SECRET"
