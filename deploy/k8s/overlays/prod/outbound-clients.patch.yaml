# Preserve the existing MCP 10 / Hermes 20 / writer 30 dependency order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
spec:
  template:
    spec:
      containers:
      - name: mcp
        env:
        - name: OPENAI_BASE_URL
          value: http://verdify-outbound:8081/v1
        - name: SLACK_API_BASE_URL
          value: http://verdify-outbound:8082/api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    spec:
      containers:
      - name: ingestor
        env:
        - name: SLACK_API_BASE_URL
          value: http://verdify-outbound:8082/api
        - name: VERDIFY_FORECAST_BASE_URL
          value: http://verdify-outbound:8083
