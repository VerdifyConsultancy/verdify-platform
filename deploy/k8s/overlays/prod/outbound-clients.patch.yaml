apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-mcp
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  template:
    spec:
      containers:
      - name: mcp
        env:
        - name: OPENAI_BASE_URL
          value: http://verdify-outbound:8081/v1
        - name: SLACK_API_BASE_URL
          value: http://verdify-outbound:8082/api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  template:
    spec:
      containers:
      - name: ingestor
        env:
        - name: SLACK_API_BASE_URL
          value: http://verdify-outbound:8082/api
        - name: VERDIFY_FORECAST_BASE_URL
          value: http://verdify-outbound:8083
