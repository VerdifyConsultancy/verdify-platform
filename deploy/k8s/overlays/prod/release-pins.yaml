# Release pins: the digests production runs for the five images that the
# verdify-platform-ci pin actuator manages (api, mcp, ingestor, migrate and
# experiment-v2-orchestrator).
#
# The actuator rewrites those five entries in kustomization.yaml `images:` after
# every build of `main`. Those entries are build candidates: this file is listed
# under `transformers:`, which kustomize runs after the `images:` field, so the
# digests below replace the candidate digests in every rendered workload, CronJob
# and hook Job. A source build therefore changes Git only and leaves the prod
# render, and what Argo compares against live, unchanged.
#
# Promote: `python3 scripts/promote-release-pins.py` copies the candidate
# digests into this file. Commit that digest-only change, merge it, then run the
# gated `verdify-prod-dark` sync in the same attended session
# (docs/runbooks/laptop-operator.md §2). Promote all five together unless the
# schema allows otherwise: the migrate hook carries the migrations the api, mcp
# and ingestor digests expect.
