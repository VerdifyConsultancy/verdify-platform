# network-infra#839 (STD-EXP-03): declared management consumers beside the vendored
# egress-deny-management policy (egress-deny-management.yaml). docs/SERVICE_MAP.md lists
# the Home Assistant consumers: the ingestor (already bounded by
# allow-ingestor-device-egress, so not selected by the deny) and the setpoint server.
# Home Assistant (HAOS 192.168.30.107) is in the management set. The setpoint server
# calls only the HA REST API on 8123 and does not use MQTT. The HA gap backfill CronJob
# was retired by VD-48.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allow-management-home-assistant
  labels:
    app.kubernetes.io/part-of: verdify
    network.vallery.net/policy: egress-allow-management
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - setpoint-server
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.30.107/32
      ports:
        - protocol: TCP
          port: 8123
