# Production numbered-migration delivery (#583 / experiment-v2 integration).
#
# This flag is set directly on the PreSync hook rather than through
# verdify-config: a PreSync Job runs before ordinary ConfigMaps reconcile, so
# envFrom alone could observe the previous ConfigMap on the first armed sync
# and let new workloads roll before their schema. The ledger runner is
# idempotent, advisory-lock protected, and fails closed on a missing baseline
# authorization or an edited-after-apply migration hash.
apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: VERDIFY_MIGRATE_LEDGER
              value: "1"
            - name: VERDIFY_C0_BOUNDARY_CONTRACT
              value: /db/c0-boundary-contract.json
            # Independent review pin for the exact ConfigMap file bytes.
            - name: VERDIFY_C0_BOUNDARY_CONTRACT_SHA256
              value: 90fac3dafbf927e6dfc67d8ec73e6b41c4f818f5c983216550848be8bf9dff6f
          volumeMounts:
            - name: c0-boundary-contract
              mountPath: /db/c0-boundary-contract.json
              subPath: contract.json
              readOnly: true
      volumes:
        - name: c0-boundary-contract
          configMap:
            name: verdify-c0-boundary-contract-240-248
            defaultMode: 0444
