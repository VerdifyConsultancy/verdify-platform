# #1022: sole ESP32 writer; exact Shelly TCP/502 exception approved by Jason.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingestor-device-egress
  labels:
    app.kubernetes.io/part-of: verdify
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ingestor
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 192.168.10.111/32
    ports:
    - protocol: TCP
      port: 6053
  - to:
    - ipBlock:
        cidr: 192.168.10.36/32
    ports:
    - protocol: TCP
      port: 502
  - to:
    - ipBlock:
        cidr: 192.168.30.107/32
    ports:
    - protocol: TCP
      port: 8123
    - protocol: TCP
      port: 1883
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: mqtt-broker
    ports:
    - protocol: TCP
      port: 1883
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: hermes-iris
    ports:
    - protocol: TCP
      port: 8642
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: mcp
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: frigate
      podSelector:
        matchLabels:
          app: frigate
    ports:
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 1984
  - to:
    - ipBlock:
        cidr: 192.168.30.31/32
    - ipBlock:
        cidr: 192.168.30.32/32
    - ipBlock:
        cidr: 192.168.30.33/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 192.168.30.105/32
    - ipBlock:
        cidr: 192.168.30.142/32
    - ipBlock:
        cidr: 192.168.30.108/32
    ports:
    - protocol: TCP
      port: 9400
  - to:
    - ipBlock:
        cidr: 192.168.30.150/32
    - ipBlock:
        cidr: 192.168.30.105/32
    - ipBlock:
        cidr: 192.168.30.142/32
    - ipBlock:
        cidr: 192.168.30.151/32
    - ipBlock:
        cidr: 192.168.30.212/32
    - ipBlock:
        cidr: 192.168.30.211/32
    - ipBlock:
        cidr: 192.168.30.213/32
    - ipBlock:
        cidr: 192.168.30.214/32
    - ipBlock:
        cidr: 192.168.30.215/32
    ports:
    - protocol: TCP
      port: 9100
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: outbound
    ports:
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
