apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instance: verdify-dev — the dev k3s Verdify APP instance (read-only telemetry
# SUBSCRIBER; never writes the ESP32).
#
# LIVE + THE PROVING ENVIRONMENT (2026-06-10): the verdify-dev ArgoCD app syncs
# this overlay from `main`; staging is RETIRED. The container-publish
# bump-dev-digests job auto-pins freshly published image digests here, dev
# reconciles them, and the gated prod-promote workflow copies proven-on-dev
# digests to overlays/prod. Dev's database is a nightly prod-restored copy
# (db-restore-from-prod.yaml); dev NEVER connects to the greenhouse device.
#
# The namespace string is PINNED. It MUST equal:
#   - the Namespace object in this overlay (verdify-dev)
#   - the future ArgoCD Application destination.namespace
#   - every registry/secrets/<id>.yaml target.namespace
namespace: verdify-dev

# Placeholder Secret for local `kustomize build` validation ONLY. The SOPS
# backend provides the real verdify-app-secrets out-of-band. See the file.
# DEVICE-SAFETY: dev-only egress lock dropping all egress to the greenhouse
# device VLAN (192.168.10.0/24) from the ingestor pod. Mirrors staging; the
# inverse allow lives ONLY in overlays/prod. See deny-esp32-egress.yaml.
# EDGE/WAN: host-route the dev verdify-api on api.k3s.verdify.ai through the
# shared apps Traefik (.7.10). dev/stage URLs live on *.k3s.verdify.ai (prod
# owns the bare *.verdify.ai hosts). See ingressroute.yaml.
# EDGE/WAN: host-route the dev verdify-lab Quartz site on lab.k3s.verdify.ai
# through the same shared apps Traefik (#124). See lab-ingressroute.yaml.
# Nightly prod->dev DB refresh: RO PV/PVC onto the prod dumps NFS subdir +
# restore CronJob + the db-restore ingress allow. See file header.
resources:
- namespace.yaml
- ../../base
- secrets.placeholder.yaml
- deny-esp32-egress.yaml
- allow-web-from-apps-ingress.yaml
- ingressroute.yaml
- lab-ingressroute.yaml
- db-restore-from-prod.yaml

# verdify-planner (#117) + verdify-lab (#124) + grafana (graphs-dev) —
# referenced as Components, NOT added to base. Same pattern as overlays/prod.
# The grafana component is namespace-transformed into verdify-dev, so its
# provisioned datasource (host verdify-db) reads the DEV DB; two dev patches
# below fix its prod-hardcoded edge/env values.
components:
- ../../components/planner
- ../../components/lab-site
- ../../components/grafana

# APP_ENV=dev + VERDIFY_DEVICE_WRITE_ENABLED=0 + VERDIFY_INGEST_SOURCE=
# mqtt-subscribe (dev is a read-only telemetry SUBSCRIBER, never writes the
# device). See env-configmap.yaml.
# DEVICE SAFETY (single-writer invariant): pin the ingestor workload OFF
# (replicas:0), mirroring overlays/staging, so verdify-dev is PROVABLY
# device-dark — no ingestor pod runs until the Jason-gated M5 cutover, and an
# ArgoCD selfHeal reconcile cannot stand up a second writer. dev must never be a
# 2nd writer. See ingestor-replicas-zero.yaml.
# PER-ENV DB STORAGE (#115): retarget the verdify-db PVC from the base
# local-path to Longhorn NVMe RWO storage. dev gets its OWN TimescaleDB
# StatefulSet (NOT prod's DB), seeded by the gated copy-not-move pg_dump restore
# runbook.
# graphs-dev: retarget the prod-authored grafana edge route to the dev edge
# (apps Traefik web/websecure + graphs.k3s.verdify.ai) and fix the two
# prod-hardcoded Deployment env values.
patches:
- path: env-configmap.yaml
- path: ingestor-replicas-zero.yaml
- path: db-storageclass.yaml
  target:
    kind: StatefulSet
    name: verdify-db
- path: graphs-ingressroute-patch.yaml
  target:
    kind: IngressRoute
    name: verdify-t2-graphs
- path: grafana-dev-patch.yaml
- path: lab-publisher-config-patch.yaml

# Image digest pins. Canonical namespace ghcr.io/verdifyconsultancy/verdify-*,
# immutable @sha256 (NEVER a mutable :latest/:dev tag). The app images reuse the
# staging-verified digests as a known-good baseline; verdify-planner and
# verdify-migrate now carry their real published GHCR digests (#99 — both images
# are published + repo-linked; the bump-staging-digests job auto-repins BOTH the
# planner (on each green planner build) and the migrate (on each green migrate
# build) digest into this dev overlay, so neither self-heals away from a phantom
# pin again). dev is INERT (no ArgoCD app), so this pin deploys nothing.
  # verdify-lab (#124): real GHCR digest of the Quartz research-site image built
  # from the verdify-site-legacy repo's Dockerfile.k3s (Quartz `npx quartz build`
  # -> static public/ -> nginx-unprivileged on :8080). Published + repo-linked by
  # verdify-site-legacy's publish-lab-image.yml workflow (package repository.name
  # == verdify-site-legacy) and verified pullable 2026-06-04 — REPLACES the prior
  # all-zeros placeholder pin whose package 404'd (verdify-site was an orphan GHCR
  # repo). lab is NOT in overlays/staging (it is a dev/prod-only Component), so it
  # is EXEMPT from the promote-diff-guard staging-equality check; dev pins the SAME
  # env-agnostic digest as prod (one-digest-across-envs static content).
  #
  # 2026-06-07 #263 CONVERGENCE (laptop-root): the prior 92ab47.. pin was the
  # SYNTHETIC CI temp-vault build (stock "Welcome to Quartz 4" starter). Repointed
  # to the SAME real vault-built digest overlays/prod already serves on
  # lab.verdify.ai (bf71018, 121 .md -> 566 static files), so no overlay carries
  # the synthetic placeholder and a sync can never seed the Quartz manual. The
  # durable CI-from-real-vault fix is Iris #124 / PR #259.
images:
- digest: sha256:ecb4b6ce2b34286a492819e5afadb6c585c356d0dd5e2a7856effda003c514e4
  name: ghcr.io/verdifyconsultancy/verdify-api
- digest: sha256:7b562474bee6ad1f70c820ea8ca87098b9b34d20167d05f7588d7ccb130f20b0
  name: ghcr.io/verdifyconsultancy/verdify-ingestor
- digest: sha256:bf71018f181f4e37e585b8778852eb209875555525c425921663e7744891c973
  name: ghcr.io/verdifyconsultancy/verdify-lab
- digest: sha256:4f64996f45e7b84618cc9b7da9f0ac97bc2b38de7805cc314b245d2c2f0b791c
  name: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
- digest: sha256:0592adcea96e67174d16bc7f7a9f1d8580074483634f1b0bd37d773ec22d9aa9
  name: ghcr.io/verdifyconsultancy/verdify-mcp
- digest: sha256:59d441396a2d63f02903d862366a6656f83e45c5634eed9a42e413983b83f1a3
  name: ghcr.io/verdifyconsultancy/verdify-migrate
- digest: sha256:fa8b6e0a6a49dee1e6ba475d777a26472ab0dc3f4f19f5312eee17bf2bde8e44
