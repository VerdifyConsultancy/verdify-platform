# dev verdify-www edge exposure on the *.k3s.verdify.ai dev/stage domain (#116).
#
# CONFIRMED ARCHITECTURE: dev/stage URLs live on *.k3s.verdify.ai; prod owns the
# bare www.verdify.ai host. This routes the dev verdify-www THROUGH the shared
# apps Traefik (traefik-apps on the .7.10 VIP) — the ONE conformant front door,
# identical pattern to overlays/dev/ingressroute.yaml (the dev api route).
#
# INERT-ON-MERGE: there is no verdify-dev ArgoCD Application CR yet (laptop-root
# gate). The live verdify-local-staging app syncs ONLY overlays/staging, so this
# IngressRoute is never reconciled by merging to live/platform-main. It is the
# reviewable target shape. The www.k3s.verdify.ai DNS + the traefik-apps
# host-route acceptance + a public *.k3s.verdify.ai wildcard Certificate
# (cert-manager letsencrypt-dns01) are platform-layer prerequisites (same gate as
# the dev App CR / the api route's residual TLS gap). HTTP routing is the shape.
#
# No strip-identity Middleware here: the marketing site is fully public and
# trusts no forward-auth identity (unlike the api). tls: {} == Traefik default
# cert.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: verdify-www
  namespace: verdify-dev
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: www
spec:
  entryPoints:
    - websecure
    - web
  routes:
    # dev www on the dev/stage domain. The component verdify-www Service is
    # ClusterIP :8080 (no LoadBalancer overlay in dev). Traefik's kubernetescrd
    # provider resolves against the Service .spec.ports[].port, which is 8080.
    - kind: Rule
      match: Host(`www.k3s.verdify.ai`)
      services:
        - name: verdify-www
          port: 8080
  tls: {}
