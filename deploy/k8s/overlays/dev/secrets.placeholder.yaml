# PLACEHOLDER secret for LOCAL VALIDATION ONLY (kustomize build / kubeconform).
#
# THIS IS NOT A REAL CREDENTIAL and MUST NOT be applied to a real cluster. In
# production the verdify-app-secrets Secret is provided by the fleet SOPS+age
# secret backend (jvallery/agent-fleet-control) and applied OUT-OF-BAND by the
# GitOps secret-delivery step BEFORE this app reconciles. kustomize cannot
# decrypt SOPS, so this is NOT how the real secret arrives — it exists ONLY so
# `kustomize build` / kubeconform yield a complete, lint-able manifest in CI.
#
# NAMESPACE-MATCH: target.namespace in the registry secret-meta MUST be
# byte-identical to this overlay's namespace (verdify-dev) and the base
# Namespace object, or the sealed Secret silently never mounts.
#
# The config.kubernetes.io/local-config ANNOTATION makes `kustomize build`
# exclude this object from its output (it must be an annotation, not a label —
# as a label it renders into the manifest and a Secret-blacklisted ArgoCD
# AppProject rejects the whole sync). For a real apply, drop the
# `- secrets.placeholder.yaml` line from this overlay's kustomization.
#
# OPENAI_API_KEY is included so the planner's optional secretKeyRef resolves in
# local builds; the value here is fake. ESP32_API_KEY is device-affecting (Noise
# PSK) but dev NEVER writes the device (DEVICE_WRITE stays 0); the value is fake.
apiVersion: v1
kind: Secret
metadata:
  name: verdify-app-secrets
  labels:
    app.kubernetes.io/part-of: verdify
  annotations:
    config.kubernetes.io/local-config: "true"   # never applied by GitOps
type: Opaque
stringData:
  POSTGRES_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_WRITE_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  ESP32_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_USER: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_PASS: "PLACEHOLDER_NOT_A_REAL_SECRET"
  OPENAI_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
