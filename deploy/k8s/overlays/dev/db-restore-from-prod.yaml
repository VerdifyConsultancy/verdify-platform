# Nightly prod -> dev database refresh (Jason, 2026-06-10).
#
# The dev environment's TimescaleDB is a RESTORED COPY of production, refreshed
# every night from the newest pg_dump the prod db-backup CronJob wrote to the
# NAS (components/db-backup: `pg_dump -Fc` at 02:17 UTC into the
# verdify-db-dumps NFS PVC, subDir db-dumps/prod). This CronJob mounts that
# SAME NFS subdir READ-ONLY via its own static PV/PVC pair (a PV binds exactly
# one PVC, so dev gets a second PV onto the same export), picks the newest
# dump, and rebuilds the IN-NAMESPACE verdify-db from it.
#
# Direction is strictly prod -> dev. Nothing here can write prod:
#   * the dumps mount is readOnly,
#   * the restore targets verdify-db.verdify-dev (in-namespace Service),
#   * dev remains device-dark (ingestor replicas:0 + deny-esp32-egress).
# Dev-written state (plans the dev planner produced, test rows) is WIPED each
# night by design — dev plans must never replicate to prod, and a fresh prod
# copy is the whole point.
#
# TimescaleDB restore flow per docs/runbooks/db-copy-not-move.md, adapted from
# the human-gated db/restore-job.yaml to a full-dump nightly: recreate the
# database (WITH (FORCE) drops lingering dev app connections; the api liveness
# probe is DB-decoupled per #231 so pods ride it out and reconnect),
# CREATE EXTENSION, timescaledb_pre_restore(), pg_restore the full -Fc dump,
# timescaledb_post_restore(), ANALYZE, then a hard freshness/rowcount gate so
# a bad dump fails the Job loudly instead of leaving dev silently stale.
# NOTE: the backing PersistentVolume (verdify-db-dumps-prod-ro-dev — a second,
# read-only static PV onto the SAME NFS export/subDir as prod's
# verdify-db-dumps-prod) is PLATFORM-PROVIDED, applied out-of-band by
# laptop-root exactly like prod's dumps PV: the app-test AppProject's
# clusterResourceWhitelist does not (and should not) include PersistentVolume.
# Spec mirror for re-provisioning: server 192.168.30.126, share
# /volume2/verdify, subDir db-dumps/prod, nfs.csi.k8s.io, ReadOnlyMany,
# claimRef verdify-dev/verdify-db-dumps-prod-ro, reclaimPolicy Retain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdify-db-dumps-prod-ro
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-restore
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: verdify-db-dumps-prod-ro-dev
---
# The base default-deny-ingress covers verdify-db; this is the restore-side
# allow (the same shape the prod cutover used out-of-band as
# allow-db-from-restore — codified here for dev).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-restore
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: db-restore
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verdify-db-restore-from-prod
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: db-restore
spec:
  # 03:47 UTC — ~90 min after the prod 02:17 UTC pg_dump finishes (<5 min run),
  # ~21:47 MDT, while dev traffic is nil.
  schedule: "47 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: verdify
            app.kubernetes.io/component: db-restore
        spec:
          restartPolicy: Never
          # verdify-dev enforces pod-security `restricted` — mirror the prod
          # db-backup CronJob's posture (postgres uid 999 in the timescaledb
          # image; RuntimeDefault seccomp; no escalation, no capabilities).
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore
              # Same image as the verdify-db StatefulSet — guarantees matching
              # pg_restore/psql + timescaledb client versions.
              image: timescale/timescaledb:2.25.2-pg16
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: verdify-db
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: verdify
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: verdify-app-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              command:
                - /bin/sh
                - -ec
                - |
                  # Ride out the kube-router netpol-programming race (same
                  # pattern as the prod backup CronJob, #273).
                  tries=0
                  until pg_isready -d postgres >/dev/null 2>&1; do
                    tries=$((tries+1))
                    [ "$tries" -ge 60 ] && { echo "db never became reachable"; exit 1; }
                    sleep 5
                  done

                  latest="$(ls -1 /dumps/verdify-*.dump 2>/dev/null | sort | tail -1)"
                  [ -n "$latest" ] || { echo "ERROR: no verdify-*.dump found in /dumps"; exit 1; }
                  echo "restoring dev from: $latest ($(stat -c %y "$latest"))"

                  psql -d postgres -v ON_ERROR_STOP=1 \
                    -c "DROP DATABASE IF EXISTS verdify WITH (FORCE);" \
                    -c "CREATE DATABASE verdify OWNER verdify;"
                  psql -d verdify -v ON_ERROR_STOP=1 \
                    -c "CREATE EXTENSION IF NOT EXISTS timescaledb;" \
                    -c "SELECT timescaledb_pre_restore();"
                  # Full-dump restore. pg_restore exits non-zero on harmless
                  # already-exists noise (e.g. the timescaledb extension the
                  # pre-restore flow requires us to create first), so the hard
                  # success gate is the verification below, not the exit code.
                  pg_restore -d verdify --no-owner --no-privileges --jobs=2 "$latest" || \
                    echo "pg_restore exited non-zero (expected extension noise); verifying content"
                  psql -d verdify -v ON_ERROR_STOP=1 \
                    -c "SELECT timescaledb_post_restore();" \
                    -c "ANALYZE;"

                  # HARD GATE: the restored copy must be real and fresh.
                  rows="$(psql -d verdify -t -A -c "SELECT count(*) FROM climate WHERE ts > now() - interval '7 days'")"
                  age_h="$(psql -d verdify -t -A -c "SELECT round(extract(epoch FROM (now() - max(ts)))/3600) FROM climate")"
                  echo "verify: climate rows last-7d=$rows, newest-row age=${age_h}h"
                  [ "${rows:-0}" -ge 1000 ] || { echo "ERROR: restored climate table too small"; exit 1; }
                  [ "${age_h:-9999}" -le 48 ] || { echo "ERROR: restored data older than 48h"; exit 1; }
                  echo "dev restore complete + verified"
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: verdify-db-dumps-prod-ro
                readOnly: true
            - name: tmp
              emptyDir: {}
