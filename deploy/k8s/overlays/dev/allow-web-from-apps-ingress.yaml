apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-from-apps-ingress
  namespace: verdify-dev
  labels:
    app.kubernetes.io/part-of: verdify
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - lab-site
          - www
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-apps
        - ipBlock:
            cidr: 192.168.7.0/24
      ports:
        - protocol: TCP
          port: 8080
