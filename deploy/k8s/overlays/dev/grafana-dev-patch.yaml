# graphs-dev (Jason, 2026-06-10): dev clone of the prod graphs.verdify.ai
# Grafana. The components/grafana resources are namespace-transformed into
# verdify-dev by this overlay, so the provisioned datasource's `verdify-db`
# host resolves to the DEV TimescaleDB (the nightly prod-restored copy) —
# same dashboards, dev data. This strategic-merge patch fixes the two
# prod-hardcoded env values (the component is documented prod-only; dev
# overrides rather than forking it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://graphs.k3s.verdify.ai/
            - name: GF_RENDERING_CALLBACK_URL
              value: http://verdify-grafana.verdify-dev.svc:3000/
