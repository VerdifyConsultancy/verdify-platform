        {
          "id": 121,
          "title": "Runtime-Modeled Electric by Device (30d)",
          "type": "table",
          "description": "Whole controlled-equipment runtime model with selected coefficient source, revision, and low/nominal/high kWh. Partial Shelly measurement is a separate scope and is not compared as a facility total.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 70
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BF69",
                    "value": null
                  }
                ]
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Runtime h"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Modeled kWh nominal"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Modeled kWh high"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "kwatth"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": ""
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "format": "table",
              "rawSql": "SELECT\n  r.equipment AS \"Device\",\n  ROUND((SUM(r.on_minutes) / 60.0)::numeric, 1) AS \"Runtime h\",\n  ROUND(SUM((r.on_minutes / 60.0) * c.coefficient_low / 1000.0)::numeric, 2) AS \"Modeled kWh low\",\n  ROUND(SUM((r.on_minutes / 60.0) * c.coefficient_nominal / 1000.0)::numeric, 2) AS \"Modeled kWh nominal\",\n  ROUND(SUM((r.on_minutes / 60.0) * c.coefficient_high / 1000.0)::numeric, 2) AS \"Modeled kWh high\",\n  c.coefficient_source AS \"Coefficient source\",\n  c.coefficient_revision AS \"Coefficient revision\"\nFROM mv_equipment_runtime_daily r\nJOIN v_equipment_resource_catalog c\n  ON c.greenhouse_id = r.greenhouse_id\n AND c.equipment_slug = r.equipment\n AND c.resource_kind = 'electric_watts'\nWHERE r.day >= current_date - interval '30 days'\n  AND r.day < current_date\nGROUP BY r.equipment, c.coefficient_source, c.coefficient_revision\nORDER BY \"Modeled kWh nominal\" DESC;",
              "refId": "A"
            }
          ],
          "transparent": true
        },
