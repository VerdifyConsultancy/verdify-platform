              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "refId": "K",
              "rawSql": "(SELECT ts AS time, solar_irradiance_w_m2 AS \"Solar Forecast\"\nFROM climate WHERE solar_irradiance_w_m2 IS NOT NULL ORDER BY ts DESC LIMIT 1)\nUNION ALL\n(SELECT DISTINCT ON (date_trunc('hour', ts))\n    date_trunc('hour', ts) AS time, solar_w_m2 AS \"Solar Forecast\"\nFROM weather_forecast WHERE ts > now() AND ts < now() + interval '72 hours'\nORDER BY date_trunc('hour', ts), fetched_at DESC)\nORDER BY time"
            },
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "verdify-tsdb"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT ts AS time,\n    temp_low + f.frac * (temp_target - temp_low) AS \"Target Band Base\",\n    temp_high - f.frac * (temp_high - temp_target) AS \"Target Band\",\n    temp_target AS \"Target\"\nFROM v_band_curve,\n     (SELECT COALESCE((SELECT value FROM setpoint_snapshot WHERE parameter='band_track_fraction' AND greenhouse_id='vallery' ORDER BY ts DESC LIMIT 1), 0.25) AS frac) f\nWHERE $__timeFilter(ts) ORDER BY ts",
