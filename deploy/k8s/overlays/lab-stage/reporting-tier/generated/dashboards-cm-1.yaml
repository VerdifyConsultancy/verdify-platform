              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT ts AS time,\n    vpd_low + f.frac * (vpd_target - vpd_low) AS \"Target Band Base\",\n    vpd_high - f.frac * (vpd_high - vpd_target) AS \"Target Band\",\n    vpd_target AS \"Target\"\nFROM v_band_curve,\n     (SELECT COALESCE((SELECT value FROM setpoint_snapshot WHERE parameter='band_track_fraction' AND greenhouse_id='vallery' ORDER BY ts DESC LIMIT 1), 0.25) AS frac) f\nWHERE $__timeFilter(ts) ORDER BY ts",
