              "rawSql": "SELECT ts AS time, solar_irradiance_w_m2 AS \"Solar\" FROM climate WHERE $__timeFilter(ts) AND solar_irradiance_w_m2 IS NOT NULL ORDER BY ts"
            },
            {
              "datasource": {
