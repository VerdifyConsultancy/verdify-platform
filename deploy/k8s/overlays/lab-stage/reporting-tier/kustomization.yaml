apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Source-only nested overlay. The parent lab-stage kustomization deliberately
# does not reference this directory. Even when rendered independently, both
# workloads remain at zero replicas and no public route is created.
namespace: verdify-platform

resources:
  - generated/targets-cm.yaml
  - generated/dependencies-cm.yaml
  - generated/dashboards-cm-0.yaml
  - generated/dashboards-cm-1.yaml
  - reporting-config.yaml
  - projection-service.yaml
  - reporting-tier.yaml
  - producer.yaml
  - network-policies.yaml

configMapGenerator:
  - name: verdify-lab-reporting-projection-readiness
    files:
      - projection-readiness.sql

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: verdify-lab-reporting-projection
    app.kubernetes.io/component: lab-reporting-projection
    app.kubernetes.io/part-of: verdify

labels:
  - pairs:
      app.kubernetes.io/instance: verdify-platform-lab-stage-reporting
      verdify.ai/environment: lab-stage
      verdify.ai/activation-state: source-only
    includeSelectors: false
