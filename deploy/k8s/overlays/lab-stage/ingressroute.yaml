apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: verdify-lab-astro-stage
  labels:
    app.kubernetes.io/name: verdify-lab-astro-stage
    app.kubernetes.io/component: lab-astro-stage
    app.kubernetes.io/part-of: verdify
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`lab-stage.verdify.ai`)
      # The shared verdify-sites wildcard route is priority 50. Keep this exact
      # stage host above it so Traefik cannot send Lab stage to the legacy site.
      priority: 100
      services:
        - name: verdify-lab-astro-stage
          port: 80
  tls: {}
