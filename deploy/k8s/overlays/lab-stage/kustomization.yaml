apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: verdify-platform

resources:
  - ../../components/lab-astro-stage
  - ../../candidates/lab-release-runtime
  - ingressroute.yaml

images:
  # The serving static Astro image remains the separately accepted stage
  # release; changing it requires its own validated exact-source pin.
  - name: registry.vallery.net/verdifyconsultancy/verdify-lab-astro
    newName: registry.vallery.net/verdifyconsultancy/verdify-lab-astro
    digest: sha256:1852cf2523041ef840b3eb1092050e4b3b19d2027494fc6b6c9809b930de93b7
  # These exact-source runtime images remain dormant under the replicas-zero
  # patch. A separate validated activation must add the store contract and raise
  # replicas; digest presence alone is not rollout authority.
  - name: registry.vallery.net/verdifyconsultancy/verdify-lab-release-agent
    newName: registry.vallery.net/verdifyconsultancy/verdify-lab-release-agent
    digest: sha256:4165b2516653c08fc45f24bbc292db6f390bcc410cc5c550819e98ee35b27e04
  - name: registry.vallery.net/verdifyconsultancy/verdify-lab-release-nginx
    newName: registry.vallery.net/verdifyconsultancy/verdify-lab-release-nginx
    digest: sha256:b1ded136b8d499b746fb114d66fafeed9e090f1391ecb3a39b227c9c5cf668e2
  - name: registry.vallery.net/verdifyconsultancy/verdify-lab-occurrence-exporter
    newName: registry.vallery.net/verdifyconsultancy/verdify-lab-occurrence-exporter
    digest: sha256:ffa31e6b1e21ece0cdc75100a0475aa31998eeb4de4410881aca7b330614733e

patches:
  - path: lab-release-runtime-dormant.patch.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: verdify-platform-lab-stage
      verdify.ai/environment: lab-stage
    includeSelectors: false
