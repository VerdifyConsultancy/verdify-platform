# DEVICE-WRITE INTERLOCK (#79) — staging.
#
# VERDIFY_DEVICE_WRITE_ENABLED is the explicit software interlock for the
# device-touching write path. In STAGING it is pinned to "0" (disabled) so even
# if the ingestor were ever scaled up by mistake, the setpoint/occupancy push
# path stays OFF. This is the ONLY value the staging instance may carry; "1" is
# set ONLY in overlays/prod. Combined with replicas:0 (ingestor-replicas-zero)
# and the deny-esp32-egress NetworkPolicy, this is defence-in-depth so no second
# writer can ever reach the live ESP32 from staging.
#
# Patched onto the base verdify-config ConfigMap (strategic merge adds the key).
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdify-config
data:
  VERDIFY_DEVICE_WRITE_ENABLED: "0"
