# PLACEHOLDER secret for LOCAL VALIDATION ONLY (kustomize build / kubeconform).
#
# THIS IS NOT A REAL CREDENTIAL and MUST NOT be applied to a real cluster.
# In production the verdify-app-secrets Secret is provided by the fleet SOPS+age
# backend in jvallery/agent-fleet-control (registry/secrets/<id>.yaml meta +
# secrets/encrypted/<id>.enc.yaml ciphertext), sealed to the fleet age key and
# applied by the GitOps secret-delivery step (local-k8s-secret-sync.yml) BEFORE
# this app reconciles.
#
# NAMESPACE-MATCH: target.namespace in the registry secret-meta MUST be
# byte-identical to this overlay's namespace (verdify-staging) and to the base
# Namespace object, or the sealed Secret silently never mounts (handoff §2.4).
#
# DEVICE-AFFECTING KEY: ESP32_API_KEY is the ESP32 native-API encryption key
# (Noise PSK). It MUST be byte-identical to the firmware's `api_encryption_key`
# (esphome secrets.yaml) or the ingestor's aioesphomeapi connection fails.
# STAGING PROOF FOUND A MISMATCH: the live .env ESP32_API_KEY (sha 127f85d0...)
# != the esphome api_encryption_key (sha df2784f9...). The CANONICAL value is the
# one the live ingestor currently uses to reach the device; the two source files
# have drifted. RECONCILE AT SOURCE and seal from the canonical one. Sealing/
# rotating is gated on explicit Jason confirmation (which value is canonical) and
# must never trigger a re-flash (handoff §6). The placeholder value here is fake.
#
# The config.kubernetes.io/local-config label makes GitOps tooling skip this
# object on real applies; for a real apply, drop the `- secrets.placeholder.yaml`
# line from the overlay kustomization. It exists ONLY so `kustomize build`
# yields a complete, lint-able manifest in CI without reaching the secret backend.
apiVersion: v1
kind: Secret
metadata:
  name: verdify-app-secrets
  labels:
    app.kubernetes.io/part-of: verdify
    config.kubernetes.io/local-config: "true"   # never applied by GitOps
type: Opaque
stringData:
  POSTGRES_PASSWORD: "PLACEHOLDER_NOT_A_REAL_SECRET"
  VERDIFY_WRITE_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  ESP32_API_KEY: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_USER: "PLACEHOLDER_NOT_A_REAL_SECRET"
  MQTT_PASS: "PLACEHOLDER_NOT_A_REAL_SECRET"
