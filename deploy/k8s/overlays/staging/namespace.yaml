apiVersion: v1
kind: Namespace
metadata:
  # PINNED namespace string. This MUST be byte-identical to:
  #   - the ArgoCD Application destination.namespace
  #   - every registry/secrets/<id>.yaml target.namespace
  # A sealed Secret applied to a mismatched namespace silently never mounts
  # (the gravity 3-way-namespace-mismatch gotcha, handoff §2.4). Do not rename
  # one place without the others.
  name: verdify-staging
  labels:
    app.kubernetes.io/part-of: verdify
    # PodSecurity: enforce the restricted profile. All Verdify workloads run
    # non-root with dropped capabilities, so this passes cleanly and catches any
    # future regression toward privileged pods.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
