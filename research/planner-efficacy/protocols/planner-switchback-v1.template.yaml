# Planner switchback protocol — version 1 TEMPLATE (SUPERSEDED, never locked).
#
# ADR-0010 supersedes this generalized policy-vector design for the first
# physical trial. Keep this file as the historical platform-v2 contract; use
# planner-switchback-v2.template.yaml for current execution planning.
#
# Machine-readable preregistration scaffold per audit Sections 8.2–8.6
# (docs/research/planner-efficacy-current-firmware-2026-08-14.md) and issue #588.
# The historical v1 lock order is preserved by the v1 tooling/tests and the
# "Historical version 1" section of README.md. This file would become
# protocols/planner-switchback-v1.yaml only under a future platform-v2 decision;
# it is not governed by the current v2 fast-path lock instructions.

schema: verdify-planner-switchback-protocol
version: 1
status: template

study:
  study_id: "TO-LOCK: canonical study id (Unicode NFC; hashed into every derivation)"
  greenhouse_id: "TO-LOCK: greenhouse id"
  timezone: America/Denver
  start_local_date: "TO-LOCK: YYYY-MM-DD of local day 1"
  local_days: 30
  pairs: 15
  # Version 1 forbids the 30 local days crossing a Denver UTC-offset/DST
  # transition; the generator raises if they do (Section 8.3).
  dst_crossing_allowed: false
  assignment_namespace_uuid: "TO-LOCK: protocol's fixed UUIDv5 namespace"
  # 30 half-open UTC ranges + pair ids + blinded labels + assignment UUIDs are
  # generated by `python -m switchback gen-schedule` from the beacon output and
  # committed alongside this file.
  blinded_schedule_artifact: "TO-LOCK: path of committed blinded schedule JSON"
  blinded_schedule_hash_sha256: "TO-LOCK: SHA256(UTF8(RFC8785(blinded_assignment_json))) hex"

randomization:
  algorithm: switchback/randomization.py  # byte-exact Section 8.3 derivations
  generator_source_sha: "TO-LOCK: git commit SHA of the generator source"
  pair_order_derivation: >-
    HMAC-SHA256(key=beacon_bytes, msg=ASCII("verdify-switchback-order-v1") ||
    0x00 || UTF8_NFC(study_id) || 0x00 || uint32_be(j));
    (digest[31] & 0x01) == 0 -> XY, else YX; j = 0..14.
  arm_map_derivation: >-
    HMAC-SHA256(key=mapping_secret, msg=ASCII("verdify-switchback-arm-map-v1")
    || 0x00 || UTF8_NFC(study_id)); bit = digest[31] & 0x01;
    bit 0 -> X=A/Frozen, Y=B/AI; bit 1 reversed.
  mapping_commitment_derivation: >-
    SHA256(ASCII("verdify-switchback-map-commit-v1") || 0x00 ||
    UTF8_NFC(study_id) || 0x00 || mapping_secret); published before the beacon
    round is published.
  assignment_uuid_derivation: >-
    UUIDv5 over the fixed namespace with raw name bytes UTF8_NFC(study_id) ||
    0x00 || ASCII(YYYY-MM-DD).
  beacon:
    source: "TO-LOCK: public randomness beacon (e.g. NIST beacon v2)"
    round_id: "TO-LOCK: future round id, named at protocol lock"
    output_hash_sha256: "TO-LOCK: raw-byte hash of the beacon output, filled after publication"
  mapping_secret:
    length_bytes: 32
    generation: >-
      automated assignment-service operating-system CSPRNG draw; publish the
      domain-separated commitment in Git before the named beacon round
      (Jason decision 2026-08-15; implementation/audit still TO-LOCK)
    commitment_sha256: "TO-LOCK: commitment hex, recorded before the beacon round publishes"
    custody: assignment service only until analysis lock; analysts/dashboards see X/Y only
  treatment_octets:  # Section 8.9 version 1, assignment_treatment_bytes
    randomized: "0x01 || 0x58 (X) | 0x01 || 0x59 (Y)"
    qualification: "0x02 || op(0x01 analyzed,0x02 positioning,0x03 baseline_recovery,0x04 identity_hold) || source_uuid16 || target_uuid16 || regime(0x00 night,0x01 hot_bright_dry,0x02 hot_bright_humid,0x03 other_daylight)"
    aa: "0x03 || lane (0x00|0x01)"

arms:
  frozen_fsm:
    label: A
    definition: >-
      Current deterministic ESP32 FSM with one reviewed immutable effective
      policy vector: time-weighted medians of device-confirmed readbacks
      (modal Booleans) quantized by the canonical wire schema; not boot
      defaults, ClimateIntent(), or the last AI vector.
    baseline_vector_content_sha256: "TO-LOCK: canonical baseline vector hash after replay/HIL/A/A approval"
    baseline_extraction_query_hash: "TO-LOCK: extraction query/input hashes"
  ai_planner:
    label: B
    definition: >-
      Same FSM with admitted planner-derived tunables and normal within-day
      event-triggered replanning; planner selects between exactly two frozen
      48-field schema-v2 templates; delivery/planner failure falls back to A but remains
      a B assignment for ITT.
    template_moderate_content_sha256: "TO-LOCK: moderate hot/dry template hash"
    template_aggressive_content_sha256: "TO-LOCK: aggressive hot/dry template hash"
    treatment_allowlist:  # only these 11 fields may differ between arms (Section 8.2)
      - cool_stage2_over_high_f
      - sw_cool_all_fans_at_high_enabled
      - fog_escalation_kpa
      - min_fog_on_s
      - min_fog_off_s
      - mister_engage_kpa
      - mister_all_kpa
      - mister_all_delay_s
      - mister_pulse_gap_s
      - mister_pulse_on_s
      - mister_water_budget_gal
    common_fields_note: remaining 37 policy values byte-identical to baseline in both arms
  shadow_deterministic_forecast:
    definition: >-
      Deterministic proposal produced, compiled, and scored on every eligible
      trigger without actuation; joined by assignment, trigger, as-of forecast
      vintage, compiler, and vector schema.
    shadow_version: "TO-LOCK: shadow comparator revision"

transition_graph:  # six-edge content-changing graph (Section 8.3)
  vertices: [baseline, moderate, aggressive]
  directed_edges:
    - baseline->moderate
    - moderate->baseline
    - baseline->aggressive
    - aggressive->baseline
    - moderate->aggressive
    - aggressive->moderate
  qualification_specification_hash: "TO-LOCK: separately hashed pretrial qualification spec"
  qualification_result_manifest_hash: "TO-LOCK: ordered 96-assignment manifest hash after the gate passes"

washout:
  daily_exclusion_local: "00:00-02:00"
  expected_bins_per_day: 88
  admission: >-
    Two hours is admitted ONLY by the locked pretrial step test: max settling
    time over all three endpoints and all 96 fixed transitions <= 2 h, with
    policy identity confirmed within 120 s in every transition. A maximum over
    2 h fails this protocol version; over 6 h also requires multi-day blocks.
  sensitivity_reports: [zero-hour, locked, six-hour, previous-day interaction]

endpoints:
  bucketing: >-
    UTC half-open [bucket, bucket+15min); x_i = arithmetic mean of finite raw
    samples; >= 12 of 15 expected raw samples required; never interpolate an
    indoor value; fixed bin weight w_i = 0.25 h regardless of sample count.
  corridor: >-
    Common validity-versioned evaluation corridor [L_i, U_i] resolved at the
    bucket-start timestamp, matching the checked extractor.
  distance_formula: "e_i = max(L_i - x_i, 0, x_i - U_i); Y_d = sum(w_i*e_i)/sum(w_i)"
  co_primary:
    - name: vpd_corridor_distance
      formula: daily mean VPD distance outside the common corridor (kPa)
      decision: upper one-sided 97.5% bound for AI-Frozen < +0.05 kPa
      boundary: +0.05 kPa
    - name: temperature_corridor_distance
      formula: daily mean temperature distance outside the common corridor (degF)
      decision: upper one-sided 97.5% bound < +0.50 degF
      boundary: +0.50 degF
    - name: nine_device_runtime
      formula: >-
        integrated observed relay device-minutes over heat1, heat2, vent, fan1,
        fan2, fog, and south/west/center misters
      decision: upper one-sided 97.5% bound < 0
      boundary: 0 device-minutes
  secondary:
    - six-core and wet-device minutes, cycles, short cycles, controller-miss and
      physically-unachievable minutes (effect + interval; no multiplicity-free claim)
    - qualified climate water, scoped measured electricity, gas
      (availability-gated; no imputation; retain scope and quality flags)
  safety_descriptive:
    - SENSOR_FAULT, SAFETY_HEAT, SAFETY_COOL, hard interlocks, emergency override
  exploratory:
    - planner latency, retries, tokens, compute energy/cost, crop observations

margins:
  vpd_kpa: 0.05
  temperature_f: 0.50
  approved_by: "Jason (2026-08-15, recorded on epic #581)"
  rationale: >-
    Engineering proposals — 11.6% of the 0.43-kPa VPD corridor width and 5% of
    the 10-degF temperature corridor; approximately 50% and 98% of the
    exact-firmware historical mean distance-outside-corridor endpoints. Not
    crop-specific biological thresholds.
  horticultural_safety_signoff: "TO-LOCK: named horticultural and safety owner approval before lock"

analysis:
  estimand_primary: >-
    ITT: average effect over the 30 realized days of assignment to the complete
    operational AI strategy vs Frozen-FSM. Planner timeouts, delivery failures,
    automatic fallback, safety preemption, and emergency rescue remain in ITT.
  contrast: "D_j = s_j (y_j1 - y_j2) = Y_AI,j - Y_Frozen,j; tau_hat = mean(D_j)"
  primary_model: "mean(D) ± t(0.975,14) * sd(D)/sqrt(15); t(0.975,14)=2.144786688; all 15 pairs required"
  leave_one_pair_out: "mean(D_-j) + t(0.975,13) * sd(D_-j)/sqrt(14); t(0.975,13)=2.160368656"
  influence_rule: >-
    If removing any one pair changes any co-primary pass/fail classification,
    the bundle cannot advance; report the run influence-sensitive and inconclusive.
  decision_rule: >-
    Intersection-union at one-sided alpha 0.025 per condition: advance only if
    all three co-primary conditions pass, no safety stop fires, and protocol
    integrity passes. Lower one-sided 97.5% bound above a climate margin (or
    above zero on nine-device duty) is evidence against; every other failure is
    inconclusive, not equivalence or safety proof.
  randomization_sensitivity: >-
    Center contrasts at each locked boundary, enumerate all 2^15 = 32768 legal
    pair-sign assignments, invert over a fixed effect grid (frozen in
    switchback/analysis.py). Exact for a sharp constant effect; sensitivity
    only; never changes the locked decision.
  diagnostics_published: [pair values, Q-Q plot, lag-one contrast correlation, previous-arm interaction, all leave-one-pair-out bounds]
  per_protocol:
    denominator_s: 79200  # post-washout seconds in [02:00, 24:00) local
    day_minimum_s: 75240  # 95%
    numerator_a: union duration whose device echo resolves to the assignment-bound Frozen baseline content
    numerator_b: >-
      union duration whose echo exactly matches the then-current
      arbiter-admitted vector for that assignment, one of the two template
      hashes, schema/revisions, validity, and a lineage through a
      passing-qualified content-changing edge or manifest-permitted
      assignment-bound identity_rebind; gaps, baseline fallback on B, rejected
      or shadow proposals, and override intervals contribute zero
    day_rules: no parallel writer, no manual override; a pair enters only when both days qualify
    inference: paired t with m_PP - 1 df when m_PP >= 2; else listed without interval; never changes the ITT decision
  weather_adjustment: single prospectively frozen weather-load score, secondary precision adjustment only
  environment_digest: "TO-LOCK: analysis environment digest (uv.lock / image digest)"

data_eligibility:
  bin: >-
    >= 12 of 15 expected raw samples, finite measured indoor temperature and
    VPD, finite versioned evaluation corridor, no indoor-value interpolation.
  day: ">= 80 of 88 bins and no continuous gap over 30 minutes"
  runtime_day: >-
    seeded relay state for all nine climate actuators; transition integration
    agrees with device counters within max(1 device-minute, 1%).
  itt_ledger: keep every randomized day even if outcome missing; no carry-forward, no pair deletion
  completeness_rule: >-
    All 15 pairs outcome-complete for the primary efficacy classification;
    otherwise the run is an integrity/feasibility result with best/worst-case
    imputations from the locked endpoint bounds, and no advance decision.
  imputation_bounds:
    lower: 0
    upper: "TO-LOCK: accepted sensor-domain/physical maximum per endpoint"

aa_qualification:  # seven-day A/A before randomization; all six gates required (Section 8.6)
  duration_days: 7
  gates:
    - both branches compile the baseline to identical canonical bytes and hash
    - every boundary activation confirmed within 120 s and the correct assignment/vector hash covers >= 99% of minutes
    - no unauthorized writer changes an experiment-owned field
    - ">= 98% of climate bins valid and all nine climate-actuator transition streams valid"
    - every eligible action row joins exactly one device-confirmed vector
    - compiled-firmware replay and HIL fault tests add no safety event relative to the factual baseline

stopping_rules:
  no_efficacy_peek: monitoring is for safety and integrity only; assignments never shifted, replaced, or rerandomized
  actions:
    - trigger: SENSOR_FAULT > 5 continuous minutes, actuator interlock failure, or emergency override
      action: atomically activate baseline; pause physical AI admission pending review; assignment calendar continues
    - trigger: SAFETY_HEAT or SAFETY_COOL for 15 continuous minutes or 3 times in 60 minutes
      action: baseline for the rest of the assigned day; retain the ITT day; review before the next assignment
    - trigger: unknown/mismatched vector hash > 5 minutes or a parallel writer
      action: baseline for the day; a second affected randomized day is a terminal integrity stop
    - trigger: any change to firmware, baseline, band, allowlist, actuator inventory, sensor registry, or meter calibration
      action: end the protocol epoch rather than pooling incompatible days
  terminal: >-
    A terminal integrity/epoch stop disables further physical AI admission;
    remaining calendar rows are kept, collected when safe, labeled
    post-stop/non-efficacy; no replacement, restart, or efficacy classification.

revisions:  # TO-LOCK: pin every revision before the mapping-secret draw
  firmware_binary_sha256: "TO-LOCK"
  baseline_vector_sha256: "TO-LOCK"
  tunable_registry_rev: "TO-LOCK"
  compiler_rev: "TO-LOCK"
  planner_prompt_model_rev: "TO-LOCK"
  lesson_context_snapshot: "TO-LOCK"
  response_model_snapshot: "TO-LOCK"
  crop_band_rev: "TO-LOCK"
  schedule_rev: "TO-LOCK"
  safety_rev: "TO-LOCK"
  meter_rev: "TO-LOCK"
  mechanical_rev: "TO-LOCK"
  wire_schema_manifest_sha256: "TO-LOCK"

rollback:
  tested_rollback_vector_sha256: "TO-LOCK: hash of the tested rollback vector"
  procedure: "TO-LOCK: reference to the tested rollback procedure"
