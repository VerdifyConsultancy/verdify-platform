[project]
name = "verdify-planner-efficacy-audit"
version = "0.1.0"
description = "Reproducible core PID analysis for the Verdify planner audit"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<2",
    # Lane G baseline builder imports verdify_schemas from the repo root
    # (path shim in baseline/baseline.py), which needs these at runtime.
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# The checked-in tools/tests intentionally add the repository or research root
# before importing sibling source modules; match the monorepo lint contract.
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
