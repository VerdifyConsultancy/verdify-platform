preconditions:
  - {precondition_id: exact_source_deployed, status: pending, evidence_ref: null}
  - {precondition_id: argo_synced_healthy, status: pending, evidence_ref: null}
  - {precondition_id: normal_greenhouse_health, status: pending, evidence_ref: null}
