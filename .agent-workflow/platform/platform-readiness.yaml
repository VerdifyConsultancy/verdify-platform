schema_ref: platform-readiness.schema.yaml
kind: PlatformReadiness
schema_version: "1.0"
project_id: verdify-platform
status: not_ready
assessed_at: "2026-07-09T22:31:05Z"
domains:
  - id: PLAT-001
    domain: Agent Platform project/session API or MCP contract
    status: fail
    evidence:
      - The Codex controller exposes no Agent Platform session-create, poll, send, or attach tools.
      - The in-pod agent-fleet MCP advertises add_worktree_agent and remove_worktree_agent as disabled post-MVP operations; mutation probes return structured HTTP 501 responses.
    gaps:
      - No supported operation can create an isolated lane worker session.
      - No supported operation can remove or recover a dynamically created lane session.
  - id: PLAT-002
    domain: Controller and worktree session lifecycle
    status: fail
    evidence:
      - Four fixed claude, codex, openclaw, and hermes sessions share /workspace/verdify-platform/repo.
      - The shared in-pod repository is on retired live/platform-main at e96f60d while the approved origin/main baseline is 0a9a19a840be6bae1beba604497d880b3b74b1ef.
    gaps:
      - There is no one-session-per-lane worktree lifecycle or recoverable lease identity.
      - The fixed sessions cannot safely provide isolated concurrent lane ownership.
  - id: PLAT-003
    domain: Namespace model, quotas, placement, service accounts, and PVCs
    status: pass
    evidence:
      - All 38 of 38 repository pods are Ready and every cluster node is Ready.
      - repo-verdifyconsultancy-verdify-platform-0 is Ready 1/1 with zero restarts in agent-fleet-runners.
      - The repo pod uses a 64 GiB Longhorn PVC at 6 percent utilization, and the repository-pod quota is 38 of 150.
      - The pod uses repo-verdifyconsultancy-verdify-platform-sa and the target dashboard reports four of four fixed sessions ready.
    gaps: []
  - id: PLAT-004
    domain: Secrets and credential injection without prompt, log, or source exposure
    status: warn
    evidence:
      - Runtime credentials remain referenced through existing scoped secret paths; no raw credential material was captured in this assessment.
      - The sprint has a fail-closed source-remediation lane and an open protected production database credential rotation gate.
    gaps:
      - Production credential rotation and redacted caller verification remain unresolved and block release, but not local source implementation.
  - id: PLAT-005
    domain: Development, stage, and production access boundaries
    status: fail
    evidence:
      - Verdify is intentionally single-environment production-only; dev and staging are decommissioned.
      - repo-verdifyconsultancy-verdify-platform-sa has administrative authority in verdify-prod, including Secrets CRUD and pod exec.
      - The approved lane contracts prohibit worker production mutation and reserve prod sync, database state changes, and OTA for the controller release path, but Kubernetes RBAC does not enforce that boundary.
    gaps:
      - There is no disposable platform environment for runtime lane validation.
      - A compromised or mistaken repo session can directly cross the declared production and secret boundary.
  - id: PLAT-006
    domain: CI/CD, image build, registry, cache, GitOps, and Argo CD flow
    status: warn
    evidence:
      - GitHub main CI, digest-pinned publication, prod-promote, and manual ArgoCD sync are the declared delivery path and main CI is healthy.
      - The agent-sessions ArgoCD application is Synced and Healthy; verdify-prod-dark is Healthy but OutOfSync with five drifted resources.
      - The orphan reaper is degraded and the platform has an unresolved own-discovery-token gap.
      - The in-pod shared repository remains on retired live/platform-main at e96f60d instead of the approved main baseline.
    gaps:
      - A platform-created worker cannot currently start from or prove the approved baseline.
      - A current-sprint wave release plan is still required before production delivery.
  - id: PLAT-007
    domain: DNS, ingress, edge ownership, and dashboard health
    status: pass
    evidence:
      - The agents.vallery.net dashboard API is healthy and reports 136 of 136 fleet sessions ready.
    gaps: []
  - id: PLAT-008
    domain: Observability, logs, metrics, alerts, correlation, and deployment markers
    status: warn
    evidence:
      - Fleet readiness, target readiness, pod readiness, restart count, API results, and structured 501 operation failures are observable.
    gaps:
      - No dynamic lane-session event stream, lease telemetry, or closeout correlation exists because worktree-agent operations are disabled.
  - id: PLAT-009
    domain: Browser terminal access, authentication, authorization, auditing, and ownership
    status: warn
    evidence:
      - Authenticated dashboard API, tmux, and SSH identities were proven for the repo pod.
      - Operator-visible terminal access is available for the four fixed sessions.
    gaps:
      - Browser-terminal WSS was not independently exercised in this assessment.
      - Every visible terminal still points at the shared stale clone rather than an isolated lane worktree.
  - id: PLAT-010
    domain: Combined review inbox and deployed review evidence
    status: fail
    evidence:
      - The sprint contracts name CI, critic, review packet, rollback, and runtime evidence requirements.
    gaps:
      - No current software-recovery review inbox packet or deployed review revision exists yet.
  - id: PLAT-011
    domain: Session ledger and semantic history handoff
    status: pass
    evidence:
      - The existing session ledger was still active for cancelled sprint s8-vanda-night-dehum when this assessment began.
      - The root controller has superseded the S8 controller identity, activated controller software-recovery-root-019f4826, and updated ledger-verdify-platform-controller for software-recovery-2026-07-09.
      - Controller state and ledger reconciliation were completed by controller-loop ownership and were not changed by this platform-readiness lane.
    gaps: []
  - id: PLAT-012
    domain: Non-Gravity pilot scope, rollback plan, and human sign-off
    status: blocked
    evidence:
      - Dynamic worktree-agent creation and removal return structured HTTP 501 responses.
      - A sprint-scoped local-agent fallback is recorded separately so approved implementation can proceed without claiming platform readiness.
    gaps:
      - The minimum native-platform pilot cannot run until isolated create, poll, send, attach, closeout, and removal operations are supported.
      - Fleet issue #2497 remains open and unbuilt; its prior blocker #2641 is closed, so implementation can now be planned.
minimum_pilot:
  - Create one isolated non-production lane worktree and agent session from current origin/main in the repo pod.
  - Prove unique repository, branch, worktree, lease, session, tmux, browser terminal, and service-account identities.
  - Poll and message the session, observe a heartbeat and closeout, and append correlated controller and session-ledger events.
  - Remove or recover the session without affecting the four fixed sessions or any verdify-prod workload.
  - Complete CI, independent critic, review packet, fix/replan, sign-off, and cleanup evidence for the pilot revision.
gates_to_open:
  - Restore or replace the retired Agent Platform worktree-agent mutation contract before native platform dispatch is attempted again.
  - Implement or reconcile fleet issue #2497 now that closed issue #2641 no longer blocks it.
  - Remove repo service-account administrative production authority or add an enforceable least-privilege boundary before native worker sessions can be trusted.
  - Reassess platform readiness after supported create, poll, send, attach, closeout, and removal operations are live.
  - Keep g-prod-db-credential-rotation-20260709 open until Jason separately authorizes the protected rotation.
risks:
  - Reusing the four fixed sessions would create shared-worktree races and ambiguous lane ownership.
  - Dispatching from retired live/platform-main at e96f60d would violate the approved origin/main baseline.
  - Treating dashboard and terminal health as session-lifecycle readiness would mask the structured 501 control-plane failure.
  - The repo service account can mutate verdify-prod Secrets and exec into pods despite the contract-level worker prohibition.
  - The local fallback must not expand into production writes, credential rotation, or a bypass of CI, critic, migration, firmware, or runtime gates.
handoff:
  next_skill: sprint-orchestrator
  next_mode: recorded-local-fallback
  reason: Native Agent Platform dispatch is not ready; proceed only through the approved sprint-scoped local-agent fallback and retain the platform restoration gate.
approval:
  status: pending
  approver: null
  approved_at: null
