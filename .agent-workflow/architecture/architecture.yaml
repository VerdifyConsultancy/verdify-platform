kind: ArchitectureDefinition
schema_version: "1.0"
architecture_id: verdify-platform-recovery-2026-07-09
status: approved
baseline_sha: 0a9a19a840be6bae1beba604497d880b3b74b1ef
requirement_ids: [NSR-001, NSR-002, NSR-003, NSR-004, NSR-005, NSR-006, NSR-007]
system_context: One live greenhouse is controlled locally by deterministic ESP32 firmware and remotely configured by exactly one ingestor writer. Bounded planner intent crosses MCP and registry validation into TimescaleDB before delivery. Evidence consumers must preserve availability and provenance. GitHub, GHCR, ArgoCD, one production namespace, and one gated OTA path deliver reviewed change.
components:
  - id: CMP-001
    name: Deterministic greenhouse firmware
    responsibility: Resolve sensors, solar phase, validated tunables, irrigation ownership, and safety rails into relay decisions and diagnostics.
    requirement_ids: [NSR-003, NSR-004, NSR-005, NSR-006, NSR-007]
  - id: CMP-002
    name: Sole device writer and readback reconciler
    responsibility: Track true connection generations and confirmed canonical cfg state, drain bounded writes fairly, and record truthful terminal outcomes.
    requirement_ids: [NSR-001, NSR-007]
  - id: CMP-003
    name: Hermes, planner, and MCP delivery
    responsibility: Maintain tool-level liveness, create bounded terminal plan actions, enforce strict registry bounds, and fail visibly neutral.
    requirement_ids: [NSR-002, NSR-007]
  - id: CMP-004
    name: TimescaleDB plan and evidence store
    responsibility: Own serialized schema evolution, one effective expiring plan, crop-care job outcomes, metric availability, and realized dry-out evidence.
    requirement_ids: [NSR-002, NSR-004, NSR-005, NSR-006, NSR-007]
  - id: CMP-005
    name: API, planner context, dashboards, and generated sites
    responsibility: Consume only availability-bearing, provenance-correct evidence and expose operator-visible terminal state.
    requirement_ids: [NSR-002, NSR-005, NSR-006]
  - id: CMP-006
    name: Immutable delivery and runtime verifier
    responsibility: Bind issue, commit, tests, schema, images, Argo state, firmware artifact, device readback, acceptance probes, and rollback.
    requirement_ids: [NSR-007]
runtime_topology:
  - One ESP32 runs the five-second control loop and exposes ESPHome entities on the device network.
  - One authorized ingestor in verdify-prod owns remote ESP32 writes; all other services are read-only or propose through MCP and database contracts.
  - Hermes invokes bounded MCP tools; MCP and planner services validate against shared schemas and persist plan lifecycle in TimescaleDB.
  - API, lab, graph, Grafana, and planner-context jobs read TimescaleDB evidence without device-write authority.
  - GitHub Actions publishes immutable images from main; a digest-only promotion PR advances the manually synced ArgoCD app; firmware follows a separate gated OTA.
data_flows:
  - from: CMP-001
    to: CMP-002
    data: telemetry, actual cfg readbacks, relay state, diagnostics, firmware revision
    transport: ESPHome native API
  - from: CMP-002
    to: CMP-001
    data: normalized validated writes with connection-generation and per-command correlation
    transport: serialized ESPHome service calls
  - from: CMP-003
    to: CMP-004
    data: terminal run status, actual MCP action, bounded plan, validity, provenance
    transport: MCP and PostgreSQL transaction
  - from: CMP-004
    to: CMP-002
    data: one effective normalized plan and audited operator intent
    transport: PostgreSQL query and writer queue
  - from: CMP-001
    to: CMP-004
    data: irrigation intent and terminal state, metric availability, solar phase, dry-out admission and stop evidence
    transport: ingestor and PostgreSQL
  - from: CMP-004
    to: CMP-005
    data: availability-bearing telemetry, plan lifecycle, crop-care ledger, realized outcomes
    transport: SQL, API, and generated artifacts
  - from: CMP-006
    to: CMP-001
    data: approved firmware artifact
    transport: gated OTA
  - from: CMP-006
    to: CMP-002
    data: approved immutable service image
    transport: GHCR and ArgoCD
storage:
  - TimescaleDB owns immutable telemetry history, alert and delivery ledgers, plan lifecycle, commissioning records, and realized outcome views.
  - The tunable registry and schemas in Git own canonical compatibility rules; firmware cfg readbacks expose effective device state.
  - Historical invalid DLI remains forensic with invalid provenance and is never silently rewritten into valid crop evidence.
  - Firmware artifacts and immutable image digests support rollback; GitHub and .agent-workflow retain delivery evidence.
security_boundaries:
  - Exactly one ingestor identity may write the live device; planner, API, sites, and reviewers cannot bypass MCP, registry, or firmware rails.
  - Jason's July 9 approval covers this recovery's production sync and OTA but not credentials, public edge, destructive data, new hardware, or unrelated products.
  - Raw secrets remain in scoped Kubernetes or local credential stores and never enter repository artifacts, logs, prompts, or reports.
integrations:
  - ESPHome native API and Home Assistant provide device transport/readback; transport loss and cfg drift are distinct events.
  - OpenAI/Hermes and FastMCP provide planner execution; readiness requires usable Verdify tools, not TCP alone.
  - Weather and solar functions provide context; outdoor forecast VPD must be compared with observed outdoor-derived VPD, never indoor VPD.
  - GHCR, GitHub Actions, ArgoCD, k3s, and the OTA tooling provide delivery and rollback.
deployment:
  - Land serialized schema/migrations first, then service consumers and manifests, then retire stale database intent, then perform one combined firmware OTA.
  - Main is canonical; images are digest-pinned and promoted through a digests-only PR; prod sync is followed by revision and endpoint proof.
  - Firmware changes pass unit tests, invariants, stock replay, band replay when applicable, firmware check, alert, weekly OTA, bake, heap/map, and last-good rollback proof.
  - No preview environment exists; isolated worktrees, fixtures, replay, rendered manifests, fault injection, and production-safe dry runs are the proving surfaces.
observability:
  - Connection generation, cfg drift, writer queue age, per-command lifecycle, confirmed readback, batch duration, and periodic task cadence.
  - MCP tool liveness, retry state, run terminal status, result action, plan validity, expiry, active provenance, and neutral fallback.
  - Irrigation demand source, resolved relay owner, zone enablement, requested and delivered liters, job state, fertilizer master, and flush endpoint.
  - DLI availability, reason, provenance, raw forensic value, and consumer suppression.
  - Solar phase, dry-out eligibility, admission, block and stop reasons, actuator duty, outdoor absolute-humidity advantage, and realized response.
  - Exact Git revision, image digest, Argo revision, firmware build, device readback, alert state, acceptance probe, and rollback signal.
risks:
  - Enabling the current wall schedule before routing repair would fertilize south and west misters.
  - Overlapping ownership of firmware YAML or MCP paths can create incompatible partial fixes; contracts serialize these paths.
  - Long writer batches can starve alerts and planner work unless scheduling and confirmation are redesigned together.
  - Shared lime/cannabis chemistry cannot be safely guessed; commissioning must fail closed.
  - The live database solar function and source migrations can diverge; apply and prove serialized migrations before trusting diurnal analytics.
  - One production environment and one weekly OTA increase rollback importance and require one integrated firmware package.
decision_ids: [ADR-005, ADR-006, ADR-007, ADR-008, ADR-009]
