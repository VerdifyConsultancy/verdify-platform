    statement: Current climate rotation conflicts with center-only VPD mist.
    existing_authority: firmware climate zone router
    proposed_direction: center-only climate route; explicit intentional south/west irrigation
    blocking: false
  - id: CON-002
    statement: Current dead schedule and 90-minute hold conflict with commissioned weekly liters and immediate flush.
    existing_authority: firmware irrigation scheduler
    proposed_direction: fail-closed solar-week state machine and wall-local immediate flush
    blocking: false
  - id: CON-003
    statement: Current proxy DLI conflicts with the operator-confirmed broken interior sensor.
    existing_authority: firmware accumulator and downstream views
    proposed_direction: explicit unavailable evidence contract
    blocking: false
  - id: CON-004
    statement: Current active 0.25 plan conflicts with approved/device zero.
    existing_authority: stale v_active_plan row
    proposed_direction: atomically retire stale intent and prevent repinning
    blocking: false
