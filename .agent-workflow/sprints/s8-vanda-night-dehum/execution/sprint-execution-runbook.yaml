  open_blockers: []
platform:
  mcp_server: agents.vallery.net
  api_ref:
  auth_mode: mcp_session
  required_tools:
  - name: agent_platform.session.create
    purpose: Create one lane worker session per approved lane.
    required: true
  - name: agent_platform.session.poll
    purpose: Read lane status, questions, closeout, and coordination requests.
    required: true
  - name: agent_platform.terminal.attach
    purpose: Attach operator-visible tmux or browser terminal views.
    required: true
  - name: agent_platform.session.send
    purpose: Answer worker questions and coordination requests.
    required: true
  terminal_access:
    mode: both
    operator_visible: true
    attach_refs: []
  fallback_policy: 'RECORDED FALLBACK IN EFFECT (gate g-local-dispatch-fallback, approved
    by jason 2026-07-03): Agent Platform MCP tools are not present in the controller
    session; lane workers run as local Claude subagent sessions inside verdify lane
    create worktrees/leases, one session per lane, controller-supervised. Any further
    platform work routes to platform-readiness.'
cadence:
  poll_interval_minutes: 10
  heartbeat_timeout_minutes: 15
  loop_until:
  - All required lanes have closeout artifacts.
  - Independent critics approve current heads.
  - Review packet is complete with exact revision, CI, deployment, telemetry, rollback,
    and questions.
  - Deployment verification and outcome review are ready for the next role.
