coordination:
  poll_steps:
  - Refresh GitHub, lease, session, PR, check, and deployment state.
  - Poll each Agent Platform lane session through MCP.
  - Capture questions, blockers, closeout, and coordination requests.
  - Answer delegated questions or open gates for protected decisions.
  - Record controller and session-ledger events, then update sprint status.
  controller_responses:
  - Answer contract-scoped worker questions.
  - Dispatch only dependency-ready lanes with no active worker session.
  - Route scope changes to sprint-planning or architecture-contracts.
  - Route closeout to independent-critic and approved lanes to review-inbox.
  coordination_request_policy: Resolve only within approved lane contracts and delegation;
    route protected changes to gates.
  escalation_paths: []
ci_cd:
  required_checks:
  - lint
  - test
  - firmware-replay-diff
  - migration-rollback-safety
  - no-new-fire-and-forget
  - service-restart-drift-guard
  workflows:
  - ci.yml
  - prod-promote
  merge_policy: Merge or queue only after critic approval, review packet readiness,
    and required checks.
  deployment_trigger: Trigger review deployment only from approved release plan and
    authorized environment policy.
  evidence_refs: []
deployment:
  target_environment: verdify-prod
  namespace: verdify-prod
  strategy: manual
  approval_required: true
  rollout_refs:
  - deploy/k8s overlays/prod @ main (app verdify-prod-dark)
  rollback_refs:
  - cfg_dehum_vent_hold_enabled readback false after rollback
  - Next-night 02-06h behavior matches pre-activation baseline
review:
  review_packet_path: ".agent-workflow/sprints/s8-vanda-night-dehum/review/review-inbox-packet.yaml"
  human_review_trigger: Review packet complete with exact revision, checks, deployment
    evidence, telemetry, rollback, and open questions.
  reviewer_visibility: []
ledger:
  controller_state_path: ".agent-workflow/controller/controller-state.yaml"
  session_ledger_path: ".agent-workflow/controller/session-ledger.yaml"
  required_events:
  - lane_dispatched
  - prompt_compiled
  - worker_status
  - worker_closeout
  - critic_reviewed
  - review_packet_created
  - ci_observed
  - deployment_observed
stop_conditions:
- Platform MCP operation identity is missing or unavailable.
- A lane session, issue, branch, PR, lease, or contract identity conflicts.
- A worker asks for protected production, schema, security, migration, or destructive
  authority.
- Required CI/CD, review, deployment, telemetry, or rollback evidence cannot be obtained.
handoff:
  next_skill: sprint-orchestrator
  next_mode: platform-dispatch
  reason: Dispatch dependency-ready lane sessions through Agent Platform MCP and supervise
    execution.
