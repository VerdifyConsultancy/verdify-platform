discovered_issues:
  - >-
    #419 filed: replay corpus never populates outdoor_data_age_s (0 of
    193,525 rows) -> every outdoor-aware estimator path (BC-13/#385/#410) is
    replay-blind in the stock rule-8 gate; export fix belongs to
    scripts/export-replay-overrides.sh (outside this lane's ownership).
residual_risks:
  - >-
    Flag-ON morning firing: the hold path has no night predicate (per the
    agreed spec), so once armed it can vent+reheat on wet MORNINGS with
    cold-dry outdoor air (10 such corpus rows under the freshness
    assumption). Expected physics, but should be watched in the bake KPIs
    (heat1 runtime/cycles).
  - >-
    Re-entry-gap idle sliver (inherent to the specced predicates): with the
    flag armed, in the 1.0F band between the can_hold floor and the re-entry
    line, the estimator selects the hold candidate (so closed_heat_dehum,
    which needs MX_HEAT_ASSIST, cannot engage) while mode entry is blocked ->
    the controller idles wet until temp either sags below the floor (heat +
    closed-heat-dehum resume) or recovers past floor+1.0 (hold re-enters).
    Demonstrated by the fixture gap rows. If the critic/bake judges this
    sliver harmful, the ladder-order decision is a spec change (escalation
    condition: estimator ladder semantics) — not unilaterally patchable here.
  - >-
    climate_moisture_exchange JSON grows to ~290 chars worst-case (buffers
    raised 320->384 on-device). If any downstream consumer path truncates
    text states at 255 chars (HA recorder-style), the tail fields could
    clip; flagged to data-327 in the PR. Firmware side is safe.
  - >-
    Deploy confounds from the design review stand for the release wave: OTA
    boots band_track_fraction=0.0 vs live pushed 0.25 (re-pin or bake joint,
    see #416), and the hold cannot engage under live #409 night anchors
    until #411 re-raises the corridor.
