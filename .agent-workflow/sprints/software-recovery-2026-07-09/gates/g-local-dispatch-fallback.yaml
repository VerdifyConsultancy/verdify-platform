type: policy_exception
status: approved
question: >-
  Agent Platform worktree-agent operations are disabled and return structured
  HTTP 501 responses. May the controller use isolated local Codex subagent
  sessions, one coding session per contracted worktree, to deliver the approved
  software-recovery sprint while retaining every protected production gate?
owner: Jason Vallery
evidence_required:
  - Jason explicitly directed the agent to take the greenhouse feedback and deliver all proposed software fixes, then repeatedly directed it to continue.
  - Jason explicitly granted permission for the required firmware OTA without another OTA approval request, while deterministic safety gates remain mandatory.
  - Codex exposes no Agent Platform session tools; in-pod add_worktree_agent and remove_worktree_agent are disabled post-MVP and return structured HTTP 501 responses.
  - The four fixed repo sessions share one stale retired-branch worktree and cannot provide safe lane isolation.
allowed_decisions:
  - approve-local-codex-subagent-dispatch-with-contracted-worktrees
  - reject-and-wait-for-agent-platform-restoration
decision: approve-local-codex-subagent-dispatch-with-contracted-worktrees
rationale: >-
  Jason's explicit delivery and OTA directive authorizes the ordinary isolated
  implementation mechanism needed to complete the approved sprint. The fallback
  is limited to contracted source, test, review, and evidence work in separate
  worktrees under controller supervision. It does not authorize production DB
  credential rotation, worker production mutation, destructive database work,
  raw secret handling, or bypass of CI, independent criticism, migration,
  firmware, GitOps, release, and runtime gates.
opened_at: "2026-07-09T22:31:05Z"
resolved_at: "2026-07-09T22:31:05Z"
resume_state: >-
  Commit and independently review the controller baseline, then dispatch only
  dependency-ready local Codex subagents into their contracted branches and
  worktrees; keep native platform control requests blocked and preserve the
  separate production credential-rotation gate.
