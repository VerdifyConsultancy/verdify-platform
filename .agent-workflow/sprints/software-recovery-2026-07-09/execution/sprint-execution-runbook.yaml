coordination:
  poll_steps:
    - Refresh GitHub, worktree, session, PR, check, and deployment state.
    - Poll each active local fallback session and capture heartbeat, questions, blockers, closeout, and coordination requests.
    - Answer only contract-scoped questions; open or retain gates for protected decisions.
    - Reconcile immutable heads, CI, critic verdicts, review evidence, and dependency handoffs.
    - Record controller and session-ledger events without copying raw terminal logs or secrets.
  controller_responses:
    - Dispatch only dependency-ready lanes with no active session or worktree owner.
    - Answer approved contract-scoped worker questions and enforce path ownership.
    - Route scope, architecture, schema-sequence, security, migration, and production changes to their owning gates or skills.
    - Route immutable worker closeout to a fresh independent critic.
  coordination_request_policy: Resolve only inside approved lane contracts and the local fallback boundary; any production, credential, destructive, schema-sequence, or scope expansion requires its owning controller gate.
  escalation_paths:
    - platform-readiness for native session lifecycle restoration
    - controller-loop for session identity, ledger, or recovery ambiguity
    - sprint-planning for material scope or dependency changes
    - architecture-contracts for public contract or architecture changes
ci_cd:
  required_checks:
    - lint
    - test
    - migration-rollback-safety
    - firmware-replay-diff
    - no-new-fire-and-forget
    - service-restart-drift-guard
  workflows:
    - .github/workflows/ci.yml
    - .github/workflows/prod-promote.yml
  merge_policy: Merge only current independently accepted heads after all required checks pass; preserve schema-before-consumer and one-migration-at-a-time order.
  deployment_trigger: Production promotion and manual ArgoCD sync occur only from the approved wave release plan after the credential, alert, CI, critic, migration, and runtime prerequisites close.
  evidence_refs:
    - .agent-workflow/platform/platform-readiness.yaml
    - .agent-workflow/sprints/software-recovery-2026-07-09/gates/g-local-dispatch-fallback.yaml
deployment:
  target_environment: verdify-prod
  namespace: verdify-prod
  strategy: Manual digest-pinned prod promotion PR followed by gated ArgoCD sync; one reviewed firmware OTA follows the repository firmware preflight and rollback procedure.
  approval_required: true
  rollout_refs:
    - deploy/k8s/overlays/prod
    - ArgoCD application verdify-prod-dark
  rollback_refs:
    - Prior digest-pinned prod overlay revision
    - firmware/artifacts/last-good.ota.bin
review:
  review_packet_path: .agent-workflow/sprints/software-recovery-2026-07-09/review/review-inbox-packet.yaml
  human_review_trigger: The exact integrated revision has green CI, fresh critic acceptance, prod and OTA evidence, immediate and settled telemetry, rollback proof, and only explicitly accepted residual risks.
  reviewer_visibility:
    - GitHub issues, pull requests, checks, workflow runs, and immutable commit refs
    - agents.vallery.net dashboard and authenticated terminal surfaces
    - Durable .agent-workflow and .verdify evidence without raw session logs or secrets
ledger:
  controller_state_path: .agent-workflow/controller/controller-state.yaml
  session_ledger_path: .agent-workflow/controller/session-ledger.yaml
  required_events:
    - lane_dispatched
    - prompt_compiled
    - worker_status
    - worker_closeout
    - critic_reviewed
    - review_packet_created
    - ci_observed
    - deployment_observed
stop_conditions:
  - A local worker lacks a unique contracted branch, worktree, issue set, prompt, and controller-visible session identity.
  - A worker requests production, credential, destructive database, broad RBAC, or secret-handling authority.
  - The production credential rotation gate, critical planner alert, migration ordering, firmware safety, cycling, weekly OTA, bake, or rollback gate is not satisfied for its protected transition.
  - A lane head, issue, PR, worktree, contract hash, CI result, critic verdict, deployment revision, or runtime evidence conflicts.
  - Native Agent Platform tools are used despite their disabled contract or the four fixed shared sessions are treated as isolated lane workers.
handoff:
  next_skill: sprint-orchestrator
  next_mode: local-fallback-dispatch
  reason: Supervise the active device-writer and evidence-core isolated worktrees on authoritative main a2c3ee9, then dispatch only dependency-ready downstream lanes under the approved fallback gate.
