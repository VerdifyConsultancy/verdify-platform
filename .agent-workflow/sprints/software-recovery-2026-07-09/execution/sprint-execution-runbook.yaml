  api_ref: agents.vallery.net dashboard API and in-pod agent-fleet MCP
  auth_mode: mcp_session
  required_tools:
    - name: agent-fleet.add_worktree_agent
      purpose: Create one isolated worktree-agent session for a dependency-ready lane; observed disabled post-MVP with HTTP 501.
      required: true
    - name: agent-fleet.remove_worktree_agent
      purpose: Remove or recover the exact isolated lane session; observed disabled post-MVP with HTTP 501.
      required: true
    - name: agent-platform.session.poll
      purpose: Read durable lane heartbeat, status, questions, blockers, and closeout; absent from the controller tool inventory.
      required: true
    - name: agent-platform.session.send
      purpose: Answer contract-scoped worker questions through the platform identity; absent from the controller tool inventory.
      required: true
    - name: agent-platform.terminal.attach
      purpose: Attach the operator to the exact isolated lane session rather than a shared fixed clone; no dynamic lane identity exists.
      required: true
  terminal_access:
    mode: both
    operator_visible: true
    attach_refs:
      - agents.vallery.net authenticated dashboard/tmux surface
      - repo pod SSH identity
  fallback_policy: Use only the approved gate g-local-dispatch-fallback-software-recovery-20260709 for one local Codex subagent per contracted worktree; never reuse the four fixed shared sessions or expand the exception into production writes.
cadence:
  poll_interval_minutes: 5
  heartbeat_timeout_minutes: 15
  loop_until:
