north_star:
  goal: Restore truthful, bounded, non-starving software control and evidence for the live greenhouse, deliver it through production, and perform one gated OTA without inventing hardware or crop measurements.
  alignment_status: aligned
  source_refs: [.agent-workflow/northstar/NORTHSTAR_PRODUCT.md, .agent-workflow/northstar/NORTHSTAR_ARCHITECTURE.md, .agent-workflow/project/project-definition.yaml]
current_state:
  summary: The 17-issue sprint and eight lane contracts are approved and validated; Agent Platform dispatch is blocked by disabled dynamic worktrees and a stale shared clone, so execution will use the recorded isolated local-worktree fallback. Production remains degraded by writer/planner failures, wrong irrigation/DLI semantics, evidence/resource gaps, chronic firmware risk, stale intent, and an exposed live DB credential.
  lifecycle_state: Controller baseline validation with recorded local dispatch fallback
  active_sprint: software-recovery-2026-07-09
  open_gates: [g-prod-db-credential-rotation-20260709]
  delivery_risks:
    - Enabling the current wall schedule before firmware topology repair would fertilize south and west misters.
    - Stale 0.25 intent must not be retired until repaired planner/writer consumers are live.
    - Argo OutOfSync drift must be reconciled before a broad production sync.
    - The planner critical alert blocks normal OTA until a valid required plan clears it.
    - All firmware changes share one device, one weekly OTA, tight historical heap, and one rollback artifact.
    - Replay outdoor freshness, trustworthy cycle counts, and topology-aware policy must land before firmware acceptance.
    - Water-event materialization is stale and equipment/energy scopes must converge before resource claims are trusted.
    - Production release is blocked until the exposed DB credential is explicitly authorized, rotated, and verified across every consumer.
    - The repo runner ServiceAccount currently has direct namespace-admin rights in verdify-prod; workers must not use that bypass and release remains GitOps/operator-gated.
delivery_health:
  status: failing
  diagnostic_refs: [docs/reviews/greenhouse-performance-and-project-review-2026-07-09.md, .agent-workflow/strategy/github-backlog-sync.yaml]
  deployment_refs: ["Argo verdify-prod-dark Healthy/OutOfSync @ 0a9a19a", "running ingestor digest 175e5ec", "firmware 2026.7.3.1931.ab18fe8"]
  log_refs: ["verdify-ingestor 69/69 pushes every 5–6 minutes", "Hermes MCP retry exhaustion", "vision ImagePullBackOff GHCR 401"]
  telemetry_refs: ["critical alert 7676", "plan_journal latest 2026-06-25", "v_active_plan band_track_fraction=0.25", "interior light 0 lx with numeric DLI"]
  discovered_health_issues:
    - id: HEALTH-001
      statement: Stable ESPHome connection receives broad 69-value reconcile batches every five to six minutes and starves the task loop.
      severity: critical
      evidence_refs: [issue 433, live ingestor logs]
      action: Implement device-writer-reconcile first and require two-hour zero-storm proof.
    - id: HEALTH-002
      statement: Required planner is tool-dead while pods are green; alert 7676 is critical and no plan journal entry has landed since June 25.
      severity: critical
      evidence_refs: [issue 427, Hermes/run audit, alert_log]
      action: Restore tool-level health and terminal plan semantics before OTA.
    - id: HEALTH-003
      statement: Climate mist currently rotates into unplanted south/west zones and automatic fertilizer semantics are accidentally disabled rather than correct.
      severity: high
      evidence_refs: [issue 434, live relay attribution and HA config]
      action: Implement one firmware relay resolver and commissioning-gated wall-only feed.
    - id: HEALTH-004
      statement: Product and planner publish numeric interior DLI despite a broken 0-lx sensor and compounding arithmetic defects.
      severity: high
      evidence_refs: [issue 435, live/read-code audit]
      action: Land schema-first unavailable/provenance contract and guard all consumers.
    - id: HEALTH-005
      statement: DB solar phase remains old in production and dry-out has projected but not durable realized-effectiveness evidence.
      severity: high
      evidence_refs: [issues 293 and 410]
      action: Apply/prove solar parity and materialize solar-night outcome evidence.
    - id: HEALTH-006
      statement: Out-of-band vision CronJob has not succeeded since July 4 and is in ImagePullBackOff due GHCR 401.
      severity: medium
      evidence_refs: [issue 436]
      action: Defer from control recovery and reconcile separately as vision-only work.
    - id: HEALTH-007
      statement: Stock replay has no source-backed outdoor age/freshness and cannot reach outdoor-aware estimator branches honestly.
      severity: high
      evidence_refs: [issue 419, corpus audit]
      action: Populate typed source-backed freshness and enforce coverage before firmware acceptance.
    - id: HEALTH-008
      statement: Firmware daily counters are unsafe for partial-day cycling acceptance and the device has a chronic low lifetime heap floor plus Task WDT history.
      severity: critical
      evidence_refs: ["issues 389, 390, and 428"]
      action: Land raw-transition truth, topology-aware OTA policy, and measured heap/WDT gate.
    - id: HEALTH-009
      statement: Canonical/legacy equipment slugs diverge, the water-event ledger stopped May 1, and partial measured versus modeled energy is collapsed.
      severity: high
      evidence_refs: [issue 437, live resource audit]
      action: Converge active aliases, restore idempotent water freshness, and expose resource scope/quality.
    - id: HEALTH-010
      statement: A committed fallback matches the still-valid production application DB credential.
      severity: critical
      evidence_refs: [issue 438, redacted hygiene gate]
      action: Merge fail-closed cleanup but block production release until explicit scoped rotation and redacted consumer verification.
