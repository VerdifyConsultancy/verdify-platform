  architecture_inputs:
    system_context:
      - One live greenhouse contains crops, sensors, an ESP32, relay boards, climate and irrigation equipment, lighting, water and gas systems, and operator-gated hardware.
      - The ESP32 runs deterministic control locally and exchanges telemetry and bounded setpoints with one authorized production ingestor over the native API.
      - k3s hosts TimescaleDB, ingestion, planner, MCP, API, generated sites, observability, backup, MQTT, and supporting services in one production environment.
      - GitHub and GHCR own accepted code and immutable images; ArgoCD owns declarative runtime state behind a manual production gate.
      - Jason is the safety and outward-action gate; authorized agents own bounded repository and non-protected operational work.
    architecture_decision_areas:
      - Wall-drip-only automatic fertigation state machine, calibrated-volume commissioning, immediate flush, exact-once weekly solar cadence, center-only VPD mist, dormant-zone disablement, intentional south and west irrigation, and available feedback contract.
      - DLI availability, provenance, time, and dimensional contract while the interior sensor is invalid and after replacement.
      - Atomic singular active-plan model, expiry, neutral fallback, and registry compatibility.
      - True reconnect versus configuration-drift semantics, setpoint cache, wire-ID readback, post-clamp comparison, and no-op suppression contract.
      - Solar-phase existing-sensor night dry-out control and evidence contract.
      - Deferred crop-zone sensing, HAF, intake, shade, metering, and possible dehumidification interfaces.
      - Planner shadow evaluation, forecast calibration, and constrained experiment interface.
      - Public and SaaS identity, privacy, retention, and accessibility requirements.
    quality_attributes:
      - Plant and device safety under partial failure.
      - Single-writer determinism and bounded AI authority.
      - Dimensional correctness, provenance, reproducibility, and evidence invalidation.
      - Resilience through planner, network, service, node, and storage interruptions.
      - Reviewable releases and exact revision-to-runtime traceability.
      - Low wear and utility cost subject to crop health and safety.
      - Future-agent operability without dependence on conversation history.
    constraints:
      - One production environment contains the only live device and database.
      - Firmware OTA, live sync, device network, destructive database, credentials, and outward-facing actions are human gated.
      - Existing greenhouse envelope, equipment, plumbing, and crop exposure constrain physical experiments.
      - The current plan may not depend on new physical sensors or equipment; interior DLI remains unavailable until Jason's separate sensor replacement.
      - GitHub Issues, main, ADRs, CI, ArgoCD, and runtime evidence own different authoritative states.
      - Migrations and firmware changes must satisfy specialized safety tooling and bake rules.
    assumptions:
      - Crop-specific optimization remains provisional until plant identity and crop-zone evidence improve.
      - Manual crop work must be explicitly logged before it can be distinguished from automation.
      - Physical models need separate open-window and closed-house epochs.
      - Center drip inactivity is expected and center clean mist is climate actuation, not evidence of a separate watering program.
      - Weekly wall fertigation is an approved pilot scheduler cadence, not proof of a universal crop optimum; seasonal dose and shared-line chemistry remain bounded by commissioned measurements and crop review.
  delivery_operations:
    environments:
      - verdify-prod is the sole environment; development and staging are retired.
      - Local or agent worktrees provide isolated source execution, not a second live environment.
    infrastructure:
      - k3s hosts the production namespace, ArgoCD hosts the application record, GHCR hosts immutable images, and persistent storage and backup are cluster-managed.
      - The ESP32 and Home Assistant remain on local networks reached through explicitly controlled egress.
    configuration:
      - Repository manifests, Kubernetes secrets, database plans, tunable registry, dispatcher validation, and device cfg readbacks form the configuration chain.
      - Raw secrets remain external to repository and report artifacts.
    deployment:
      - Main pushes build digest-pinned artifacts; prod-promote creates a digests-only PR; a human merges and an operator performs gated ArgoCD sync.
      - Firmware uses a separate gated OTA path with alert, weekly, bake, replay, invariant, and unit-test evidence.
    rollback:
      - Runtime rollback returns to prior immutable image digests or reviewed manifest revision.
      - Firmware rollback uses retained artifacts and the gated operator procedure.
      - Crop-care and planner experiments require neutral or prior-safe parameter fallback and explicit stop conditions.
    migrations:
      - One migration change proceeds at a time and is classified before rollback proof.
      - Self-transactional or commit-forcing migrations are never wrapped in an outer rollback transaction.
    observability:
      - Climate, equipment, setpoint, diagnostic, plan, alert, utility, crop, ArgoCD, pod, endpoint, and backup evidence are available.
      - Known semantic defects include fabricated interior DLI availability, forecast VPD comparison, persistent reset reason, stale sensor alerts, and missing crop-zone evidence.
    support:
      - Repository runbooks, subsystem docs, Grafana, API health, database access, GitHub Issues, and coordination requests support diagnosis and handoff.
      - Explicit service-level and crop-emergency response expectations still need approval.
    incident_response:
      - Track A incidents take precedence; safe local firmware behavior and single-writer enforcement are preserved while the failure domain is isolated.
      - Device, production sync, destructive database, credential, and public-infrastructure remediation remains Jason gated where specified.
    documentation:
      - Durable decisions and operations live in docs and .agent-workflow; one-off evidence and historical context live in the indexed Orbit context dump.
      - Review conclusions must supersede or reconcile stale reports and issue claims instead of leaving competing truths.
  open_gaps:
    - id: GAP-001
      area: crop-intent
      question: Which exact Vanda cultivars or parentage are present, and which temperature, light, VPD, watering, feed, and dry-down limits should Jason approve for each?
      impact: Crop optimization and acceptance criteria remain provisional and may be wrong for a specific plant.
      owner: Jason with crop reviewer
      blocking: false
      status: accepted_risk
    - id: GAP-002
      area: crop-sensing
      question: How shall current software expose unavailable crop-zone evidence without blocking work that can be validated from existing sensors?
      impact: Crop-specific optimization claims remain limited, but current reconcile, planner, irrigation-contract, DLI-availability, and house dry-out recovery can proceed without new hardware.
      owner: verdify-platform owning agent; Jason separately owns interior-light-sensor replacement
      blocking: false
      status: accepted_risk
    - id: GAP-003
      area: irrigation-semantics
      question: "Resolved: automatic feed is a commissioned weekly solar-cadence wall-only pilot; climate mist is center-only; south and west require intentional irrigation; dormant infrastructure remains present but disabled."
      impact: Implementation must remove the dead 10:30 behavior and forbidden automatic paths without deleting future-zone infrastructure.
      owner: verdify-platform owning agent
      blocking: false
      status: resolved
    - id: GAP-004
      area: data-correctness
      question: "Resolved: every active consumer must expose interior DLI as unavailable until a replacement sensor passes an explicit validity contract; history retains provenance and is not silently reinterpreted."
      impact: Implementation must stop current false values while preserving independent lighting-control evidence.
      owner: verdify-platform owning agent
      blocking: false
      status: resolved
    - id: GAP-005
      area: planner-reliability
      question: "Resolved for recovery: tool liveness must be part of health and restart policy; plans use intersected bounds, one expiring active plan, a classified neutral fallback, and become active immediately after acceptance checks."
      impact: Implementation and runtime proof remain required before the planner is considered healthy.
      owner: verdify-platform owning agent
      blocking: false
      status: resolved
    - id: GAP-006
      area: physical-upgrades
      question: No current decision is requested; revisit HAF, intake, shade, airflow measurement, sensors, and possible dehumidification only when Jason reopens physical scope.
      impact: Physical limits remain, but they do not block the current software recovery and must not be smuggled in as implementation prerequisites.
      owner: Jason for procurement and installation
      blocking: false
      status: accepted_risk
    - id: GAP-007
      area: utilities-and-cost
      question: Which whole-building electric, gas, lighting, fog, and water meters are authoritative and what budget or optimization target applies?
      impact: Cost and wear recommendations remain approximate and cannot be independently reconciled to bills.
      owner: Jason with verdify-platform agent
      blocking: false
      status: open
    - id: GAP-008
      area: security-privacy-compliance
      question: What identity, authorization, retention, privacy, compliance, and public-data rules govern the present and future SaaS or public surfaces beyond the existing secret and device-write rules?
      impact: Later architecture and public-product work could choose incompatible data and access boundaries.
      owner: Jason
      blocking: false
      status: accepted_risk
    - id: GAP-009
      area: accessibility-localization
      question: What accessibility standard, browser support, and localization scope apply to lab, graph, API documentation, and future product surfaces?
      impact: Design and acceptance criteria for human-facing surfaces are incomplete.
      owner: Jason or delegated product owner
      blocking: false
      status: accepted_risk
    - id: GAP-010
      area: project-approval
      question: "Resolved: Jason approved the corrected product intent, complete software delivery, production rollout, and OTA in the July 9 attached brief."
      impact: Architecture contracts and sprint planning may proceed under the recorded scope and non-waived safety gates.
      owner: Jason
      blocking: false
      status: resolved
    - id: GAP-011
      area: device-reconcile-reliability
      question: "Resolved: true transport reconnect has its own generation signal; generic cfg drift must not clear the cache; actual wire IDs and post-normalization comparison drive no-op suppression; writes are confirmed only after success and batches must yield without starving the task loop."
      impact: The current deployed loop remains a P0 implementation defect until runtime evidence shows zero stable-connection full pushes.
      owner: verdify-platform owning agent
      blocking: false
      status: resolved
    - id: GAP-012
      area: fertigation-commissioning
