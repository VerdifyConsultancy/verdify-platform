  - id: SRC-021
    type: operator-approved-delivery-brief
    location: /Users/jason/.codex/attachments/afeed265-feb3-4eab-b454-7b0e6dcdcfeb/pasted-text-1.txt
    summary: Approves delivery of the complete software recovery, including a researched automatic wall-fertigation pilot, preserved-but-disabled future zone infrastructure, center-only VPD mist, intentional-only south and west irrigation, solar-phase night dry-out, retirement of the June band experiment, immediate planner activation after repair, production delivery, and OTA subject to deterministic safety gates.
    evidence_status: reported
  - id: SRC-022
    type: fertigation-research
    location: UF IFAS HS1306; Virginia Tech VCE 430-100; UC ANR microirrigation uniformity guidance; peer-reviewed cannabis nutrient studies
    summary: Supports small controlled doses, measured distribution and injector calibration, compatibility testing, immediate clean-water flushing after injection, crop-specific nutrient limits, and commissioning the shared wall line from measured flow and chemistry rather than guessed relay minutes.
    evidence_status: verified
decisions:
  - id: DEC-001
    statement: Keeping the live greenhouse and plants safe and operational outranks SaaS, cloud, and product evolution.
    status: approved
    rationale: Track A over Track B is the repository prime directive.
    source_ids: [SRC-001, SRC-004]
  - id: DEC-002
    statement: Main is the sole canonical branch and verdify-prod is the sole environment; production is promoted by digest-only pull request and manually synced through ArgoCD.
    status: approved
    rationale: The prior deployment branch, development environment, and staging overlay are retired.
    source_ids: [SRC-001, SRC-003, SRC-017]
  - id: DEC-003
    statement: Jason remains the human gate for firmware OTA, production sync affecting the live writer, device-network actions, destructive production database work, credential rotation, and outward-facing infrastructure.
    status: approved
    rationale: These actions can affect live devices, plants, data, security, or public behavior.
    source_ids: [SRC-001, SRC-003, SRC-007]
  - id: DEC-004
    statement: Exactly one process may write setpoints to the live ESP32 and write authority must default deny.
    status: approved
    rationale: A second writer can create unsafe nondeterministic device behavior.
    source_ids: [SRC-001, SRC-008]
  - id: DEC-005
    statement: Firmware owns deterministic safety and high-frequency actuation; AI may propose only bounded tactical plans through validated MCP and registry surfaces.
    status: approved
    rationale: Local control must remain safe through planner, network, and service failure.
    source_ids: [SRC-004, SRC-008]
  - id: DEC-006
    statement: GitHub Issues are the backlog authority, main owns accepted code, and durable operating decisions belong in repository docs or the indexed Orbit context dump.
    status: approved
    rationale: Future sessions must reconstruct state from durable sources instead of chat history.
    source_ids: [SRC-001, SRC-003, SRC-013, SRC-019]
  - id: DEC-007
    statement: Schema changes land before consumers, migrations are serialized and rollback-classified, and drift guards define the wire protocol between layers.
    status: approved
    rationale: These rules prevent runtime/schema drift and unsafe live migration rehearsal.
    source_ids: [SRC-001, SRC-006, SRC-018]
  - id: DEC-008
    statement: verdify-platform owns the end-to-end greenhouse product stack, while verdify-www and verdify-crm remain separate products and repositories.
    status: approved
    rationale: Ownership boundaries prevent accidental cross-product changes.
    source_ids: [SRC-001, SRC-004]
  - id: DEC-009
    statement: Restore deliberate Vanda watering and correct DLI evidence before another broad firmware or AI tuning wave.
    status: rejected
    rationale: The premise was wrong; the center drip is intentionally disabled and unconnected, and Jason did not approve a deliberate center watering program.
    source_ids: [SRC-010, SRC-011, SRC-012, SRC-015, SRC-020]
  - id: DEC-010
    statement: Use a clean-water morning center drench as the first recovery experiment and defer routine fertilizer until flow, EC, pH, and runoff are calibrated.
    status: rejected
    rationale: Center drip delivery is not current product intent; center clean mist is a climate actuator and fertilizer belongs only on the wall drips.
    source_ids: [SRC-010, SRC-011, SRC-015, SRC-020]
  - id: DEC-011
    statement: Center clean mist is a VPD-cycle climate actuator; center drip is intentionally disabled and unconnected; fertilizer delivery is allowed only through wall drips; dormant center, south, and west infrastructure shall be preserved but disabled until explicitly commissioned for planted zones.
    status: approved
    rationale: This is Jason's corrected equipment and crop-care contract and supersedes design assumptions that treated center drip or any mister as a fertilizer path.
    source_ids: [SRC-020]
  - id: DEC-012
    statement: Interior DLI is unavailable until Jason replaces and validates the broken interior light sensor; software shall not infer crop DLI from outdoor or broken-sensor proxies.
    status: approved
    rationale: Arithmetic correction cannot create a defensible interior-light measurement without a valid interior sensor.
    source_ids: [SRC-010, SRC-011, SRC-020]
  - id: DEC-013
    statement: The current recovery plan is software-only and prioritizes eliminating mislabeled reconnect/full-push reconciliation, planner recovery, wall-only fertilizer semantics, honest DLI availability, and bounded night dry-out using existing sensors.
    status: approved
    rationale: Jason explicitly deferred additional physical sensors and equipment from the current plan while prioritizing these software problems.
    source_ids: [SRC-020]
  - id: DEC-014
    statement: Automatic wall fertigation shall use a once-weekly pilot cadence, measured liters for prewet, feed, and immediate clean flush, and fail-closed commissioning fields for water chemistry, product analysis, injector ratio, aggregate wall flow, distribution uniformity, and distal-line flush proof.
    status: approved
    rationale: Weekly is an operator-selected pilot cadence, not a universal agronomic optimum; exact concentration and volume cannot be safely inferred for a shared lime-and-cannabis line, and research supports calibrated small doses with immediate flushing rather than a fixed 90-minute hold.
    source_ids: [SRC-021, SRC-022]
  - id: DEC-015
    statement: Climate-driven mist shall actuate the center mister only; south and west misters shall remain off unless an explicit intentional irrigation command or future approved schedule targets them.
    status: approved
    rationale: This matches current occupancy and prevents the VPD fairness rotation from watering unplanted zones.
    source_ids: [SRC-021]
  - id: DEC-016
    statement: Night dry-out shall be enabled only in the firmware-defined night solar phase and remain bounded by existing temperature, humidity, wind, weather, dwell, and safety checks.
    status: approved
    rationale: Solar phase is the established diurnal clock and avoids seasonal drift from a fixed wall-clock window.
    source_ids: [SRC-020, SRC-021]
  - id: DEC-017
    statement: The June band-track experiment is retired with band_track_fraction set to zero, and the repaired bounded planner becomes active immediately after its acceptance and delivery checks pass.
    status: approved
    rationale: Jason explicitly rejected continuing the 0.25 experiment and waived a proposal-only soak while retaining deterministic bounds and runtime verification.
    source_ids: [SRC-021]
  - id: DEC-018
    statement: Jason authorizes implementation, production delivery, and firmware OTA for this recovery without another approval request, while CI, alert, replay, invariant, migration, weekly-OTA, bake, single-writer, and runtime verification gates remain mandatory.
    status: approved
    rationale: The protected-action approval is explicit and scoped to the reviewed software recovery; it does not waive deterministic safety controls.
    source_ids: [SRC-001, SRC-021]
assumptions:
  - id: ASM-001
    statement: The priority orchids are strap-leaf Vandas, but cultivar and parentage are not yet inventoried well enough to define cultivar-specific limits.
    status: open
  - id: ASM-002
    statement: Manual watering or feeding may have occurred during the 30-day window even though no durable record proves it.
    status: open
  - id: ASM-003
    statement: Reconstructed relay-on intervals represent commanded state; physical water, airflow, combustion, and valve completion require independent feedback.
    status: validated
  - id: ASM-004
    statement: Utility costs use configured rates and partial meters, not a reconciled facility bill.
    status: validated
  - id: ASM-005
    statement: Summer open-screen response coefficients will change when the greenhouse is closed for fall or winter.
    status: validated
contradictions:
  - id: CON-001
    statement: The prior wet-night bake report concluded PASS from an early subset, while the expanded five-night review finds only three passing nights and a failed latest night.
    source_ids: [SRC-010, SRC-011]
    status: open
  - id: CON-002
    statement: The interior light sensor is broken, yet software publishes and consumes interior DLI; its accumulator also credits a one-second loop as five seconds and downstream logic re-multiplies and re-adds components.
    source_ids: [SRC-008, SRC-010, SRC-011, SRC-020]
    status: open
  - id: CON-003
    statement: Center drip is physically disabled and fertilizer is wall-drip-only, but firmware exposes center drip, center fertilizer, and fertilizer-mister jobs; both wall and center schedules are configured for 10:30 while fertilizer jobs are admitted only from 06:00 through 09:00, so all scheduled fertilizer work is dropped.
    source_ids: [SRC-008, SRC-010, SRC-011, SRC-012, SRC-020]
    status: open
  - id: CON-004
    statement: Existing documents imply materially different single thermal time constants, while new passive fits cannot identify a trustworthy one-state constant.
    source_ids: [SRC-009, SRC-010, SRC-011]
    status: open
  - id: CON-005
    statement: The July Tier-1 setpoint work is described as a push-collapse optimization, but generic configuration drift triggers a five-minute job mislabeled as reconnect, clears the cache, misses 56 valid readbacks by wire-ID mismatch, and performs 69 direct pushes despite a stable ESPHome connection.
    source_ids: [SRC-010, SRC-012, SRC-013]
    status: open
  - id: CON-006
    statement: Planner timeouts appear as failed AI deliveries, but 142 of 144 mapped timeouts contain completed GPT-5.5 sessions whose Verdify MCP tool was disconnected; TCP health stays green after MCP keepalive death, retries terminate, and full-plan materialization separately applies broader firmware bounds before stricter planner bounds.
    source_ids: [SRC-010, SRC-011, SRC-012]
    status: open
  - id: CON-007
    statement: Current VPD wet-assist rotates across center, south, and west, while the approved crop topology requires center-only climate mist and intentional-only south and west irrigation.
    source_ids: [SRC-008, SRC-021]
    status: open
  - id: CON-008
    statement: Current wall fertigation uses guessed durations and a 90-minute post-feed hold, while the approved and researched contract requires calibrated volumes and immediate measured clean-water flushing.
    source_ids: [SRC-008, SRC-021, SRC-022]
    status: open
requirements:
  functional:
    - id: FR-001
      statement: The system shall maintain the live greenhouse within explicit safety limits through a deterministic local control loop when AI, network, or platform services fail.
      source_ids: [SRC-001, SRC-004, SRC-008]
      acceptance_ids: [AC-001]
    - id: FR-002
      statement: The system shall preserve exactly one authorized live device writer and validate every planner-proposed value before delivery.
      source_ids: [SRC-001, SRC-004, SRC-008]
      acceptance_ids: [AC-002]
    - id: FR-003
      statement: The platform shall ingest, retain, and expose climate, equipment, setpoint, diagnostic, plan, utility, and crop evidence with sufficient provenance to reconstruct outcomes.
      source_ids: [SRC-002, SRC-004, SRC-005, SRC-018]
      acceptance_ids: [AC-003]
    - id: FR-004
      statement: Center clean mist shall remain a fertilizer-free, center-only VPD-cycle actuator; center drip and every non-wall fertilizer path shall remain disabled; south and west mist shall require explicit intentional irrigation; connected wall-drip clean and fertilizer actions shall record requested, admitted, started, completed, feedback-confirmed, and dropped outcomes without silent loss.
      source_ids: [SRC-010, SRC-011, SRC-020, SRC-021]
      acceptance_ids: [AC-004]
    - id: FR-005
      statement: The planner shall maintain observable Hermes-to-MCP liveness, recover from tool disconnects, create bounded expiring auditable plans using the intersection of all applicable registry bounds, distinguish full plans from one-shot fallbacks, and enter a neutral safe state when delivery fails.
      source_ids: [SRC-004, SRC-008, SRC-010, SRC-012]
      acceptance_ids: [AC-005]
    - id: FR-006
      statement: Operators and reviewers shall be able to inspect greenhouse state, plans, diagnostics, and evidence through API, lab, graph, database, and operational surfaces.
      source_ids: [SRC-002, SRC-004, SRC-005]
      acceptance_ids: [AC-003]
    - id: FR-007
      statement: The release system shall build immutable images, review digest-only production promotions, and preserve explicit human gates for production sync and firmware OTA.
      source_ids: [SRC-001, SRC-003, SRC-006, SRC-017]
      acceptance_ids: [AC-006]
    - id: FR-008
      statement: Automatic wall fertigation shall run at most once per approved solar-week interval and only after commissioning is complete, derive prewet, feed, and immediate postflush durations from calibrated liters and aggregate wall flow, and retain exact-once execution and terminal evidence across restart or missed windows.
      source_ids: [SRC-021, SRC-022]
      acceptance_ids: [AC-004, AC-008]
    - id: FR-009
      statement: Night dry-out shall use the established solar phase rather than a fixed clock, actuate only when environmental and equipment safety predicates pass, and publish why it was admitted, blocked, or stopped.
      source_ids: [SRC-020, SRC-021]
      acceptance_ids: [AC-009]
    - id: FR-010
      statement: Interior crop DLI shall be represented as unavailable in firmware, database, planner context, API, and human-facing consumers until a replacement interior sensor passes an explicit validity contract; lighting control that does not depend on fabricated DLI shall continue independently.
      source_ids: [SRC-010, SRC-011, SRC-020, SRC-021]
      acceptance_ids: [AC-003, AC-010]
  non_functional:
    - id: NFR-001
      category: safety
      statement: Track A safety, single-writer enforcement, alert gates, firmware replay, invariants, unit tests, weekly OTA limit, and bake requirements shall fail closed.
      source_ids: [SRC-001, SRC-004, SRC-006, SRC-008]
      acceptance_ids: [AC-001, AC-002, AC-006]
    - id: NFR-002
      category: auditability
      statement: Every material plan, configuration, release, migration, device build, and crop-care outcome shall identify its source, revision, disposition, and observed result.
      source_ids: [SRC-001, SRC-004, SRC-008, SRC-010]
      acceptance_ids: [AC-003, AC-004, AC-006]
    - id: NFR-003
      category: reliability
      statement: Greenhouse safety shall tolerate planner timeout, service restart, network interruption, stale plan, failed deployment, and cancelled device-write batches without uncontrolled actuation, false completion accounting, or starvation of alerts and planning heartbeats.
      source_ids: [SRC-001, SRC-003, SRC-008]
      acceptance_ids: [AC-001, AC-005]
    - id: NFR-004
      category: security
      statement: Secrets shall remain in approved credential stores and Kubernetes secrets, never in repository content, logs, reports, or public responses.
      source_ids: [SRC-001, SRC-003, SRC-017]
      acceptance_ids: [AC-007]
    - id: NFR-005
      category: data-integrity
      statement: Migrations shall be serialized, rollback-classified, and never wrapped unsafely when they self-commit or force commits.
      source_ids: [SRC-001, SRC-006, SRC-018]
      acceptance_ids: [AC-006]
    - id: NFR-006
      category: evidence-quality
      statement: Physical and crop metrics shall be dimensionally correct, sensor-grounded, provenance-labeled, and explicitly unavailable when their evidence contract is broken.
      source_ids: [SRC-010, SRC-011, SRC-015, SRC-020]
      acceptance_ids: [AC-003, AC-004]
    - id: NFR-007
      category: operability
      statement: A future authorized agent shall be able to reconstruct current constraints, source authority, runtime state, and safe next action from durable artifacts.
      source_ids: [SRC-001, SRC-003, SRC-004, SRC-016]
      acceptance_ids: [AC-006]
  constraints:
    - id: CST-001
      statement: Production contains live plants and a device control loop; production and device actions remain human gated.
      source_ids: [SRC-001, SRC-003, SRC-004]
    - id: CST-002
      statement: Main and verdify-prod are the only current branch and environment authorities.
      source_ids: [SRC-001, SRC-003, SRC-017]
    - id: CST-003
      statement: GitHub Issues are the backlog and approved implementation must be reconciled to a bounded issue and reviewed delivery record.
      source_ids: [SRC-001, SRC-013, SRC-016]
    - id: CST-004
      statement: Current recovery must use the existing ESP32, sensors, relay boards, plumbing, and production data model; additional physical sensors and equipment are outside the active plan, and Jason separately owns replacement of the broken interior light sensor.
      source_ids: [SRC-003, SRC-009, SRC-010, SRC-020]
    - id: CST-005
      statement: verdify-www, verdify-crm, retired development/staging environments, and autonomous outward-facing actions are outside this project definition.
      source_ids: [SRC-001, SRC-004]
  acceptance_criteria:
    - id: AC-001
      statement: Loss or failure of planner and platform services leaves firmware enforcing validated safety rails without a second writer or uncontrolled relay state.
      evidence_expected: [fault-injection test, firmware invariants, replay evidence, live single-writer proof]
    - id: AC-002
      statement: Runtime evidence shows exactly one authorized writer and every non-neutral proposed value is registry-valid, pushed once as intended, and confirmed by device readback.
      evidence_expected: [CI interlock, runtime writer inventory, push log, cfg readback, alert state]
    - id: AC-003
      statement: Core telemetry and action evidence are fresh, dimensionally tested, revision-linked, and reproducible from documented queries.
      evidence_expected: [schema tests, freshness probe, query manifest, data-quality test]
    - id: AC-004
      statement: Center clean mist remains available exclusively to the VPD cycle without fertilizer; south and west mist remain off without explicit intentional irrigation; center drip and non-wall fertilizer requests are explicitly disabled; every connected wall-drip job has a durable terminal disposition and available relay or flow feedback.
      evidence_expected: [firmware invariant test, schedule and manual-path test, job ledger, relay and available flow feedback]
    - id: AC-005
      statement: Required planner triggers meet an approved SLA, produce one auditable expiring plan or neutral fallback, and pass independent outcome scoring.
      evidence_expected: [trigger ledger, plan journal, registry validation, horizon check, matched outcome report]
    - id: AC-006
      statement: Landed and deployed work identifies exact revisions and passes applicable lint, test, migration, firmware, manifest, promotion, approval, and runtime checks.
      evidence_expected: [CI checks, pull request, ArgoCD revision, runtime probe, OTA evidence when applicable]
    - id: AC-007
      statement: Repository, logs, reports, and generated artifacts contain no raw secret values and runtime identities use scoped credential references.
      evidence_expected: [secret scan, config review, deployment secret references]
    - id: AC-008
      statement: A commissioned automatic wall-feed run proves weekly exact-once admission, calibrated volume-to-time conversion, mutually safe valve and injector sequencing, no 90-minute hold, and immediate flush to the commissioned distal-line endpoint; incomplete commissioning fails closed without actuation.
      evidence_expected: [unit tests, firmware replay and invariants, commissioning record, job ledger, relay and flow evidence]
    - id: AC-009
      statement: Night dry-out can be admitted only in firmware night solar phase, stops on any existing environmental or equipment guard, and exposes solar phase, admission predicate, stop reason, temperature, humidity, and actuator evidence.
      evidence_expected: [firmware unit tests, invariants, replay, diagnostic readbacks, overnight runtime evidence]
    - id: AC-010
      statement: No active consumer presents an interior or crop DLI value while the sensor validity contract is false; unavailable provenance is explicit and existing photoperiod or qualified-minute lighting behavior remains testable.
      evidence_expected: [schema and migration tests, API and planner-context tests, firmware unit tests, dashboard or generated-site checks]
product:
  primary_users:
    - id: USR-001
      name: Jason as greenhouse owner and human safety gate
      needs: [healthy plants, clear risk and approval decisions, trustworthy evidence, safe production and device operations]
    - id: USR-002
      name: authorized repository and operations agent
      needs: [durable source authority, bounded autonomy, reproducible build and runtime access, explicit gates, observable outcomes]
    - id: USR-003
      name: crop and controls reviewer
      needs: [crop-zone measurements, intervention history, physical model assumptions, causal limits, reviewable recommendations]
    - id: USR-004
      name: lab, graph, and API consumer
      needs: [available public technical surfaces, understandable greenhouse evidence, no exposure of private control or secret data]
  problem_statement: Verdify must keep one live greenhouse and its crops safe while turning firmware, sensing, equipment, telemetry, bounded AI, and delivery operations into an auditable system that can improve plant outcomes without hiding uncertainty or bypassing human gates.
  jobs_to_be_done:
    - Maintain safe climate and crop-care behavior continuously despite planner or infrastructure failure.
    - Observe what the crop actually experienced and distinguish intent, device state, and physical outcome.
    - Propose, review, execute, and learn from bounded control experiments.
    - Release software, schemas, configuration, and firmware without creating a second writer or unsafe live change.
    - Explain greenhouse status, costs, risks, and next decisions to the operator and reviewers.
  scope:
    - ESP32 and ESPHome firmware, relay control, tunables, readbacks, replay, invariants, and gated OTA.
    - Production ingestion, TimescaleDB data, schemas, migrations, planner, MCP, API, and lab and graph sites.
    - Production Kubernetes and ArgoCD manifests, CI and promotion, observability, backup, and operator runbooks.
    - Greenhouse equipment, crop evidence, physical-response models, utility attribution, and bounded optimization for the live house.
  non_goals:
    - Autonomous firmware OTA, production sync, device-network changes, destructive database work, credential rotation, or public edge and organization changes.
    - A second production-like environment or a second live greenhouse writer.
    - Moving deterministic safety or five-second actuation into the AI planner.
    - Ownership of verdify-www, verdify-crm, or retired historical tracker artifacts.
    - Claiming cultivar-specific optimization without cultivar identity and crop-zone evidence.
    - Adding physical sensors, HAF, intake, shade, metering, or dehumidification equipment in the current recovery plan; Jason's replacement of the broken interior light sensor is tracked separately.
  success_metrics:
    - id: MET-001
      measure: Open deploy-blocking critical or legacy-high alerts at firmware OTA decision time.
      target: Zero.
    - id: MET-002
      measure: Authorized live ESP32 writers.
      target: Exactly one, continuously evidenced.
    - id: MET-003
      measure: Commissioned connected wall-drip clean or fertilizer jobs with durable terminal disposition, calibrated requested and delivered volume, and available physical feedback.
      target: 100 percent.
    - id: MET-004
      measure: Fertilizer actuation through center, south-mister, or west-mister outputs.
      target: Zero.
    - id: MET-005
      measure: Valid overnight house dry-out samples within an approved existing-sensor VPD or absolute-humidity objective and temperature bounds.
      target: 100 percent of dry-out actuation occurs in night solar phase and every run records weather, realized temperature, absolute humidity, actuator duty, admission, and stop reason.
    - id: MET-006
      measure: Required planner trigger resolution and valid plan or neutral-fallback delivery.
      target: 100 percent reach a bounded full plan or explicitly classified neutral fallback before their due-time SLA, with active-plan uniqueness and MCP liveness evidenced.
    - id: MET-007
      measure: Release evidence binding tests, image or firmware artifact, Git revision, and observed production state.
      target: 100 percent of production changes.
    - id: MET-008
      measure: Climate-driven mist events outside the center zone or fertilizer events outside the wall-drip path.
      target: Zero.
    - id: MET-009
      measure: Active consumers publishing interior crop DLI while the sensor-validity contract is false.
      target: Zero.
    - id: MET-010
      measure: Redundant full-device reconcile batches during a stable ESPHome connection.
      target: Zero; true reconnect performs one bounded post-connect reconciliation without starving other tasks.
  risks:
    - Live plants can be damaged by hidden irrigation, humidity, light, or temperature failure before software metrics reveal it.
    - A second writer or stale plan can produce conflicting device behavior.
    - Low heap and Task WDT resets can interrupt control or conceal firmware instability.
    - Invalid DLI and missing crop-zone evidence can make optimization conclusions false unless unavailable signals are suppressed.
    - Intake restriction, solar load, and absent HAF or shade impose physical limits software cannot remove.
    - Planner timeouts, invalid materialization, and biased forecasts can increase moisture or actuator wear.
    - Single production environment limits safe end-to-end proving and increases reliance on replay, shadow evaluation, and gates.
design:
  surfaces:
    - id: SURF-001
      type: embedded deterministic control loop
      actor: ESP32 firmware and greenhouse equipment
      purpose: Convert validated sensor state and bounded setpoints into safe high-frequency relay decisions.
      inputs: [climate probes, outdoor data, time and solar state, cfg readbacks, safety rails, equipment state]
      outputs: [relay commands, mode and reason, diagnostics, configuration readbacks]
      requirement_ids: [FR-001, FR-002, NFR-001, NFR-003]
    - id: SURF-002
      type: MCP and planner workflow
      actor: bounded AI planner and operator
      purpose: Read evidence and propose auditable tactical plans and tunables without bypassing firmware safety.
      inputs: [forecast, climate history, crop context, plan history, registry, alerts]
      outputs: [validated expiring plan, acknowledgement, hypothesis, journal and outcome record]
      requirement_ids: [FR-002, FR-005, NFR-002, NFR-006]
    - id: SURF-003
      type: telemetry and observability data plane
      actor: ingestor, database, API, dashboards, agent, and reviewer
      purpose: Preserve and expose observed climate, equipment, setpoint, diagnostic, utility, crop, and plan evidence.
      inputs: [device telemetry, relay state, weather, plan events, crop observations, meters]
      outputs: [TimescaleDB records, alerts, API responses, dashboards, analysis extracts]
      requirement_ids: [FR-003, FR-006, NFR-002, NFR-006]
    - id: SURF-004
      type: crop-care relay and feedback workflow
      actor: irrigation scheduler, firmware, plumbing, operator, and crop reviewer
      purpose: Preserve center-only clean VPD misting, keep future unplanted-zone infrastructure explicitly disabled, and deliver commissioned weekly fertilizer only through connected wall drips using calibrated volumes and immediate flushing.
      inputs: [solar phase, weekly wall policy, commissioning state, calibrated wall flow, prewet feed and flush liters, chemistry and injector metadata, relay and available flow feedback, center VPD demand, explicit intentional-zone irrigation]
      outputs: [clean center climate mist, intentional south or west irrigation when explicitly requested, wall water or feed delivery, job disposition, volume and feedback record, configuration rejection, alert]
      requirement_ids: [FR-004, FR-008, FR-009, NFR-002, NFR-006]
    - id: SURF-005
      type: GitHub, CI, promotion, ArgoCD, and OTA workflow
      actor: repository agent, CI, GitHub reviewer, Jason, ArgoCD, and firmware deploy tooling
      purpose: Move reviewed changes to production or the device while preserving immutable evidence and human gates.
      inputs: [issue, commit, pull request, tests, image digest or firmware artifact, approvals]
      outputs: [accepted main revision, promotion PR, synced runtime, OTA record, rollback evidence]
      requirement_ids: [FR-007, NFR-001, NFR-004, NFR-005, NFR-007]
    - id: SURF-006
      type: public API and generated web surfaces
      actor: public or authorized technical consumer
      purpose: Expose greenhouse health, laboratory context, graphs, and API data without exposing control credentials.
      inputs: [approved database and generated content, request identity where applicable]
      outputs: [API response, lab page, graph page, health response]
      requirement_ids: [FR-006, NFR-004]
  flows:
    - id: FLOW-001
      name: Maintain greenhouse climate safely
      steps:
        - Read validated sensors, time, outdoor state, setpoints, and safety rails.
        - Resolve deterministic mode and relay outputs locally.
        - Apply active-low relay decisions with interlocks and dwell protection.
        - Publish mode, reason, relay, diagnostic, and configuration-readback evidence.
        - Alert on safety, sensor, heap, readback, or actuator anomalies.
      acceptance_ids: [AC-001, AC-002, AC-003]
    - id: FLOW-002
      name: Produce and evaluate a bounded AI plan
      steps:
        - Create a trigger with due time and current evidence context.
        - Generate one bounded hypothesis and plan through MCP.
        - Validate every parameter against the registry and write an expiring plan atomically.
        - Deliver and confirm intended changes or enter a neutral fallback.
        - Score the observed outcome independently and retain a lesson only when evidence is valid.
      acceptance_ids: [AC-002, AC-003, AC-005]
    - id: FLOW-003
      name: Preserve irrigation and fertilizer topology
      steps:
        - Admit clean center-mister demand only from the VPD-cycle climate path.
        - Keep center drip and all non-wall fertilizer paths disabled while preserving their dormant configuration; admit south or west mist only from explicit intentional irrigation.
        - Admit automatic wall feed at most once per solar-week interval and only when every commissioning field and safety predicate is valid.
        - Convert commissioned prewet, feed, and flush liters to bounded durations from measured aggregate wall flow.
        - Execute wall water prewet, fertilizer injection, fertilizer-off, and immediate clean flush in a mutually safe sequence with no fixed post-feed hold.
        - Record exact-once terminal disposition, requested and delivered volume, and available relay or flow feedback; alert on drop, mismatch, incomplete flush, or unsafe persistence.
      acceptance_ids: [AC-003, AC-004, AC-008]
    - id: FLOW-004
      name: Release software or firmware safely
      steps:
        - Bind work to GitHub intent and review the bounded change surface.
        - Run the applicable lint, tests, migrations, replay, invariants, manifests, and secret checks.
        - Merge accepted code to main and build an immutable artifact.
        - Obtain Jason approval before production sync or firmware OTA where required.
        - Verify the exact revision, runtime health, alerts, and rollback path after deployment.
      acceptance_ids: [AC-001, AC-002, AC-006, AC-007]
  human_gates:
    - Jason approves firmware OTA and any exception to alert, weekly, bake, replay, or device-safety gates.
    - Jason approves production ArgoCD sync that can affect the live writer.
    - Jason approves device-VLAN and physical hardware actions.
    - Jason approves destructive production database work, credential rotation, and public DNS, edge, or organization changes.
    - Material product intent, crop target, and lifecycle constraints require human approval before this project definition becomes approved.
  error_states:
    - A second process or session attempts to write to the ESP32.
    - Planner trigger times out, plan horizon is empty, or plan materialization violates registry bounds.
    - Ingestor misclassifies generic drift as reconnect, clears confirmed state, or repeatedly pushes unchanged or clamped values.
    - Firmware heap or watchdog state violates deployment safety thresholds.
    - A connected wall irrigation or feed job is silently dropped, or a center/non-wall fertilizer path remains callable.
    - DLI or another metric is unavailable or dimensionally invalid but remains planner-visible as a valid crop measurement.
    - Crop-zone sensing is absent or stale while house averages are treated as crop truth.
    - ArgoCD revision, image digest, database schema, and running service state diverge.
    - A self-committing migration is wrapped by an outer rollback transaction.
    - Public surfaces expose secrets, control authority, or unreviewed private data.
