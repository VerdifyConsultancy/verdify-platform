schema_ref: module-contract.schema.yaml
kind: ModuleContract
schema_version: "1.0"
module_id: runtime-release-verification
contract_version: "1.1"
status: approved
purpose: Own ordered integration, protected credential gate, immutable production promotion, migration application evidence, topology-aware cycling baseline, stale-intent retirement, one gated firmware OTA, rollback readiness, acceptance probes, and durable closeout without changing module internals.
requirement_ids: [NSR-007]
owned_paths:
  - deploy/k8s/overlays/prod/**
  - .verdify/sprints/software-recovery-2026-07-09/release/**
  - scripts/firmware-cycling-gate.sh
  - scripts/firmware-deploy-preflight.sh
  - docs/runbooks/software-recovery-2026-07-09.md
  - docs/reviews/software-recovery-2026-07-09-closeout.md
prohibited_paths:
  - firmware/**
  - ingestor/**
  - mcp/**
  - planner_graph/**
  - verdify_schemas/**
  - db/migrations/**
inputs:
  - name: accepted_module_changes
    schema: reviewed commits, critic decisions, tests, migration order, image and firmware build inputs
    producer: all implementation modules
  - name: protected_action_approval
    schema: approver, scope, decided_at, non-waived gates
    producer: northstar-artifacts and project-definition
  - name: runtime_acceptance_contracts
    schema: module required evidence and release stop/rollback signals
    producer: module contracts
outputs:
  - name: release_verification
    schema: exact code/image/manifest/Argo/firmware revisions, gate results, runtime probes, rollback state, final disposition
    consumers: [operator, GitHub, future agents]
  - name: production_state
    schema: applied migration versions, running digests, Argo sync/health, device build/readbacks, alert and acceptance state
    consumers: [operator, project-router, GitHub]
public_interfaces:
  - name: ordered-release-runbook
    location: docs/runbooks/software-recovery-2026-07-09.md
    compatibility: Schema and services precede audited stale-intent retirement; planner blocker clears before one combined OTA; every step has stop and rollback conditions.
  - name: release-evidence-packet
    location: .verdify/sprints/software-recovery-2026-07-09/release/
    compatibility: Machine-readable and human-readable evidence cite immutable revisions and never raw secrets.
dependencies:
  hard: [device-writer-reconcile, planner-delivery, firmware-control-policy, evidence-contracts, green CI, explicit production application DB credential rotation approval and verification]
  soft: [GHCR availability, ArgoCD controller, Home Assistant and public endpoints]
invariants:
  - No schema consumer is deployed before its migration and rollback proof.
  - No production release begins until source credential fallbacks are absent and the exposed application credential is explicitly authorized, rotated, verified across every consumer, and rejected in its old form.
  - No stale 0.25 intent is retired until repaired materializer/writer consumers are live and verified.
  - No firmware OTA proceeds until planner critical alert is correctly resolved and firmware alert/weekly/bake/replay/invariant/check gates pass.
  - Exactly one combined firmware OTA carries the recovery unless rollback is required.
  - Every production mutation has exact pre-state, post-state, stop condition, and rollback evidence.
  - Runtime proof distinguishes merged, published, promoted, synced, running, device-effective, and accepted states.
  - Cycling acceptance uses completed raw-transition windows, topology-aware expectations, explicit tolerances, and an insufficient-data state; current/future/overlapping windows cannot pass.
runtime_resources:
  - GitHub, GHCR, ArgoCD app verdify-prod-dark, namespace verdify-prod
  - production TimescaleDB and migration tooling
  - one live ESP32 and retained last-good firmware artifact
  - public API/lab/graph endpoints and Home Assistant readbacks
validation_commands:
  - id: integration
    command: make lint && make test
    purpose: Verify the accepted integrated tree.
  - id: migration-safety
    command: make migration-rollback-safety
    purpose: Confirm serialized migration classifications and proof method.
  - id: firmware-gates
    command: make test-firmware && make firmware-invariants && make firmware-replay-worktree OLD=origin/main && make firmware-replay-band OLD=origin/main && make firmware-check
    purpose: Verify the exact combined firmware artifact before OTA.
  - id: irrigation-software
    command: make irrigation-stack-software-check
    purpose: Verify current software-only irrigation contract without requiring deferred hardware.
  - id: cycling-gate
    command: make firmware-cycling-gate
    purpose: Capture immutable pre-OTA evidence and evaluate topology-aware completed-day post-OTA outcomes.
  - id: site
    command: make site-lint
    purpose: Verify human-facing evidence consumers.
required_evidence:
  - Green required CI on accepted main and immutable image digests.
  - Serialized migration rollback proofs and live applied-version checks.
  - Promotion PR, merged overlay digests, Argo synced revision, running image IDs, pod health, and endpoint responses.
  - Stale 0.25 plan retirement transaction and zero-repin proof.
  - Firmware build/map/heap, last-good, alert, weekly, bake, OTA, boot, cfg readback, relay attribution, DLI and dry-out diagnostics.
  - GitHub issues/PRs and durable state artifacts reconciled to actual final state.
  - Redacted credential caller inventory plus new-valid/old-invalid authentication evidence.
  - Pre/post cycling JSON and human artifacts with code SHA, firmware versions, dates, source view, topology policy, and completeness.
  - Resource evidence distinguishes fresh water ledger, measured/model energy scope, command-only, ambiguous, and unattributed quantities.
definition_of_done:
  - All module critics approve and the integration tree passes complete gates.
  - Production services and database show the intended revisions and healthy behavior.
  - One OTA is device-effective and all firmware acceptance probes pass or rollback completes.
  - Acceptance observation covers at least two writer hours and one eligible night, with longer agronomic commissioning explicitly separated.
  - No unresolved P0/P1 regression remains and records identify any accepted nonblocking risk.
approval:
  status: approved
  approver: Jason Vallery
  approved_at: "2026-07-09T21:05:00Z"
