schema_ref: module-contract.schema.yaml
kind: ModuleContract
schema_version: "1.0"
module_id: device-writer-reconcile
contract_version: "1.0"
status: approved
purpose: Own canonical ESPHome cfg identity, true connection generations, normalized reconciliation, a fair bounded device-write queue, and truthful per-command terminal state for the sole live writer.
requirement_ids: [NSR-001, NSR-007]
owned_paths:
  - verdify_schemas/tunable_registry.py
  - ingestor/entity_map.py
  - ingestor/ingestor.py
  - ingestor/shared.py
  - ingestor/esp32_push.py
  - ingestor/tasks/_common.py
  - ingestor/tasks/dispatcher.py
  - ingestor/tasks/confirmation.py
  - tests/test_cfg_readback_reconcile.py
  - tests/test_setpoint_dispatcher.py
  - tests/test_tunable_registry.py
prohibited_paths:
  - firmware/**
  - mcp/**
  - planner_graph/**
  - db/migrations/**
  - deploy/k8s/**
inputs:
  - name: desired_setpoints
    schema: normalized tunable name, typed value, source plan/operator ID, desired revision
    producer: planner-delivery and audited operator plan
  - name: cfg_readbacks
    schema: canonical ESPHome wire object ID, typed effective value, observed timestamp, firmware revision
    producer: deterministic firmware through ESPHome
  - name: connection_generation
    schema: monotonic integer incremented only after a successful new transport connection
    producer: ingestor connection owner
outputs:
  - name: device_write_lifecycle
    schema: command correlation, normalized requested value, queued/sent/failed/cancelled/confirmed/superseded status and timestamps
    consumers: [TimescaleDB, alerts, runtime-release-verification]
  - name: confirmed_cfg_state
    schema: canonical tunable, normalized confirmed value, wire ID, connection generation, observed timestamp
    consumers: [dispatcher, planner-delivery, diagnostics]
  - name: writer_health
    schema: queue age/depth, task cadence, connection generation, reconcile reason, batch duration
    consumers: [alerts, runtime-release-verification]
public_interfaces:
  - name: canonical-readback-registry
    location: verdify_schemas/tunable_registry.py
    compatibility: Generated canonical wire IDs must match ESPHome object IDs; any registry change requires firmware/readback drift fixtures and cfg readback coverage.
  - name: bounded-writer-queue
    location: ingestor/tasks/dispatcher.py
    compatibility: One writer serializes physical service calls but never blocks unrelated task scheduling; lifecycle status advances only after the corresponding event.
dependencies:
  hard: [deterministic-firmware ESPHome cfg readbacks, TimescaleDB setpoint and audit tables]
  soft: [planner-delivery desired values, Home Assistant diagnostics]
invariants:
  - Exactly one production identity can issue ESP32 writes.
  - A cfg value change is not a transport reconnect and cannot clear the entire confirmed cache.
  - Desired and confirmed values are compared after the same type, bounds, precision, and alias normalization.
  - No row or cache entry is represented as sent or confirmed before successful physical delivery and readback.
  - Cancellation and partial delivery retain per-command truth and retry only unconfirmed intent.
  - Pacing the writer cannot starve alerts, heartbeat, confirmation, forecast, or planner tasks.
runtime_resources:
  - verdify-ingestor pod and ServiceAccount
  - sole ESPHome native API connection and write lock
  - setpoint push log, setpoint snapshot, cfg telemetry, and alert tables
validation_commands:
  - id: writer-targeted-tests
    command: pytest -q tests/test_cfg_readback_reconcile.py tests/test_setpoint_dispatcher.py tests/test_tunable_registry.py
    purpose: Prove canonical IDs, event separation, normalized no-op suppression, per-command lifecycle, and fair scheduling.
  - id: lint
    command: make lint
    purpose: Enforce Python quality gates.
  - id: full-tests
    command: make test
    purpose: Prove repository integration.
required_evidence:
  - Generated 56-anchor expected-versus-actual wire-ID fixture with zero mismatch.
  - Two steady-state runtime hours with zero broad stable-connection anchor pushes.
  - One deliberate drift produces exactly one successful write and confirmation.
  - One controlled reconnect increments generation once and performs only the bounded required restore.
  - Periodic task cadence remains within twice intended interval during device writes.
definition_of_done:
  - False reconnect trigger and global cfg-drift cache reset are removed.
  - All lifecycle states survive cancellation, retry, restart, and confirmation tests.
  - Live logs and database use distinct reconnect, drift, desired-change, retry, and confirmation reasons.
  - Required integration and runtime evidence is attached to the lane and release record.
approval:
  status: approved
  approver: Jason Vallery
  approved_at: "2026-07-09T21:05:00Z"
