  upstream_authorities: [AGENTS.md, approved North Star and project definition, architecture/module contracts, GitHub Issues and main, current runtime evidence]
  downstream_consumers: [sprint planning/orchestration, CI, GHCR, ArgoCD, verdify-prod services, ESP32, API/lab/graphs, future repo agents]
responsibilities:
  - id: RAS-001
    description: Reconstruct and preserve approved intent, runtime truth, and GitHub backlog authority.
    lifecycle_skill: project-router, northstar-planning, project-definition, architecture-contracts, state-of-union
    acceptance_signal: Canonical artifacts validate and GitHub issues carry every executable outcome.
    evidence_refs: [.agent-workflow/northstar, .agent-workflow/project, .agent-workflow/architecture, .agent-workflow/strategy]
  - id: RAS-002
    description: Plan and supervise disjoint implementation lanes with independent criticism.
    lifecycle_skill: sprint-planning and verdify-agentic-sprint
    acceptance_signal: Every lane has one issue, locked ownership, tests, critic approval, and integration evidence.
    evidence_refs: [.agent-workflow/modules, .verdify/sprints/software-recovery-2026-07-09]
  - id: RAS-003
    description: Deliver schema, services, audited state cleanup, and one firmware package in safety order.
    lifecycle_skill: release-verification
    acceptance_signal: Exact migrations/images/Argo/firmware revisions and rollback state are observed live.
    evidence_refs: [.agent-workflow/modules/contracts/runtime-release-verification.contract.yaml]
  - id: RAS-004
    description: Protect credentials and stop on unapproved credential rotation or raw secret exposure.
    lifecycle_skill: repo-hygiene
    acceptance_signal: No raw value enters output/artifacts, committed fallback is removed, and rotation proceeds only after the durable gate is approved.
    evidence_refs: [.agent-workflow/hygiene/gates/g-prod-db-credential-rotation.yaml]
authority_boundaries:
  allowed_operations:
    - Read repository, GitHub, Kubernetes, Argo, database, logs, metrics, Home Assistant, and approved credential-reference metadata.
    - Create/update/close issue and PR records within the approved recovery; implement/test/commit/push reviewed code and artifacts.
    - Apply non-destructive serialized migrations, promote reviewed images, and perform approved prod sync/OTA after deterministic gates.
  prohibited_operations:
    - Record, print, paste, log, commit, or summarize raw secrets.
    - Create a second device writer, bypass firmware/MCP bounds, or disable safety gates.
    - Rewrite Git history, force push, destructively reset user work, or delete unattributed worktrees/branches.
    - Change unrelated products, public infrastructure, or physical equipment.
  approval_required_for:
    - Production database credential rotation or any other credential rotation.
    - Scope expansion beyond the approved recovery, destructive production data action, or outward-facing infrastructure change.
    - Any OTA/sync outside the July 9 approved recovery or any safety-gate override.
  credential_rules:
    - Use existing secret references and auth modes; never emit raw values.
    - Compare or validate secrets only inside a local process with boolean/redacted output.
    - Rotate through scoped Kubernetes/database mechanisms and verify consumers/rollback only after explicit approval.
  environment_limits:
    - verdify-prod is the only environment and contains live plants/device/database.
    - Isolated worktrees and fixtures are source proving surfaces, not a second live environment.
