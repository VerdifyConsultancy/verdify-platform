lanes:
  - lane_id: L1-CLIMATE
    lane_name: "Floating-Corridor Control (firmware)"
    worktree_branch: lane/climate-floating-corridor
    preflight: firmware-preflight
    milestone: "Greenhouse Control Optimization"
    depends_on_lanes: ["L0-SCHEMA"]
    owns_paths: ["firmware/**"]
    covers_issues: ["377", "299", "383", "367", "368", "369", "370", "361", "323", "324", "326", "300", "291", "349", "14", "31"]
    summary: "L1-CLIMATE owns the ESP32 control lane and carries the user's #1 priority: QUIET THE GREENHOUSE (reduce device cycling/runtime) under ADR-0004's floating-corridor regime (float inside the crop corridor, act only at edges with the cheapest minimal dose, treat cost/cycling as first-class). Verified ground truth: band_track_fraction=0.25 is LIVE (pinch armed; cfg readback confirmed in prod), so the float-flip to 0 (#377) is a real safety-checked lever, not a no-op. The three misters (mister_center/south/west) are NOT in the firmware R[] dwell array (controls.yaml:92-99); their relays are toggled directly by the pulse-timer FSM (controls.yaml:1336-1338) with only a per-zone VPD hysteresis floor and no min-on/min-off dwell — confirming the empirical chatter (mister_center 505 on-events/7d, 202 sub-60s, 79 sub-30s incl 0s pulses) while vent/fan/heat (which ARE in R[]) show 0-1 sub-60s. heat_dehum is hardcoded-active at greenhouse_logic.h:1580 with no enable tunable, adding overnight IDLE->heat1 actuation in the exact wet-night regime ADR-0004 wants idle — it must be carved out, preflight-controlled OFF behind a cfg-backed tunable, and shipped as its own post-float OTA so the float trial stays clean. Grow-light cycling roughly doubled post-#295 (grow_light_main 360/grow_light_grow 485 on-events/7d) from dawn/dusk lux-shoulder + solar-window-boundary flapping that the 120s min-on only partly catches — a genuine NEW gap (the #349 epic is occupancy/Lutron-scoped, too broad). The lane sequences strictly to the firmware freeze budget (<=1 OTA/week + 48h bake + replay-diff/invariants/test artifacts), batching the quiet-the-greenhouse OTA (misters + grow-light shoulder) into one window and the heat_dehum opt-in into a separate post-float window. Source-only/no-OTA cleanups (#367/#369/#370/#300-firmware/#326-firmware/#368-firmware) ride behind the functional control sequence, touched only when replay/invariant coverage proves behavior unchanged. Depends on L0-SCHEMA for: migration 186 NOAA solar parity applied to prod (#293, prerequisite for trustworthy solar phase before float/anchor work), the per-zone band schema (#324 columns already landed in prod — verified zone/band_role/target_value populated), and registry/tunable rows + cfg readbacks for every new firmware tunable this lane introduces."
    user_stories:
      - story_id: S1-QUIET
        as_a: "greenhouse operator watching relay wear and electricity"
        i_want: "the controller to stop chattering its misters, grow-lights, and wet-side actuators with sub-minute pulse-trains"
        so_that: "device runtime and start counts drop materially (the user's stated #1 priority) without losing climate compliance or moisture delivery"
        work_items:
          - issue_ref: "#377"
            title: "Float-flip: band_track_fraction source default -> 0 (corridor-keep) + live safety-checked trial"
            what: "Land the source-only float default (band_track_fraction cold-start = 0.0 in globals.yaml + C++ default_setpoints()) on this lane's branch, then run the safety-checked LIVE tunable push of band_track_fraction=0 with a predeclared 48-72h observation window and confirmed cfg_band_track_fraction=0 readback."
            why: "Verified prod: band_track_fraction=0.25 is LIVE (cfg readback present), so the pinch is armed and the flip is a real lever, not the superseded 2026-06-17 inert-dead-code note. Independent recompute (PR #385 findings) shows the served corridor at ~97-98% temp compliance vs ~66-90% pinched and daytime VPD ~65% above the served high edge; the flip reclaims ~7-9% of samples to IDLE and cuts VENT/FOG/MIST edge-actuations ~10-20% — the highest-leverage/lowest-effort cycling lever per ADR-0004 step 1."
            how: "Source side: keep ESPHome global default 0.0 + C++ default_setpoints() 0.0 (already in PR #385's globals.yaml on this branch). Live side (no OTA): set_tunable band_track_fraction=0 via the dispatcher path, preflight no-critical-alerts, confirm cfg_band_track_fraction=0 in setpoint_snapshot, predeclare SUCCESS (served-temp compliance stays >=95% AND mister_center on-events/day not up vs the 0.25 baseline AND night VPD not worse by >5pp) and ROLLBACK (restore 0.25 on served-temp <95% or mister_center on-events/day up >15% or any safety alert). Verify apply_band_track_pinch() honors 0 at both controller entry points."
            acceptance: ["cfg_band_track_fraction reads 0 in setpoint_snapshot post-push", "make firmware-replay-band OLD=<merge-base> shows the float-vs-pinch behavioral delta (NOT the stock corpus-fed replay, which is 0-divergence for band-curve-shape changes per CLAUDE.md verification rule 4)", "48-72h before/after read from #371 KPI surface attributes the actuation delta", "predeclared rollback value 0.25 documented in the PR/trial note"]
            depends_on: ["#293", "#371", "#324"]
            preflight: device-tunable-preflight
            effort: S
            wave: W1
            area_labels: ["area:firmware", "area:ingestor", "epic:climate-band"]
            schema_touch: false
            new_properties: []
          - issue_ref: "#299"
            title: "Mister dwell-guard: mister_min_on_s/mister_min_off_s + per-actuator max-cycles/hr governor"
            what: "Add a min-on/min-off dwell floor and a per-relay max-cycles/hr governor to the three climate misters (center/south/west), which today bypass the dwell-protected R[] array entirely."
            why: "Verified: the misters are NOT in the RelayMeta R[] array (controls.yaml:92-99 — only heat1/heat2/fan1/fan2/fog/vent are); the mister relays are toggled directly by the pulse-timer FSM (controls.yaml:1336-1338) with only a per-zone VPD hysteresis floor (mister_hysteresis_kpa) and no min-on/min-off. Result (lead evidence): mister_center 505 on-events/7d, 202 sub-60s, 79 sub-30s incl 0s pulses, 191 refires <90s; mister_south 220/80/28; vs vent/fan/heat 0-1 sub-60s because their dwell works. This is the REAL chatter the PR #385 observability does not fix. A 120s/60s dwell + VPD hysteresis floor collapses a sub-120s pulse-train into one held pulse, ~40-55% fewer mister on-events with moisture delivery preserved."
            how: "Add new ESPHome globals mister_min_on_s (default 120) and mister_min_off_s (default 60) in globals.yaml + number entities in tunables.yaml + cfg_mister_min_on_s / cfg_mister_min_off_s readbacks in sensors.yaml (CI no-new-fire-and-forget). Wire the dwell through the mister FSM turn-on path (controls.yaml ~1336-1338 center_mister/south_wall_mister/west_wall_mister .turn_on) and the pulse/gap timer (PULSE_ON_MS/PULSE_GAP_MS at ~1228) and the BLOCKED off path (~1186-1200) — NOT the RelayMeta R[] climate-relay array. Add per-zone last_on/last_off stamps and a rolling on-edge counter for a max-cycles/hr clamp. Add invariant in firmware/test/invariants.h (TraceRow already carries eq_mister_south/west/center per invariant #2/#6) asserting no mister on-edge within mister_min_off_s and no off within mister_min_on_s, and on-edges/hr per relay under the governor. Add unit tests in test_greenhouse_logic.cpp replaying a sub-120s pulse-train."
            acceptance: ["No mister exceeds its max-cycles/hr over the replay corpus (new invariant); make firmware-invariants green", "Mister min-on/min-off enforced \u2014 new unit test in test_greenhouse_logic.cpp + make test-firmware green", "cfg_mister_min_on_s / cfg_mister_min_off_s readbacks present (no-new-fire-and-forget CI green)", "make firmware-replay OLD=<base> NEW=HEAD divergence is the documented intended dwell-collapse only (THRESHOLD_PCT override + coordinator note per freeze rule 8)", "make firmware-check compiles"]
            depends_on: ["#377", "#300"]
            preflight: firmware-preflight
            effort: M
            wave: W2
            area_labels: ["area:firmware", "epic:control-optimization", "epic:firmware-control"]
            schema_touch: true
            new_properties: ["mister_min_on_s", "mister_min_off_s", "mister_max_cycles_per_hr"]
          - issue_ref: "#386"
            title: "Grow-light solar-window shoulder min-on bypass fix (post-#295 cycling regression)"
            what: "Fix the dawn/dusk lux-shoulder + solar-window-boundary flapping that doubled grow-light cycling after the #295 solar-phased-lighting OTA: widen lux on/off hysteresis at the shoulder, hold the window decision when exterior_lux_fresh is flapping, and ensure the 120s min-on hold spans the !in_window -> outside_window transition."
            why: "Verified: grow_light_main 360 and grow_light_grow 485 on-events/7d post-#295 (was 4-6 toggles/day pre-OTA), 20-21 sub-60s with sub-minute pulses. Root cause in evaluate_lighting() (greenhouse_logic.h ~1284-1349): plant_supplement_demand flips as natural_lux/exterior_lux crosses lux_on/lux_off during the shoulder, AND the solar-phased in_window boundary (added by #295) can flip lights to want_on=false reason=outside_window, where the min_on_hold guard (line 1345, only fires when current_on) does not fully damp the boundary chatter. NEW issue: the #349 lighting epic is occupancy/Lutron/Frigate-scoped (too broad); no existing issue owns the post-#295 grow-light cycling regression specifically."
            how: "In evaluate_lighting (greenhouse_logic.h): (1) widen lux_hysteresis handling so the dawn/dusk shoulder uses a larger effective band (or a shoulder-specific grow_light_shoulder_hysteresis tunable), (2) add an exterior_lux_flap hold so a flapping exterior_lux_fresh signal holds the prior window/lux decision rather than toggling, (3) verify min_on_hold (line 1345) spans the in_window->outside_window edge so a brief window boundary cannot force an off inside the 120s hold. Add the new tunable with globals + tunables number entity + cfg readback. Re-run make lighting-audit-static and the lighting replay. Co-OTA with #299 in the same firmware window to honor the 1-OTA/week budget."
            acceptance: ["grow_light on-events/day in replay/audit drop back toward the pre-#295 ~50/day baseline (~40-50% reduction of the post-#295 increment)", "make lighting-audit-static passes (warn count not increased)", "make firmware-replay OLD=<base> documents the intended lighting-decision change only", "any new tunable has a cfg_* readback (no-new-fire-and-forget green)", "make test-firmware + make firmware-invariants + make firmware-check green"]
            depends_on: ["#293", "#300"]
            preflight: firmware-preflight
            effort: M
            wave: W2
            area_labels: ["area:firmware", "epic:lighting"]
            schema_touch: true
            new_properties: ["grow_light_shoulder_hysteresis"]
          - issue_ref: "#367"
            title: "BC-8: settle ONE anti-chatter mechanism (arm the dwell preflight OR consolidate to hysteresis-only)"
            what: "Pick a single anti-chatter mechanism — arm + settle the purpose-built dwell preflight (sw_dwell_gate_enabled, ships disabled) with its paired temp_hysteresis push, OR consolidate to hysteresis-only — and delete the redundant path."
            why: "Two half-mechanisms (a disabled dwell preflight + scattered hysteresis + invariant #6) multiply edge cases; flapping is the opposite of tracking. Under the floating regime (band_track_fraction=0) edge decisions get more sensitive, so a single, settled anti-chatter mechanism matters more. This is the climate-relay analogue of the mister dwell-guard (#299) — settle it once the mister/grow-light chatter fixes have produced replay evidence so the dwell-vs-hysteresis choice is data-backed, not guessed."
