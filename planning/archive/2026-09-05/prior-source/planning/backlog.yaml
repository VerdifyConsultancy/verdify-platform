        as_a: "operator who needs the greenhouse system-of-record to be recoverable without a 7-day-data-loss window"
        i_want: "a real point-in-time-recovery posture for verdify-db short of the riskiest live cutover — interim WAL archiving to existing NFS plus a practiced restore drill"
        so_that: "I have a tested sub-restore-window RPO and a proven RTO before committing to the preflight-controlled CNPG flip, instead of an unbounded-RPO single replica with only nightly dumps"
        work_items:
          - issue_ref: "#218"
            title: "Interim DB durability: enable WAL archiving to the existing verdify-db-dumps NFS + run a practiced PITR restore drill (no new iSCSI, no cutover)"
            what: "Turn on continuous WAL archiving from the live single-replica verdify-db StatefulSet to the already-present verdify-db-dumps NFS PVC (archive_command to NFS, not a new iSCSI target), and execute a documented restore drill that proves a point-in-time recovery from a base dump + WAL replay. This is the lower-risk, not-blocked-by-the-iSCSI-cap interim that the COORDINATION_REQUESTS row 23 explicitly calls out."
            why: "#218 is RED: verdify-db is replicas=1 with WAL off; RPO is effectively the nightly dump (≤24h) and RTO is unpracticed. GitHub issues row 23 states 'WAL-to-NFS is the lower-risk interim and is NOT blocked by the iSCSI cap, but archive_mode=on needs a DB restart → attended maintenance window'. This closes most of the durability gap WITHOUT the #245 cutover risk and gives the cutover a proven restore baseline."
            how: "Add a prod overlay patch to the verdify-db StatefulSet: wal_level=replica, archive_mode=on, archive_command piping completed WAL segments to a mounted subdir of the verdify-db-dumps NFS PVC (mount it read-write into the DB pod, or a sidecar). The base dump is the existing nightly pg_dump. Document + script a restore drill (restore base dump into a scratch DB, replay WAL to a chosen recovery_target_time, assert row-count/max(ts) per hypertable). archive_mode=on requires a DB restart → ATTENDED preflight-controlled window (the DB is the writer's backing store; coordinate with the writer-quiesce discipline, not racing it). Stage the patch as STAGED-* until the window. No CNPG, no cutover."
            acceptance: ["After the controlled DB restart, `SHOW archive_mode` = on and WAL segments accumulate on the NFS archive path", "A restore drill restores base+WAL to a target time and asserts zero row-count / max(ts) diff per hypertable against a known point", "RTO of the drill is recorded; RPO documented as the WAL archive cadence", "`make migration-rollback-safety` N/A (no migration); the DB-config patch validated by kustomize build + an attended restart with the writer-quiesce checklist", "DURABILITY CHECK: archiving still healthy + a second restore drill clean, re-probed >=60 min after the restart"]
            depends_on: ["L6-S1"]
