nts read daily_summary.cycles_* — firmware per-day counters reset at local midnight — which are inflated 30-140x on partial/recent days and would cause a FALSE rollback/success on the cycling axis of the #377 float trial; the trustworthy source is v_equipment_runtime_daily (TRUE rising edges from raw equipment_state). (2) the 3-way lat/lon/zenith constant duplication (firmware/lib/greenhouse_solar.h, ingestor/solar.py, db migration 186) has no single-source-of-truth record. (3) #43 site_content RAG refresh is ALREADY implemented+scheduled (ingestor/ingestor.py:1997, 86400s) — it is verify-and-close, not new build. The lane is the schema-FIRST foundation other lanes depend on: it must land its source changes and apply migration 186 before the float-flip (#377) and VPD/dehum policy (#383) lanes can trust their measurement surface."
