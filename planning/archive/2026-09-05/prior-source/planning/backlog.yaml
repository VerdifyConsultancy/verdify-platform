ber is 187 (186 is the latest). Wave assignment: the no-OTA observability/dispatcher loops and topology schema are W3 (parallel-reliability+irrigation+product); the firmware sub-FSM and the irrig default change are also W3 but explicitly preflight-controlled behind the W1/W2 climate OTAs."
