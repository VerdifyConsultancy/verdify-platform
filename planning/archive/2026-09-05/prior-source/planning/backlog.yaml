  - lane_id: L5-DEPLOY
    lane_name: "Deploy Enablement / CI-CD"
    worktree_branch: lane/deploy-cicd
    preflight: none
    milestone: "Deploy Enablement (agent access + firmware CI/OTA)"
    depends_on_lanes: []
    owns_paths: [".github/workflows/**", "deploy/**", "Makefile", "scripts/**"]
    covers_issues: ["288", "303", "304", "319", "320", "335", "336", "317", "318", "338", "322", "339", "330", "332"]
    summary: "This lane builds the CI/CD + firmware-OTA pipeline that the cycling/float control program (lanes L1-L4, ADR-0004) must ride on, and closes the guard gaps PR #385's independent validation surfaced. It is pure infra/CI/manifests/tooling — preflight=none, no device action — so it can run W0 in parallel with every other lane, with two exceptions explicitly safety-checked (the ESP32 OTA-password SealedSecret #301 and any prod ArgoCD operation). The headline insight from the replan evidence: #295 proved an OTA can silently DOUBLE cycling (grow_light 4-6 -> 30-44 toggles/day) because NO CI check judged cycle count, and three existing guards FALSE-PASS — service-restart-drift-guard (ci.yml:597 greps the bare word 'service', present in ~every PR body), the firmware 'compile' job (only runs esphome config validation, never a real compile, and floats the esphome version via unpinned pip install), and there is NO preflight binding the generated Grafana dashboard ConfigMaps to their JSON source (the manual-regen invariant #318 depends on). This lane hardens all three, stands up a REAL pinned firmware-compile lane (#303) and the in-pod tooling image (#304) so L2/L3 firmware OTAs (#299/#349/#383) have a reproducible build->bake->OTA path, fixes the prod-promote migrate-rebuild race (#319) and the Actions-PR-creation org blocker (#320), adds a single-source-of-truth guard for the now-triplicated solar site constants (lat 40.167 / lon -105.102 / zenith 90.833 across ingestor/solar.py, firmware/greenhouse_solar.h, db/migrations/186), modernizes the test suite off the destroyed iris-VM stack (#322/#339) so `make test` is meaningful again, brings Actions to Node 24 (#338), and triages the ArgoCD/GitOps cleanup (#336/#317/#318 + verdify-prod-dark rename). Cross-lane: the cycling-KPI deploy preflight this lane builds (NEW) consumes the L1 outcome_kpi cycles_* surface (#371) so future firmware OTAs are regression-preflight-controlled on runtime/cycling, not just band-compliance. Two seed items are downgraded as non-actionable: #332 (Fable) is a close-as-not-planned clarification, #330 is an archived-branch review chore. Covers all 16 lane-scoped issues; #382/#245 storage-infra explicitly NOT taken (separate safety-checked infra lane per the replan deferred list)."
    user_stories:
      - story_id: S1
        as_a: "greenhouse control engineer shipping firmware that changes how often relays fire"
        i_want: "a reproducible, pinned firmware build->config->replay->compile->bake->OTA pipeline in CI and in the agent pod, plus a cycling-KPI preflight that judges every OTA on runtime/cycle-count before it can be promoted"
        so_that: "the L2/L3 anti-chatter OTAs (mister dwell #299, grow-light shoulder #349, opt-in heat_dehum #383) can be built and behaviorally proven the same way every time, and no future OTA can silently double cycling the way #295 did (grow_light 4-6 -> 30-44 toggles/day with nobody gating on cycle count)"
        work_items:
          - issue_ref: "#303"
            title: "Real pinned firmware-compile CI lane + portable esphome paths"
            what: "Replace the validation-only 'firmware' CI job (ci.yml:309-324, which only runs `esphome config greenhouse.yaml`) with a true `firmware-compile` lane that pins the esphome version and produces a build artifact, and make scripts/firmware-esphome-worktree.sh fully host-portable (drop the /srv/greenhouse/.venv fallback as the primary path, resolve esphome from a pinned venv)."
            why: "Every firmware seed change (#299/#349/#383) needs a build->bake->OTA path. Today `pip install esphome` floats the version in BOTH ci.yml:319 and the worktree script, so the compiler that validates a PR may not match the one that builds the OTA — and the CI job never actually compiles (the ESP-IDF toolchain is skipped per its own note), so a config-valid-but-compile-broken firmware can merge. #303 is the P1 enabler for the entire control program (#288)."
            how: "Pin esphome (e.g. esphome==<resolved> in pyproject extras + scripts) as the single version both CI and the agent image install. Add a `firmware-compile` job (or upgrade the existing `firmware` job) that caches the ESP-IDF toolchain and runs `make firmware-check` (the real compile via firmware-esphome-worktree.sh) on PRs touching firmware/greenhouse/** and firmware/lib/**, composing with the existing firmware-replay-diff / no-new-fire-and-forget / band-replay checks. Make firmware-esphome-worktree.sh resolve ESPHOME_BIN from a repo-local pinned venv first, accept SECRETS_SRC override, and not hard-depend on /srv paths."
            acceptance: ["A PR touching firmware/greenhouse.yaml triggers a green `firmware-compile` job that produces a downloadable artifact (not just `esphome config`).", "`grep -rnE 'esphome==' ` resolves to exactly one pinned version referenced by CI, the Makefile/scripts, and the agent image (#304).", "`make firmware-check` runs from a clean checkout with no /srv dependency (SECRETS_SRC overridable).", "Existing firmware-replay-diff, band-replay, and no-new-fire-and-forget checks still pass on a no-op firmware PR."]
