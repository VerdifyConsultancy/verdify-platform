  - lane_id: L6-HA
    lane_name: "HA / Reliability / Infra"
    worktree_branch: lane/ha-reliability
    preflight: infra-preflight
    milestone: "M7 — HA: first-principles resilience"
    depends_on_lanes: []
    owns_paths: ["deploy/k8s/**"]
    covers_issues: ["225", "218", "245", "238", "235", "382", "207", "114"]
    summary: "L6-HA is the Track-A reliability lane: keep the single ESP32-writer datapath and the verdify-db system-of-record durable and survivable, in parallel with (never blocking, never lightly restarting against) the climate-control sprint. Verified repo state: ha-1 (4-tier PriorityClasses, PDBs, serving CPU-limits, ingestor liveness/anti-affinity) and ha-3 (Lease-fence + fast-failover patch + split-brain alarm, all STAGED/preflight-controlled) source has LANDED; the nightly pg_dump CronJob now has netpol-race-retry and is wired into both prod overlays but is UNVERIFIED-green; the descheduler (#234) is authored but wired into NO live overlay/ArgoCD app; WAL archiving is OFF and there is no standby (#218 RED); the prod CNPG cluster (#244) does not yet exist in repo and the cutover (#245) is hard-blocked by the live #382 iSCSI target-cap wedge that today keeps the writer's state on a committed emptyDir TEMP patch. The single highest-leverage unblock is the storage-infra/safety-checked iSCSI cap fix (#382) — until it lands, every writer restart is a 5-10 min outage and #245 cannot proceed. This lane sequences: (Story A) close the active #382 storage wedge + restore durable ingestor state + add the missing out-of-band writer-absent/split-brain alerting and the never-verified backup proof; (Story B) get verdify-db to a real recoverable posture short of the risky cutover — interim WAL archiving + a practiced restore drill; (Story C) the preflight-controlled CNPG HA program (prod cluster build + the riskiest atomic cutover), strictly downstream of #382; (Story D) ship the authored-but-dormant resilience surfaces (descheduler arm, edge HA hooks that DO live in deploy/k8s) and close platform drift. Cross-lane: #238 (traefik/metallb) and #235 (pihole) per their own bodies file in network-infra/cluster-infra, OUTSIDE deploy/k8s — flagged for the cluster-infra owner, not owned here. #114 is STALE (single-env decommissioned dev/stage) and is recommended for closure."
    user_stories:
      - story_id: L6-S1
        as_a: "operator of the single-writer greenhouse datapath"
        i_want: "the live iSCSI storage wedge closed so that any ingestor/DB restart remounts durable state in seconds, with out-of-band alerting that tells me the instant the writer is absent or doubled"
        so_that: "a routine pod restart or node flap can no longer silently strand the sole ESP32 writer for 5-10 minutes on ephemeral state, and a backup I never verified can no longer be a false safety net"
        work_items:
          - issue_ref: "#382"
            title: "Close the iSCSI target-cap wedge: confirm DSM fix, revert ingestor-state emptyDir TEMP patch back to the durable PVC, verify remount"
            what: "Drive the storage-infra/safety-checked DSM iSCSI target-count cap fix to closure, then revert the committed TEMP-ingestor-state-emptydir.patch.yaml (and its kustomization patches: line) so verdify-ingestor-state is the durable synology-iscsi RWO PVC again, and verify the writer pod remounts it cleanly on a preflight-controlled restart."
            why: "Verified live: deploy/k8s/overlays/prod/TEMP-ingestor-state-emptydir.patch.yaml + ingestor-state-pvc.yaml header confirm the writer currently runs on emptyDir (state ephemeral, lost on every restart) because the DSM iSCSI target cap is exhausted (synology-csi-controller-0: 'Number of target reach limit', verified in GitHub issues row 21 and the storage-iscsi-target-cap memory). Issue #382 body: writer was DOWN ~10min and did NOT self-resolve. This is the lane's #1 active reliability defect and the hard blocker for #245."
            how: "Cross-lane: storage-infra/Jason prunes orphaned iSCSI targets / raises the DSM cap and curbs agent-fleet-ci *-workdir iSCSI churn (no repo change). Repo side (this lane): once a fresh synology-iscsi PVC is provably bindable, in a preflight-controlled maintenance window remove the `- path: TEMP-ingestor-state-emptydir.patch.yaml` line from deploy/k8s/overlays/prod/kustomization.yaml + delete the patch file, then `argocd app sync verdify-prod-dark` (preflight-controlled, Recreate rollout of the writer). Confirm MountVolume succeeds and the ingestor re-seeds /srv/verdify/state from DB+device. Keep the emptyDir patch revertible until remount is proven twice."
            acceptance: ["kustomize build deploy/k8s/overlays/prod renders verdify-ingestor with the synology-iscsi PVC volume (no emptyDir) and `kustomize build` is clean", "On a controlled writer restart, MountVolume.MountDevice succeeds (no DeadlineExceeded) and the pod reaches Ready < 90s", "sum(verdify_esp32_writer_estab)==1 within 2 min of the restart; a fresh climate row lands post-restart", "DURABILITY CHECK: writer healthy + state PVC mounted, re-probed >=60 min later with the identical kubectl get pod / estab query"]
            depends_on: []
            preflight: infra-preflight
            effort: M
            wave: W3
            area_labels: ["theme:Infra/Database", "epic:ha-resilience"]
            schema_touch: false
            new_properties: []
          - issue_ref: "#394"
            title: "Out-of-band writer-absent + split-brain alert: ship the VerdifyESP32SplitBrain/NoWriter PrometheusRule live (HA-3.3 #241 wiring)"
            what: "Author and wire into the live verdify-prod overlay a PrometheusRule (or equivalent alert surface) that fires on sum(verdify_esp32_writer_estab)==0 (no live writer) AND on sum>=2 (split-brain), independent of the in-cluster control loop, so a wedged/absent writer pages out-of-band."
            why: "Lane-1 architecture audit (memory: lane1-architecture-audit-2026-06-16) names 'no out-of-band writer-absent alert' as a P0. The split-brain oracle sum(verdify_esp32_writer_estab) is referenced all over the HA-3 runbooks (STAGED-ha3-writer-fence-arm.md, PROD-CNPG-MIGRATION-RUNBOOK.md) and the metric is emitted, but grep found NO live PrometheusRule object in deploy/k8s/** — the alarm exists only as a manual `wget` in runbook prose. The #382 wedge proved the writer can be down ~10min with no automated alert detecting stale telemetry."
            how: "Add deploy/k8s/overlays/prod/writer-estab-alerts.yaml: a monitoring.coreos.com/v1 PrometheusRule with two rules — VerdifyESP32SplitBrain (expr sum(verdify_esp32_writer_estab)>=2 for:1m, critical) and VerdifyESP32NoWriter (expr sum(verdify_esp32_writer_estab)==0 for:5m, critical), labeled to route to the operator. Wire it in overlays/prod/kustomization.yaml resources:. Verify the metric name against the live ingestor exporter. Routes through the existing monitoring stack (cross-lane confirm scrape coverage). No device write, no writer restart — additive observability."
            acceptance: ["kustomize build deploy/k8s/overlays/prod includes the PrometheusRule; `kustomize build` clean", "promtool check rules (or the cluster's rule linter) passes on the rule file", "A synthetic scale-to-0 of the writer in a non-prod context fires VerdifyESP32NoWriter; a synthetic 2-estab fires VerdifyESP32SplitBrain", "Alert visible in the live Prometheus /rules endpoint, re-probed >=60 min"]
            depends_on: []
            preflight: infra-preflight
            effort: M
            wave: W3
            area_labels: ["theme:Reliability", "epic:ha-resilience", "area:observability"]
            schema_touch: false
            new_properties: []
          - issue_ref: "#395"
            title: "Prove the nightly pg_dump backup actually runs green + add a backup-freshness alert (HA-1.8 #233 verification gap)"
            what: "Verify the verdify-db-backup CronJob now produces a non-zero lastSuccessfulTime in live prod (post the netpol-race-retry fix already in backup-cronjob.yaml), and add/confirm a backup-freshness alert so a silently-failing backup pages rather than rotting to an unbounded RPO."
            why: "#218 acceptance and the CNPG runbook both flag 'the nightly pg_dump CronJob has never succeeded (RPO unbounded)'. The repo NOW has the netpol-race retry-the-dump loop (backup-cronjob.yaml lines 98-126, fixes the 0-byte .partial root cause from #273) and a backup-freshness-exporter.yaml exists — but nothing in this lane's evidence shows the CronJob has been re-verified green in prod, and the freshness exporter is not confirmed wired to an alert. An unverified backup is a false safety net before any DB-HA work."
            how: "Read deploy/k8s/components/db-backup/backup-freshness-exporter.yaml; confirm it is in the db-backup kustomization (it is, both prod overlays pull ../../components/db-backup). Trigger a manual `kubectl create job --from=cronjob/verdify-db-backup` in prod (read-only pg_dump, safe), confirm a .dump lands on verdify-db-dumps and the CronJob's lastSuccessfulTime is non-zero. Add a PrometheusRule VerdifyBackupStale (freshness metric > 26h => critical) wired into overlays/prod. No DB write."
            acceptance: ["A manual run of verdify-db-backup completes and writes a verdify-<ts>.dump to the dumps PVC; `kubectl get cronjob verdify-db-backup -o jsonpath='{.status.lastSuccessfulTime}'` is non-empty", "Backup-freshness metric is scraped and a VerdifyBackupStale rule fires on a synthetic stale-mtime", "DURABILITY CHECK: two consecutive scheduled nightly runs land a dump, re-verified on the second night"]
            depends_on: []
            preflight: infra-preflight
            effort: S
            wave: W3
            area_labels: ["theme:Infra/Database", "epic:data-durability", "area:observability"]
            schema_touch: false
            new_properties: []
