  - lane_id: L3-PLANNER
    lane_name: "Planner / GenAI — outcome objective (stop chasing the target, optimize corridor outcomes minus cost)"
    worktree_branch: lane/planner-outcome-objective
    preflight: none
    milestone: "Greenhouse Control Optimization"
    depends_on_lanes: ["L0-SCHEMA", "L2-OBS"]
    owns_paths: ["ingestor/iris_planner.py", "mcp/server.py", "prompts/**", "planner_graph/**", "scripts/gather-plan-context.sh", "scripts/forecast-action-engine.py"]
    covers_issues: ["365", "214", "210", "379"]
    summary: "L3-PLANNER pivots the AI planner (Hermes/iris_planner) from ADR-0003 target-distance optimization to the ADR-0004 floating-corridor outcome objective: grade and reward OUTCOMES inside the served corridor (time-in-band x DLI x DIF x wet/dry-completion) minus a cost/cycling penalty, and stop spending water/energy/wear to make in-corridor air hug the target line. The lane is almost entirely WAVE-0/W1 source-only (no execution safeguard) because the safety boundary is MCP+registry, not Hermes (ADR-0002): the planner can only ever WRITE band_track_fraction=0 and bounded ClimateIntent, so its reward function is observability-grade, not control-grade.  Verified ground truth from owns_paths: (1) The planner reward (planner_score 80%-compliance half) reads compliance_v2_attributable_pct via fn_planner_scorecard, surfaced through gather-plan-context.sh — that is graded target-compliance, NOT the ADR-0004 outcome composite. The composite outcome score does NOT exist yet: daily_summary has cycles_*/dli_final/DIF columns but no composite, no wet/dry-completion axis, no cost penalty. (2) The MCP outcome_kpi() tool emits the raw ADR-0004 components but has NO consumer — the planner reads SQL via gather-plan-context.sh, never this tool (PR #385 finding: measurement surface shipped ahead of #365). (3) The prompt already carries ADR-0004 language partially (iris_planner.py:189-219, 422-423) and band_track_fraction is registry-constrained to planner-write-0 with cfg___band_track_fraction readback — so the prompt/registry copy is half-done, the reward swap is the real gap. (4) #214 is LIVE: iris_planner.py:987 _run_alert_sql STILL shells `docker exec -i verdify-timescaledb psql`, which does not exist in k3s, so every plan_context_failed alert silently fails (caught + warning-logged only) — exactly the #214 silent-failure bug; #211 (its gather_context VM-path blocker) is now CLOSED so the deviation->set_plan path is unblocked. (5) #210 forecast_actions subprocess path is ALREADY FIXED (forecast.py:33-39 B4 comment + _FORECAST_ACTION_ENGINE = REPO_ROOT/scripts, no VM venv); residual is the heartbeat MCP auto-restart subprocess (heartbeat.py:1097) + live verification that forecast_action_log is writing again. (6) #379 MPC is correctly DEFERRED — it must consume #293 solar parity + #371 outcome history + #327 moisture telemetry + #377 float-trial evidence first, or it re-optimizes the rejected target-hugging proxy.  Sequencing discipline: the outcome reward swap (#365) DEPENDS on L2-OBS landing the trustworthy outcome surface (#371: composite score DB fn + cycle-count reconciliation against raw equipment_state — daily_summary cycles_* are demonstrably inflated 30-140x on partial days and would give a false reward). Schema-first holds: any new planner-visible KPI/score property lands as a schema-only change with pydantic + drift-guard before the planner consumes it. No firmware, no OTA, no prod-migration in this lane (those are L0/L1/firmware lanes); the planner reads the surfaces those lanes produce."
    user_stories:
      - story_id: L3-S1
        as_a: "control system whose only authority is bounded tunables and ClimateIntent (ADR-0002)"
        i_want: "my optimization objective to reward crop OUTCOMES inside the served corridor minus actuator cost/cycling, not distance to the target line"
        so_that: "the AI stops spending water, energy, and relay wear to make in-corridor air hug the target curve — the single largest source of the cycling the operator is trying to eliminate"
        work_items:
          - issue_ref: "#365"
            title: "Swap the planner reward + prompt + MCP/registry guidance from target-compliance to the ADR-0004 outcome composite"
            what: "Re-point the planner's optimization signal from compliance_v2_attributable_pct (graded target-compliance) to the ADR-0004 composite outcome score (time-in-band x DLI x DIF x wet/dry-completion minus cost/cycling), surface that composite to the planner via gather-plan-context.sh, and rewrite the iris_planner prompt + MCP scorecard()/outcome_kpi() docstrings + tunable_registry guidance so target-reference deviation is explicitly DIAGNOSTIC-ONLY. Do NOT apply migration 147 as-is (it implements the superseded reward swap to compliance_v2_attributable_pct)."
