name: CI

# ─── Branch model (Jason, 2026-06-10): `main` is the single canonical branch ──
# The 2026-05-31 `live/platform-main` deploy-branch split is RETIRED. All work
# lands on `main` via PRs; these gates fire on every push/PR to `main`. The
# issue-#22 era dual-branch trigger was trimmed when the drift was reconciled
# (main and live/platform-main merged both ways; ArgoCD + all workflows now
# point at main).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check ingestor/ api/ mcp/ scripts/*.py tests/ verdify_schemas/
      - name: Ruff format check
        run: ruff format --check ingestor/ api/ mcp/ scripts/*.py tests/ verdify_schemas/

  site-generated-guards:
    name: Site Generated Route Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify generated route alias and freshness guards
        run: |
          set -euo pipefail
          VAULT="$(mktemp -d)"
          mkdir -p \
            "$VAULT/data/forecast" \
            "$VAULT/plans" \
            "$VAULT/data/plans" \
            "$VAULT/evidence" \
            "$VAULT/data" \
            "$VAULT/reference" \
            "$VAULT/static/data/hourly-performance"
          NOW="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Denver")).isoformat(timespec="seconds"))
          PY
          )"
          cat > "$VAULT/data/forecast/index.md" <<EOF
          ---
          title: Greenhouse Weather Forecast
          tags: [forecast, auto-generated]
          last_updated: '$NOW'
          ---

          # Greenhouse Weather Forecast

          *Auto-generated fixture.*
          EOF
          cat > "$VAULT/reference/ai-tunables.md" <<EOF
          ---
          title: Planner Contract and AI Tunables
          tags: [reference, auto-generated]
          date: '$NOW'
          ---

          # Planner Contract and AI Tunables

          auto-generated by scripts/generate-ai-tunables-page.py.
          EOF
          cat > "$VAULT/plans/2026-05-10.md" <<'EOF'
          ---
          title: May 10, 2026
          tags: [daily-plan]
          ---

          # May 10, 2026

          *Auto-generated fixture.*
          EOF
          cat > "$VAULT/plans/index.md" <<'EOF'
          ---
          title: Planning Archive Alias
          tags: [plans, auto-generated]
          ---

          # Planning Archive Alias

          *Auto-generated fixture.*

          Canonical generated archive: [/data/plans/](/data/plans/).
          EOF
          cat > "$VAULT/data/plans/index.md" <<'EOF'
          ---
          title: AI Greenhouse Planning Archive
          tags: [plans, auto-generated]
          ---

          # AI Greenhouse Planning Archive

          *Auto-generated fixture.*

          | Date | Plans |
          |------|-------|
          | [2026-05-10](/plans/2026-05-10) | 1 |
          EOF
          cat > "$VAULT/evidence/baseline-vs-iris.md" <<'EOF'
          ---
          title: Baseline vs Iris
          tags: [evidence, auto-generated]
          ---

          # Baseline vs Iris

          *Auto-generated fixture.*
          EOF
          cp "$VAULT/evidence/baseline-vs-iris.md" "$VAULT/data/baseline-vs-iris.md"
          cat > "$VAULT/data/hourly-performance.md" <<'EOF'
          ---
          title: Hourly Performance Dataset
          tags: [data, auto-generated]
          ---

          # Hourly Performance Dataset

          *Auto-generated fixture.*

          Generated by `scripts/export-hourly-performance-dataset.py`.
          EOF
          cat > "$VAULT/static/data/hourly-performance/latest.csv" <<'EOF'
          hour,heating_minutes
          2026-05-10T00:00:00-06:00,0
          EOF
          cat > "$VAULT/static/data/hourly-performance/manifest.json" <<EOF
          {
            "generated_at": "$NOW",
            "current_archive": {
              "url": "/static/data/hourly-performance/latest.csv",
              "rows": 24
            },
            "latest": {
              "url": "/static/data/hourly-performance/latest.csv"
            }
          }
          EOF
          cat > "$VAULT/reference/ai-tunables.md" <<EOF
          ---
          title: Planner Contract and AI Tunables
          tags: [intelligence, planning, tunables, control]
          date: '$NOW'
          type: reference
          ---

          # Planner Contract and AI Tunables

          *Auto-generated fixture.*

          [//]: # (auto-generated by scripts/generate-ai-tunables-page.py)
          EOF

          python scripts/site-doctor.py \
            --vault-root "$VAULT" \
            --skip-grafana \
            --skip-public \
            --skip-site-container \
            --skip-launch-lint

          cat >> "$VAULT/plans/index.md" <<'EOF'

          | Date | Plans |
          |------|-------|
          | [2026-05-10](/plans/2026-05-10) | 1 |
          EOF
          if python scripts/site-doctor.py \
            --vault-root "$VAULT" \
            --skip-grafana \
            --skip-public \
            --skip-site-container \
            --skip-launch-lint; then
            echo "::error::site-doctor failed to catch generated route drift"
            exit 1
          fi

          cat > "$VAULT/plans/index.md" <<'EOF'
          ---
          title: Planning Archive Alias
          tags: [plans, auto-generated]
          ---

          # Planning Archive Alias

          *Auto-generated fixture.*

          Canonical generated archive: [/data/plans/](/data/plans/).
          EOF
          python - <<'PY' "$VAULT/data/forecast/index.md"
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          path.write_text(
              "\n".join(
                  "last_updated: '2026-01-01T00:00:00-07:00'"
                  if line.startswith("last_updated: ")
                  else line
                  for line in text.splitlines()
              )
              + "\n"
          )
          PY
          if python scripts/site-doctor.py \
            --vault-root "$VAULT" \
            --skip-grafana \
            --skip-public \
            --skip-site-container \
            --skip-launch-lint; then
            echo "::error::site-doctor failed to catch generated forecast freshness drift"
            exit 1
          fi

  schemas:
    name: Pydantic Schemas + Drift Guards
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: verdify
          POSTGRES_PASSWORD: verdify
          POSTGRES_DB: verdify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verdify -d verdify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: verdify
      POSTGRES_PASSWORD: verdify
      POSTGRES_DB: verdify
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: verdify
      PGPASSWORD: verdify
      PGDATABASE: verdify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system deps (psql client + postgres extensions)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Python deps
        run: pip install "pydantic>=2.8" pytest pyyaml
      - name: Apply migrations (and schema.sql if present)
        run: |
          # Prefer schema.sql (full schema snapshot) over replaying every migration.
          # Falls back to applying every migration in filename order.
          if [ -f db/schema.sql ]; then
            # schema.sql may reference TimescaleDB functions; ignore non-fatal errors
            psql -v ON_ERROR_STOP=0 -f db/schema.sql > /tmp/schema.log 2>&1 || true
            tail -50 /tmp/schema.log
          fi
          for f in $(ls db/migrations/*.sql 2>/dev/null | sort); do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=0 -f "$f" > /tmp/mig.log 2>&1 || true
          done
      - name: Schema unit tests
        run: pytest verdify_schemas/tests/ -v --ignore=verdify_schemas/tests/test_drift_guards.py --ignore=verdify_schemas/tests/test_vault_writers.py --ignore=verdify_schemas/tests/test_views.py
      - name: Drift guards (against CI Postgres)
        run: pytest verdify_schemas/tests/test_drift_guards.py -v
      - name: Database smoke tests (against CI Postgres)
        run: VERDIFY_DB_QUERY_MODE=direct pytest tests/test_02_database.py::TestSchemaIntegrity -q

  device-write-gate:
    name: Device-Write Safety Gate (single-writer interlock)
    runs-on: ubuntu-latest
    # Layer-3 of the #71 single-writer interlock. The ingestor must NEVER drive
    # the physical ESP32 unless VERDIFY_DEVICE_WRITE_ENABLED == '1' (default-deny);
    # this lets a k3s STAGING ingestor exist with zero risk to the live greenhouse.
    # tests/test_device_write_gate.py mocks the aioesphomeapi client and asserts
    # ZERO device writes when the gate is off. PR-blocking: a regression that
    # re-opens push_to_esp32 / push_occupancy_to_esp32 with the gate off fails
    # here. No Postgres / no device contact — every write path is mocked.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python deps
        run: pip install "pydantic>=2.8" pytest pyyaml
      - name: Device-write gate tests (mocked client, default-deny)
        run: pytest tests/test_device_write_gate.py -v

  firmware:
    name: Firmware Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome
      - name: Validate firmware config
        run: |
          cp firmware/secrets.example.yaml firmware/secrets.yaml
          cd firmware
          esphome config greenhouse.yaml
        # Note: full compile requires ESP-IDF toolchain (~1.5GB)
        # Config validation catches YAML errors and missing references

  # ─── Phase-0 stabilization gates ────────────────────────────────────────
  # Background: the plan at
  #   .claude-agents/iris-dev/plans/yo-iris-dev-you-help-humming-stonebraker.md
  # calls for a test-harness + CI net landing BEFORE the next firmware change,
  # so that the sprint-15 gate / sprint-15.1 interlock / plan-vs-tunable gap
  # class of regression is caught pre-merge. These jobs implement that net.

  firmware-logic:
    name: Firmware Logic Tests + Replay + Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make
      - name: Native firmware unit tests
        run: |
          cd firmware
          g++ -std=c++17 -I lib -o test/test_greenhouse test/test_greenhouse_logic.cpp
          ./test/test_greenhouse
      - name: Unpack replay corpus
        run: |
          test -f firmware/test/data/replay_overrides.csv \
            || gunzip -k firmware/test/data/replay_overrides.csv.gz
      - name: Replay corpus freshness
        # The corpus is the ONLY thing the firmware replay/invariant gates validate
        # against; a stale corpus means new seasonal regimes + any band/firmware
        # change after its last row are untested. Visible WARNING past 21 days;
        # hard FAIL past 120 days (refresh via `make replay-corpus-refresh`).
        run: |
          python3 - <<'PY'
          import datetime, gzip, sys
          p = "firmware/test/data/replay_overrides.csv.gz"
          last = None
          with gzip.open(p, "rt") as f:
              next(f)  # header
              for line in f:
                  if line.strip():
                      last = line
          ts = last.split("\t")[0][:10]
          age = (datetime.date.today() - datetime.date.fromisoformat(ts)).days
          print(f"replay corpus newest row: {ts} ({age} days old)")
          WARN, FAIL = 21, 120
          if age > FAIL:
              print(f"::error::replay corpus is {age}d old (> {FAIL}d) — run `make replay-corpus-refresh`")
              sys.exit(1)
          if age > WARN:
              print(f"::warning::replay corpus is {age}d old (> {WARN}d) — refresh soon via `make replay-corpus-refresh`")
          PY
      - name: Replay (OBS-1e evaluate_overrides validation)
        run: |
          cd firmware
          g++ -std=c++17 -O2 -I lib -o test/replay_overrides test/replay_overrides.cpp
          ./test/replay_overrides test/data/replay_overrides.csv | tail -30
      - name: Replay invariants (15 bulletproof gates)
        # Binary exits 2 with a clear message when the corpus predates the
        # Phase-0 schema extension — that's expected until the first corpus
        # refresh with the new schema. Non-zero count < 10 => real failures.
        run: |
          cd firmware
          g++ -std=c++17 -O2 -I lib -o test/replay_invariants test/replay_invariants.cpp
          set +e
          ./test/replay_invariants test/data/replay_overrides.csv
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::replay corpus predates Phase-0 schema extension; skipping invariants this run"
            exit 0
          fi
          exit $rc

  logic-tests:
    name: Logic & contract tests (no live stack)
    runs-on: ubuntu-latest
    # Audit L1: CI previously ran only 3 narrow tests/ selections; the bulk of the
    # pure-logic / static-contract suite (twin src parity, planner routing, anchor
    # service sync, forecast engine, writer-lease fence, etc.) never gated a PR.
    # This job runs the DB-free / device-free / network-free tests/ set with the
    # full project deps installed (so local-import behaviour matches). It has NO
    # Postgres service on purpose — these tests must not depend on a live stack.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project + test deps
        # No editable install (pyproject has no build-system); pytest resolves the
        # local packages from the repo root, like the other CI jobs. Pull the dep
        # lists straight from pyproject so this never drifts.
        run: |
          python - <<'PY' > /tmp/reqs.txt
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          reqs = list(d["project"]["dependencies"])
          opt = d["project"].get("optional-dependencies", {})
          for grp in ("planner", "api"):
              reqs += opt.get(grp, [])
          print("\n".join(reqs))
          PY
          pip install -r /tmp/reqs.txt paho-mqtt pytest pytest-asyncio
      - name: Run pure-logic / contract tests
        run: |
          pytest -q \
            tests/test_10_planner_routing.py \
            tests/test_11_planner_milestones.py \
            tests/test_13_grafana_band_traceability.py \
            tests/test_14_shadow_mode.py \
            tests/test_14_site_doctor.py \
            tests/test_17_planner_health_surface.py \
            tests/test_18_twin_divergence_dashboard.py \
            tests/test_19_firmware_twin_shadow_src_sync.py \
            tests/test_anchor_service_sync.py \
            tests/test_climate_intent_replay_evaluator.py \
            tests/test_compliance_feasibility_classifier.py \
            tests/test_firmware_crop_agnostic_guard.py \
            tests/test_forecast_action_engine_path.py \
            tests/test_g5_dualwrite_validation.py \
            tests/test_generate_daily_plan.py \
            tests/test_mqtt_fanout.py \
            tests/test_planner_memory_ingest.py \
            tests/test_psql_verdify_backend.py \
            tests/test_publish_site_content_guard.py \
            tests/test_site_content_refresh.py \
            tests/test_slack_config.py \
            tests/test_slack_ops.py \
            tests/test_soil_dryout_alert.py \
            tests/test_solar_band_anchors.py \
            tests/test_tempest_sync.py \
            tests/test_writer_lease_fence.py

  firmware-replay-diff:
    name: Firmware Replay Diff (behavioral regression gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for merge-base worktree
      - name: Install g++
        run: sudo apt-get install -y g++
      - name: Unpack replay corpus
        run: |
          test -f firmware/test/data/replay_overrides.csv \
            || gunzip -k firmware/test/data/replay_overrides.csv.gz
      - name: Run replay diff (PR HEAD vs merge-base)
        # THRESHOLD_PCT=0 default => any mode/relay divergence blocks the PR.
        # Per CLAUDE.md rule 8: intentional divergence (e.g. Phase 2 dwell-gate
        # rollout, PR-A fog threshold lowering) requires coordinator approval
        # + explicit threshold override. Override marker must appear in PR body
        # as `REPLAY_DIFF_THRESHOLD_PCT: <N>` on its own line; CI parses it.
        run: |
          set +e
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "No merge-base change; skipping replay diff"
            exit 0
          fi
          # 2026-07-11 audit: the old explicit three-file list let PR #450's
          # entire irrigation/fencing rearchitecture (irrigation_policy.h,
          # heap_diagnostics.h — new headers) bypass rule 8 unseen. Trigger on
          # ANY firmware logic header or greenhouse yaml instead.
          CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            'firmware/lib/*.h' \
            'firmware/lib/*.cpp' \
            firmware/greenhouse/controls.yaml \
            firmware/greenhouse/tunables.yaml \
            firmware/greenhouse/globals.yaml)
          if [ -z "$CHANGED" ]; then
            echo "No firmware-logic diff in PR; skipping replay diff"
            exit 0
          fi
          # Parse PR body for threshold override
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          OVERRIDE=$(printf '%s' "$PR_BODY" | grep -oE '^REPLAY_DIFF_THRESHOLD_PCT:[[:space:]]*[0-9]+' | awk -F: '{gsub(/[[:space:]]/,"",$2); print $2}' | head -1)
          THRESHOLD_PCT="${OVERRIDE:-${THRESHOLD_PCT:-0}}"
          echo "Using THRESHOLD_PCT=$THRESHOLD_PCT"
          THRESHOLD_PCT="$THRESHOLD_PCT" bash scripts/firmware-replay-diff.sh "$BASE" HEAD
      - name: Band-curve behavioral diff (blocking gate)
        # The stock replay above feeds the band from recorded sp_* columns and only
        # triggers on logic.h/types.h/controls.yaml — so a change to the band CURVE
        # itself (greenhouse_solar.h band_value_at_phase) shows ZERO divergence there
        # (the exact gap that let the lumpy/wet-night curve ship blind, per CLAUDE.md
        # verification order step 4). This DERIVES the band on-chip-style from
        # band_value_at_phase at each row's solar phase and diffs the real behavior.
        # BLOCKING when greenhouse_solar.h changes: default THRESHOLD_PCT=0 (any
        # divergence fails). An intentional band-curve change must carry
        # `BAND_REPLAY_THRESHOLD_PCT: <N>` on its own line in the PR body (reviewed,
        # mirroring the rule-8 REPLAY_DIFF_THRESHOLD_PCT override).
        run: |
          set +e
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "No merge-base change; skipping band replay"; exit 0
          fi
          # Band-DERIVE behavior depends on the curve (greenhouse_solar.h) AND on the
          # control-band shaping that consumes it: apply_band_track_pinch + the
          # escalation/ladder logic live in greenhouse_logic.h / greenhouse_types.h /
          # controls.yaml. The stock corpus-fed replay is blind to all of these, so the
          # band-DERIVE gate must fire when ANY of them change (the wet-night-shipped-blind trap).
          CHANGED=$(git diff --name-only "$BASE" HEAD -- firmware/lib/greenhouse_solar.h firmware/lib/greenhouse_logic.h firmware/lib/greenhouse_types.h firmware/greenhouse/controls.yaml)
          if [ -z "$CHANGED" ]; then echo "No band-curve / control-band diff (solar.h, logic.h, types.h, controls.yaml) in PR; skipping band replay"; exit 0; fi
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          OVERRIDE=$(printf '%s' "$PR_BODY" | grep -oE '^BAND_REPLAY_THRESHOLD_PCT:[[:space:]]*[0-9]+' | awk -F: '{gsub(/[[:space:]]/,"",$2); print $2}' | head -1)
          THRESHOLD_PCT="${OVERRIDE:-0}"
          echo "Band-curve gate: THRESHOLD_PCT=$THRESHOLD_PCT (setpoints DERIVED from band_value_at_phase)"
          REPLAY_EMIT_BAND_DERIVE=1 THRESHOLD_PCT="$THRESHOLD_PCT" bash scripts/firmware-replay-diff.sh "$BASE" HEAD
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::band-curve behavioral divergence exceeds ${THRESHOLD_PCT}%. If intentional, add 'BAND_REPLAY_THRESHOLD_PCT: <N>' to the PR body and have it reviewed."
          fi
          exit $rc
      - name: Twin shadow vendored source must compile
        # 2026-07-11 audit: the vendored twin src was missing greenhouse_solar.h
        # for weeks — its initContainer g++ step could never have succeeded, and
        # the byte-sync test passed because its PAIRS list was hardcoded. Compile
        # the vendored copy exactly the way the twin initContainer does.
        run: |
          g++ -std=c++17 -fsyntax-only \
            -Ideploy/k8s/components/firmware-twin/src \
            deploy/k8s/components/firmware-twin/src/replay_emit.cpp
          echo "twin vendored source compiles"

  no-new-fire-and-forget:
    name: No new tunables without readback
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for new tunables without cfg_* readback
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          # tunables.yaml number entities are `- platform: template` then `id: num_<base>`
          # (the `id:` is NOT a sequence item, so the old `/^\+ - id:/` awk matched nothing
          # and this gate passed vacuously — freeze rule 6 was unenforced). Extract the
          # added `id: num_<base>` lines and reduce to the <base> name the readback uses.
          # 2026-07-11 audit: sw_* switch entities bypassed this gate entirely
          # (rule 6 covered numerics only), and a bare `id(<base>)` reference
          # anywhere in sensors.yaml false-passed as a readback. Cover both
          # entity kinds and require a literal `id: cfg_<base>` template sensor.
          NEW_IDS=$(git diff "$BASE" HEAD -- firmware/greenhouse/tunables.yaml 2>/dev/null \
            | grep -oE '^\+[[:space:]]+id:[[:space:]]+(num|sw)_[a-z0-9_]+' \
            | sed -E 's/.*id:[[:space:]]+(num|sw)_//' | sort -u || true)
          if [ -z "$NEW_IDS" ]; then
            echo "No new tunable entities in PR"
            exit 0
          fi
          echo "New tunable IDs in PR: $NEW_IDS"
          MISSING=""
          for id in $NEW_IDS; do
            if ! grep -qE "id: cfg_(sw_)?${id}\b" firmware/greenhouse/sensors.yaml 2>/dev/null; then
              MISSING="$MISSING $id"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::New tunables without cfg_* readback:$MISSING"
            echo "Per plan Appendix B freeze rule, every new tunable needs a readback."
            exit 1
          fi
          echo "All new tunables have readback coverage"

  service-restart-drift-guard:
    name: Service restart hygiene (schema → runtime)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flag schema changes without restart documentation
        # Observed need from 2026-04-21 MCP staleness incident — MCP ran
        # 40+ hours with stale schema because nobody restarted it post-merge.
        # Forces PR authors to document which services bounce post-merge.
        # Reads PR body via jq from $GITHUB_EVENT_PATH (not shell-interpolated
        # ${{ github.event.pull_request.body }}) so arbitrary PR-body content
        # including backticks/parens/quotes doesn't break the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base HEAD "origin/${BASE_REF}")
          SCHEMA_CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            'verdify_schemas/**' 'ingestor/entity_map.py' 'mcp/server.py' 2>/dev/null | head -1)
          if [ -z "$SCHEMA_CHANGED" ]; then
            echo "No schema files changed"
            exit 0
          fi
          echo "Schema-touching files changed: $SCHEMA_CHANGED"
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          if ! printf '%s' "$PR_BODY" | grep -iqE '(restart|bounce|service|systemctl)'; then
            echo "::error::PR touches schema/entity_map/mcp but PR body doesn't mention service restart."
            echo "Add a 'Post-merge restart' line listing which services need to bounce (e.g. verdify-mcp, verdify-ingestor)."
            exit 1
          fi
          echo "PR body documents service restart"

  migration-rollback-safety:
    name: Migration rollback-safety guard (no self-committing wrap)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Codifies the 2026-05-30 live-commit incident (#23): a SELF-committing
    # migration (its own top-level COMMIT, or a commit-forcing statement like
    # CREATE INDEX CONCURRENTLY / VACUUM / ALTER SYSTEM) chained under an outer
    # BEGIN..ROLLBACK dry-run defeats the rollback and commits to the LIVE DB.
    # scripts/check_migration_rollback_safety.py classifies each db/migrations
    # file (stripping comments / string literals / dollar-quoted bodies so a
    # CONCURRENTLY mentioned only in a comment never trips it). This job flags
    # any self-committing migration touched in the PR so a reviewer confirms the
    # apply/rollback tooling is NOT blindly wrapping it. No DB / no device.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Flag self-committing migrations touched in this PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD "origin/${BASE_REF}")
          # Only the real numbered set under db/migrations/ — the git pathspec
          # `db/migrations/*.sql` matches RECURSIVELY, so we explicitly exclude the
          # db/migrations/fixtures/ tree (the deliberately self-committing guard
          # fixtures, which are NOT applied migrations).
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
            -- 'db/migrations/*.sql' ':(exclude)db/migrations/fixtures/*' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "No applied db/migrations/*.sql changed in this PR; nothing to guard."
            exit 0
          fi
          echo "Changed migrations:"
          echo "$CHANGED"
          # shellcheck disable=SC2086
          python scripts/check_migration_rollback_safety.py --check $CHANGED
      - name: Guard self-test (bad fixture must fail, 151-155 must pass)
        run: |
          set -euo pipefail
          if python scripts/check_migration_rollback_safety.py --check db/migrations/fixtures/_self_committing_bad.sql; then
            echo "::error::guard FAILED to reject the self-committing fixture"
            exit 1
          fi
          python scripts/check_migration_rollback_safety.py --check \
            db/migrations/151-backfill-suppressed-sensor-offline-resolved-at.sql \
            db/migrations/152-kwh-coalesce-sanity-gate.sql \
            db/migrations/153-pipeline-health-weather-station-dark-sources.sql \
            db/migrations/154-consolidate-oscillation-views.sql \
            db/migrations/155-twin-observability-tables.sql
          echo "guard self-test passed"
      - name: Guard unit tests
        run: |
          pip install pytest
          pytest tests/test_migration_rollback_safety.py -q
