name: Promote Diff Guard

# #82 — prod-promotion safety gate (single-environment model, 2026-06-16).
#
# Promotion to prod is a deliberate, human-gated digest copy: a prod-promote PR
# must ONLY advance deploy/k8s/overlays/prod image digest lines — it must not
# change manifests, replica counts, the device-write interlock ConfigMap,
# NetworkPolicies, or anything else in the prod render. This guard asserts that
# change-surface containment, which is the device-write-safety half of the
# contract (a digest bump cannot smuggle in a posture change).
#
# The dev/staging environments are DECOMMISSIONED, so the former "advance only
# to the digest dev is currently running" equality check is gone (there is no
# dev overlay to compare against). Digest integrity is instead anchored at the
# SOURCE: prod-promote.yml computes the target digests by resolving the
# published `:branch-main` image from GHCR (imagetools), so a promote PR carries
# real, published @sha256 digests; a fabricated digest would simply fail to pull
# on the manual prod sync. A human still reviews + merges, then runs the gated
# `argocd app sync verdify-prod-dark`.
#
# It is intentionally a SEPARATE workflow from ci.yml so it can be wired as its
# own status check on prod-promote PRs if desired.

on:
  # NOTE: a `paths:` filter and `types: [labeled]` do NOT compose as an OR on a
  # single pull_request trigger — GitHub ANDs them, so a label event with no
  # overlays/prod path change would be filtered out. To honour the contract
  # ("fires on PRs labeled prod-promote OR touching overlays/prod") we trigger
  # broadly on the relevant activity types and do the OR gating in the job `if:`
  # below (label present OR prod-overlay files changed).
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Decide whether this PR is a prod promotion
    runs-on: ubuntu-latest
    outputs:
      is_promote: ${{ steps.gate.outputs.is_promote }}
    steps:
      - name: Checkout PR head (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — label `prod-promote` OR overlays/prod changed
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
          # Space-joined label-name list, e.g. "prod-promote needs-review".
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          is_promote=false

          # (a) explicit label
          for l in $PR_LABELS; do
            if [ "$l" = "prod-promote" ]; then
              is_promote=true
            fi
          done

          # (b) PR touches the prod overlay
          BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          if git diff --name-only "$BASE" HEAD -- 'deploy/k8s/overlays/prod/' | grep -q .; then
            is_promote=true
          fi

          echo "is_promote=${is_promote}" >> "$GITHUB_OUTPUT"
          echo "Promotion gate: is_promote=${is_promote} (labels='${PR_LABELS}')"

  promote-diff-guard:
    name: Assert prod promote changes only prod image digests
    needs: detect
    if: needs.detect.outputs.is_promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kustomize (pinned v5.4.3)
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=v5.4.3
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Change-surface containment (prod overlay = digests only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD "origin/${BASE_REF}")"

          # 0) Is this PR ACTUALLY a digest promotion? A promotion is defined by a
          #    changed `digest:` pin line in prod/kustomization.yaml. The
          #    change-surface containment in step 1 (prod overlay = kustomization.yaml
          #    only) is the constraint on a PROMOTION; it must NOT wedge a normal
          #    reviewed STRUCTURAL PR that adds new prod-overlay files (e.g. wiring in
          #    the two-tier-traefik `traefik/` dir via a `- traefik` resource entry,
          #    refs #199) and changes NO digest. Such a PR is not a promotion, so the
          #    digits-only surface check below does not apply to it; the digest-
          #    EQUALITY enforcement in the final step still runs and remains the real
          #    promotion-safety gate (a structural PR that changes no pin trivially
          #    passes it). This mirrors the documented intent in step 2's comment.
          IS_DIGEST_PROMOTE="$(git diff "$BASE" HEAD -- deploy/k8s/overlays/prod/kustomization.yaml \
            | grep -E '^[+-][[:space:]]*digest:[[:space:]]*sha256:[0-9a-f]{64}[[:space:]]*$' \
            || true)"
          if [ -z "$IS_DIGEST_PROMOTE" ]; then
            echo "Not a digest promotion (no changed digest: pin) — structural/reviewed PR."
            echo "Change-surface containment is for promotions only; skipping it. Digest-equality still enforced below."
            exit 0
          fi

          # 1) The ONLY file a prod-promote PR may touch under the prod overlay
          #    is kustomization.yaml (where the digests live). Anything else
          #    under overlays/prod/ is a non-promotion change and must go through
          #    a normal reviewed PR, not this gate.
          PROD_CHANGED="$(git diff --name-only "$BASE" HEAD -- 'deploy/k8s/overlays/prod/' || true)"
          BAD="$(printf '%s\n' "$PROD_CHANGED" | grep -v '^deploy/k8s/overlays/prod/kustomization.yaml$' | grep -v '^$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::prod-promote PR changed prod-overlay files other than kustomization.yaml:"
            printf '  %s\n' $BAD
            exit 1
          fi

          # 2) Within prod/kustomization.yaml, the ONLY changed lines may be
          #    `digest:` lines (the image pins), comment lines, or a kustomize
          #    `components:`/`resources:` LIST ENTRY (a `- ../../...` path).
          #    Pins are the promotion payload; comments are inert documentation
          #    (kustomize never renders them) and a pin change legitimately carries
          #    an updated rationale comment. A component/resource list-entry add is
          #    a STRUCTURAL wiring change (e.g. opting prod into the M3.3 db-backup
          #    component, refs #84/#28/#130) — it is NOT a digest promotion, so it
          #    cannot land via a `prod-promote` PR, but a normal reviewed
          #    structural PR that happens to touch overlays/prod must not be wedged
          #    by this guard's auto-trip. The digest-EQUALITY enforcement below is
          #    unchanged and remains the real promotion-safety gate; this allowance
          #    is change-SURFACE only. Any OTHER added/removed line (a patch, a
          #    replica count, the device-write interlock, a NetworkPolicy) is still
          #    rejected as an illegitimate promotion edit.
          NON_DIGEST="$(git diff "$BASE" HEAD -- deploy/k8s/overlays/prod/kustomization.yaml \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]]*digest:[[:space:]]*sha256:[0-9a-f]{64}[[:space:]]*$' \
            | grep -vE '^[+-][[:space:]]*#' \
            | grep -vE '^[+-][[:space:]]*-[[:space:]]+\.\./.*$' \
            | grep -vE '^[+-][[:space:]]*$' \
            || true)"
          if [ -n "$NON_DIGEST" ]; then
            echo "::error::prod/kustomization.yaml changed non-digest, non-comment, non-component-ref lines; a promote PR may only advance digests:"
            printf '%s\n' "$NON_DIGEST"
            exit 1
          fi
          echo "Change-surface OK: only prod digest/comment/component-ref lines changed."
