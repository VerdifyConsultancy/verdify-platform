name: Promote Diff Guard

# #82 — prod-promotion safety gate.
#
# Promotion to prod is a deliberate, human-gated digest copy: a prod-promote PR
# must ONLY advance deploy/k8s/overlays/prod image digests, and for any image
# DEV actually carries it must advance ONLY to the digest CURRENTLY pinned in
# deploy/k8s/overlays/dev (which the in-repo digest write-back keeps current
# — locked decision; staging is RETIRED, dev is the proving environment). It
# must not change manifests, replica counts, the device-write interlock,
# NetworkPolicies, or anything else, and it must not invent a digest that dev
# has never run.
#
# This guard asserts exactly that. It is intentionally a SEPARATE workflow from
# ci.yml so it can be wired as its own required status check on prod-promote PRs.
#
# DEV-TRACKED vs PROD-ONLY (the scope of the equality check): some workloads
# are prod-only Components by design and are intentionally ABSENT from
# overlays/dev — e.g. setpoint-server (#118, the 2nd device writer). Dev never
# runs them and there is no dev digest to match; pinning THEIR prod digests is
# a dev-independent write-back, not a promotion. The equality check therefore
# applies ONLY to images the dev overlay actually carries (derived from the
# dev render, not a hand-maintained allowlist). STRICT digest-equality is
# preserved for those.
#
# A no-op is always allowed: prod is human-gated and legitimately LAGS dev
# (dev auto-bumps on every green build), so a PR that does not change a given
# dev-tracked prod pin never trips the guard — only a pin this PR *advances*
# is required to land on the current dev digest.
#
# SCOPE / TODO: the enforcement below is per-image digest-equality (scoped to the
# dev-tracked set) + change-surface containment. A richer future version could
# additionally diff the fully-rendered prod overlay against a synthetic
# "dev-image-set applied to prod overlay" render to prove byte-identical
# non-image manifests; that is left as a TODO and not required for Sprint 1.

on:
  # NOTE: a `paths:` filter and `types: [labeled]` do NOT compose as an OR on a
  # single pull_request trigger — GitHub ANDs them, so a label event with no
  # overlays/prod path change would be filtered out. To honour the contract
  # ("fires on PRs labeled prod-promote OR touching overlays/prod") we trigger
  # broadly on the relevant activity types and do the OR gating in the job `if:`
  # below (label present OR prod-overlay files changed).
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Decide whether this PR is a prod promotion
    runs-on: ubuntu-latest
    outputs:
      is_promote: ${{ steps.gate.outputs.is_promote }}
    steps:
      - name: Checkout PR head (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — label `prod-promote` OR overlays/prod changed
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
          # Space-joined label-name list, e.g. "prod-promote needs-review".
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          is_promote=false

          # (a) explicit label
          for l in $PR_LABELS; do
            if [ "$l" = "prod-promote" ]; then
              is_promote=true
            fi
          done

          # (b) PR touches the prod overlay
          BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          if git diff --name-only "$BASE" HEAD -- 'deploy/k8s/overlays/prod/' | grep -q .; then
            is_promote=true
          fi

          echo "is_promote=${is_promote}" >> "$GITHUB_OUTPUT"
          echo "Promotion gate: is_promote=${is_promote} (labels='${PR_LABELS}')"

  promote-diff-guard:
    name: Assert prod promote only advances prod digests to dev digests
    needs: detect
    if: needs.detect.outputs.is_promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kustomize (pinned v5.4.3)
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=v5.4.3
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Change-surface containment (prod overlay = digests only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD "origin/${BASE_REF}")"

          # 0) Is this PR ACTUALLY a digest promotion? A promotion is defined by a
          #    changed `digest:` pin line in prod/kustomization.yaml. The
          #    change-surface containment in step 1 (prod overlay = kustomization.yaml
          #    only) is the constraint on a PROMOTION; it must NOT wedge a normal
          #    reviewed STRUCTURAL PR that adds new prod-overlay files (e.g. wiring in
          #    the two-tier-traefik `traefik/` dir via a `- traefik` resource entry,
          #    refs #199) and changes NO digest. Such a PR is not a promotion, so the
          #    digits-only surface check below does not apply to it; the digest-
          #    EQUALITY enforcement in the final step still runs and remains the real
          #    promotion-safety gate (a structural PR that changes no pin trivially
          #    passes it). This mirrors the documented intent in step 2's comment.
          IS_DIGEST_PROMOTE="$(git diff "$BASE" HEAD -- deploy/k8s/overlays/prod/kustomization.yaml \
            | grep -E '^[+-][[:space:]]*digest:[[:space:]]*sha256:[0-9a-f]{64}[[:space:]]*$' \
            || true)"
          if [ -z "$IS_DIGEST_PROMOTE" ]; then
            echo "Not a digest promotion (no changed digest: pin) — structural/reviewed PR."
            echo "Change-surface containment is for promotions only; skipping it. Digest-equality still enforced below."
            exit 0
          fi

          # 1) The ONLY file a prod-promote PR may touch under the prod overlay
          #    is kustomization.yaml (where the digests live). Anything else
          #    under overlays/prod/ is a non-promotion change and must go through
          #    a normal reviewed PR, not this gate.
          PROD_CHANGED="$(git diff --name-only "$BASE" HEAD -- 'deploy/k8s/overlays/prod/' || true)"
          BAD="$(printf '%s\n' "$PROD_CHANGED" | grep -v '^deploy/k8s/overlays/prod/kustomization.yaml$' | grep -v '^$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::prod-promote PR changed prod-overlay files other than kustomization.yaml:"
            printf '  %s\n' $BAD
            exit 1
          fi

          # 2) Within prod/kustomization.yaml, the ONLY changed lines may be
          #    `digest:` lines (the image pins), comment lines, or a kustomize
          #    `components:`/`resources:` LIST ENTRY (a `- ../../...` path).
          #    Pins are the promotion payload; comments are inert documentation
          #    (kustomize never renders them) and a pin change legitimately carries
          #    an updated rationale comment. A component/resource list-entry add is
          #    a STRUCTURAL wiring change (e.g. opting prod into the M3.3 db-backup
          #    component, refs #84/#28/#130) — it is NOT a digest promotion, so it
          #    cannot land via a `prod-promote` PR, but a normal reviewed
          #    structural PR that happens to touch overlays/prod must not be wedged
          #    by this guard's auto-trip. The digest-EQUALITY enforcement below is
          #    unchanged and remains the real promotion-safety gate; this allowance
          #    is change-SURFACE only. Any OTHER added/removed line (a patch, a
          #    replica count, the device-write interlock, a NetworkPolicy) is still
          #    rejected as an illegitimate promotion edit.
          NON_DIGEST="$(git diff "$BASE" HEAD -- deploy/k8s/overlays/prod/kustomization.yaml \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]]*digest:[[:space:]]*sha256:[0-9a-f]{64}[[:space:]]*$' \
            | grep -vE '^[+-][[:space:]]*#' \
            | grep -vE '^[+-][[:space:]]*-[[:space:]]+\.\./.*$' \
            | grep -vE '^[+-][[:space:]]*$' \
            || true)"
          if [ -n "$NON_DIGEST" ]; then
            echo "::error::prod/kustomization.yaml changed non-digest, non-comment, non-component-ref lines; a promote PR may only advance digests:"
            printf '%s\n' "$NON_DIGEST"
            exit 1
          fi
          echo "Change-surface OK: only prod digest/comment/component-ref lines changed."

      - name: Dev-tracked prod digests may only advance to current dev digests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD "origin/${BASE_REF}")"

          # Extract the effective image -> digest map kustomize actually renders
          # for an overlay (optionally from a given git ref's worktree). Rendering
          # (vs grepping the file) is robust to formatting and proves the
          # *effective* pin, not just the source line. Emits "image<TAB>digest".
          render_map() {
            kustomize build "$1" \
              | grep -oE 'ghcr\.io/verdifyconsultancy/verdify-[a-z-]+@sha256:[0-9a-f]{64}' \
              | sed -E 's#^ghcr\.io/verdifyconsultancy/(verdify-[a-z-]+)@(sha256:[0-9a-f]{64})$#\1\t\2#' \
              | sort -u
          }

          # Prod render at the merge BASE and at the PR HEAD, plus current dev.
          # The base render lets us see exactly which prod pins THIS PR changed.
          git worktree add -q /tmp/promote-base "$BASE"
          render_map /tmp/promote-base/deploy/k8s/overlays/prod > /tmp/prod.base
          git worktree remove --force /tmp/promote-base

          render_map deploy/k8s/overlays/prod > /tmp/prod.head
          render_map deploy/k8s/overlays/dev  > /tmp/dev.cur

          echo "=== prod (merge-base) ==="; cat /tmp/prod.base
          echo "=== prod (PR head) ===";    cat /tmp/prod.head
          echo "=== dev (current) ===";     cat /tmp/dev.cur

          # DEV-TRACKED set = the images the dev overlay actually carries. These
          # ride the in-repo bump-dev-digests write-back, so prod promotion of
          # THEM must land on exactly the digest dev is running — never a
          # fabricated one. Images intentionally ABSENT from dev (e.g.
          # setpoint-server #118, the prod-only 2nd device writer) are prod-only
          # Components by design; dev never runs them, so there is no dev digest
          # to match and they are EXEMPT from this equality check. The exemption
          # is derived (= images present in the dev render), NOT a
          # hand-maintained allowlist, so it tracks the architecture automatically.
          fail=0
          while IFS="$(printf '\t')" read -r img dev_digest; do
            [ -n "$img" ] || continue
            base_digest="$(awk -F'\t' -v i="$img" '$1==i{print $2}' /tmp/prod.base)"
            head_digest="$(awk -F'\t' -v i="$img" '$1==i{print $2}' /tmp/prod.head)"

            # Prod doesn't pin this dev-tracked image at all -> nothing to gate.
            [ -n "$head_digest" ] || continue

            # This PR did NOT change this prod pin -> prod may legitimately LAG
            # dev (prod is human-gated; dev auto-bumps continuously). A
            # no-op is always allowed.
            if [ "$base_digest" = "$head_digest" ]; then
              echo "ok (unchanged, prod may lag dev): ${img} prod=${head_digest}"
              continue
            fi

            # This PR DID change this prod pin -> it MUST advance to exactly the
            # digest dev is currently running. Inventing a digest dev never
            # ran is the precise failure mode this guard exists to stop.
            if [ "$head_digest" = "$dev_digest" ]; then
              echo "ok (promoted to dev digest): ${img} ${base_digest:-<none>} -> ${head_digest}"
            else
              echo "::error::${img}: prod pin advanced to ${head_digest}, which is NOT the current dev digest ${dev_digest}."
              echo "::error::A prod-promote PR may only advance a dev-tracked image to the digest dev is currently running."
              fail=1
            fi
          done < /tmp/dev.cur

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Promote OK: every dev-tracked prod pin this PR changed advanced to the current dev digest; prod-only images (e.g. setpoint-server) are exempt."
