name: Container Publish

# Verdify APP CI/CD (golden-path, mirrors jvallery/gravity container-publish.yml).
#
# On push to the production branch, build and publish the Verdify application
# images to GHCR, then request a k3s GitOps deploy via the Agent Fleet
# (jvallery/agents) desired-state promotion workflow. The repo drives the
# deployment: push -> build -> publish -> GitOps desired-state PR -> Argo CD.
#
# The Verdify application is composed of these image contexts (handoff §3):
#   - api       (FastAPI public crop catalog + setpoints)  ./api
#   - mcp       (MCP transport server, Iris/Hermes tools)  ./mcp
#   - ingestor  (telemetry + single-writer setpoint dispatcher, device loop) ./ingestor
#   - planner   (standalone LangGraph planner, folded from verdify-planner #102) ./planner_graph
#
# ─── PLANNER IMAGE IS ARTIFACT-ONLY (#102) ───────────────────────────────────
#  The planner-image job below builds + publishes ghcr.io/<owner>/verdify-planner
#  so the folded planner_graph package stops being an un-built blob, but it is
#  DELIBERATELY NOT wired into the deploy path. It is absent from both
#  bump-staging-digests (the overlays/staging @sha256 write-back) and
#  request-gitops-promotion (the Agent Fleet GitOps dispatch). The planner is not
#  yet a deployed k3s workload — this image is a build artifact only. Wiring it
#  into the deploy path is a separate, gated change once a planner Deployment +
#  overlay exists. NEVER add `planner-image` to those two jobs in this PR's scope.
#
# Image publishing is gated by reusable-container-build.yml branch rules
# (publish only from the production branch, never from a pull_request). Pull
# requests build the images without publishing through the same reusable
# workflow for validation.
#
# ─── PROPOSED / PROPOSED-PR NOTES (coordinator + James review required) ──────
#  * `.github/**` is SHARED INFRA per CLAUDE.md — this file lands as a PR for
#    coordinator/James review, NOT an autonomous merge.
#  * VerdifyConsultancy/verdify-platform is READ-ONLY to the agent: this is a
#    PR into that org with James coordinating; never a direct push.
#  * PRODUCTION BRANCH DRIFT (P0): the verified production branch on-box and on
#    the remote is `live/platform-main` (4 ahead of `main`, 0 behind), NOT a
#    bare `live` and NOT `main`. The default branch is still `main`. This
#    Per Jason's 2026-05-31 decision the canonical source-of-truth / deploy
#    branch is `live/platform-main` (the ArgoCD targetRevision). This workflow
#    publishes ONLY from `live/platform-main`; pushes to `main` build but never
#    publish. ArgoCD reconciles `deploy/k8s/overlays/{staging,prod}` from it.
#  * The Dockerfiles (./api/Dockerfile.prod, ./mcp/Dockerfile.prod,
#    ./ingestor/Dockerfile) and the deploy/k8s tree are net-new (P3) and land in
#    a SEPARATE PR. Until they exist these build jobs will fail at `docker build`
#    — intentional: this workflow is the CI/CD wiring (P4), the images are P3.
#  * The cross-repo promotion target (jvallery/agents
#    verdify-gitops-dev-test-promotion.yml) + AGENT_FLEET_PROJECT_TOKEN secret
#    are P5 jvallery-side wiring that does NOT exist yet; the
#    request-gitops-promotion job below is a safe no-op until they land.
#  * FIRMWARE / OTA: this workflow NEVER builds-and-flashes firmware. The ESP32
#    OTA path stays on the human-gated `make firmware-deploy`. No firmware image
#    context is published here.

on:
  push:
    branches:
      - live/platform-main
      - main
    # LOOP-BREAK (#78): the bump-staging-digests job below commits the new
    # @sha256 digests back into deploy/k8s/overlays/staging/** on a push to
    # live/platform-main. Without this filter that bump commit would retrigger
    # this same workflow (rebuild -> publish -> bump -> ...), an infinite loop.
    # The bump commit ONLY touches overlays/staging/kustomization.yaml, so a
    # push whose entire diff is under overlays/staging never rebuilds images.
    # Defense-in-depth: the bump commit body also carries [skip ci]; this
    # paths-ignore is the primary, deterministic guard (skip-ci only covers the
    # exact-marker case, not e.g. a hand-edit to the overlay).
    paths-ignore:
      - "deploy/k8s/overlays/staging/**"
  pull_request:
    branches:
      - live/platform-main
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: verdify-container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-impact:
    name: Resolve image publish impact
    runs-on: ubuntu-latest
    outputs:
      image_publish: ${{ steps.impact.outputs.image_publish }}
      api_impact: ${{ steps.impact.outputs.api_impact }}
      mcp_impact: ${{ steps.impact.outputs.mcp_impact }}
      ingestor_impact: ${{ steps.impact.outputs.ingestor_impact }}
      planner_impact: ${{ steps.impact.outputs.planner_impact }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed files and image impact
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # ─── Collect the changed-file list for this event ───────────────────
          changed_files="$(mktemp)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            : > "$changed_files"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed_files" 2>/dev/null \
              || git diff --name-only HEAD^ HEAD > "$changed_files"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files" 2>/dev/null \
              || git diff --name-only HEAD^ HEAD > "$changed_files"
          else
            git diff --name-only HEAD^ HEAD > "$changed_files" 2>/dev/null || : > "$changed_files"
          fi

          echo "Changed files:"
          sed 's/^/  /' "$changed_files" || true

          # ─── Image-impact resolution (inline; mirrors gravity's
          #     scripts/resolve-deploy-impact.rb but self-contained so this
          #     workflow needs no net-new Ruby helper script). ──────────────────
          #
          # Per-image path prefixes. A change to verdify_schemas/ or
          # docker-compose.yml impacts every Python image (all three COPY the
          # shared schemas; compose defines the shared runtime contract).
          manual=false
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && manual=true

          api_impact=false
          mcp_impact=false
          ingestor_impact=false
          planner_impact=false
          doc_only=true
          any_changed=false

          # Files that never change a published APP runtime image.
          # NOTE: firmware/* is doc-only HERE because firmware never produces a
          # published APP image — CI never flashes; firmware artifacts are
          # validated by the existing ci.yml firmware jobs, not this pipeline.
          # *.md subsumes README/CLAUDE/etc., so they are not listed separately.
          is_doc_only() {
            case "$1" in
              docs/*|*.md|LICENSE|\
              .github/ISSUE_TEMPLATE/*|\
              deploy/k8s/*|firmware/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            any_changed=true
            if ! is_doc_only "$f"; then
              doc_only=false
            fi
            case "$f" in
              api/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) api_impact=true ;;
            esac
            case "$f" in
              mcp/*|slack_config.py|slack_ops/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) mcp_impact=true ;;
            esac
            case "$f" in
              ingestor/*|slack_config.py|slack_ops/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) ingestor_impact=true ;;
            esac
            # planner image is built from the repo root with planner_graph/Dockerfile
            # but COPYs ONLY planner_graph/** (its own pyproject.toml + uv.lock); it
            # does NOT COPY the shared verdify_schemas/ — the planner carries its own
            # copied contract mirror. So a verdify_schemas/ change does not impact the
            # planner image, unlike the other three Python images.
            case "$f" in
              planner_graph/*) planner_impact=true ;;
            esac
          done < "$changed_files"

          if [ "$manual" = "true" ]; then
            api_impact=true
            mcp_impact=true
            ingestor_impact=true
            planner_impact=true
          fi

          any_image=false
          { [ "$api_impact" = "true" ] || [ "$mcp_impact" = "true" ] || [ "$ingestor_impact" = "true" ] || [ "$planner_impact" = "true" ]; } && any_image=true

          image_publish=false
          if [ "$manual" = "true" ]; then
            image_publish=true
            reason="manual workflow_dispatch: building all Verdify images"
          elif [ "$any_changed" = "false" ]; then
            reason="no changed files detected; skipping image publish"
          elif [ "$doc_only" = "true" ]; then
            reason="docs/firmware/manifests-only change; skipping image publish"
          elif [ "$any_image" = "false" ]; then
            reason="no image-impacting files changed; skipping image publish"
          else
            image_publish=true
            changed="api=$api_impact mcp=$mcp_impact ingestor=$ingestor_impact planner=$planner_impact"
            reason="image-impacting change ($changed)"
          fi

          echo "$reason"
          {
            echo "image_publish=$image_publish"
            echo "api_impact=$api_impact"
            echo "mcp_impact=$mcp_impact"
            echo "ingestor_impact=$ingestor_impact"
            echo "planner_impact=$planner_impact"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Image publish impact"
            echo
            echo "- image_publish: \`$image_publish\`"
            echo "- api_impact: \`$api_impact\`"
            echo "- mcp_impact: \`$mcp_impact\`"
            echo "- ingestor_impact: \`$ingestor_impact\`"
            echo "- planner_impact: \`$planner_impact\` (artifact-only; not deployed)"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Per-image build/publish jobs. The reusable workflow only publishes on the
  # production/main branch; pull_request events always build without pushing for
  # validation (push_allowed is false on pull_request inside the reusable flow).
  #
  # Image naming: ghcr.io/<owner>/verdify-<component>:sha-<12char>. <owner> is
  # the repo owner (VerdifyConsultancy), lowercased by GHCR. We pass the owner
  # via github.repository_owner so this is correct under either org.
  # ---------------------------------------------------------------------------
  api-image:
    name: Build and publish api image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.api_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # FastAPI must COPY verdify_schemas/ from the repo root, so the build
      # context is the repo root (".") with the Dockerfile under ./api.
      context: .
      # Hardened, slim production image (FastAPI only; no agent toolchain) —
      # mirrors gravity's Dockerfile.prod image-split security fix. The P3
      # artifact shipped this as the multi-stage api/Dockerfile (it replaced the
      # prior throwaway inline build), so the reference is the plain name, not
      # the gravity .prod suffix. RECONCILED 2026-05-30; flag for coordinator.
      dockerfile: api/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-api
      push: true
      publish-branches: live/platform-main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  mcp-image:
    name: Build and publish mcp image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.mcp_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # MCP also COPYs verdify_schemas/ + slack_config/slack_ops from the repo
      # root, so the build context is the repo root. P3 shipped the hardened
      # multi-stage image as the plain mcp/Dockerfile (DANGER surface: wraps
      # mcp/server.py with zero tool-semantic change). RECONCILED 2026-05-30.
      context: .
      dockerfile: mcp/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-mcp
      push: true
      publish-branches: live/platform-main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  ingestor-image:
    name: Build and publish ingestor image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.ingestor_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Ingestor COPYs verdify_schemas/ + slack_config/slack_ops from the repo
      # root, so the build context is the repo root.
      context: .
      dockerfile: ingestor/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-ingestor
      push: true
      publish-branches: live/platform-main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  planner-image:
    name: Build and publish planner image
    needs: image-impact
    # ARTIFACT-ONLY (#102): build + publish the folded standalone planner image so
    # planner_graph/ stops being an unbuilt blob. This image is intentionally NOT
    # consumed by bump-staging-digests or request-gitops-promotion below — the
    # planner is not yet a deployed k3s workload. Publishing the artifact is not a
    # deploy. The 4 deploy-path images stay api/mcp/ingestor/migrate.
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.planner_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Build context = repo root (matches api/mcp/ingestor convention); the
      # Dockerfile lives at planner_graph/Dockerfile and COPYs only planner_graph/**
      # (its own pyproject.toml + uv.lock with langgraph etc.), NOT the repo-root
      # pyproject or the shared verdify_schemas (the planner carries its own mirror).
      context: .
      dockerfile: planner_graph/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-planner
      push: true
      publish-branches: live/platform-main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  migrate-image:
    name: Build and publish migrate image
    needs: image-impact
    # verdify-migrate (db/Dockerfile.migrate) carries db/schema.sql + migration
    # 000; it is tiny and rebuilt on any publish so the staging schema stays
    # current. NOTE: a db/-only change (schema.sql / migrations / migrate.sh) does
    # not yet set image_publish via the api/mcp/ingestor impact paths — add db/**
    # to the image-impact paths, or use workflow_dispatch, to rebuild it then.
    if: needs.image-impact.outputs.image_publish == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Build context = repo root so the Dockerfile can COPY db/schema.sql +
      # db/migrations/000-* + db/migrate.sh.
      context: .
      dockerfile: db/Dockerfile.migrate
      image-name: ${{ github.repository_owner }}/verdify-migrate
      push: true
      publish-branches: live/platform-main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  # ---------------------------------------------------------------------------
  # In-repo digest write-back into deploy/k8s/overlays/staging (LOCKED DECISION:
  # the digest bump is an in-repo commit on live/platform-main — NO cross-repo
  # PR, NO ArgoCD Image Updater). After the 4 verdify-* images publish to in-org
  # GHCR, this job pins overlays/staging to the exact @sha256 digests of the
  # images built from THIS commit and commits the bump back to
  # live/platform-main. ArgoCD (repoint is jvallery/laptop-root's #65) then
  # reconciles staging to the new digests. prod is promoted separately (gated),
  # so it is intentionally NOT auto-bumped here.
  #
  # Only images that actually rebuilt this run carry a digest; skipped images
  # (no path impact) leave an empty output, and we keep the existing pin for
  # those — the bump is digest-by-digest, never blanking an unbuilt image.
  # ---------------------------------------------------------------------------
  bump-staging-digests:
    name: Bump overlays/staging image digests
    needs:
      - image-impact
      - api-image
      - mcp-image
      - ingestor-image
      - migrate-image
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/live/platform-main' &&
      needs.image-impact.outputs.image_publish == 'true' &&
      needs.api-image.result != 'failure' &&
      needs.mcp-image.result != 'failure' &&
      needs.ingestor-image.result != 'failure' &&
      needs.migrate-image.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout live/platform-main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: live/platform-main
          # Need a writable token to push the digest bump back to the branch.
          token: ${{ github.token }}

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/kustomize.tar.gz kustomize
          kustomize version

      - name: Pin published digests into overlays/staging
        env:
          API_DIGEST: ${{ needs.api-image.outputs.image_digest }}
          MCP_DIGEST: ${{ needs.mcp-image.outputs.image_digest }}
          INGESTOR_DIGEST: ${{ needs.ingestor-image.outputs.image_digest }}
          MIGRATE_DIGEST: ${{ needs.migrate-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          cd deploy/k8s/overlays/staging

          # ref is "ghcr.io/verdifyconsultancy/verdify-<c>@sha256:<hex>".
          # `kustomize edit set image name@digest` rewrites the pin in place.
          pin() {
            local ref="$1"
            if [ -z "$ref" ]; then return 0; fi
            case "$ref" in
              *@sha256:*) ;;
              *) echo "refusing non-digest image ref: $ref" >&2; exit 1 ;;
            esac
            kustomize edit set image "$ref"
            echo "pinned $ref"
          }

          pin "$API_DIGEST"
          pin "$MCP_DIGEST"
          pin "$INGESTOR_DIGEST"
          pin "$MIGRATE_DIGEST"

      - name: Validate digest-only render
        run: |
          set -euo pipefail
          # Every verdify-* image must be @sha256-pinned (no mutable tag leaks).
          rendered="$(kustomize build deploy/k8s/overlays/staging)"
          if printf "%s" "$rendered" \
              | grep -E '^\s+image: ghcr.io/verdifyconsultancy/verdify-' \
              | grep -qv '@sha256:'; then
            echo "a verdify-* image is not digest-pinned after bump" >&2
            printf "%s" "$rendered" | grep -E '^\s+image: ghcr.io/verdifyconsultancy/verdify-' >&2
            exit 1
          fi

      - name: Commit and push digest bump
        run: |
          set -euo pipefail
          git config user.name "verdify-ci[bot]"
          git config user.email "verdify-ci@users.noreply.github.com"
          if git diff --quiet -- deploy/k8s/overlays/staging/kustomization.yaml; then
            echo "no digest change to commit"
            exit 0
          fi
          git add deploy/k8s/overlays/staging/kustomization.yaml
          # [skip ci] in the SUBJECT line (honored by GitHub Actions anywhere in
          # the message, but placed first so it is unmissable) is the secondary
          # loop-break; the primary is the on.push paths-ignore for
          # deploy/k8s/overlays/staging/** above. Bot author keeps the bump
          # commits attributable + filterable.
          git commit -m "ci: [skip ci] bump overlays/staging image digests to ${GITHUB_SHA:0:12}

          In-repo digest write-back (locked decision, no cross-repo PR, no
          ArgoCD Image Updater). Digests pin overlays/staging to the verdify-*
          images built from ${GITHUB_SHA}. ArgoCD reconciles staging from here."
          git push origin HEAD:live/platform-main

  # ---------------------------------------------------------------------------
  # Request the Agent Fleet GitOps dev-to-test promotion. The api image SHA tag
  # is the canonical deployable revision. This only runs on a real
  # production-branch push that published images. The desired-state PR (and Argo
  # CD reconcile) is owned by jvallery/agents.
  #
  # SAFE NO-OP UNTIL P5: the jvallery/agents
  # `verdify-gitops-dev-test-promotion.yml` workflow and the
  # AGENT_FLEET_PROJECT_TOKEN secret do not exist yet. When the token is unset
  # the dispatch step exits 0 with a message instead of failing.
  # ---------------------------------------------------------------------------
  request-gitops-promotion:
    name: Request Agent Fleet k3s deploy
    needs:
      - image-impact
      - api-image
      - mcp-image
      - ingestor-image
      - migrate-image
    # always() so a skipped optional image (no impact) does not block the deploy
    # request; we still gate on a successful publish path and a production push.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/live/platform-main' &&
      needs.image-impact.outputs.image_publish == 'true' &&
      needs.api-image.result != 'failure' &&
      needs.mcp-image.result != 'failure' &&
      needs.ingestor-image.result != 'failure' &&
      needs.migrate-image.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve immutable image metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "api_image=ghcr.io/${owner}/verdify-api:sha-${short_sha}"
            echo "mcp_image=ghcr.io/${owner}/verdify-mcp:sha-${short_sha}"
            echo "ingestor_image=ghcr.io/${owner}/verdify-ingestor:sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Agent Fleet GitOps promotion
        env:
          GH_TOKEN: ${{ secrets.AGENT_FLEET_PROJECT_TOKEN }}
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          MCP_IMAGE: ${{ steps.image.outputs.mcp_image }}
          INGESTOR_IMAGE: ${{ steps.image.outputs.ingestor_image }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "AGENT_FLEET_PROJECT_TOKEN is not configured; skipping Agent Fleet GitOps promotion dispatch."
            echo "This is expected until the P5 jvallery/agents promotion wiring lands." >&2
            exit 0
          fi

          gh workflow run verdify-gitops-dev-test-promotion.yml \
            --repo jvallery/agents \
            --ref main \
            -f mode=pull-request \
            -f source_revision="$GITHUB_SHA" \
            -f api_image="$API_IMAGE" \
            -f mcp_image="$MCP_IMAGE" \
            -f ingestor_image="$INGESTOR_IMAGE"

          {
            echo "### Agent Fleet GitOps promotion dispatch"
            echo
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- api image: \`${API_IMAGE}\`"
            echo "- mcp image: \`${MCP_IMAGE}\`"
            echo "- ingestor image: \`${INGESTOR_IMAGE}\`"
            echo "- Workflow: \`jvallery/agents/.github/workflows/verdify-gitops-dev-test-promotion.yml\`"
            echo "- Target: \`local-dev\` then gated \`local-staging\` after dev health"
          } >> "$GITHUB_STEP_SUMMARY"
