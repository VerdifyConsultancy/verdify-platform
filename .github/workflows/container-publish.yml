name: Container Publish

# Verdify APP CI/CD (golden-path, mirrors jvallery/gravity container-publish.yml).
#
# On push to the production branch, build and publish the Verdify application
# images to GHCR, then request a k3s GitOps deploy via the Agent Fleet
# (jvallery/agents) desired-state promotion workflow. The repo drives the
# deployment: push -> build -> publish -> GitOps desired-state PR -> Argo CD.
#
# The Verdify application is composed of these image contexts (handoff §3):
#   - api       (FastAPI public crop catalog + setpoints)  ./api
#   - mcp       (MCP transport server, Iris/Hermes tools)  ./mcp
#   - ingestor  (telemetry + single-writer setpoint dispatcher, device loop) ./ingestor
#   - planner   (standalone LangGraph planner, folded from verdify-planner #102) ./planner_graph
#   - lab-publisher (Quartz + generated lab content publisher) scripts/Dockerfile.lab-publisher
#
# ─── PLANNER IMAGE (#102) ─────────────────────────────────────────────────────
#  The planner-image job below builds + publishes ghcr.io/<owner>/verdify-planner
#  so the folded planner_graph package is a real published image. It IS a prod
#  workload (verdify-planner in verdify-prod) and is in the prod-promote
#  promotable set, so its :branch-main digest is advanced into overlays/prod by
#  the gated prod-promote workflow like the other greenhouse services.
#
# Image publishing is gated by reusable-container-build.yml branch rules
# (publish only from the production branch, never from a pull_request). Pull
# requests build the images without publishing through the same reusable
# workflow for validation.
#
# ─── PROPOSED / PROPOSED-PR NOTES (coordinator + James review required) ──────
#  * `.github/**` is SHARED INFRA per CLAUDE.md — this file lands as a PR for
#    coordinator/James review, NOT an autonomous merge.
#  * VerdifyConsultancy/verdify-platform is READ-ONLY to the agent: this is a
#    PR into that org with James coordinating; never a direct push.
#  * CANONICAL BRANCH = `main` (Jason, 2026-06-10): the 2026-05-31
#    `live/platform-main` split is retired — `main` (the default branch, where
#    PRs land) is the single source-of-truth / deploy branch and the ArgoCD
#    targetRevision. This workflow publishes ONLY from `main`; pull requests
#    build without publishing. SINGLE ENVIRONMENT (2026-06-16): dev and staging
#    are DECOMMISSIONED. ArgoCD reconciles only `deploy/k8s/overlays/prod`
#    (verdify-prod, manual-sync) from `main`; prod is advanced by the gated
#    prod-promote workflow off the published `:branch-main` image digests.
#  * The Dockerfiles (./api/Dockerfile.prod, ./mcp/Dockerfile.prod,
#    ./ingestor/Dockerfile) and the deploy/k8s tree are net-new (P3) and land in
#    a SEPARATE PR. Until they exist these build jobs will fail at `docker build`
#    — intentional: this workflow is the CI/CD wiring (P4), the images are P3.
#  * FIRMWARE / OTA: this workflow NEVER builds-and-flashes firmware. The ESP32
#    OTA path stays on the human-gated `make firmware-deploy`. No firmware image
#    context is published here.

on:
  push:
    branches:
      - main
    # No paths-ignore needed: the dev/staging environments are decommissioned,
    # so nothing commits image digests back into an overlay on a push to main
    # anymore (the old bump-dev-digests write-back + its loop are gone). Prod
    # promotion is a separate human-gated workflow (prod-promote.yml) that
    # touches only deploy/k8s/overlays/prod/kustomization.yaml — and that path
    # is treated as doc-only by image-impact (is_doc_only covers deploy/k8s/*),
    # so a prod-promote merge publishes nothing and cannot loop.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: verdify-container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-impact:
    name: Resolve image publish impact
    runs-on: ubuntu-latest
    outputs:
      image_publish: ${{ steps.impact.outputs.image_publish }}
      api_impact: ${{ steps.impact.outputs.api_impact }}
      mcp_impact: ${{ steps.impact.outputs.mcp_impact }}
      ingestor_impact: ${{ steps.impact.outputs.ingestor_impact }}
      planner_impact: ${{ steps.impact.outputs.planner_impact }}
      setpoint_impact: ${{ steps.impact.outputs.setpoint_impact }}
      migrate_impact: ${{ steps.impact.outputs.migrate_impact }}
      lab_publisher_impact: ${{ steps.impact.outputs.lab_publisher_impact }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the impact diff runs against github.event.before /
          # the PR base sha; a shallow fetch-depth:2 made those diffs fail and
          # silently fall back to HEAD^..HEAD (last commit only), which skipped
          # builds on multi-commit pushes (observed 2026-06-10).
          fetch-depth: 0

      - name: Resolve changed files and image impact
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # ─── Collect the changed-file list for this event ───────────────────
          changed_files="$(mktemp)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            : > "$changed_files"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed_files" 2>/dev/null \
              || git diff --name-only HEAD^ HEAD > "$changed_files"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files" 2>/dev/null \
              || git diff --name-only HEAD^ HEAD > "$changed_files"
          else
            git diff --name-only HEAD^ HEAD > "$changed_files" 2>/dev/null || : > "$changed_files"
          fi

          echo "Changed files:"
          sed 's/^/  /' "$changed_files" || true

          # ─── Image-impact resolution (inline; mirrors gravity's
          #     scripts/resolve-deploy-impact.rb but self-contained so this
          #     workflow needs no net-new Ruby helper script). ──────────────────
          #
          # Per-image path prefixes. A change to verdify_schemas/ or
          # docker-compose.yml impacts every Python image (all three COPY the
          # shared schemas; compose defines the shared runtime contract).
          manual=false
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && manual=true

          api_impact=false
          mcp_impact=false
          ingestor_impact=false
          planner_impact=false
          setpoint_impact=false
          migrate_impact=false
          lab_publisher_impact=false
          doc_only=true
          any_changed=false

          # Files that never change a published APP runtime image.
          # NOTE: firmware/* is doc-only HERE because firmware never produces a
          # published APP image — CI never flashes; firmware artifacts are
          # validated by the existing ci.yml firmware jobs, not this pipeline.
          # *.md subsumes README/CLAUDE/etc., so they are not listed separately.
          is_doc_only() {
            case "$1" in
              docs/*|*.md|LICENSE|\
              .github/ISSUE_TEMPLATE/*|\
              deploy/k8s/*|firmware/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            any_changed=true
            if ! is_doc_only "$f"; then
              doc_only=false
            fi
            # Publish workflow changes can alter build args, image names,
            # permissions, or digest write-back behavior. Rebuild every image so
            # CI/CD wiring changes are validated by the pipeline they affect.
            case "$f" in
              .github/workflows/container-publish.yml|.github/workflows/reusable-container-build.yml)
                api_impact=true
                mcp_impact=true
                ingestor_impact=true
                planner_impact=true
                setpoint_impact=true
                migrate_impact=true
                lab_publisher_impact=true
                ;;
            esac
            case "$f" in
              api/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) api_impact=true ;;
            esac
            case "$f" in
              mcp/*|slack_config.py|slack_ops/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) mcp_impact=true ;;
            esac
            case "$f" in
              ingestor/*|slack_config.py|slack_ops/*|verdify_schemas/*|docker-compose.yml|pyproject.toml) ingestor_impact=true ;;
            esac
            # planner image is built from the repo root with planner_graph/Dockerfile
            # but COPYs ONLY planner_graph/** (its own pyproject.toml + uv.lock); it
            # does NOT COPY the shared verdify_schemas/ — the planner carries its own
            # copied contract mirror. So a verdify_schemas/ change does not impact the
            # planner image, unlike the other three Python images.
            case "$f" in
              planner_graph/*) planner_impact=true ;;
            esac
            # setpoint-server image (#128) is built from scripts/setpoint-server.py
            # with scripts/Dockerfile.setpoint-server (repo-root context, COPYs
            # verdify_schemas/). It is ARTIFACT-ONLY — published but never wired into
            # bump-staging-digests or request-gitops-promotion (no staging overlay;
            # prod is human-gated; the workload stays scaled-to-0/device-write-disabled).
            # A verdify_schemas/ change does impact it (it COPYs the package), matching
            # the api/mcp/ingestor closure.
            case "$f" in
              scripts/setpoint-server.py|scripts/Dockerfile.setpoint-server|verdify_schemas/*) setpoint_impact=true ;;
            esac
            # verdify-migrate image (db/Dockerfile.migrate) carries db/schema.sql
            # (the production pg_dump --schema-only snapshot) + migration 000 + the
            # inline migrate.sh. A db/-only change (schema.sql / migrations / the
            # migrate.sh inline script / Dockerfile.migrate) MUST rebuild it so the
            # staging schema-build hook stays current — historically a db/-only
            # change left image_publish=false (only api/mcp/ingestor/setpoint paths
            # set it) so migrations never rebuilt the migrate image and its digest
            # only ever published via manual workflow_dispatch (where the
            # bump-staging-digests write-back is skipped, stranding staging on a
            # phantom pin). This db/** path closes that gap. (#99)
            case "$f" in
              db/*) migrate_impact=true ;;
            esac
            # lab-publisher image owns the in-cluster lab.verdify.ai publish
            # workflow: Quartz toolchain, generated-content scripts, schemas,
            # firmware tunable source docs, and the k3s publisher wrapper.
            case "$f" in
              site/*|scripts/Dockerfile.lab-publisher|scripts/lab-publish-k3s.sh|scripts/lab-publisher-docker-shim.sh)
                lab_publisher_impact=true
                ;;
              scripts/publish-site-content.sh|scripts/rebuild-site.sh|scripts/generate-*.py|scripts/render-*.py)
                lab_publisher_impact=true
                ;;
              scripts/update-evidence-snapshots.py|scripts/export-hourly-performance-dataset.py|scripts/export-public-sample-dataset.sh)
                lab_publisher_impact=true
                ;;
              scripts/gather-static-context.sh|scripts/lib/psql-verdify.sh|verdify_schemas/*|firmware/greenhouse/*)
                lab_publisher_impact=true
                ;;
              ingestor/config.py|slack_config.py|slack.yaml)
                lab_publisher_impact=true
                ;;
            esac
          done < "$changed_files"

          if [ "$manual" = "true" ]; then
            api_impact=true
            mcp_impact=true
            ingestor_impact=true
            planner_impact=true
            setpoint_impact=true
            migrate_impact=true
            lab_publisher_impact=true
          fi

          any_image=false
          { [ "$api_impact" = "true" ] || [ "$mcp_impact" = "true" ] || [ "$ingestor_impact" = "true" ] || [ "$planner_impact" = "true" ] || [ "$setpoint_impact" = "true" ] || [ "$migrate_impact" = "true" ] || [ "$lab_publisher_impact" = "true" ]; } && any_image=true

          image_publish=false
          if [ "$manual" = "true" ]; then
            image_publish=true
            reason="manual workflow_dispatch: building all Verdify images"
          elif [ "$any_changed" = "false" ]; then
            reason="no changed files detected; skipping image publish"
          elif [ "$doc_only" = "true" ]; then
            reason="docs/firmware/manifests-only change; skipping image publish"
          elif [ "$any_image" = "false" ]; then
            reason="no image-impacting files changed; skipping image publish"
          else
            image_publish=true
            changed="api=$api_impact mcp=$mcp_impact ingestor=$ingestor_impact planner=$planner_impact setpoint=$setpoint_impact migrate=$migrate_impact lab_publisher=$lab_publisher_impact"
            reason="image-impacting change ($changed)"
          fi

          echo "$reason"
          {
            echo "image_publish=$image_publish"
            echo "api_impact=$api_impact"
            echo "mcp_impact=$mcp_impact"
            echo "ingestor_impact=$ingestor_impact"
            echo "planner_impact=$planner_impact"
            echo "setpoint_impact=$setpoint_impact"
            echo "migrate_impact=$migrate_impact"
            echo "lab_publisher_impact=$lab_publisher_impact"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Image publish impact"
            echo
            echo "- image_publish: \`$image_publish\`"
            echo "- api_impact: \`$api_impact\`"
            echo "- mcp_impact: \`$mcp_impact\`"
            echo "- ingestor_impact: \`$ingestor_impact\`"
            echo "- planner_impact: \`$planner_impact\` (artifact-only; not deployed)"
            echo "- setpoint_impact: \`$setpoint_impact\` (artifact-only; not deployed)"
            echo "- migrate_impact: \`$migrate_impact\` (db/** schema-build image)"
            echo "- lab_publisher_impact: \`$lab_publisher_impact\` (k3s lab publish workflow)"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Per-image build/publish jobs. The reusable workflow only publishes on the
  # production/main branch; pull_request events always build without pushing for
  # validation (push_allowed is false on pull_request inside the reusable flow).
  #
  # Image naming: ghcr.io/<owner>/verdify-<component>:sha-<12char>. <owner> is
  # the repo owner (VerdifyConsultancy), lowercased by GHCR. We pass the owner
  # via github.repository_owner so this is correct under either org.
  # ---------------------------------------------------------------------------
  api-image:
    name: Build and publish api image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.api_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # FastAPI must COPY verdify_schemas/ from the repo root, so the build
      # context is the repo root (".") with the Dockerfile under ./api.
      context: .
      # Hardened, slim production image (FastAPI only; no agent toolchain) —
      # mirrors gravity's Dockerfile.prod image-split security fix. The P3
      # artifact shipped this as the multi-stage api/Dockerfile (it replaced the
      # prior throwaway inline build), so the reference is the plain name, not
      # the gravity .prod suffix. RECONCILED 2026-05-30; flag for coordinator.
      dockerfile: api/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-api
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev
      # In-image pre-push proof (#26 residual): the shared alerts contract must
      # import inside the built api image (WORKDIR /app, verdify_schemas/ COPYed
      # to /app/verdify_schemas) before it can be pushed/digest-pinned.
      smoke-import: verdify_schemas.alerts

  mcp-image:
    name: Build and publish mcp image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.mcp_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # MCP also COPYs verdify_schemas/ + slack_config/slack_ops from the repo
      # root, so the build context is the repo root. P3 shipped the hardened
      # multi-stage image as the plain mcp/Dockerfile (DANGER surface: wraps
      # mcp/server.py with zero tool-semantic change). RECONCILED 2026-05-30.
      context: .
      dockerfile: mcp/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-mcp
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev
      # In-image pre-push proof (#26 residual): WORKDIR /app, verdify_schemas/
      # COPYed to /app/verdify_schemas — alerts must import before push.
      smoke-import: verdify_schemas.alerts

  ingestor-image:
    name: Build and publish ingestor image
    needs: image-impact
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.ingestor_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Ingestor COPYs verdify_schemas/ + slack_config/slack_ops from the repo
      # root, so the build context is the repo root.
      context: .
      dockerfile: ingestor/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-ingestor
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev
      # In-image pre-push proof (#26 residual): the ingestor image sets
      # WORKDIR /app/ingestor but COPYs verdify_schemas/ to /app/verdify_schemas,
      # so the smoke run is pinned to /app to keep the top-level import resolvable.
      smoke-import: verdify_schemas.alerts
      smoke-import-workdir: /app

  planner-image:
    name: Build and publish planner image
    needs: image-impact
    # ARTIFACT-ONLY (#102): build + publish the folded standalone planner image so
    # planner_graph/ stops being an unbuilt blob. The planner is NOT pinned into
    # overlays/staging and is NOT in the request-gitops-promotion dispatch — it is
    # not a deployed k3s workload there. Publishing the artifact is not a deploy.
    # The staging deploy-path images stay api/mcp/ingestor (+ migrate for the
    # in-cluster schema build). The bump job DOES read this job's digest, but ONLY
    # to repin the INERT dev overlay's placeholder planner pin (#127, no ArgoCD app).
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.planner_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Build context = repo root (matches api/mcp/ingestor convention); the
      # Dockerfile lives at planner_graph/Dockerfile and COPYs only planner_graph/**
      # (its own pyproject.toml + uv.lock with langgraph etc.), NOT the repo-root
      # pyproject or the shared verdify_schemas (the planner carries its own mirror).
      context: .
      dockerfile: planner_graph/Dockerfile
      image-name: ${{ github.repository_owner }}/verdify-planner
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  migrate-image:
    name: Build and publish migrate image
    needs: image-impact
    # verdify-migrate (db/Dockerfile.migrate) carries db/schema.sql + migration
    # 000; it is tiny and rebuilt on any publish so the staging schema stays
    # current. A db/-only change (schema.sql / migrations / the inline migrate.sh /
    # Dockerfile.migrate) now sets migrate_impact -> image_publish via the
    # image-impact db/** path (#99), so migrations rebuild + republish the migrate
    # image on a real push (not only via workflow_dispatch, where the
    # bump-staging-digests write-back is skipped and staging strands on a phantom
    # pin). The `if:` stays image_publish-gated (rebuild on ANY publish keeps the
    # staging schema current); migrate_impact guarantees a db/-only push reaches it.
    if: needs.image-impact.outputs.image_publish == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Build context = repo root so the Dockerfile can COPY db/schema.sql +
      # db/migrations/000-* + db/migrate.sh.
      context: .
      dockerfile: db/Dockerfile.migrate
      image-name: ${{ github.repository_owner }}/verdify-migrate
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev

  setpoint-server-image:
    name: Build and publish setpoint-server image
    needs: image-impact
    # ARTIFACT-ONLY (#128): build + publish ghcr.io/<owner>/verdify-setpoint-server
    # (scripts/Dockerfile.setpoint-server) so the containerized grow-light writer /
    # setpoint-diagnostics service is a reviewable, repo-linked artifact. It is
    # DELIBERATELY NOT consumed by bump-staging-digests or request-gitops-promotion:
    # it has NO staging overlay (it is a prod-only, device-affecting writer) and
    # prod is human-gated. Publishing the artifact is NOT a deploy — the
    # setpoint-server workload stays scaled-to-0 / device-write-disabled. Same
    # posture as planner-image (#102). Mirrors the migrate-image job pattern.
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.setpoint_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      # Build context = repo root: setpoint-server.py inserts the repo root on
      # sys.path and the Dockerfile COPYs scripts/setpoint-server.py + verdify_schemas/.
      context: .
      dockerfile: scripts/Dockerfile.setpoint-server
      image-name: ${{ github.repository_owner }}/verdify-setpoint-server
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev
      # In-image pre-push proof (#26 residual): WORKDIR /app, verdify_schemas/
      # COPYed to /app/verdify_schemas — alerts must import before push (same
      # contract closure the setpoint-server's tunable_registry import relies on).
      smoke-import: verdify_schemas.alerts

  lab-publisher-image:
    name: Build and publish lab-publisher image
    needs: image-impact
    # k3s lab publishing (# planner recovery): build the Quartz + Python
    # generated-content image used by the verdify-lab-publisher CronJob. This is
    # a deployed web/content workflow, not a device writer.
    if: needs.image-impact.outputs.image_publish == 'true' && (needs.image-impact.outputs.lab_publisher_impact == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      context: .
      dockerfile: scripts/Dockerfile.lab-publisher
      # The historical verdify-lab-publisher GHCR package was bootstrapped
      # manually and is not linked to this repository, so GITHUB_TOKEN cannot
      # push to it even with packages:write. Publish future CI-owned images to a
      # fresh repo-linked package while keeping the Kubernetes CronJob name.
      image-name: ${{ github.repository_owner }}/verdify-lab-publisher-k3s
      push: true
      publish-branches: main
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      extra-tags: local-dev
